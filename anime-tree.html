<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#9cc7ea">
<title>ต้นไม้อนิเมะ — ทดลอง</title>
<!--
  anime-tree.html  —  the plants of anime-tree.js, one at a time or as a set, each switchable with the game's current
  version of the same plant. One job: compare them. Nothing here goes into the game.
    ?type=oak   open on that plant      ?all=1   open on the whole set      ?old=1   open on the game's current versions
    ?seed=3     which dice              ?novivi=1   no Vivi beside the plant (she is there for scale)
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9cc7ea; font-family: system-ui, sans-serif; touch-action: none; }
  canvas { display: block; }
  #name { position: fixed; left: 0; right: 0; top: calc(10px + env(safe-area-inset-top)); text-align: center; pointer-events: none;
    font: 700 17px system-ui; color: #fff; text-shadow: 0 1px 6px #0007; }
  #name small { display: block; font: 500 12px system-ui; opacity: 0.9; margin-top: 3px; }
  #ui { position: fixed; left: 0; right: 0; bottom: calc(10px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 8px; }
  #sunrow { display: flex; align-items: center; gap: 8px; background: #1d4f6ed9; border: 1px solid #ffffffaa; border-radius: 999px; padding: 6px 14px; color: #fff; font: 700 13px system-ui; }
  #sun { width: min(56vw, 260px); accent-color: #f2b33d; }
  .bar { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
  .bar button { border: 1px solid #ffffffaa; border-radius: 999px; padding: 9px 13px; background: #1d4f6ed9; color: #fff; font: 700 13px system-ui; touch-action: manipulation; }
  .bar button.on { background: #c0702e; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="name"></div>
<div id="ui">
  <div id="sunrow">🌅 <input id="sun" type="range" min="0" max="1" step="0.005" value="0.3"> 🌇</div>
  <div class="bar">
    <button id="prev">◀</button>
    <button id="swap">🔁 ดูแบบเดิม</button>
    <button id="next">▶</button>
    <button id="all">ดูทั้งชุด</button>
  </div>
  <div class="bar">
    <button id="dice">🎲 สุ่มทรง</button>
    <button id="fall" class="on">🍃 ใบร่วง</button>
    <button id="wind" class="on">💨 ลม</button>
  </div>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import * as N from './stylized-nature.js';
import { createAnimeTree, createAnimeBush, setAnimeSun } from './anime-tree.js';

const Q = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
{ // a sky: deep blue overhead, pale at the horizon
  const c = document.createElement('canvas'); c.width = 4; c.height = 256;
  const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#2f72c4'); gr.addColorStop(0.55, '#7fb4e6'); gr.addColorStop(1, '#dcecf5');
  g.fillStyle = gr; g.fillRect(0, 0, 4, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  scene.background = t;
}
scene.add(N.createAlphaFix());
N.setHaze({ color: '#cfe4f1', near: 90, far: 420, max: 0.55 });
const ground = N.createGround({ radius: 240, flat: 130, hills: 1, far: '#cfe4f1' });
scene.add(ground);
const H = ground.userData.heightAt;
scene.add(N.createGrass({ count: 3200, radius: 22, heightAt: H, seed: 4 }));

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 900);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.maxPolarAngle = Math.PI * 0.49; controls.minDistance = 1.5; controls.maxDistance = 200;

// the plants: name, how wide it stands, how tall, and how to build the new (anime) and the game's current version
const PLANTS = [
  { key: 'broadleaf', name: 'ต้นใบกว้าง', w: 6, h: 11,
    make: s => createAnimeTree({ type: 'broadleaf', seed: s }), old: s => N.createTree({ type: 'broadleaf', seed: s }) },
  { key: 'oak', name: 'ต้นโอ๊ก', w: 9.5, h: 9,
    make: s => createAnimeTree({ type: 'oak', seed: s }), old: s => N.createTree({ type: 'oak', seed: s }) },
  { key: 'sapling', name: 'ต้นอ่อน', w: 3.4, h: 4.8,
    make: s => createAnimeTree({ type: 'sapling', seed: s }), old: s => N.createTree({ type: 'sapling', seed: s }) },
  { key: 'birch', name: 'ต้นเบิร์ช', w: 4.6, h: 9.6,
    make: s => createAnimeTree({ type: 'birch', seed: s }), old: s => N.createTree({ type: 'birch', seed: s }) },
  { key: 'pine', name: 'ต้นสน', w: 6, h: 12,
    make: s => createAnimeTree({ type: 'pine', seed: s }), old: s => N.createTree({ type: 'pine', seed: s }) },
  { key: 'bush', name: 'พุ่มไม้', w: 3.4, h: 1.9,
    make: s => createAnimeBush({ seed: s + 2 }), old: s => N.createBush({ type: 'round', seed: s + 2 }) },
];
let index = Math.max(0, PLANTS.findIndex(p => p.key === Q.get('type')));
let seed = +Q.get('seed') || 1, showAll = Q.has('all'), old = Q.has('old'), falling = true, wind = true;
const shown = new THREE.Group(); scene.add(shown);
const nameEl = document.getElementById('name');
const sunDir = new THREE.Vector3();

// Vivi stands beside the plant so its size (and its leaves' size) reads
let vivi = null;
const placeVivi = () => {
  if (!vivi) return;
  const p = PLANTS[index];
  const x = showAll ? 0 : p.w * 0.5 + 1.0, z = showAll ? 5 : 1.6;
  vivi.object.position.set(x, H(x, z), z);
  vivi.object.rotation.y = -0.5;
};
if (!Q.has('novivi')) (async () => {
  try {
    const [{ loadCharacter }, { VIVI_GLB, VIVI_ANIM }] = await Promise.all([import('./stylized-character.js'), import('./vivi-data.js')]);
    vivi = await loadCharacter(VIVI_GLB, VIVI_ANIM);
    vivi.play('idle');
    scene.add(vivi.object);
    placeVivi();
  } catch (err) { console.warn('Vivi not loaded', err); }
})();

// the sun: low on the left in the morning, high at noon, low on the right in the evening (always a little toward the camera)
function setSun(s) {
  const a = Math.PI * s;
  sunDir.set(-Math.cos(a), Math.sin(a) * 0.95 + 0.12, 0.45).normalize();
  setAnimeSun(sunDir);
  // the game's current plants: their leaves' light is baked when they are built; only their bark can follow
  shown.traverse(o => { const u = o.material && o.material.uniforms; if (u && u.uLight && !o.name.startsWith('anime')) u.uLight.value.copy(sunDir); });
}

function clear() { for (const m of [...shown.children]) { m.userData.dispose && m.userData.dispose(); shown.remove(m); } }
function build() {
  clear();
  const list = showAll ? PLANTS : [PLANTS[index]];
  let x = 0, cards = 0;
  for (const p of list) {
    const plant = old ? p.old(seed) : p.make(seed);
    plant.userData.setFalling && plant.userData.setFalling(falling);
    x += p.w / 2; plant.position.x = x; x += p.w / 2 + 1.0;
    cards += plant.userData.cards || 0;
    shown.add(plant);
  }
  const off = -(x - 1.0) / 2;                                              // the row centred
  for (const pl of shown.children) { pl.position.x += off; pl.position.y = H(pl.position.x, 0) - 0.05; }
  setSun(+document.getElementById('sun').value);
  placeVivi();
  const which = old ? 'แบบเดิมในเกม' : 'แบบอนิเมะ (ใหม่)';
  const what = showAll ? 'ทั้งชุด' : PLANTS[index].name;
  nameEl.innerHTML = `${what} · ${which} <small>${showAll ? '' : (index + 1) + ' / ' + PLANTS.length + ' · '}ใบการ์ด ${cards.toLocaleString()} · ทรงที่ ${seed} · ลากหมุนดู</small>`;
  document.getElementById('swap').textContent = old ? '🔁 ดูแบบใหม่' : '🔁 ดูแบบเดิม';
  document.getElementById('swap').classList.toggle('on', old);
  document.getElementById('all').textContent = showAll ? 'ดูทีละต้น' : 'ดูทั้งชุด';
  return x - 1.0;
}
// far enough back that what is shown fits both ways, on a tall phone screen too
function frame(width) {
  const vHalf = THREE.MathUtils.degToRad(camera.fov / 2), hHalf = Math.atan(Math.tan(vHalf) * camera.aspect);
  const h = showAll ? 12 : PLANTS[index].h, w = showAll ? width : PLANTS[index].w + 2.6;
  const d = Math.max((h / 2) / Math.tan(vHalf), (w / 2) / Math.tan(hHalf)) * 1.1 + 1.5;
  controls.target.set(showAll ? 0 : 0.6, h * 0.47, 0);
  camera.position.set(d * 0.1, h * 0.42 + 0.4, d);
  controls.update();
}
const rebuild = (reframe = true) => { const w = build(); if (reframe) frame(w); };

const btn = id => document.getElementById(id);
btn('sun').addEventListener('input', e => setSun(+e.target.value));
btn('prev').onclick = () => { showAll = false; index = (index + PLANTS.length - 1) % PLANTS.length; rebuild(); };
btn('next').onclick = () => { showAll = false; index = (index + 1) % PLANTS.length; rebuild(); };
btn('swap').onclick = () => { old = !old; rebuild(false); };
btn('all').onclick = () => { showAll = !showAll; rebuild(); };
btn('dice').onclick = () => { seed++; rebuild(false); };
btn('fall').onclick = () => {
  falling = !falling; btn('fall').classList.toggle('on', falling);
  for (const p of shown.children) p.userData.setFalling && p.userData.setFalling(falling);
};
btn('wind').onclick = () => { wind = !wind; N.setWind(wind ? 1 : 0); btn('wind').classList.toggle('on', wind); };

rebuild();
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  N.update(dt);
  if (vivi) vivi.update(dt);
  controls.update();
  renderer.render(scene, camera);
});
window.__scene = { scene, camera, controls, setSun, go(i, o = false, all = false) { index = i; old = o; showAll = all; rebuild(); } };
</script>
</body>
</html>
