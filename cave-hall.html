<!--
  cave-hall.html  —  the forest hall of the dungeon under the waterfall cliff (room ③ of the plan). First a beauty test (the
  user: "อันนี้สวยละ"), then, the same day, made to be played ("แต่จะเล่นยังไง ... ไม่มีให้ไต่ กระโดดสี่ชั้น วิ่ง"; chosen:
  "ไต่ขึ้นสู่แสง"): four levels up the north and east walls to a high arm of rock beside the shaft of light, the way on at
  its root. Vivi plays as in the game: the game's player (player-moves.js: her run gathering speed, climbing a face she
  pushes at, the magic jump four times in the air, wading the pool), its touch screen and its music (music.js, the game's
  piece, "เพลงเดิมของเกมไปก่อน"); the forest sprite floats at her shoulder and is the cave's light where she goes.
  The hall: cave-hall.js (baked by tools/make-cave-hall.py); her level in it: cave-level.js; its light on the plants and on
  her: cave-light.js. The buttons on the right put her on each level.
  Then the same night: the map, as the hill village's ("ทำแผนที่แบบ hill village ก่อนได้ไหม จะได้เห็นว่าเดินไปไหน"): game-map.js
  as the game has it (the small round map at the top that follows her, the whole map on a tap, a pin on every level), on a
  picture painted by tools/make-cave-map.py; and her skills, as the game has them ("ขอปุ่มสกิลด้วยค่ะ"): วาร์ป · กระโดด ·
  โจมตี in a row along the bottom (tapped: four casts; held: the lance, let go: thrown; slid up while held: ฝนหอก), their
  light shining as it does by night (it is dark in here).
  ?sound=0: no sound; ?music=0: her steps without the music. No monsters, no puzzles yet (the plan has them).
-->

<div id="name">โถงป่าใต้ดิน<small>ไต่ขึ้นสู่แสง · ดันเจี้ยนหลังผาน้ำตก ห้อง ③</small></div>

<div id="hint">ซ้าย: เดิน วิ่ง · ขวา: หมุนกล้อง · เดินชนผา: ปีน · กระโดดซ้ำกลางอากาศ: 4 ชั้น · แตะแผนที่: ดูทั้งโถง</div>

<script type="module">
import * as THREE from 'three';
import * as N from './stylized-nature.js';
import { createCaveHall } from './cave-hall.js';
import { createCaveLevel } from './cave-level.js';
import { loadPlayable } from './characters.js';
import { CHARACTER_ANIM } from './character-anim.js';
import { VAULT_ANIM } from './vault-anim.js';
import { CHARACTER_ANIM as MOCAP_ANIM } from './magic-jump-mocap-anim.js';
import { CHARACTER_ANIM as FLOW_ANIM } from './magic-jump-flow-anim.js';
import { CLIMB_TOP_ANIM } from './climb-top-anim.js';
import { createPlayer } from './player-moves.js';
import { createMagicCircles } from './magic-circle-fx.js';
import { createStepSounds } from './step-sounds.js';
import { createMusic } from './music.js';
import { createSpriteCompanion } from './sprite-companion.js';
import { updateAnimals } from './stylized-animals.js';
import { createGameMap } from './game-map.js';
import { CHARACTER_ANIM as COMBO_ANIM } from './magic-combo-game-anim.js';
import { skyThrowClip } from './spear-rain-anim.js';
import { createMagicComboFx } from './magic-combo-fx.js';
import { createSpearRain } from './spear-rain.js';
import { createSpearRainFx } from './spear-rain-fx.js';
import { createSpearRainSounds } from './spear-rain-sounds.js';
import { createChargeHum } from './charge-hum.js';
import { createBlink } from './blink.js';
import { createBlinkFx } from './blink-fx.js';
import { createBlinkSounds } from './blink-sounds.js';
import { BLINK_STOP, CHARACTER_ANIM as BLINK_ANIM } from './blink-stop-anim.js';

const Q = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance', preserveDrawingBuffer: Q.has('shot') });
// as the game (index.html): the kit's shaders write their colours as they are (raw sRGB); three's own get the conversion back
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
THREE.ShaderChunk.colorspace_fragment = 'gl_FragColor = sRGBTransferOETF( gl_FragColor );';
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, +Q.get('dpr') || 1.5));
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.12, 220);
const fit = () => {
  camera.aspect = innerWidth / innerHeight; camera.fov = camera.aspect < 1 ? 70 : 55; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
};
addEventListener('resize', fit); fit();
const stepEl = document.getElementById('step');
const onStep = async (t) => { stepEl.textContent = t + '…'; await new Promise((r) => requestAnimationFrame(() => setTimeout(r, 0))); };
const noCave = (root) => root.traverse((o) => { for (const m of [].concat(o.material || [])) { m.userData = m.userData || {}; m.userData.noCave = true; } });

// ---- the hall, and the level she plays in it
const hall = await createCaveHall({ onStep });
scene.add(hall.group);
scene.background = new THREE.Color(hall.look.sky);        // (only seen through the crack in the roof)
const level = createCaveLevel(hall);

// ---- her (Vivi), with the game's moves and their clips (as index.html: the vault, the magic jump's take-off and landing
// and its moves in the air, her way over a cliff's top; her spells' moves on the ground, the lance hurled up for the spear
// rain, her stop after a blink)
await onStep('ปลุก Vivi');
const SKY_CLIP = skyThrowClip(COMBO_ANIM);
const PLAYER_ANIM = { ...CHARACTER_ANIM, clips: { ...CHARACTER_ANIM.clips, ...VAULT_ANIM.clips, ...MOCAP_ANIM.clips, ...FLOW_ANIM.clips, ...CLIMB_TOP_ANIM.clips,
  ...COMBO_ANIM.clips, ...(SKY_CLIP ? { mc_sky: SKY_CLIP } : {}), ...BLINK_ANIM.clips } };
const hero = await loadPlayable('vivi', PLAYER_ANIM, { height: 1.75 });
const circles = createMagicCircles({ seed: 2 });            // the magic jump's circles: their own light
scene.add(circles.object);
noCave(circles.object);
// her steps, her jumps and landings (the game's sounds), on the AudioContext her first touch wakes; the game's music on it
const soundVol = Q.has('sound') ? +Q.get('sound') : 1;
const sounds = soundVol > 0 ? createStepSounds({ level, volume: soundVol }) : null;
const music = sounds && Q.get('music') !== '0' ? createMusic({ context: () => sounds.context, volume: soundVol }) : null;
// her skills, as the game has them (index.html): the magic combo and its light, the spear rain (its light, its sound, the
// lance's hum), the blink (its light, its sound, her stop). Their light is their own, and in here it shines as it does by night
const spellKit = { comboFx: createMagicComboFx(), renderer, spearRain: createSpearRain, rainFx: createSpearRainFx() };
if (sounds) {
  spellKit.rainSounds = createSpearRainSounds({ context: () => sounds.context, volume: sounds.volume });
  spellKit.hum = createChargeHum({ context: () => sounds.context, volume: sounds.volume });
}
const blinkFx = createBlinkFx();
const blink = createBlink({ fx: blinkFx, heard: sounds ? createBlinkSounds({ context: () => sounds.context, volume: sounds.volume }) : null, stop: BLINK_STOP });
for (const fx of [spellKit.comboFx, spellKit.rainFx, blinkFx, circles]) { if (fx.setNight) fx.setNight(true); }
const player = createPlayer({ character: hero, level, camera, dom: renderer.domElement, ui: document.getElementById('stick'), circles, sounds, spells: spellKit, blink, ramp: true, dash: false, roll: false });
blinkFx.prepare(hero);                                       // (her meshes read now, for her afterimages, not as she first blinks)
scene.add(player.object, spellKit.comboFx.object, spellKit.rainFx.object, blinkFx.object);
noCave(player.blob); noCave(spellKit.comboFx.object); noCave(spellKit.rainFx.object); noCave(blinkFx.object);
// the buttons, as the game's: วาร์ป · กระโดด · โจมตี in a row along the bottom; ฝนหอก over the attack while she holds the lance
document.body.classList.add('spells');
const jumpBtn = document.getElementById('jumpBtn');
jumpBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); jumpBtn.classList.add('down'); player.jump(); });
for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) jumpBtn.addEventListener(ev, () => jumpBtn.classList.remove('down'));
const blinkBtn = document.createElement('button'); blinkBtn.id = 'blinkBtn'; blinkBtn.type = 'button'; blinkBtn.setAttribute('aria-label', 'วาร์ป');
blinkBtn.innerHTML = '<span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.2"/><circle cx="9" cy="12" r="1.6"/><path d="M13 5.5l6.5 6.5-6.5 6.5"/><path d="M19.5 12h-6"/><path d="M15.5 3.5l.6 1.4 1.4.6-1.4.6-.6 1.4-.6-1.4-1.4-.6 1.4-.6z" stroke-width="1.2"/></svg><br>วาร์ป</span>';
document.body.append(blinkBtn);
blinkBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); blinkBtn.classList.add('down'); player.blink(); });
for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) blinkBtn.addEventListener(ev, () => blinkBtn.classList.remove('down'));
const atkBtn = document.createElement('button'); atkBtn.id = 'atkBtn'; atkBtn.type = 'button'; atkBtn.setAttribute('aria-label', 'โจมตี');
atkBtn.innerHTML = '<span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.2 6.3L20.5 10l-6.3 2.2L12 18.5l-2.2-6.3L3.5 10l6.3-1.7z"/><path d="M19 17l.7 2 .2.1 2 .7-2 .7-.9 2.2-.7-2.2-2-.7 2-.7z"/></svg><br>โจมตี</span>';
atkBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); atkBtn.setPointerCapture(e.pointerId); atkBtn.classList.add('down'); player.attack(); });
for (const ev of ['pointerup', 'pointercancel']) atkBtn.addEventListener(ev, () => { atkBtn.classList.remove('down'); player.release(); });
document.body.append(atkBtn);
// the spear rain (ฝนหอก): while the attack button is down its finger may slide up off it; past FLICK px the lance she holds
// is thrown into the sky. The badge over the button shows where to slide to while she holds the lance; it may be tapped too
const rainBtn = document.createElement('button'); rainBtn.id = 'rainBtn'; rainBtn.type = 'button'; rainBtn.setAttribute('aria-label', 'ฝนหอก');
rainBtn.innerHTML = '<span><svg viewBox="0 0 28 14" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l10-8 10 8"/></svg>ฝนหอก</span>';
{
  const FLICK = 52, near = (v) => rainBtn.style.setProperty('--near', Math.max(0, Math.min(1, v)).toFixed(2));
  let finger = null, from = 0, gone = false;
  atkBtn.addEventListener('pointerdown', (e) => { finger = e.pointerId; from = e.clientY; gone = false; near(0); });
  atkBtn.addEventListener('pointermove', (e) => {
    if (e.pointerId !== finger || gone) return;
    const up = from - e.clientY;
    near(up / FLICK);
    if (up >= FLICK) { gone = true; player.spells.skyward(); }
  });
  for (const ev of ['pointerup', 'pointercancel']) atkBtn.addEventListener(ev, (e) => { if (e.pointerId === finger) { finger = null; near(0); } });
  rainBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); player.spells.skyward(); });
  addEventListener('keydown', (e) => { if (e.code === 'KeyR' && !e.repeat) player.spells.skyward(); });
}
document.body.append(rainBtn);

// the sprite: it goes everywhere with her (sprite-companion.js), and here it is the light
await onStep('ปลุกสไปรต์');
const sprite = await createSpriteCompanion({ level: { heightAt: (x, z) => level.standAt(x, z), colliders: level.colliders }, scene, player });
sprite.shadow.visible = false;                              // (it is the light: no shadow under it)
noCave(sprite.object);
const body = sprite.object.getObjectByName('body') || sprite.object;
// its glow: a soft warm halo round it
const glowTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(255,240,205,0.85)'); gr.addColorStop(0.25, 'rgba(255,226,170,0.35)'); gr.addColorStop(1, 'rgba(255,210,150,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.NoColorSpace; return t;
})();
const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0xffffff, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
halo.material.userData.noCave = true;
halo.scale.setScalar(1.7); halo.renderOrder = 6;
scene.add(halo);
let lampOn = true;

// ---- the cave's light on everything (once all is in the scene)
await onStep('จุดแสงในถ้ำ');
const patched = hall.light.apply(scene);
const spritePos = new THREE.Vector3();
const lampAt = () => { body.getWorldPosition(spritePos); spritePos.y += 0.25; hall.light.setSprite(spritePos, lampOn); halo.position.copy(spritePos); halo.visible = lampOn; };

// ---- her camera is the game's (player-camera.js, inside the player): in here the room's level says how far it may go
// (cave-level.js: cameraReach), so it comes in softly before a wall or under the roof and never into her head

// ---- the buttons: each level, and the sprite's light
const bar = document.getElementById('bar');
const ICON = ['📍', '🌳', '🪨', '⛰', '✨'];
level.places.forEach((p, i) => {
  const b = document.createElement('button'); b.type = 'button';
  b.textContent = `${ICON[i] || '📍'} ${p.name}`;
  b.onclick = () => player.teleport(p.x, p.z, p.heading);
  bar.append(b);
});
const lampBtn = document.createElement('button'); lampBtn.type = 'button'; lampBtn.className = 'on'; lampBtn.textContent = '💡 แสงสไปรต์';
lampBtn.onclick = () => { lampOn = !lampOn; lampBtn.classList.toggle('on', lampOn); };
bar.append(lampBtn);

// ---- 🗺 the map, as the hill village's (game-map.js): a small round one at the top that follows her; a tap on it opens the
// whole hall, a pin on every level, and ไปที่นี่ takes her there
const ICONS = { 'ทางเข้า': '📍', 'พื้นป่า': '🌳', 'ชั้นหิน': '🪨', 'ระเบียง': '⛰', 'หิ้งสูง': '✨' };
const gameMap = await createGameMap({ url: './assets/maps/cave-hall-map.json', player,
  places: level.places.map((p, i) => ({ key: 'cave' + i, label: `${ICONS[p.name] || '📍'} ${p.name}`, x: p.x, z: p.z, yaw: p.heading })) });

// ---- a frame
function step(dt) {
  dt = Math.min(dt, 0.05);
  player.update(dt);
  N.setWalker(player.position, 0.55);                        // (the ferns and the grass part round her)
  updateAnimals(dt);                                         // (the sprite)
  circles.update(dt, camera);
  blinkFx.update(dt, camera);
  blinkBtn.classList.toggle('wait', !blink.ready);           // (not again yet)
  rainBtn.classList.toggle('on', !!player.spells.skyReady);  // (she holds the lance: it may be thrown up)
  hall.update(dt, camera);
  lampAt();
  gameMap.update();
  if (music) music.update(dt, { when: 'day', drowned: 0 });
}
let fixedCam = null;
function draw() {
  if (fixedCam) { camera.position.set(fixedCam[0], fixedCam[1], fixedCam[2]); camera.lookAt(fixedCam[3], fixedCam[4], fixedCam[5]); }
  renderer.render(scene, camera);
}

// for a test (or the console): run(s) steps the game without drawing (then draws once); keys('KeyW', true) holds a key
window.caveTrial = {
  ready: false, held: false, player, level, hall, hero, camera, renderer, scene, patched, sounds, music, gameMap, spellKit, blink,
  run(seconds, { fps = 30, show = true, each = null } = {}) { this.held = true; for (let u = 0; u < seconds - 1e-6; u += 1 / fps) { step(1 / fps); if (each) each(); } if (show) draw(); },
  place(i) { const p = level.places[i]; player.teleport(p.x, p.z, p.heading); },
  keys(code, down) { dispatchEvent(new KeyboardEvent(down ? 'keydown' : 'keyup', { code })); },
  fix(...v) { fixedCam = v.length ? v : null; },
  lamp(on) { lampOn = on; lampBtn.classList.toggle('on', on); },
  draw, info() { return renderer.info.render; },
};

// ---- warm up every shader before she is shown, then go
await onStep('เตรียมภาพ');
step(1 / 60);
try { await renderer.compileAsync(scene, camera); } catch (e) { renderer.compile(scene, camera); }
document.getElementById('wait').remove();
window.caveTrial.ready = true;
let then = performance.now(), shown = 0;
function tick(now) {
  requestAnimationFrame(tick);
  if (now - shown < 1000 / 61) return;
  shown = now;
  const dt = (now - then) / 1000; then = now;
  if (window.caveTrial.held) return;
  step(dt);
  draw();
}
requestAnimationFrame(tick);
</script>
</body>
</html>
