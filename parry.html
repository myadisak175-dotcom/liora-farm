<title>วีวี่ — ปัด สู้บอส (ลอง)</title>
<!--
  parry.html  —  her parry against the plant boss, to try (26 Nov 2026); and the fight made an action game's the same day
  ("อยากได้ action มันสๆ", then "ทำค่ะ" to three things: her spells strike the heads; a perfect parry or a perfect blink slows
  the boss's world while she goes at her own pace; out of a perfect parry, her attack is a counter).
  The parry was asked for in the barrier's place: "จะเอา บาเรีย ออก แต่ ทำ เป็น pary แบบ doctor strang แทน", "เป็นแบบปัดสกิล
  ระยะไกล กดให้ตรงจังหวะ"; the boss given a straight shot for each head to parry ("เพิ่มท่ายิงให้บอส ... เอาสามหัวทำเป็นท่ายิง
  ตรงๆ ให้แพรี่ด้วย"), its poison rain to be walked or blinked out of; no dash and no roll ("dash มันคือวิ่งเร็ว ควรใส่ลงท่าวิ่ง
  ธรรมดา แล้วเพิ่มความเร็วเอา"): her run gathers speed by itself. The heads are not beaten: water calms them (the fight's own
  idea: her rain at the end makes the plant a friend, not made yet), and a head calmed through falls asleep. The game is
  not changed by this page.

  Who does what: the game's own player (player-moves.js: walk, the run gathering speed, the magic jump, the blink) with her
  spells (player-spells.js: the four casts, the lance, the spear rain; given the heads to strike, and the counter's cast),
  her parry (parry.js: its rules and her move, and when it is perfect; parry-fx.js: the circle at her palm; her moves
  parry-anim.js); the plant boss (plant-boss.js; its moves plant-boss-moves.js, with its heads falling asleep; turning to
  her plant-boss-turn.js) spitting its straight shots (boss-shots.js: their flight, slowed with its world; boss-shots-fx.js:
  their look) and now and then its poison rain (howl-fx.js, poison-rain-fx.js). This page: the heads as things to strike,
  the calm, the slow time, the counter, the buttons.

  Bottom right: โจมตี (J; held: the lance; slid up: the spear rain, R), ปัด (K or P), วาร์ป (E or L), กระโดด (Space). Up top:
  ⚔ the boss fighting by itself, 🌱 🌼 ☠ ☁ one move each, 🎥 the camera kept on the boss, ☀/🌙, ⏱ slower, 🔊, ↺ again.
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1d2547; font-family: system-ui, sans-serif; touch-action: none; -webkit-user-select: none; user-select: none; }

  #beat.perfect { font-size: 28px; letter-spacing: 1px; text-shadow: 0 0 12px #62ebf5, 0 0 26px #1f86d8, 0 2px 8px #000c; }
  #heads { position: fixed; left: calc(12px + env(safe-area-inset-left)); top: calc(34px + env(safe-area-inset-top)); pointer-events: none;
    font: 700 12px system-ui; color: #fff; text-shadow: 0 1px 4px #000b; line-height: 1.7; }
  #heads .row { display: flex; align-items: center; gap: 6px; }

  #heads .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, #5fe6e8, #effffe); transition: width .25s ease-out; }
  #heads .asleep b { opacity: .65; }
  #heads .riled .bar { animation: riled .6s ease-out; }
  @keyframes riled { 0%, 45% { border-color: #ffb09c; box-shadow: 0 0 9px #ff5a3c; } 100% { border-color: #ffffff80; box-shadow: none; } }
  #score { margin-top: 2px; font-weight: 600; opacity: .95; }
  #bar { position: fixed; right: calc(8px + env(safe-area-inset-right)); top: calc(8px + env(safe-area-inset-top)); display: flex; flex-direction: column; align-items: flex-end; gap: 5px; z-index: 3; }
  #bar button { border: 1px solid #ffffffaa; border-radius: 999px; padding: 6px 10px; background: #2b3a55c8; color: #fff; font: 700 12px system-ui; touch-action: manipulation; text-align: left; }
  #bar button.boss { background: #3c5a2bd9; }
  #bar button.on { background: #6a4c2b; }
  #stick { position: fixed; width: 112px; height: 112px; margin: -56px 0 0 -56px; border-radius: 50%; pointer-events: none; opacity: 0;
    background: rgba(255, 255, 255, .2); border: 2px solid rgba(255, 255, 255, .6); transition: opacity .12s; }
  #stick i { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%;
    background: rgba(255, 255, 255, .82); box-shadow: 0 2px 8px rgba(40, 60, 30, .25); }
  .act { position: fixed; z-index: 4; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .75); background: rgba(255, 255, 255, .24);
    color: #fff; font: 700 12px system-ui, sans-serif; text-shadow: 0 1px 3px rgba(40, 30, 60, .7); touch-action: none; user-select: none;
    -webkit-user-select: none; -webkit-tap-highlight-color: transparent; display: grid; place-items: center; padding: 0; }
  .act.down { background: rgba(255, 255, 255, .5); }

  /* the attack, the big one, under the right thumb (it glows white while a counter is there to be had); the parry beside
     it, the jump over the parry, the blink further in */
  #atkBtn { right: max(16px, calc(env(safe-area-inset-right) + 8px)); bottom: max(12px, calc(env(safe-area-inset-bottom) + 6px)); width: 84px; height: 84px;
    background: rgba(170, 225, 255, .22); box-shadow: 0 0 calc(26px * var(--counter, 0)) rgba(255, 255, 255, calc(.85 * var(--counter, 0))); }
  #atkBtn svg { width: 30px; height: 30px; }
  #atkBtn.down { background: rgba(170, 225, 255, .55); }
  #parryBtn { right: max(112px, calc(env(safe-area-inset-right) + 104px)); bottom: max(12px, calc(env(safe-area-inset-bottom) + 6px)); width: 70px; height: 70px;
    background: rgba(98, 235, 245, calc(.1 + .2 * var(--ready, 1))); border-color: rgba(220, 255, 255, calc(.35 + .6 * var(--ready, 1)));
    box-shadow: 0 0 calc(4px + 14px * var(--ready, 1) + 22px * var(--hot, 0)) rgba(98, 235, 245, calc(.15 + .55 * var(--ready, 1))); }
  #parryBtn svg { width: 30px; height: 30px; margin-bottom: -3px; }
  #parryBtn.down { background: rgba(190, 250, 255, .55); }
  #jumpBtn { right: max(117px, calc(env(safe-area-inset-right) + 109px)); bottom: max(92px, calc(env(safe-area-inset-bottom) + 86px)); width: 60px; height: 60px; }
  #blinkBtn { right: max(192px, calc(env(safe-area-inset-right) + 184px)); bottom: max(16px, calc(env(safe-area-inset-bottom) + 10px)); width: 56px; height: 56px;
    background: rgba(95, 230, 232, calc(.1 + .22 * var(--ready, 1))); border-color: rgba(200, 255, 255, calc(.35 + .5 * var(--ready, 1))); }
  /* the spear rain's badge, over the attack button while she holds the lance: slide up to it (or tap it) */
  #rainBtn { position: fixed; z-index: 5; right: max(14px, calc(env(safe-area-inset-right) + 6px)); bottom: max(104px, calc(env(safe-area-inset-bottom) + 98px));
    border: 2px solid rgba(255, 255, 255, calc(.6 + .4 * var(--near, 0))); border-radius: 999px; padding: 5px 12px; color: #fff; font: 800 12px system-ui;
    background: rgba(98, 235, 245, calc(.3 + .5 * var(--near, 0))); box-shadow: 0 0 calc(6px + 16px * var(--near, 0)) #62ebf5; touch-action: none; }
  #rainBtn svg { width: 22px; height: 11px; display: block; margin: 0 auto 1px; }
  #rainBtn[hidden] { display: none; }
  #hint { position: fixed; left: calc(12px + env(safe-area-inset-left)); top: calc(118px + env(safe-area-inset-top)); max-width: 46%; pointer-events: none;
    font: 500 12px/1.5 system-ui; color: #fff; opacity: .9; text-shadow: 0 1px 4px #000a; transition: opacity .8s; }
  #tap { position: fixed; left: 0; right: 0; top: 46%; display: flex; justify-content: center; pointer-events: none; }
  #tap span { background: rgba(31, 134, 160, .9); color: #fff; font: 600 14px system-ui; padding: 10px 18px; border-radius: 999px; }
  #tap[hidden] { display: none; }
  #wait { position: fixed; left: 0; right: 0; top: 46%; text-align: center; color: #fff; font: 700 15px system-ui; text-shadow: 0 1px 6px #0008; pointer-events: none; white-space: pre-wrap; }
  @media (max-width: 640px) {                        /* a phone upright */
    #beat { top: 30%; }
    #hint { max-width: 54%; font-size: 11px; }
    #bar button { padding: 6px 9px; font-size: 11px; }
  }
  @media (max-height: 520px) {                       /* a phone on its side: the buttons up top in a row */
    #name { font-size: 14px; }
    #heads { top: calc(28px + env(safe-area-inset-top)); line-height: 1.55; }
    #bar { flex-direction: row; flex-wrap: wrap; justify-content: flex-end; max-width: 60vw; gap: 4px; top: calc(6px + env(safe-area-inset-top)); }

<body>
<div id="witch"></div>
<div id="name">วีวี่ · ปัด สู้บอส (ลอง)</div>
<div id="heads"></div>
<div id="beat"></div>
<div id="bar">
  <button id="auto" class="boss on" type="button">⚔ สู้เอง</button>
  <button id="seed" class="boss" type="button" title="หัวขวา: หนาม">🌱 ขวา</button>
  <button id="pollen" class="boss" type="button" title="หัวกลาง: เกสร">🌼 กลาง</button>
  <button id="venom" class="boss" type="button" title="หัวซ้าย: พิษ ×3">☠ ซ้าย</button>
  <button id="rain" class="boss" type="button" title="ฝนพิษ: หลบ">☁ ฝน</button>
  <button id="lock" class="on" type="button" title="กล้องหันหาบอส">🎥 ล็อก</button>
  <button id="hour" type="button">☀</button>
  <button id="slow" type="button">⏱ ×1</button>
  <button id="sound" type="button">🔊</button>
  <button id="again" type="button">↺</button>
</div>
<div id="stick"><i></i></div>
<button id="blinkBtn" class="act" type="button" aria-label="วาร์ป"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="12" r="2.6"/><path d="M10.5 12h9M16 8.5l3.5 3.5-3.5 3.5" /></svg><br>วาร์ป</span></button>
<button id="jumpBtn" class="act" type="button" aria-label="กระโดด"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15l7-7 7 7"/></svg><br>กระโดด</span></button>
<button id="parryBtn" class="act" type="button" aria-label="ปัด"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><circle cx="12" cy="12" r="6.2"/><path d="M12 5.8l5.4 9.3H6.6z" stroke-width="1.3"/><circle cx="12" cy="12" r="2" stroke-width="1.3"/></svg><br>ปัด</span></button>
<button id="atkBtn" class="act" type="button" aria-label="โจมตี"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.2 6.3L20.5 10l-6.3 2.2L12 18.5l-2.2-6.3L3.5 10l6.3-1.7z"/><path d="M19 17l.7 2 .2.1 2 .7-2 .7-.9 2.2-.7-2.2-2-.7 2-.7z"/></svg><br>โจมตี</span></button>
<button id="rainBtn" type="button" aria-label="ฝนหอก" hidden><span><svg viewBox="0 0 28 14" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l10-8 10 8"/></svg>ฝนหอก</span></button>
<div id="hint">ลูกที่ยิงมาเรืองแสง กดปัด · ปัดตอนเกือบโดน = ปัดเป๊ะ โลกช้าลง แล้วกดโจมตีทันที = สวนกลับ<br>วาร์ปหลบตอนเกือบโดน = หลบเป๊ะ · ตีหัวด้วยเวทน้ำจนสงบ แล้วมันจะหลับ</div>
<div id="tap" hidden><span>แตะจอหนึ่งครั้งเพื่อเปิดเสียง</span></div>
<div id="wait">กำลังโหลดวีวี่กับบอส…</div>
<script type="module">
import * as THREE from 'three';
import * as N from './stylized-nature.js';
import * as G from './stylized-grassfield.js';
import { loadCharacter } from './stylized-character.js';
import { createSprings } from './character-springs.js';
import { CHARACTER_ANIM } from './character-anim.js';
import { VAULT_ANIM } from './vault-anim.js';
import { CHARACTER_ANIM as MOCAP_ANIM } from './magic-jump-mocap-anim.js';
import { CHARACTER_ANIM as FLOW_ANIM } from './magic-jump-flow-anim.js';
import { CLIMB_TOP_ANIM } from './climb-top-anim.js';
import { CHARACTER_ANIM as STOP_ANIM, BLINK_STOP } from './blink-stop-anim.js?v=1';
import { CHARACTER_ANIM as PARRY_ANIM } from './parry-anim.js';
import { CHARACTER_ANIM as COMBO_ANIM } from './magic-combo-game-anim.js';
import { skyThrowClip } from './spear-rain-anim.js';
import { createPlayer } from './player-moves.js';
import { createMagicCircles } from './magic-circle-fx.js';
import { createStepSounds } from './step-sounds.js';
import { createBlink } from './blink.js?v=2';
import { createBlinkFx } from './blink-fx.js?v=1';
import { createBlinkSounds } from './blink-sounds.js?v=2';
import { createMagicComboFx } from './magic-combo-fx.js';
import { createSpearRain } from './spear-rain.js';
import { createSpearRainFx } from './spear-rain-fx.js';
import { createSpearRainSounds } from './spear-rain-sounds.js';
import { createChargeHum } from './charge-hum.js';
import { createReflectBarrierSounds } from './barrier-reflect-sounds.js?v=2';
import { createParry, PARRY } from './parry.js';
import { createParryFx } from './parry-fx.js';
import { createPlantBoss, setPlantBossSun } from './plant-boss.js';
import { createBossMoves, BOSS_MOVES } from './plant-boss-moves.js';
import { createBossTurn } from './plant-boss-turn.js';
import { createHowlFx } from './howl-fx.js';
import { HOWL } from './plant-boss-talk.js';
import { createPoisonRainFx, poolStrength } from './poison-rain-fx.js';
import { createBossShots, BOSS_SHOTS } from './boss-shots.js';
import { createBossShotsFx } from './boss-shots-fx.js';

const Q = new URLSearchParams(location.search);
const phone = matchMedia('(pointer: coarse)').matches;
const waitEl = document.getElementById('wait');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, phone ? 1.75 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.autoClear = false;
document.body.prepend(renderer.domElement);

// ---- the meadow: the game's sky, ground and grass (as the other trial pages')
const scene = new THREE.Scene();
{
  const c = document.createElement('canvas'); c.width = 4; c.height = 256;
  const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#2f72c4'); gr.addColorStop(0.55, '#7fb4e6'); gr.addColorStop(1, '#dcecf5');
  g.fillStyle = gr; g.fillRect(0, 0, 4, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  scene.background = t;
}
const FAR = '#d6e8ef';
scene.add(N.createAlphaFix());
N.setHaze({ color: FAR, near: 45, far: 150, max: 0.65 });
const ground = N.createGround({ radius: 120, flat: 32, hills: 1, far: FAR });
scene.add(ground);
const H = ground.userData.heightAt;
const map = G.createGroundMap({ radius: 120, size: 768, seed: 4, heightAt: H, dirt: 0 });
G.applyGroundMap(ground, map, { far: FAR });
const grass = G.createFluffyGrass({ map, heightAt: H, count: phone ? 70000 : 150000, radius: 32, far: FAR });
scene.add(grass);
const sun = new THREE.Vector3(-0.45, 0.78, 0.45).normalize();

// ---- the boss: 12 m before where she starts (in reach of her casts: magic-combo.js turns her to nothing further than
// 13 m), turned to her; how it fights (calmed through, a head falls asleep: sleep); its gathering's light, its poison rain
const BOSS_AT = new THREE.Vector3(0, 0, 12);
BOSS_AT.y = H(BOSS_AT.x, BOSS_AT.z) - 0.05;
const boss = createPlantBoss({ seed: 1, clip: true });
boss.position.copy(BOSS_AT); boss.rotation.y = Math.PI;
scene.add(boss);
setPlantBossSun(sun);
const moves = createBossMoves(boss, { snaps: true, sleep: true }), turn = createBossTurn(boss);
const howl = createHowlFx({ seed: 1, breath: false });
const rain = createPoisonRainFx({ heightAt: H, seed: 3, lift: 0.3 });
howl.setSun(sun); rain.setSun(sun);
scene.add(howl.object, rain.object);
const colliders = [[BOSS_AT.x, BOSS_AT.z, 2.9]];

// ---- the light: her jump's circles, the blink's, her spells' (the combo's, whose circle is also her parry's: the lance's
// circle, magic-combo-fx.js), the spear rain's, the shots'; in a scene of their own drawn after the meadow (by night the
// meadow is dimmed to the hour's light first, as the game does it, and the light is drawn over it undimmed). The shots'
// darts are solid: in the meadow's scene
const fxScene = new THREE.Scene();
const circles = createMagicCircles({ seed: 2 });
const blinkFx = createBlinkFx();
const combo = createMagicComboFx();
const parryFx = createParryFx({ combo });
const spearFx = createSpearRainFx();
const shotsFx = createBossShotsFx({ seed: 4 });
shotsFx.setSun(sun);
scene.add(shotsFx.solid);
fxScene.add(circles.object, blinkFx.object, combo.object, spearFx.object, shotsFx.object);
// (the dimming is also the slow time's: while the boss's world is slow the meadow, she and the boss go a little bluer, and
// the light drawn over them keeps its own colour)
const NIGHT = [0.26, 0.31, 0.6], SLOWED = [0.8, 0.9, 1.0];
const dim = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
  uniforms: { uC: { value: new THREE.Vector3(...NIGHT) } },
  vertexShader: 'void main() { gl_Position = vec4(position.xy, 0.0, 1.0); }',
  fragmentShader: 'uniform vec3 uC; void main() { gl_FragColor = vec4(uC, 1.0); }',
  blending: THREE.CustomBlending, blendSrc: THREE.DstColorFactor, blendDst: THREE.ZeroFactor, depthTest: false, depthWrite: false,
}));
dim.frustumCulled = false;
const dimScene = new THREE.Scene(); dimScene.add(dim);
const dimC = dim.material.uniforms.uC.value;
function shade(w) {                                     // (the meadow's light now: the hour's, and the slow time's by w; false: as it is)
  for (let i = 0; i < 3; i++) dimC.setComponent(i, (night ? NIGHT[i] : 1) * (1 - (1 - SLOWED[i]) * w));
  return night || w > 0.005;
}
let night = Q.get('night') === '1';
const setNight = on => { night = on; if (circles.setNight) circles.setNight(on); blinkFx.setNight(on); combo.setNight(on); spearFx.setNight(on); shotsFx.setNight(on); };
setNight(night);

// ---- the camera: the game's (player-moves.js makes it), as wide as the game's; a little lower and further back than the
// game starts it, so the boss's heads are in the picture over her; kept turned toward the boss (🎥), standing a little off
// the line from her to it so it is not hidden behind her (less on a phone held upright, whose picture is narrow), and
// near the boss coming down to look up (from `far` m of it to `near`, its pitch from `pitch` to `low`), so its heads stay
// in the picture as she closes in
const FOV = () => (innerWidth < innerHeight ? 70 : 55);

// head calmed through falls asleep; all three asleep, the plant sleeps (then wakes again, here: the ending, her rain, is
// not made yet). A blow of its own that lands on her stirs it up again. How much calm:
//   spell: for each of a cast's power (an orb 1, the turning cast's wave 2, the finisher 4 and its splash on the heads
//   near 2, the lance 2 to 8); rain: for each of a spear's (0.6 to 1.3); great: the great spear's (3 to 7); shot: a shot
//   thrown back, by which; perfect: so much more for one thrown back by a perfect parry; witch: her casts while the boss's
//   world is slow; counter: the counter's finisher; riled: the calm a head loses when its shot strikes her (a drop of the
//   poison rain: every head awake). (Her casts alone, struck all the while, never get there: a good player asleep
//   all three in some 25 s with her casts worth half again as much and nothing lost, before this)
const CALM = { max: 100, spell: 2, rain: 2, great: 4, shot: { seed: 20, pollen: 30, venom: 10 }, perfect: 1.5, witch: 1.4, counter: 2,

function calmHead(head, add) {

}
function rile(head, by) {

// she blinks at it first; the finisher at once (magic-combo.js' strike: the fourth of the four casts), at that head (for

// ---- the boss fighting by itself: its moves in turn, a breath between (shorter the more of its heads are asleep); a move

const SEQ = ['seed', 'pollen', 'venom', 'seed', 'venom', 'poison', 'pollen', 'seed', 'venom', 'pollen'];
const OWNER = { seed: 1, pollen: 0, venom: 2 };

// ---- the action game's weight: the world stops for an instant and the camera shakes, dying away

{

  }
  if (hurt > 0) { hurt = Math.max(0, hurt - dt / 0.35); hero.tint.set(1, 0.32, 0.3, hurt * 0.7); }
  else if (sick > 0.05) hero.tint.set(0.42, 1.0, 0.18, Math.min(0.5, sick * 0.5) * (0.8 + 0.2 * Math.sin(time * 7)));
  else hero.tint.set(0, 0, 0, 0);
  witchEl.style.opacity = witchK.toFixed(3);
  if (beatT > 0 && (beatT -= real) <= 0) beatEl.style.opacity = 0;
  parryBtn.style.setProperty('--ready', guard.ready ? 1 : 0.25);
  parryBtn.style.setProperty('--hot', guard.hot ? 1 : 0);
  blinkBtn.style.setProperty('--ready', blink.ready ? 1 : 0.2);
  atkEl.style.setProperty('--counter', counterT > 0 ? (0.65 + 0.35 * Math.sin(time * 30)).toFixed(2) : 0);
  rainBtn.hidden = !player.spells.skyReady;
  const tallyNow = `${tally.takes}.${tally.perfects}.${tally.dodges}.${tally.counters}.${tally.hits}`;
  if (tallyNow !== shownTally) { shownTally = tallyNow; showHeads(); }
  const s = sounds.stats;
  tapEl.hidden = s.ready || !!s.failed;
}
function draw() {
  const amp = shakeA * Math.exp(-shakeAge * 14) + 0.06 * Math.max(howl.shake * 0.5, rain.shake * 0.7, shotsFx.shake * 0.5);
  if (amp > 0.002) { shakeOff.set(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).multiplyScalar(2 * amp); camera.position.add(shakeOff); camera.updateMatrixWorld(); }
  renderer.clear();
  renderer.render(scene, camera);
  if (shade(witchK)) renderer.render(dimScene, camera);
  renderer.render(fxScene, camera);
  if (amp > 0.002) { camera.position.sub(shakeOff); camera.updateMatrixWorld(); }
}
function again() {
  calm.fill(0); asleepAt = -1; counterT = 0; counterArmed = 0; witchT = 0;
  for (const k in tally) tally[k] = 0;
  shots.clear(); pools.length = 0; drops.clear();
  moves.play('rise'); wait = 2.5; seqI = 0;
  showHeads();
}

// ---- the buttons at the top
const btn = id => document.getElementById(id);
const showHour = () => { btn('hour').textContent = night ? '🌙' : '☀'; };
showHour();
btn('hour').onclick = () => { setNight(!night); showHour(); };
const SLOWS = [1, 0.5, 0.25];
btn('slow').onclick = () => { slow = SLOWS[(SLOWS.indexOf(slow) + 1) % SLOWS.length]; btn('slow').textContent = `⏱ ×${slow === 1 ? 1 : slow === 0.5 ? '½' : '¼'}`; };
btn('sound').onclick = () => { heard.on = !heard.on; blinkHeard.volume = heard.on ? 1 : 0; sounds.volume = heard.on ? 1 : 0; btn('sound').textContent = heard.on ? '🔊' : '🔇'; };
const showAuto = () => { btn('auto').textContent = auto ? '⚔ สู้เอง' : '⚔ พัก'; btn('auto').classList.toggle('on', auto); };
btn('auto').onclick = () => { auto = !auto; wait = 1.0; showAuto(); };
showAuto();
btn('seed').onclick = () => playOne('seed');
btn('pollen').onclick = () => playOne('pollen');
btn('venom').onclick = () => playOne('venom');
btn('rain').onclick = () => playOne('poison');
const showLock = () => { btn('lock').textContent = lock ? '🎥 ล็อก' : '🎥'; btn('lock').classList.toggle('on', lock); };
btn('lock').onclick = () => { lock = !lock; showLock(); };
showLock();
btn('again').onclick = () => { if (player) { player.teleport(0, 0, 0); player.setView(Math.PI + VIEW.side, VIEW.pitch, VIEW.dist); again(); } };
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.fov = FOV(); camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
tapEl.hidden = false;
setTimeout(() => { document.getElementById('hint').style.opacity = 0; }, 14000);      // (the hint goes once it has been read)

// for a test (or the console): step the world by hand
window.parryTrial = {
  ready: false, held: false,
  get player() { return player; }, get hero() { return hero; }, get guard() { return guard; }, get shots() { return shots; },
  boss, moves, turn, camera, renderer, tally, calm, targets, live, drops, PARRY, BOSS_SHOTS, BOSS_MOVES, CALM, WITCH, COUNTER, TARGET, BOSS_AT, H,
  get witch() { return witchK; }, get bossK() { return bossK; }, get counterT() { return counterT; }, get counterArmed() { return counterArmed; },
  run(seconds, { fps = 60, show = true, each = null } = {}) { this.held = true; for (let u = 0; u < seconds - 1e-6; u += 1 / fps) { if (each) each(); step(1 / fps); } if (show) draw(); },
  play: m => { wait = 99; return moves.play(m); }, auto(on) { auto = !!on; wait = 1; showAuto(); }, lock(on) { lock = !!on; showLock(); },
  press: () => parryDown(), attack: () => attackDown(), release: () => player.release(), blink: yaw => { blinkCut = CUT_FOR; if (blink.ready) cut(); player.blink(yaw); }, sky: () => player.spells.skyward(),
  night(on) { setNight(!!on); showHour(); }, again, draw,
  get time() { return time; },
};

let then = performance.now(), shown = 0;
function tick(now) {
  requestAnimationFrame(tick);
  if (now - shown < 1000 / 61) return;                // 60 pictures a second at most: no hotter than it need be
  shown = now;
  const dt = (now - then) / 1000; then = now;
  if (window.parryTrial.held) return;
  step(dt);
  draw();
}
requestAnimationFrame(tick);
</script>
</body>
