<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#8fa2b4">
<title>เถาหนามคำสาป — ทดลอง</title>
<!--
  thorn-vine.html  —  the curse's thorn vines of thorn-vine.js, one vine or a clump, in the curse's colours or green.
  One job: see the model. Nothing here goes into the game.
    ?look=green   open green      ?clump=1   open on a clump      ?seed=3   which dice      ?novivi=1   no Vivi beside it
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8fa2b4; font-family: system-ui, sans-serif; touch-action: none; }
  canvas { display: block; }
  #name { position: fixed; left: 0; right: 0; top: calc(10px + env(safe-area-inset-top)); text-align: center; pointer-events: none;
    font: 700 17px system-ui; color: #fff; text-shadow: 0 1px 6px #0007; }
  #name small { display: block; font: 500 12px system-ui; opacity: 0.9; margin-top: 3px; }
  #ui { position: fixed; left: 0; right: 0; bottom: calc(10px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 8px; }
  .row { display: flex; align-items: center; gap: 8px; background: #3b3147d9; border: 1px solid #ffffffaa; border-radius: 999px; padding: 6px 14px; color: #fff; font: 700 13px system-ui; }
  .row input { width: min(56vw, 240px); accent-color: #c9a35c; }
  .bar { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
  .bar button { border: 1px solid #ffffffaa; border-radius: 999px; padding: 9px 13px; background: #3b3147d9; color: #fff; font: 700 13px system-ui; touch-action: manipulation; }
  .bar button.on { background: #8a6a3a; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
  "./thorn-vine.js": "./thorn-vine.js?v=1"
} }
</script>
</head>
<body>
<div id="name"></div>
<div id="ui">
  <div class="row">🌅 <input id="sun" type="range" min="0" max="1" step="0.005" value="0.3" aria-label="ดวงอาทิตย์"> 🌇</div>
  <div class="bar">
    <button id="curse">คำสาป</button>
    <button id="green">เขียวแบบเรฟ</button>
    <button id="one">เถาเดียว</button>
    <button id="clump">กอ</button>
  </div>
  <div class="bar">
    <button id="dice">🎲 สุ่มทรง</button>
    <button id="wind" class="on">💨 ลม</button>
  </div>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import * as N from './stylized-nature.js';
import { createThornVine, createThornClump, setVineSun } from './thorn-vine.js';

const Q = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const sky = look => {           // overcast and cold for the curse; the game's blue for green
  const c = document.createElement('canvas'); c.width = 4; c.height = 256;
  const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256);
  const stops = look === 'curse' ? ['#5f7590', '#97a8b8', '#d4d9dc'] : ['#2f72c4', '#7fb4e6', '#dcecf5'];
  gr.addColorStop(0, stops[0]); gr.addColorStop(0.55, stops[1]); gr.addColorStop(1, stops[2]);
  g.fillStyle = gr; g.fillRect(0, 0, 4, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  return t;
};
scene.add(N.createAlphaFix());
N.setHaze({ color: '#d4d9dc', near: 60, far: 300, max: 0.6 });
const ground = N.createGround({ radius: 240, flat: 130, hills: 1, far: '#d4d9dc' });
scene.add(ground);
const H = ground.userData.heightAt;

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 900);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.maxPolarAngle = Math.PI * 0.49; controls.minDistance = 1.5; controls.maxDistance = 120;

let look = Q.get('look') === 'green' ? 'green' : 'curse', clump = Q.has('clump'), seed = +Q.get('seed') || 1;
const shown = new THREE.Group(); scene.add(shown);
const sunDir = new THREE.Vector3();
function setSun(s) {
  const a = Math.PI * s;
  sunDir.set(-Math.cos(a), Math.sin(a) * 0.95 + 0.12, 0.45).normalize();
  setVineSun(sunDir);
}

// Vivi beside it, for its size
let vivi = null;
if (!Q.has('novivi')) (async () => {
  try {
    const [{ loadCharacter }, { VIVI_GLB }, { CHARACTER_ANIM }] = await Promise.all([import('./stylized-character.js'), import('./vivi-data.js'), import('./character-anim.js')]);
    vivi = await loadCharacter(VIVI_GLB, CHARACTER_ANIM);
    if (vivi.setSize) vivi.setSize(1.75 / vivi.baseHeight);            // her height in the game
    vivi.play('idle');
    vivi.object.position.set(-1.6, H(-1.6, 1.4), 1.4);
    vivi.object.rotation.y = 0.5;
    scene.add(vivi.object);
  } catch (err) { console.warn('Vivi not loaded', err); }
})();

function build() {
  for (const m of [...shown.children]) { m.userData.dispose && m.userData.dispose(); shown.remove(m); }
  const plant = clump ? createThornClump({ seed, look, count: 4 }) : createThornVine({ seed, look });
  plant.position.set(0, H(0, 0) - 0.02, 0);
  shown.add(plant);
  scene.background = sky(look);
  const tri = plant.userData.triangles;
  document.getElementById('name').innerHTML = `เถาหนาม${look === 'curse' ? 'คำสาป' : 'สีเขียว'} · ${clump ? 'กอ 4 เถา' : 'เถาเดียว'} <small>${tri.toLocaleString()} สามเหลี่ยม · ทรงที่ ${seed} · ลากหมุนดู</small>`;
  for (const [id, on] of [['curse', look === 'curse'], ['green', look === 'green'], ['one', !clump], ['clump', clump]]) document.getElementById(id).classList.toggle('on', on);
}
function frame() {
  const h = 2.8, w = clump ? 6 : 4.2;
  const vHalf = THREE.MathUtils.degToRad(camera.fov / 2), hHalf = Math.atan(Math.tan(vHalf) * camera.aspect);
  const d = Math.max((h / 2) / Math.tan(vHalf), (w / 2) / Math.tan(hHalf)) * 1.15 + 1.5;
  controls.target.set(0.6, h * 0.45, 0);
  camera.position.set(d * 0.35, h * 0.55 + 0.4, d);
  controls.update();
}

const btn = id => document.getElementById(id);
btn('sun').addEventListener('input', e => setSun(+e.target.value));
btn('curse').onclick = () => { look = 'curse'; build(); };
btn('green').onclick = () => { look = 'green'; build(); };
btn('one').onclick = () => { clump = false; build(); frame(); };
btn('clump').onclick = () => { clump = true; build(); frame(); };
btn('dice').onclick = () => { seed++; build(); };
let wind = true;
btn('wind').onclick = () => { wind = !wind; N.setWind(wind ? 1 : 0); btn('wind').classList.toggle('on', wind); };

setSun(+btn('sun').value);
build(); frame();
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); frame(); });
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  N.update(dt);
  if (vivi) vivi.update(dt);
  controls.update();
  renderer.render(scene, camera);
});
window.__scene = { scene, camera, controls, set(o) { if (o.look) look = o.look; if ('clump' in o) clump = o.clump; if (o.seed) seed = o.seed; build(); frame(); } };
</script>
</body>
</html>
