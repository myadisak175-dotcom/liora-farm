<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#9cc7ea">
<title>หิน stylized — แคตตาล็อก</title>
<!--
  rock-catalog.html  —  look at the stylized rocks and cliff pieces (rocks.js, section 5) one at a time, or a set in a row.
  One job: show them. Nothing here goes into the game.
    ?type=wall   open on that piece      ?all=1   open on the row of its set      ?seed=4   which dice
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9cc7ea; font-family: system-ui, sans-serif; touch-action: none; }
  canvas { display: block; }
  #name { position: fixed; left: 0; right: 0; top: calc(12px + env(safe-area-inset-top)); text-align: center; pointer-events: none;
    font: 700 18px system-ui; color: #fff; text-shadow: 0 1px 6px #0006; }
  #name small { display: block; font: 500 12px system-ui; opacity: 0.85; margin-top: 2px; }
  #bar { position: fixed; left: 0; right: 0; bottom: calc(12px + env(safe-area-inset-bottom)); display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; padding: 0 8px; }
  #bar button { border: 1px solid #ffffffaa; border-radius: 999px; padding: 10px 16px; background: #1d4f6ed9; color: #fff; font: 700 14px system-ui; touch-action: manipulation; }
  #bar button.on { background: #c0702e; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
  "./rocks.js": "./rocks.js?v=mount1"
} }
</script>
</head>
<body>
<div id="name"></div>
<div id="bar">
  <button id="group">⛰ ผา</button>
  <button id="prev">◀</button>
  <button id="next">▶</button>
  <button id="dice">🎲 สุ่มใหม่</button>
  <button id="all">ดูทั้งชุด</button>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import * as N from './stylized-nature.js';
import { PROP_ROCK_TYPES, createPropRock } from './rocks.js';

const Q = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
{ // a sky: deep blue overhead, pale at the horizon
  const c = document.createElement('canvas'); c.width = 4; c.height = 256;
  const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#2f72c4'); gr.addColorStop(0.55, '#7fb4e6'); gr.addColorStop(1, '#dcecf5');
  g.fillStyle = gr; g.fillRect(0, 0, 4, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  scene.background = t;
}
N.setHaze({ color: '#cfe4f1', near: 90, far: 420, max: 0.55 });
const ground = N.createGround({ radius: 240, flat: 130, hills: 1, far: '#cfe4f1' });
scene.add(ground);
const H = ground.userData.heightAt;
scene.add(N.createGrass({ count: 2600, radius: 16, heightAt: H, seed: 4, avoid: (x, z) => Math.abs(z) < 2.2 && Math.abs(x) < 15 }));
const trees = [[-14, -16, 'broadleaf', 3], [10, -19, 'pine', 5], [17, -12, 'oak', 8], [-21, -6, 'birch', 11]].map(([x, z, type, s]) => {
  const t = N.createTree({ type, seed: s }); t.userData.at = [x, z]; scene.add(t); return t;
});
// the trees stand by what is shown, for its size (further off beside a mountain)
const standTrees = f => { for (const t of trees) { const [x, z] = t.userData.at; t.position.set(x * f, H(x * f, z * f) - 0.05, z * f); } };
standTrees(1);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 900);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.maxPolarAngle = Math.PI * 0.49; controls.minDistance = 1.5; controls.maxDistance = 320;

const SIZE = { boulder: 4.5, stone: 2.2, pillar: 6.5, ledge: 5.5, pebbles: 3, paving: 4.2, flagstone: 2,
  cliffFace: 17, cliffTall: 17, buttress: 16, cliffTop: 9, slopeRock: 11, footRock: 6.5, cluster: 5, rubble: 3.6, range: 36,
  bluffTall: 30, bluffWide: 30, bluffSplit: 30, bluffLow: 19, bluffLowSplit: 17,
  peakSpire: 78, peakTwin: 72, mesaMount: 66, stepMount: 72, ridgeMount: 74, archMount: 56 };
const CAM = { buttress: [0.75, 0.3, 0.65], slopeRock: [0.2, 0.3, 0.95], range: [0.1, 0.16, 0.62] };     // from where each is best seen (default: front and a little to the side)
let index = Math.max(0, PROP_ROCK_TYPES.findIndex(t => t.key === Q.get('type')));
let seed = +Q.get('seed') || 1, showAll = Q.has('all');
// the groups, in turn: rocks, the cliff kit, the big cliff pieces (the button names the next one)
const GROUPS = ['rock', 'cliff', 'bluff', 'mount'], GROUP_NAME = { rock: 'หิน', cliff: 'ผา', bluff: 'ผาใหญ่', mount: 'ภูเขา' }, GROUP_BTN = { rock: '🪨 หิน', cliff: '⛰ ผา', bluff: '🏔 ผาใหญ่', mount: '🗻 ภูเขา' };
const nextGroup = () => GROUPS[(GROUPS.indexOf(PROP_ROCK_TYPES[index].group) + 1) % GROUPS.length];
const inGroup = () => PROP_ROCK_TYPES.filter(t => t.group === PROP_ROCK_TYPES[index].group);
const shown = new THREE.Group(); scene.add(shown);
const clear = () => { for (const m of [...shown.children]) { m.userData.dispose && m.userData.dispose(); shown.remove(m); } };
const nameEl = document.getElementById('name');

function build() {
  clear();
  standTrees(PROP_ROCK_TYPES[index].group === 'mount' ? (showAll ? 6 : 2.7) : 1);
  if (showAll) {                                                          // the whole set in a row, like a kit sheet
    const grp = PROP_ROCK_TYPES[index].group, cliff = grp !== 'rock', set = inGroup().filter(t => t.key !== 'range');
    let x = 0;
    for (const t of set) {
      const r = createPropRock({ type: t.key, seed }), w = SIZE[t.key] * (cliff ? 0.6 : 0.75);
      x += w / 2; r.position.set(x, 0, 0); x += w / 2 + 0.6;
      shown.add(r);
    }
    const off = -(x - 0.6) / 2;                                            // the row centred
    for (const r of shown.children) { r.position.x += off; r.position.y = H(r.position.x, 0); }
    nameEl.innerHTML = `${GROUP_NAME[grp]}ทั้งหมด <small>ชุดที่ ${seed} · ลากเพื่อหมุนดู</small>`;
    const k = grp === 'mount' ? 9.5 : grp === 'bluff' ? 3.6 : cliff ? 2.1 : 1;
    controls.target.set(0, 1.2 * k, 0); camera.position.set(1.5 * k, 4.6 * k, 16.5 * k);
  } else {
    shown.position.x = 0;
    const t = PROP_ROCK_TYPES[index], r = createPropRock({ type: t.key, seed }), s = SIZE[t.key];
    r.position.y = H(0, 0); shown.add(r);
    const g = inGroup();
    nameEl.innerHTML = `${t.name} <small>${g.indexOf(t) + 1} / ${g.length} · ชุดที่ ${seed}</small>`;
    const c = CAM[t.key] || [0.5, 0.38, 0.85];
    controls.target.set(0, s * 0.18, 0); camera.position.set(s * c[0], s * c[1], s * c[2]);
  }
  document.getElementById('all').classList.toggle('on', showAll);
  document.getElementById('group').textContent = GROUP_BTN[nextGroup()];
  controls.update();
}
const step = d => { const g = inGroup(), i = g.indexOf(PROP_ROCK_TYPES[index]); index = PROP_ROCK_TYPES.indexOf(g[(i + d + g.length) % g.length]); showAll = false; build(); };
document.getElementById('prev').onclick = () => step(-1);
document.getElementById('next').onclick = () => step(1);
document.getElementById('group').onclick = () => { const g = nextGroup(); index = PROP_ROCK_TYPES.findIndex(t => t.group === g); build(); };
document.getElementById('dice').onclick = () => { seed++; build(); };
document.getElementById('all').onclick = () => { showAll = !showAll; build(); };
build();

addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
const clock = new THREE.Clock();
const frame = () => { N.update(clock.getDelta()); controls.update(); renderer.render(scene, camera); };
window.__cat = { frame, renderer, scene, camera, controls, build, set: (o) => { if ('index' in o) index = o.index; if ('seed' in o) seed = o.seed; if ('all' in o) showAll = o.all; build(); } };
if (!Q.get('still')) renderer.setAnimationLoop(frame);
</script>
</body>
</html>
