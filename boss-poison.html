<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7fb4e6">
<title>บอสต้นไม้ — ท่าฝนพิษ</title>
<!--
  boss-poison.html  —  the plant boss's poison rain (plant-boss-moves.js: play('poison')) and all it draws (the gathering:
  howl-fx.js, without its breath; the rest: poison-rain-fx.js), in a meadow, to play: the heads gather themselves and
  the light goes up out of the middle one, they spit poison up into the sky, a whirl of it turns up there, and it rains
  down on Vivi, each drop warned on the ground first; where one lands a pool lies and bubbles for a while, and walking
  in it slows her and turns her green. Move her with the stick (or the arrow keys), or let her run by herself.
  One job: try the move. Nothing here goes into the game.
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #7fb4e6; font-family: system-ui, sans-serif; touch-action: none; -webkit-user-select: none; user-select: none; }
  canvas { display: block; }
  #name { position: fixed; left: 0; right: 0; top: calc(10px + env(safe-area-inset-top)); text-align: center; pointer-events: none;
    font: 700 17px system-ui; color: #fff; text-shadow: 0 1px 6px #0008; }
  #name small { display: block; font: 500 12px system-ui; opacity: 0.92; margin-top: 3px; }
  #beat { position: fixed; left: 0; right: 0; top: calc(58px + env(safe-area-inset-top)); text-align: center; pointer-events: none;
    font: 800 15px system-ui; color: #fff; text-shadow: 0 1px 6px #000a; }
  #sick { position: fixed; left: 50%; top: calc(86px + env(safe-area-inset-top)); transform: translateX(-50%); pointer-events: none;
    padding: 5px 12px; border-radius: 999px; background: #2c5a14e0; border: 1px solid #c8ff5a; color: #eaffc8; font: 800 13px system-ui;
    opacity: 0; transition: opacity 0.25s; white-space: nowrap; }
  #ui { position: fixed; left: 0; right: 0; bottom: calc(10px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 8px; pointer-events: none; }
  #ui > * { pointer-events: auto; }
  .track { position: relative; width: min(86vw, 420px); height: 8px; border-radius: 99px; background: #3b3147b0; border: 1px solid #ffffff90; overflow: hidden; }
  .track i { position: absolute; top: 0; bottom: 0; width: 2px; background: #ffffffa0; }
  .track b { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, #6fd23a, #d6ff5a); }
  .bar { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
  .bar button { border: 1px solid #ffffffaa; border-radius: 999px; padding: 9px 13px; background: #3b3147d9; color: #fff; font: 700 13px system-ui; touch-action: manipulation; }
  .bar button.on { background: #8a6a3a; }
  .bar button.go { background: #3f8a22; }
  #stick { position: fixed; left: calc(16px + env(safe-area-inset-left)); bottom: calc(132px + env(safe-area-inset-bottom)); width: 116px; height: 116px; border-radius: 50%;
    background: #ffffff22; border: 2px solid #ffffff88; touch-action: none; }
  @media (max-height: 520px) {                       /* a phone on its side: the buttons in one row, the title shorter */
    #name small { display: none; }
    #beat { top: calc(34px + env(safe-area-inset-top)); }
    #sick { top: calc(58px + env(safe-area-inset-top)); }
    #ui { flex-direction: row; flex-wrap: wrap; justify-content: center; align-items: center; }
    .track { width: min(26vw, 260px); }
    #stick { bottom: calc(64px + env(safe-area-inset-bottom)); }
  }
  #knob { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: #ffffffcc; box-shadow: 0 2px 8px #0005; pointer-events: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="name">บอสต้นไม้ · ท่าฝนพิษ<small>รวมพลัง → พ่นพิษขึ้นฟ้า → อุกกาบาตพิษไล่ตาม → แอ่งพิษ อย่าเหยียบ</small></div>
<div id="beat"></div>
<div id="sick">☠️ เหยียบพิษ — เดินช้าลง</div>
<div id="stick"><div id="knob"></div></div>
<div id="ui">
  <div class="track" id="track"><b id="fill"></b></div>
  <div class="bar">
    <button id="play" class="go">▶ ปล่อยท่า</button>
    <button id="loop" class="on">🔁 เล่นวน</button>
    <button id="auto" class="on">🏃 วิ่งหลบเอง</button>
  </div>
  <div class="bar">
    <button data-speed="1" class="on">×1</button>
    <button data-speed="0.5">×½</button>
    <button data-speed="0.25">×¼</button>
    <button id="cam">🎬 มุมคลิป</button>
  </div>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import * as N from './stylized-nature.js';
import * as G from './stylized-grassfield.js';
import { createPlantBoss, setPlantBossSun } from './plant-boss.js';
import { createBossMoves, BOSS_MOVES } from './plant-boss-moves.js';
import { createBossTurn } from './plant-boss-turn.js';
import { HOWL } from './plant-boss-talk.js';
import { createHowlFx } from './howl-fx.js';
import { createPoisonRainFx, poolStrength, SKY } from './poison-rain-fx.js';

const phone = matchMedia('(pointer: coarse)').matches;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, phone ? 1.75 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

// ---- the meadow: the game's sky, ground and grass
const scene = new THREE.Scene();
{
  const c = document.createElement('canvas'); c.width = 4; c.height = 256;
  const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#2f72c4'); gr.addColorStop(0.55, '#7fb4e6'); gr.addColorStop(1, '#dcecf5');
  g.fillStyle = gr; g.fillRect(0, 0, 4, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  scene.background = t;
}
const FAR = '#d6e8ef';
scene.add(N.createAlphaFix());
N.setHaze({ color: FAR, near: 45, far: 150, max: 0.65 });
const ground = N.createGround({ radius: 120, flat: 32, hills: 1, far: FAR });
scene.add(ground);
const H = ground.userData.heightAt;
const map = G.createGroundMap({ radius: 120, size: 768, seed: 4, heightAt: H, dirt: 0 });
G.applyGroundMap(ground, map, { far: FAR });
scene.add(G.createFluffyGrass({ map, heightAt: H, count: phone ? 70000 : 150000, radius: 32, far: FAR }));

// ---- the boss: how it fights, turning on its roots to her; the light of its gathering (the howl's, without the
// breath at her); and its poison rain
const boss = createPlantBoss({ seed: 1, clip: true });
boss.position.set(0, H(0, 0) - 0.05, 0);
scene.add(boss);
const moves = createBossMoves(boss, { snaps: true }), turn = createBossTurn(boss);
const howl = createHowlFx({ seed: 1, breath: false });
const fx = createPoisonRainFx({ heightAt: H, seed: 3, lift: 0.3 });
scene.add(howl.object, fx.object);
const sun = new THREE.Vector3(-0.45, 0.78, 0.45).normalize();
setPlantBossSun(sun); howl.setSun(sun); fx.setSun(sun);
const B = BOSS_MOVES.poison;

// ---- her: she runs where the stick sends her (or by herself, to and fro in front of it); in poison she is slowed and green
const her = new THREE.Vector3(0, 0, 9.5);
her.y = H(her.x, her.z);
let vivi = null, mark = null, facing = Math.PI, moving = '', arc = 0, arcWay = 1, arcTurn = 3;
(async () => {
  try {
    const [{ loadCharacter }, { VIVI_GLB }, { CHARACTER_ANIM }] = await Promise.all([import('./stylized-character.js'), import('./vivi-data.js'), import('./character-anim.js')]);
    vivi = await loadCharacter(VIVI_GLB, CHARACTER_ANIM);
    if (vivi.setSize) vivi.setSize(1.75 / vivi.baseHeight);
    vivi.play('idle');
    scene.add(vivi.object);
  } catch (err) {
    // (no Vivi here: a pole as tall as she is, on a ring where she stands)
    console.warn('Vivi not loaded', err);
    mark = new THREE.Group();
    const pale = new THREE.MeshBasicMaterial({ color: 0xfff6e0 });
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 1.75, 10), pale); pole.position.y = 0.875 + 0.3;
    const top = new THREE.Mesh(new THREE.SphereGeometry(0.16, 14, 10), pale); top.position.y = 1.75 + 0.3;
    const ring = new THREE.Mesh(new THREE.RingGeometry(0.42, 0.52, 40), pale); ring.rotation.x = -Math.PI / 2; ring.position.y = 0.32;
    mark.add(pole, top, ring);
    scene.add(mark);
  }
})();

// the pools lying now (from the moves' events): { x, z, r, born, lasts }; how badly she is poisoned (comes on quickly,
// wears off more slowly once she is out)
const pools = [];
let clockT = 0, sick = 0;
function poisonAt(p) {
  let k = 0;
  for (const q of pools) {
    const d = Math.hypot(p.x - q.x, p.z - q.z);
    k = Math.max(k, poolStrength(clockT - q.born, q.lasts) * (1 - THREE.MathUtils.smoothstep(d, q.r * 0.65, q.r * 0.95)));
  }
  return k;
}

// ---- the stick (and the arrow keys / WASD): which way she goes, -1..1, as the camera looks
const stick = new THREE.Vector2(), keys = new Set();
{
  const el = document.getElementById('stick'), knob = document.getElementById('knob');
  let id = null;
  const at = e => {
    const r = el.getBoundingClientRect(), R = r.width / 2;
    let x = (e.clientX - r.left - R) / (R * 0.8), y = -(e.clientY - r.top - R) / (R * 0.8);
    const l = Math.hypot(x, y); if (l > 1) { x /= l; y /= l; }
    stick.set(x, y); knob.style.transform = `translate(${x * R * 0.8}px, ${-y * R * 0.8}px)`;
  };
  el.addEventListener('pointerdown', e => { id = e.pointerId; el.setPointerCapture(id); at(e); setAuto(false); e.preventDefault(); });
  el.addEventListener('pointermove', e => { if (e.pointerId === id) at(e); });
  const up = e => { if (e.pointerId !== id) return; id = null; stick.set(0, 0); knob.style.transform = ''; };
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
}
addEventListener('keydown', e => { keys.add(e.key.toLowerCase()); if (/^(arrow|[wasd]$)/.test(e.key.toLowerCase())) setAuto(false); });
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
function keyStick() {
  const x = (keys.has('arrowright') || keys.has('d') ? 1 : 0) - (keys.has('arrowleft') || keys.has('a') ? 1 : 0);
  const y = (keys.has('arrowup') || keys.has('w') ? 1 : 0) - (keys.has('arrowdown') || keys.has('s') ? 1 : 0);
  const l = Math.hypot(x, y) || 1;
  return new THREE.Vector2(x / l, y / l);
}

// ---- the camera: as in the clip (in front of it, low, the sky over it in the picture), or behind her
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 600);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.maxPolarAngle = Math.PI * 0.52; controls.minDistance = 4; controls.maxDistance = 90; controls.enablePan = false;
let view = 'clip';
// the clip's view: in front of it, low, as near as it can be while her ground (just over the buttons), the plant and the
// whirl in the sky all fit in the picture: found by trying, whenever the screen's shape changes
const SKY_TOP = new THREE.Vector3(0, SKY + 1.5, 0), HER_L = new THREE.Vector3(-4.6, 0.2, 9.2), HER_R = new THREE.Vector3(4.6, 0.2, 9.2), WHIRL_SIDE = new THREE.Vector3(6.5, SKY, 0);
function frame() {
  controls.enabled = view === 'clip';
  camera.fov = view === 'clip' ? 50 : 60; camera.updateProjectionMatrix();
  if (view !== 'clip') return;
  const under = (innerHeight - document.getElementById('ui').getBoundingClientRect().top + 10) / innerHeight, over = (document.getElementById('beat').getBoundingClientRect().top + 22) / innerHeight;
  const low = -1 + 2 * under, high = 1 - 2 * over, p = new THREE.Vector3();
  const at = v => p.copy(v).project(camera);
  let best = null;
  for (let d = 14; d <= 70 && !best; d += 1) for (let ty = 0; ty <= 12 && !best; ty += 0.5) {
    camera.position.set(0, 3 + d * 0.08, d); camera.lookAt(0, ty, 2); camera.updateMatrixWorld();
    if (at(HER_L).y < low || Math.abs(p.x) > 0.92 || at(HER_R).y < low || Math.abs(p.x) > 0.92) continue;
    if (at(SKY_TOP).y > high || Math.abs(at(WHIRL_SIDE).x) > 0.98) continue;
    best = [d, ty];
  }
  const [d, ty] = best || [40, 6];
  camera.position.set(0, 3 + d * 0.08, d);
  controls.target.set(0, ty, 2);
  controls.update();
}
frame();
const behind = new THREE.Vector3(), look = new THREE.Vector3(), lookAt = new THREE.Vector3(0, 4, 0);
function follow(dt, snap = false) {
  // behind her, away from the boss, high enough to see the ground round her and what comes down on it
  const away = behind.set(her.x - boss.position.x, 0, her.z - boss.position.z);
  if (away.lengthSq() < 1e-4) away.set(0, 0, 1);
  away.normalize();
  const want = look.set(her.x + away.x * 9.5, her.y + 7, her.z + away.z * 9.5);
  const k = snap ? 1 : 1 - Math.exp(-dt * 4);
  camera.position.lerp(want, k);
  lookAt.lerp(new THREE.Vector3(her.x - away.x * 3.5, her.y + 1.6, her.z - away.z * 3.5), k);
  camera.lookAt(lookAt);
}

// ---- what is happening, shown over it
const LAST = B.rain[1] + B.lead;
const BEATS = [[0, 'สะดุ้ง หันมาหาวีวี่'], [B.gather, 'รวมพลัง กลืนแสงเขียว'], [B.beam, 'แสงพุ่งขึ้นฟ้า วังวนพิษก่อตัว'], [B.up, 'เงยหน้าขึ้นฟ้า'],
  [B.volley[0], 'พ่นลูกพิษขึ้นฟ้ารัวๆ'], [B.rain[0], 'วงเตือนตามตัวมา — หลบ!'], [B.rain[0] + B.lead, 'ฝนพิษตกกระหน่ำ!'], [LAST + 0.2, 'หัวเราะเยาะ · แอ่งพิษยังอยู่ อย่าเหยียบ']];
const track = document.getElementById('track');
for (const [t] of BEATS.slice(1)) { const i = document.createElement('i'); i.style.left = (t / B.length * 100) + '%'; track.appendChild(i); }
const beatEl = document.getElementById('beat'), fillEl = document.getElementById('fill'), sickEl = document.getElementById('sick');

let loop = true, speed = 1, wait = 1.5, auto = true;
moves.onEvent = e => {
  fx.event(e);
  if (e.type === 'warn' && e.move === 'poison') warns.set(e.drop, { x: e.shape.x, z: e.shape.z, r: e.shape.radius });
  if (e.type === 'hit' && e.move === 'poison') warns.delete(e.drop);
  if (e.type === 'cancel') warns.clear();
  if (e.type === 'hit' && e.move === 'poison' && e.pool) pools.push({ x: e.shape.x, z: e.shape.z, r: e.pool.radius, born: clockT, lasts: e.pool.lasts });
  if (e.type === 'end' && e.move === 'poison') wait = 2.4;
};
const play = () => { if (moves.state === 'idle') moves.play('poison'); };
const btn = id => document.getElementById(id);
function setAuto(on) { auto = on; btn('auto').classList.toggle('on', on); }
btn('play').onclick = () => { wait = -1; play(); };
btn('loop').onclick = () => { loop = !loop; btn('loop').classList.toggle('on', loop); };
btn('auto').onclick = () => setAuto(!auto);
for (const b of document.querySelectorAll('[data-speed]')) b.onclick = () => {
  speed = +b.dataset.speed;
  for (const o of document.querySelectorAll('[data-speed]')) o.classList.toggle('on', o === b);
};
btn('cam').onclick = () => { view = view === 'clip' ? 'her' : 'clip'; btn('cam').textContent = view === 'clip' ? '🎬 มุมคลิป' : '🧍 มุมวีวี่'; if (view === 'her') follow(0, true); frame(); };
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); frame(); });

// ---- every frame
const fwd = new THREE.Vector3(), right = new THREE.Vector3(), go = new THREE.Vector3(), UP = new THREE.Vector3(0, 1, 0);
const warns = new Map();                    // the warnings on the ground now (drop -> { x, z, r }): for her running by herself
const aim = new THREE.Vector3();
let spot = null;
// how bad a spot is to stand on, for her running by herself: a warning there (worse in its middle), a pool, too near it or too far off
function dangerAt(x, z) {
  let k = 0;
  for (const w of warns.values()) { const d = Math.hypot(x - w.x, z - w.z); if (d < w.r + 0.9) k += 1 + 3 * (1 - d / (w.r + 0.9)); }
  for (const q of pools) { const st = poolStrength(clockT - q.born, q.lasts), d = Math.hypot(x - q.x, z - q.z); if (st > 0.1 && d < q.r * 1.05) k += 2 * st; }
  const far = Math.hypot(x, z);
  return k + Math.max(0, 5 - far) + Math.max(0, far - 15);
}
function walk(dt) {
  const runSpeed = vivi ? vivi.speeds.run : 4.6, walkSpeed = vivi ? vivi.speeds.walk : 1.6;
  const pace = Math.max(walkSpeed * 1.4, runSpeed * (1 - 0.55 * Math.min(1, sick * 1.3)));      // (poisoned: she can only trudge)
  let gone = 0;
  if (auto) {
    // by herself: where she would like to be goes to and fro along an arc in front of it (turning back now and then);
    // she picks the safest spot near her on the way there, clear of the warnings and the pools, and runs to it
    const R = 9.2;
    if ((arcTurn -= dt) <= 0 || Math.abs(arc) > 0.6) { arcWay = Math.abs(arc) > 0.6 ? -Math.sign(arc) : -arcWay; arcTurn = 1.6 + Math.random() * 2.6; }
    arc += arcWay * 0.42 * dt;
    const gx = Math.sin(arc) * R, gz = Math.cos(arc) * R;
    const score = (x, z) => dangerAt(x, z) + 0.12 * Math.hypot(x - gx, z - gz);
    let bx = her.x, bz = her.z, best = score(bx, bz);
    for (let i = 0; i < 12; i++) for (const r of [1.5, 3]) {
      const a = i / 12 * Math.PI * 2, x = her.x + Math.sin(a) * r, z = her.z + Math.cos(a) * r, v = score(x, z) + 0.04 * r;
      if (v < best) { best = v; bx = x; bz = z; }
    }
    if (spot && score(spot.x, spot.z) <= best + 0.25) { bx = spot.x; bz = spot.z; } else spot = { x: bx, z: bz };
    aim.set(bx - her.x, 0, bz - her.z);
    if (aim.length() > 0.3) { go.copy(aim).setLength(Math.min(aim.length(), pace * dt)); her.add(go); gone = go.length(); }
    else spot = null;
  } else {
    const s = stick.lengthSq() > 0.001 ? stick : keyStick();
    if (s.lengthSq() > 0.001) {
      camera.getWorldDirection(fwd); fwd.y = 0; fwd.normalize();
      right.crossVectors(fwd, UP).normalize();
      go.copy(right).multiplyScalar(s.x).addScaledVector(fwd, s.y);
      const m = Math.min(1, go.length());
      go.normalize().multiplyScalar(pace * m * dt);
      her.add(go); gone = go.length();
    }
  }
  // not into it, not off the meadow
  const d = Math.hypot(her.x, her.z);
  if (d < 3.4) { her.x *= 3.4 / d; her.z *= 3.4 / d; }
  if (d > 28) { her.x *= 28 / d; her.z *= 28 / d; }
  her.y = H(her.x, her.z);
  if (gone > 1e-4) facing = Math.atan2(go.x, go.z);
  const sp = gone / Math.max(dt, 1e-4), state = sp < 0.3 ? 'idle' : (sick > 0.35 ? 'walk' : 'run');
  const who = vivi ? vivi.object : mark;
  if (who) {
    who.position.copy(her);
    let d = facing - who.rotation.y; d = Math.atan2(Math.sin(d), Math.cos(d));
    who.rotation.y += d * Math.min(1, dt * 12);
  }
  if (vivi) {
    if (state !== moving) vivi.play(state);
    vivi.setRate(state === 'walk' ? Math.min(1.6, sp / walkSpeed) : state === 'run' ? Math.max(0.6, sp / runSpeed) : 1);
    vivi.tint.set(0.42, 1.0, 0.18, Math.min(0.5, sick * 0.5) * (0.8 + 0.2 * Math.sin(clockT * 7)));
  }
  moving = state;
}
function step(dt) {
  clockT += dt;
  if (moves.state === 'idle' && wait >= 0) { wait -= dt; if (wait < 0 && (loop || !step.started)) { step.started = true; play(); } }
  for (let i = pools.length - 1; i >= 0; i--) if (clockT - pools[i].born > pools[i].lasts) pools.splice(i, 1);
  const k = poisonAt(her);
  sick += (k - sick) * Math.min(1, dt * (k > sick ? 8 : 1.1));
  walk(dt);
  N.update(dt);
  turn.update(dt, her, true);
  moves.update(dt, her);
  const t = moves.state === 'poison' ? moves.time : -1;
  howl.update(dt, camera, boss, t >= 0 && t < HOWL.length ? t : -1, her);
  fx.afflict(her, sick);
  fx.update(dt, camera, boss, t);
  if (vivi) vivi.update(dt);
  if (view === 'her') follow(dt);
  let label = '';
  if (t >= 0) for (const [bt, s] of BEATS) if (t >= bt) label = s;
  beatEl.textContent = label;
  fillEl.style.width = (t >= 0 ? t / B.length * 100 : 0) + '%';
  sickEl.style.opacity = sick > 0.2 ? 1 : 0;
}
const shakeOff = new THREE.Vector3();
let shakeT = 0;
function draw(dt) {
  if (view === 'clip') controls.update();
  shakeT += dt;
  const k = Math.max(howl.shake * 0.16, fx.shake * 0.22);
  shakeOff.set(Math.sin(shakeT * 71) * k, Math.sin(shakeT * 83 + 1) * k * 0.7, Math.sin(shakeT * 67 + 2) * k * 0.5);
  camera.position.add(shakeOff);
  renderer.render(scene, camera);
  camera.position.sub(shakeOff);
}
const clock = new THREE.Clock();
let manual = false;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (manual) return;
  step(dt * speed); draw(dt * speed);
});
// for tests: run it by hand, a fixed step at a time
window.__scene = {
  scene, camera, controls, boss, moves, fx, howl, her, pools,
  get sick() { return sick; },
  manual(on) { manual = on; },
  run(seconds, fps = 30) { const n = Math.round(seconds * fps); for (let i = 0; i < n; i++) step(1 / fps); draw(1 / fps); },
  view(v) { view = v; if (v === 'her') follow(0, true); frame(); },
  auto(on) { setAuto(on); },
  ready: () => !!(vivi || mark),
};
</script>
