name: Prep Backdrop World23

on:
  push:
    branches:
      - agent/backdrop-world23
    paths:
      - backdrop-meadow-src.png
      - backdrop-treeline.png
      - tools/prep_backdrop.py
      - .github/workflows/prep-backdrop-world23.yml

permissions:
  contents: write

jobs:
  prep:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Prepare wide backdrop assets
        run: |
          set -euo pipefail
          python tools/prep_backdrop.py backdrop-meadow-src.png assets/textures/backdrop-meadow.webp --keep-top 256 --overlap 192 --quality 88
          python tools/prep_backdrop.py backdrop-treeline.png assets/textures/backdrop-treeline.webp --overlap 192 --quality 88

      - name: Archive sources and write report
        run: |
          set -euo pipefail
          mkdir -p assets/textures/_src docs
          git mv backdrop-meadow-src.png assets/textures/_src/backdrop-meadow.png
          git mv backdrop-treeline.png assets/textures/_src/backdrop-treeline.png
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          rows = [
              ('Meadow', Path('assets/textures/backdrop-meadow.webp')),
              ('Treeline', Path('assets/textures/backdrop-treeline.webp')),
          ]
          lines = [
              '# Backdrop prep report',
              '',
              'Generated by `.github/workflows/prep-backdrop-world23.yml` using `tools/prep_backdrop.py`.',
              '',
              '| Band | Dimensions | Size |',
              '|---|---:|---:|',
          ]
          for name, path in rows:
              with Image.open(path) as image:
                  lines.append(f'| {name} | {image.width} × {image.height} | {path.stat().st_size / 1024:.1f} KB |')
          lines += [
              '',
              'Both outputs passed the pipeline seam guard before being written.',
              'Original PNGs are retained under `assets/textures/_src/`.',
              '',
          ]
          Path('docs/BACKDROP-PREP-REPORT.md').write_text('\n'.join(lines), encoding='utf-8')
          PY

      - name: Commit generated assets
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/textures/backdrop-meadow.webp assets/textures/backdrop-treeline.webp assets/textures/_src docs/BACKDROP-PREP-REPORT.md
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'Prepare wide meadow and treeline backdrops'
          git push origin HEAD:${GITHUB_REF_NAME}
