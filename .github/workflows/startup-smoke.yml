name: Production startup smoke

on:
  workflow_dispatch:
  push:
    branches: [main, fix/main-startup-20260908]
    paths: ["src/**", "index.html", "vendor/three/**", "tools/repair-startup.py", "tools/test/startup-network.mjs", ".github/workflows/startup-smoke.yml"]
  pull_request:
    paths: ["src/**", "index.html", "vendor/three/**", "tools/test/startup-network.mjs", ".github/workflows/startup-smoke.yml"]

permissions:
  contents: read

jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preserve baseline and apply the one-time repair on its branch
        if: github.ref == 'refs/heads/fix/main-startup-20260908' && hashFiles('tools/repair-startup.py') != ''
        run: |
          mkdir -p /tmp/liora-baseline
          cp -R src assets maps styles index.html /tmp/liora-baseline/
          python3 tools/repair-startup.py
      - name: Prepare browsers and vendor the exact engine without a runtime CDN dependency
        run: |
          npm install --prefix /tmp/liora-smoke --no-audit --no-fund three@0.180.0 playwright@1.55.0
          /tmp/liora-smoke/node_modules/.bin/playwright install --with-deps webkit
          mkdir -p vendor/three/addons/loaders vendor/three/addons/utils smoke-results
          cp /tmp/liora-smoke/node_modules/three/build/three.module.js vendor/three/
          cp /tmp/liora-smoke/node_modules/three/build/three.core.js vendor/three/
          cp /tmp/liora-smoke/node_modules/three/examples/jsm/loaders/GLTFLoader.js vendor/three/addons/loaders/
          cp /tmp/liora-smoke/node_modules/three/examples/jsm/utils/BufferGeometryUtils.js vendor/three/addons/utils/
          cp /tmp/liora-smoke/node_modules/three/examples/jsm/utils/SkeletonUtils.js vendor/three/addons/utils/
          cp /tmp/liora-smoke/node_modules/three/LICENSE vendor/three/LICENSE
          if [ -d /tmp/liora-baseline ]; then cp -R vendor /tmp/liora-baseline/; fi
      - name: Syntax, module graph, saved-world and farming checks
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find src tools/test -type f \( -name '*.js' -o -name '*.mjs' \) -print0)
          node tools/test/module-graph.mjs
          node tools/test/world-logic.test.mjs
          node tools/test/world-actions.test.mjs
          node tools/test/world-navigation.test.mjs
          node tools/test/world-portal-action.test.mjs
          node tools/test/farm-game-feel.test.mjs
          node tools/test/woodland-layout.test.mjs
      - name: Reproduce and fix the blank frame under stalled network requests
        run: node tools/test/startup-network.mjs
      - name: Commit only the successfully tested repair to its branch
        if: github.ref == 'refs/heads/fix/main-startup-20260908' && github.event_name == 'push'
        run: |
          git add src index.html
          git add -f vendor/three/
          if git ls-files --error-unmatch tools/repair-startup.py >/dev/null 2>&1; then git add -u tools/repair-startup.py; fi
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix: render farm before scenery, bound pending loads and self-host Three.js'
            git push origin HEAD:refs/heads/fix/main-startup-20260908
          fi
      - name: Keep startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-diagnostics
          path: smoke-results/
          retention-days: 3
