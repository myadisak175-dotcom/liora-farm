name: Production startup smoke

on:
  workflow_dispatch:
  push:
    branches: [main, fix/main-startup-20260908]
    paths: ["src/**", "index.html", ".github/workflows/startup-smoke.yml"]
  pull_request:
    paths: ["src/**", "index.html", ".github/workflows/startup-smoke.yml"]

permissions:
  contents: read

jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare browsers and exact rendering dependency
        run: |
          npm install --prefix /tmp/liora-smoke --no-audit --no-fund three@0.180.0 playwright@1.55.0
          /tmp/liora-smoke/node_modules/.bin/playwright install --with-deps webkit
          mkdir -p vendor/three smoke-results
          cp /tmp/liora-smoke/node_modules/three/build/three.module.js vendor/three/
          cp /tmp/liora-smoke/node_modules/three/build/three.core.js vendor/three/
          cp -R /tmp/liora-smoke/node_modules/three/examples/jsm vendor/three/addons
          cp /tmp/liora-smoke/node_modules/three/LICENSE vendor/three/LICENSE
      - name: Boot real index in Chromium and WebKit
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          python3 -m http.server 8000 >/tmp/liora-http.log 2>&1 &
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { chromium, webkit, devices } from '/tmp/liora-smoke/node_modules/playwright/index.mjs';
          const chrome = await chromium.launch({ executablePath: '/usr/bin/google-chrome', args: ['--no-sandbox', '--enable-unsafe-swiftshader', '--use-gl=angle', '--use-angle=swiftshader'] });
          const safari = await webkit.launch();
          let failures = 0;
          try {
            for (const [name, browser, mobile, live] of [
              ['chrome-local', chrome, true, false],
              ['webkit-local', safari, true, false],
              ['chrome-live', chrome, true, true],
              ['webkit-live', safari, true, true],
            ]) {
              const context = await browser.newContext(mobile ? { ...devices['iPhone 13'], deviceScaleFactor: 1 } : { viewport: { width: 1280, height: 720 } });
              const page = await context.newPage();
              const report = { name, errors: [], console: [], failedRequests: [] };
              page.on('pageerror', error => report.errors.push(error.stack || String(error)));
              page.on('console', message => { if (['error', 'warning'].includes(message.type())) report.console.push(message.text()); });
              page.on('requestfailed', request => report.failedRequests.push({ url: request.url(), reason: request.failure()?.errorText }));
              const url = live ? 'https://myadisak175-dotcom.github.io/liora-farm/' : 'http://127.0.0.1:8000/';
              try {
                await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 45000 });
                await page.waitForFunction(() => window.__lioraBooted === true, null, { timeout: 45000 });
              } catch (error) { report.waitError = String(error); }
              await page.waitForTimeout(1500);
              report.state = await page.evaluate(() => ({ booted: window.__lioraBooted, state: window.__lioraBootState, error: window.__lioraBootError, status: document.querySelector('#status')?.textContent, detail: document.querySelector('#status')?.title, build: window.__lioraBuild, woodland: window.__liora?.woodland, canvas: Boolean(document.querySelector('canvas')) }));
              await page.screenshot({ path: `smoke-results/${name}.png` });
              fs.writeFileSync(`smoke-results/${name}.json`, JSON.stringify(report, null, 2));
              console.log(JSON.stringify(report, null, 2));
              if (!report.state.booted || report.errors.length) failures++;
              await context.close();
            }
          } finally { await chrome.close(); await safari.close(); }
          process.exitCode = failures ? 1 : 0;
          JS
      - name: Keep startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-diagnostics
          path: smoke-results/
          retention-days: 3
      - name: Keep the exact test renderer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-renderer
          path: vendor/
          retention-days: 1
