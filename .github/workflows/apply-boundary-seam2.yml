name: Apply boundary seam 2
on:
  push:
    branches: [agent/boundary-seam2]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[boundary-seam2-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/boundary-seam2
      - name: Apply seam and invisible boundary
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace_once(path, old, new):
              p = Path(path); text = p.read_text()
              if text.count(old) != 1: raise SystemExit(f"{path}: expected 1 match, got {text.count(old)}")
              p.write_text(text.replace(old, new, 1))
          replace_once("src/config.js", 'export const BUILD = "worlds-2-detail";', 'export const BUILD = "worlds-2-boundary-seam";')
          replace_once("src/main.js", 'from "./config.js";', 'from "./config.js?v=boundary-seam2";')
          replace_once("src/main.js", 'from "./zones/home-island.js";', 'from "./zones/home-island.js?v=boundary-seam2";')
          replace_once("src/main.js", 'from "./systems/movement.js";', 'from "./systems/movement.js?v=boundary-seam2";')
          replace_once("index.html", 'entry.src = "./src/main.js?v=horizon4";', 'entry.src = "./src/main.js?v=boundary-seam2";')
          replace_once("src/zones/home-island.js", 'from "../systems/outer-world-ground.js";', 'from "../systems/outer-world-ground.js?v=boundary-seam2";')
          replace_once("src/zones/home-island.js", 'from "../systems/ground-paint.js";', 'from "../systems/ground-paint.js?v=boundary-seam2";')
          old_outer = '''  const buildOuterWorld = (outerConfig) => createOuterWorldGround({
    config: {
      ...outerConfig,
      innerY: boundaryTopY + Number(outerConfig?.innerYOffset || 0),
    },
    texture: baseMap,
    textureWorldSize: config.terrain.size,
  });'''
          new_outer = '''  // Keep the rendered world visually continuous while gameplay still ends
  // inside the terrain. A tiny overlap/depth bias prevents a precision crack
  // without reading as the raised square slab seen with the old 1.5 m / 8 cm seam.
  const buildOuterWorld = (outerConfig) => {
    const terrainHalf = Math.max(1, Number(config.terrain.size) / 2);
    const seamOverlap = 0.35;
    const seamDrop = 0.015;
    return createOuterWorldGround({
      config: {
        ...outerConfig,
        innerRadius: Math.max(1, terrainHalf - seamOverlap),
        innerY: boundaryTopY - seamDrop,
      },
      texture: baseMap,
      textureWorldSize: config.terrain.size,
    });
  };'''
          replace_once("src/zones/home-island.js", old_outer, new_outer)
          old_clamp = '''  function clampToWorld(root) {
    root.position.x = THREE.MathUtils.clamp(root.position.x, -config.worldLimit, config.worldLimit);
    root.position.z = THREE.MathUtils.clamp(root.position.z, -config.worldLimit, config.worldLimit);
  }'''
          new_clamp = '''  /** Invisible gameplay boundary: outer world is scenery, not walkable space. */
  function clampToWorld(root) {
    const terrainHalf = Number(config.terrain?.size) / 2;
    const authoredLimit = Number(config.worldLimit);
    const safeTerrainLimit = Number.isFinite(terrainHalf)
      ? Math.max(0.5, terrainHalf - Math.max(0.5, Number(config.playerRadius) || 0.3))
      : Infinity;
    const limit = Number.isFinite(authoredLimit)
      ? Math.min(Math.max(0.5, authoredLimit), safeTerrainLimit)
      : safeTerrainLimit;
    root.position.x = THREE.MathUtils.clamp(root.position.x, -limit, limit);
    root.position.z = THREE.MathUtils.clamp(root.position.z, -limit, limit);
  }'''
          replace_once("src/systems/movement.js", old_clamp, new_clamp)
          old_idle = '''      if (player.isSpecial() || input.m <= 0.05) {
        moveDirection.set(0, 0, 0);
        snapToTerrain(player.root);
        return { moving: false, running: false, direction: moveDirection, waterDepth: currentDepth };
      }'''
          new_idle = '''      if (player.isSpecial() || input.m <= 0.05) {
        moveDirection.set(0, 0, 0);
        clampToWorld(player.root);
        snapToTerrain(player.root);
        return { moving: false, running: false, direction: moveDirection, waterDepth: waterDepthAt(player.root.position.x, player.root.position.z) };
      }'''
          replace_once("src/systems/movement.js", old_idle, new_idle)
          old_post = '''      resolveCollisions(player.root);
      clampToWorld(player.root);
      resolveWalkability(player.root, fromX, fromZ);
      snapToTerrain(player.root);'''
          new_post = '''      resolveCollisions(player.root);
      clampToWorld(player.root);
      resolveWalkability(player.root, fromX, fromZ);
      clampToWorld(player.root);
      snapToTerrain(player.root);'''
          replace_once("src/systems/movement.js", old_post, new_post)
          PY
      - name: Validate scoped change
        run: |
          set -euo pipefail
          node --check src/main.js
          node --check src/config.js
          node --check src/zones/home-island.js
          node --check src/systems/movement.js
          grep -q 'worlds-2-boundary-seam' src/config.js
          grep -q 'const seamOverlap = 0.35' src/zones/home-island.js
          grep -q 'const seamDrop = 0.015' src/zones/home-island.js
          grep -q 'Invisible gameplay boundary' src/systems/movement.js
          grep -q 'main.js?v=boundary-seam2' index.html
          git diff --exit-code HEAD -- src/systems/object-shadows.js src/systems/contact-shadow.js src/systems/outer-world-ground.js
      - name: Commit runtime files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/config.js src/main.js src/zones/home-island.js src/systems/movement.js
          git commit -m "Blend play boundary into outer world [boundary-seam2-applied]"
          git push origin HEAD:agent/boundary-seam2
