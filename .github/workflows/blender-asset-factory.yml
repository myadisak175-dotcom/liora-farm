name: Blender Asset Factory

on:
  workflow_dispatch:
    inputs:
      input_path:
        description: "GLB/GLTF file already uploaded to the repo"
        required: true
        default: "assets/inbox/model.glb"
        type: string
      output_path:
        description: "Where the optimized GLB should be written"
        required: true
        default: "assets/optimized/model_100k.glb"
        type: string
      target_tris:
        description: "Target total triangle count"
        required: true
        default: "100000"
        type: string
      allow_rigged:
        description: "Allow decimation of rigged/shape-key meshes"
        required: true
        default: false
        type: boolean
      commit_output:
        description: "Commit optimized GLB and report back to this branch"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: blender-asset-factory-${{ github.ref }}
  cancel-in-progress: false

jobs:
  optimize:
    name: Optimize 3D asset
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
          blender --version

      - name: Validate input
        env:
          INPUT_PATH: ${{ inputs.input_path }}
        run: |
          test -f "$INPUT_PATH" || {
            echo "::error::Input file not found: $INPUT_PATH"
            exit 1
          }

      - name: Run Blender Asset Factory
        id: factory
        env:
          INPUT_PATH: ${{ inputs.input_path }}
          OUTPUT_PATH: ${{ inputs.output_path }}
          TARGET_TRIS: ${{ inputs.target_tris }}
          ALLOW_RIGGED: ${{ inputs.allow_rigged }}
        run: |
          ARGS=(
            --input "$INPUT_PATH"
            --output "$OUTPUT_PATH"
            --target-tris "$TARGET_TRIS"
          )

          if [[ "$ALLOW_RIGGED" == "true" ]]; then
            ARGS+=(--allow-rigged)
          fi

          blender \
            --background \
            --factory-startup \
            --python tools/blender_asset_factory.py \
            -- "${ARGS[@]}"

          REPORT_PATH="${OUTPUT_PATH%.glb}.report.json"
          echo "report_path=$REPORT_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload optimized asset
        uses: actions/upload-artifact@v4
        with:
          name: blender-asset-${{ github.run_id }}
          path: |
            ${{ inputs.output_path }}
            ${{ steps.factory.outputs.report_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Commit result to repository
        if: ${{ inputs.commit_output }}
        env:
          OUTPUT_PATH: ${{ inputs.output_path }}
          REPORT_PATH: ${{ steps.factory.outputs.report_path }}
        run: |
          git config user.name "liora-asset-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- "$OUTPUT_PATH" "$REPORT_PATH"

          if git diff --cached --quiet; then
            echo "No asset changes to commit."
            exit 0
          fi

          git commit -m "Optimize 3D asset: $OUTPUT_PATH"
          git push origin "HEAD:${GITHUB_REF_NAME}"
