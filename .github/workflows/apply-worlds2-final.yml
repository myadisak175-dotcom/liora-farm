name: Apply Worlds 2 Detail Final
on:
  push:
    branches: [agent/worlds-2-detail-clean]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[worlds2-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconstruct and verify runtime
        shell: bash
        run: |
          set -euo pipefail
          cat .deploy/rem2.aa .deploy/rem2.ab .deploy/rem2.ac | base64 -d > /tmp/rem2.tar.gz
          echo '9af9982e8b494ea91770d90241b6e995f012c4a1960f3cb3bc0088965fcc74a6  /tmp/rem2.tar.gz' | sha256sum -c -
          tar -xzf /tmp/rem2.tar.gz -C .
          grep -F 'export const BUILD = "worlds-2-detail";' src/config.js
          grep -F 'createMapScope' src/main.js
          grep -F 'horizonForMap' src/systems/horizon-settings.js
          grep -F 'createGroundDetailNormal' src/systems/terrain.js
          grep -F 'localStorage.removeItem(storageKey)' src/editor/horizon-controls.js
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find src -type f -name '*.js' -print0)
      - name: Commit validated runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .deploy .github/workflows/apply-worlds2-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Deploy worlds-2-detail [worlds2-applied]'
          git push origin HEAD:agent/worlds-2-detail-clean
