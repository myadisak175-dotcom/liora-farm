name: Materialize grass asset

on:
  push:
    branches: [main]
    paths:
      - 'assets/grass/grass_master.png.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode grass PNG
        shell: bash
        run: |
          mkdir -p assets/grass
          base64 --decode assets/grass/grass_master.png.b64 > assets/grass/grass_master.png
          rm assets/grass/grass_master.png.b64
      - name: Commit generated asset
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add master grass texture" || exit 0
          git push
