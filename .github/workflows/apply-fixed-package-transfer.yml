name: Apply fixed package transfer

on:
  push:
    branches: [agent/fixed-package-integration]

permissions:
  contents: write
  issues: read

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/fixed-package-integration
          fetch-depth: 0

      - name: Rehydrate remaining fixed-package text files
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: "44"
          EXPECTED_SHA256: "570dab2baf6a72df12588b87fdffff1b3e9ff70a015d9fc461f11d8d049ee16b"
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          issue_number = os.environ['ISSUE_NUMBER']
          token = os.environ['GH_TOKEN']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'User-Agent': 'liora-fixed-package-transfer',
          }

          def get_json(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          issue = get_json(f'https://api.github.com/repos/{repo}/issues/{issue_number}')
          comments = get_json(f'https://api.github.com/repos/{repo}/issues/{issue_number}/comments?per_page=100')
          comments.sort(key=lambda item: item['id'])
          encoded = (issue.get('body') or '') + ''.join(item.get('body') or '' for item in comments)
          archive = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(archive).hexdigest()
          expected = os.environ['EXPECTED_SHA256']
          if digest != expected:
              raise SystemExit(f'transfer checksum mismatch: {digest} != {expected}')
          with open('/tmp/liora-fixed-remaining.tar.xz', 'wb') as handle:
              handle.write(archive)
          print(f'transfer verified: {len(archive)} bytes, sha256={digest}')
          PY

          tar -xJf /tmp/liora-fixed-remaining.tar.xz
          rm -f .github/workflows/apply-fixed-package-transfer.yml

      - name: Commit remaining text files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && exit 0
          git commit -m "Apply remaining fixed-package text files"
          git push origin HEAD:agent/fixed-package-integration
