name: Apply fixed package transfer

on:
  push:
    branches: [agent/fixed-package-integration]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/fixed-package-integration
          fetch-depth: 0

      - name: Rehydrate remaining fixed-package text files
        env:
          EXPECTED_SHA256: "570dab2baf6a72df12588b87fdffff1b3e9ff70a015d9fc461f11d8d049ee16b"
        run: |
          cat .fixed-transfer/part-*.txt > /tmp/liora-fixed.b64
          python3 - <<'PY'
          import base64, hashlib, os
          encoded = open('/tmp/liora-fixed.b64', 'rt').read()
          archive = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(archive).hexdigest()
          expected = os.environ['EXPECTED_SHA256']
          if digest != expected:
              raise SystemExit(f'checksum mismatch: {digest} != {expected}')
          open('/tmp/liora-fixed-remaining.tar.xz', 'wb').write(archive)
          print(f'transfer verified: {len(archive)} bytes, sha256={digest}')
          PY
          tar -xJf /tmp/liora-fixed-remaining.tar.xz
          rm -rf .fixed-transfer
          rm -f .github/workflows/apply-fixed-package-transfer.yml

      - name: Commit remaining text files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && exit 0
          git commit -m "Apply remaining fixed-package text files"
          git push origin HEAD:agent/fixed-package-integration
