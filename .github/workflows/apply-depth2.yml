name: Apply Depth 2 package
on:
  push:
    branches:
      - agent/depth-2-detail-page
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[depth2-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild runtime package
        shell: bash
        run: |
          cat .deploy/depth2/part-* > /tmp/depth2.b64
          base64 -d /tmp/depth2.b64 > /tmp/depth2-runtime.tar.gz
          echo "51fd0ef8d3b925a3ce07963b05abb45ea89e278e4948c56a2686a632ec3a7a3f  /tmp/depth2-runtime.tar.gz" | sha256sum -c -
          tar -xzf /tmp/depth2-runtime.tar.gz -C .
          grep -q 'BUILD = "depth-2-detail"' src/config.js
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          rm -rf .deploy/depth2
          rm -f .github/workflows/apply-depth2.yml
      - name: Commit runtime
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy depth-2 detail [depth2-applied]"
          git push
