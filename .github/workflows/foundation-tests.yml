name: Foundation tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use Python 3.12
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/distant-path-world24' && github.actor != 'github-actions[bot]'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare distant path WebP and world24
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/distant-path-world24' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          test -f assets/textures/backdrop_path.png

          python tools/prep_backdrop.py \
            assets/textures/backdrop_path.png \
            assets/textures/backdrop-path.webp \
            --quality 88 \
            --overlap 192

          mkdir -p assets/textures/_src
          mv assets/textures/backdrop_path.png assets/textures/_src/backdrop-path.png

          python - <<'PY'
          from pathlib import Path

          def replace_one(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          replace_one(
              "src/config.js",
              'export const BUILD = "worlds-10-wide-backdrop";',
              'export const BUILD = "worlds-11-distant-path";'
          )

          meadow = '''      {
        name: "PaintedMeadow",
        texture: "./assets/textures/backdrop-meadow.webp",
        radius: 430, height: 46, y: -7, repeat: 4,
        tint: 0xf0f5e9, haze: 0.10, renderOrder: -28,
      },'''
          meadow_and_path = meadow + '''
      {
        // Low painted road/fence strip that replaces the pale outer-ground rim.
        // It occupies the 418–430 m gap without changing playable terrain.
        name: "PaintedPath",
        texture: "./assets/textures/backdrop-path.webp",
        radius: 424, height: 20, y: 0, repeat: 2,
        tint: 0xf7f0e3, haze: 0.06, renderOrder: -27,
      },'''
          replace_one("src/config.js", meadow, meadow_and_path)
          replace_one("src/config.js", "All three remain inside the sky", "All four remain inside the sky")

          replace_one("src/main.js", 'const APP_REVISION = "world23";', 'const APP_REVISION = "world24";')
          replace_one("index.html", './src/main.js?v=world23', './src/main.js?v=world24')

          audio_test = Path("audio-test.html")
          if audio_test.exists():
              text = audio_test.read_text()
              if './?v=world23' in text:
                  audio_test.write_text(text.replace('./?v=world23', './?v=world24'))

          world_test = Path("tools/test/world-layers.test.html")
          text = world_test.read_text()
          old_ids = '["terrain", "treeLine", "ground", "PaintedMeadow", "PaintedTreeline", "PaintedPeaks", "floatingIslands", "sky"]'
          new_ids = '["terrain", "treeLine", "ground", "PaintedPath", "PaintedMeadow", "PaintedTreeline", "PaintedPeaks", "floatingIslands", "sky"]'
          if text.count(old_ids) != 1:
              raise SystemExit("world-layers expected-id list changed")
          world_test.write_text(text.replace(old_ids, new_ids, 1))

          q = Path("tools/test/quality-cache-bridge.test.html")
          text = q.read_text()
          if './src/main.js?v=world23' in text:
              q.write_text(text.replace('./src/main.js?v=world23', './src/main.js?v=world24'))

          Path("docs/BACKDROP-PATH-WORLD24.md").write_text(
              "# Distant path backdrop — world24\n\n"
              "- source: `assets/textures/_src/backdrop-path.png` (4096 × 512)\n"
              "- runtime: `assets/textures/backdrop-path.webp`\n"
              "- layer: `PaintedPath` at 424 m, between outer ground 418 m and meadow 430 m\n"
              "- runtime geometry: height 20 m, y 0, repeat 2\n"
              "- purpose: replace the pale horizon seam with distant dirt path, low fences and shrubs\n"
              "- prep: magenta key/despill, transparent-row crop, seam verification, WebP quality 88\n"
          )
          PY

          rm -f tools/.run-backdrop-path-world24
          git diff --check

      - name: Syntax check JavaScript
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find src tools/test -type f \( -name '*.js' -o -name '*.mjs' \) -print0)

      - name: Module graph
        run: node tools/test/module-graph.mjs

      - name: Browser regression suite
        run: node tools/test/run.mjs

      - name: Commit prepared world24
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/distant-path-world24' && github.actor != 'github-actions[bot]' && success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Ship distant path backdrop in world24"
          git push origin HEAD:agent/distant-path-world24
