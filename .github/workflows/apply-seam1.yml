name: Apply seam fix 1

on:
  push:
    branches: [agent/seam-fix-1]
    paths:
      - '.deploy/seam1.part*'
      - '.github/workflows/apply-seam1.yml'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[seam1-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/seam-fix-1
          fetch-depth: 0

      - name: Reassemble validated package
        shell: bash
        run: |
          set -euo pipefail
          cat .deploy/seam1.part00 .deploy/seam1.part01 | base64 -d > /tmp/seam1-runtime.tar.gz
          echo '284e9457503e440123d8242efa426f680fb56148381ba36d41f02e58adca78f3  /tmp/seam1-runtime.tar.gz' | sha256sum -c -
          tar -xzf /tmp/seam1-runtime.tar.gz -C .

      - name: Validate seam fix only
        shell: bash
        run: |
          set -euo pipefail
          node --check src/systems/ground-paint.js
          node --check src/zones/home-island.js
          grep -q 'const boundMaterials = new Set()' src/systems/ground-paint.js
          grep -q 'previousCompile?.call(material, shader, renderer)' src/systems/ground-paint.js
          grep -q 'vOuterWorldRadius < uOuterTextureFadeEnd + vOuterFadeJitter' src/systems/ground-paint.js
          grep -q 'paint.applyTo(outerWorld.material, { distanceGate: true })' src/zones/home-island.js
          grep -q 'paint.releaseMaterial(outerWorld.material)' src/zones/home-island.js
          git diff -- src/config.js src/systems/outer-world-ground.js src/systems/contact-shadow.js src/systems/object-shadows.js --exit-code

      - name: Commit runtime files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/systems/ground-paint.js src/zones/home-island.js
          git rm .deploy/seam1.part00 .deploy/seam1.part01 .github/workflows/apply-seam1.yml
          git commit -m 'Fix outer ground paint seam [seam1-applied]'
          git push origin HEAD:agent/seam-fix-1
