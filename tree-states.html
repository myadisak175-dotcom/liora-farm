<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#8fa2b4">
<title>ต้นไม้สามสภาพ — ทดลอง</title>
<!--
  tree-states.html  —  one anime tree in three states side by side: dead, dying, alive. One job: see how the trees look as
  the curse takes them, and as they come back (anime-tree.js, DRYNESS). Nothing here goes into the game.
  The trees read their state from a picture laid over the land (the same way the game's curse will), so "ฟื้นฟู" can send
  life out from the middle in a ring.
    ?type=oak   open on that tree      ?seed=3   which dice
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8fa2b4; font-family: system-ui, sans-serif; touch-action: none; }
  canvas { display: block; }
  #name { position: fixed; left: 0; right: 0; top: calc(10px + env(safe-area-inset-top)); text-align: center; pointer-events: none;
    font: 700 17px system-ui; color: #fff; text-shadow: 0 1px 6px #0007; }
  #name small { display: block; font: 500 12px system-ui; opacity: 0.9; margin-top: 3px; }
  .tag { position: fixed; transform: translate(-50%, -100%); pointer-events: none; font: 700 13px system-ui; color: #fff;
    background: #2b2433cc; border: 1px solid #ffffff66; border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
  #ui { position: fixed; left: 0; right: 0; bottom: calc(10px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 8px; }
  .row { display: flex; align-items: center; gap: 8px; background: #3b3147d9; border: 1px solid #ffffffaa; border-radius: 999px; padding: 6px 14px; color: #fff; font: 700 13px system-ui; }
  .row input { width: min(46vw, 220px); accent-color: #c9a35c; }
  .bar { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
  .bar button { border: 1px solid #ffffffaa; border-radius: 999px; padding: 9px 13px; background: #3b3147d9; color: #fff; font: 700 13px system-ui; touch-action: manipulation; }
  .bar button.on { background: #8a6a3a; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
  "./stylized-nature.js": "./stylized-nature.js?v=dry4",
  "./anime-tree.js": "./anime-tree.js?v=dry5"
} }
</script>
</head>
<body>
<div id="name"></div>
<div class="tag" id="tag0">ตายแล้ว</div>
<div class="tag" id="tag1">ใกล้ตาย</div>
<div class="tag" id="tag2">มีชีวิต</div>
<div id="ui">
  <div class="row"><label for="dying">ต้นกลางใกล้ตายแค่ไหน</label> <input id="dying" type="range" min="0" max="1" step="0.01" value="0.8"> <b id="dyingVal">80%</b></div>
  <div class="bar" id="types"></div>
  <div class="bar">
    <button id="heal">✨ ฟื้นฟู</button>
    <button id="curse">↺ กลับเป็นคำสาป</button>
    <button id="dice">🎲 สุ่มทรง</button>
  </div>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import * as N from './stylized-nature.js';
import { createAnimeTree, setAnimeSun, setAnimeDryness } from './anime-tree.js';

const Q = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
{ // an overcast sky, a little cold: the curse's weather
  const c = document.createElement('canvas'); c.width = 4; c.height = 256;
  const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#5f7590'); gr.addColorStop(0.55, '#97a8b8'); gr.addColorStop(1, '#d4d9dc');
  g.fillStyle = gr; g.fillRect(0, 0, 4, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  scene.background = t;
}
scene.add(N.createAlphaFix());
N.setHaze({ color: '#d4d9dc', near: 60, far: 300, max: 0.6 });
const ground = N.createGround({ radius: 240, flat: 130, hills: 1, far: '#d4d9dc' });
scene.add(ground);
const H = ground.userData.heightAt;

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 900);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.maxPolarAngle = Math.PI * 0.49; controls.minDistance = 2; controls.maxDistance = 200;

const TYPES = [['broadleaf', 'ใบกว้าง', 6, 11], ['oak', 'โอ๊ก', 9.5, 9], ['sapling', 'ต้นอ่อน', 3.4, 4.8], ['birch', 'เบิร์ช', 4.6, 9.6], ['pine', 'สน', 6, 12]];
let type = TYPES.some(t => t[0] === Q.get('type')) ? Q.get('type') : 'broadleaf', seed = +Q.get('seed') || 1;
const shown = new THREE.Group(); scene.add(shown);
const sunDir = new THREE.Vector3(-0.55, 0.62, 0.45).normalize();
setAnimeSun(sunDir);

// ---- the dryness picture: 1 m a pixel over a strip of land round the three trees (red: 0 alive .. 255 dead)
const PW = 64, PD = 24, X0 = -32, Z0 = -12;
const pixels = new Uint8Array(PW * PD * 4);
const dryTex = new THREE.DataTexture(pixels, PW, PD);
dryTex.magFilter = dryTex.minFilter = THREE.LinearFilter;
setAnimeDryness(dryTex, [X0, Z0, PW, PD]);
let spacing = 10, ring = -1;                    // ring: how far life has spread from the middle (m); < 0: not spreading
const state = () => [1, +document.getElementById('dying').value, 0];      // dead, dying, alive
function paint() {
  const s = state(), half = spacing / 2;
  for (let j = 0; j < PD; j++) for (let i = 0; i < PW; i++) {
    const x = X0 + i + 0.5, z = Z0 + j + 0.5;
    // which tree's ground this is: blended over 2 m where two meet
    const toL = THREE.MathUtils.smoothstep(x, -half - 1, -half + 1), toR = THREE.MathUtils.smoothstep(x, half - 1, half + 1);
    let d = s[0] + (s[1] - s[0]) * toL;
    d += (s[2] - s[1]) * toR;
    if (ring >= 0) d *= THREE.MathUtils.smoothstep(Math.hypot(x, z), ring - 2.5, ring + 2.5);   // inside the ring: alive again
    const k = (j * PW + i) * 4;
    pixels[k] = Math.round(THREE.MathUtils.clamp(d, 0, 1) * 255); pixels[k + 1] = 0; pixels[k + 2] = 0; pixels[k + 3] = 255;
  }
  dryTex.needsUpdate = true;
}

function build() {
  for (const m of [...shown.children]) { m.userData.dispose && m.userData.dispose(); shown.remove(m); }
  const [, th, w, h] = TYPES.find(t => t[0] === type);
  spacing = w + 2.5;
  [-1, 0, 1].forEach(k => {
    const t = createAnimeTree({ type, seed });
    t.position.set(k * spacing, H(k * spacing, 0) - 0.05, 0);
    shown.add(t);
  });
  document.getElementById('name').innerHTML = `ต้น${th} · สามสภาพ <small>ทรงที่ ${seed} · ลากหมุนดู · กด ✨ ฟื้นฟู ให้ชีวิตแผ่ออกจากต้นกลาง</small>`;
  document.querySelectorAll('#types button').forEach(b => b.classList.toggle('on', b.dataset.type === type));
  paint();
  // far enough back for all three, on a tall phone screen too
  const vHalf = THREE.MathUtils.degToRad(camera.fov / 2), hHalf = Math.atan(Math.tan(vHalf) * camera.aspect);
  const width = spacing * 2 + w, d = Math.max((h / 2) / Math.tan(vHalf), (width / 2) / Math.tan(hHalf)) * 1.08 + 2;
  controls.target.set(0, h * 0.45, 0);
  camera.position.set(d * 0.08, h * 0.45 + 0.6, d);
  controls.update();
  return h;
}
let treeH = 10;

const typesBar = document.getElementById('types');
for (const [key, th] of TYPES) {
  const b = document.createElement('button'); b.textContent = th; b.dataset.type = key;
  b.onclick = () => { type = key; ring = -1; treeH = build(); };
  typesBar.append(b);
}
const dying = document.getElementById('dying'), dyingVal = document.getElementById('dyingVal');
dying.addEventListener('input', () => { dyingVal.textContent = Math.round(dying.value * 100) + '%'; paint(); });
document.getElementById('heal').onclick = () => { ring = 0; };
document.getElementById('curse').onclick = () => { ring = -1; paint(); };
document.getElementById('dice').onclick = () => { seed++; treeH = build(); };

treeH = build();
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
// the names over the trees
const tags = [0, 1, 2].map(i => document.getElementById('tag' + i));
const v = new THREE.Vector3();
function placeTags() {
  tags.forEach((el, i) => {
    const x = (i - 1) * spacing;
    v.set(x, H(x, 0) + treeH + 0.6, 0).project(camera);
    el.style.left = ((v.x + 1) / 2 * innerWidth) + 'px';
    el.style.top = ((1 - v.y) / 2 * innerHeight) + 'px';
    el.style.display = v.z < 1 ? '' : 'none';
    el.textContent = i < 2 && ring > (i === 1 ? 0 : spacing) + 2.5 ? 'ฟื้นแล้ว' : ['ตายแล้ว', 'ใกล้ตาย', 'มีชีวิต'][i];
  });
}
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (ring >= 0 && ring < 40) { ring += dt * 7; paint(); }        // life spreads ~7 m a second
  N.update(dt);
  controls.update();
  placeTags();
  renderer.render(scene, camera);
});
window.__scene = { scene, camera, controls, paint, setRing(r) { ring = r; paint(); }, build() { treeH = build(); } };
</script>
</body>
</html>
