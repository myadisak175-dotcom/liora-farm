<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quality tests</title>
</head>
<body><pre id="out"></pre>
<script type="module">
import {
  QUALITY_PRESETS,
  QUALITY_STORAGE_KEY,
  detectQualityId,
  resolveQualityId,
} from "../../src/systems/quality.js";

const results = [];
const out = document.querySelector("#out");
async function test(name, fn) {
  try { await fn(); results.push({ name, pass: true, detail: "" }); }
  catch (error) { results.push({ name, pass: false, detail: String(error?.message ?? error) }); }
}
function assert(value, message) { if (!value) throw new Error(message); }

await test("quality storage uses a fresh detector generation", () => {
  assert(QUALITY_STORAGE_KEY === "liora.quality.v2", `unexpected storage key ${QUALITY_STORAGE_KEY}`);
});

await test("desktop defaults to high", () => {
  assert(detectQualityId({ isTouch: false, pixelRatio: 1 }) === "high", "desktop no longer starts high");
});

await test("low-memory phones stay low", () => {
  assert(detectQualityId({ isTouch: true, deviceMemory: 3, cores: 8, pixelRatio: 3 }) === "low",
    "dense display overrode a real low-memory signal");
});

await test("four-core phones stay low", () => {
  assert(detectQualityId({ isTouch: true, deviceMemory: null, cores: 4, pixelRatio: 3 }) === "low",
    "a four-core phone was promoted by DPR");
});

await test("strong Android memory signal starts high", () => {
  assert(detectQualityId({ isTouch: true, deviceMemory: 8, cores: 8, pixelRatio: 3 }) === "high",
    "flagship Android fell below high");
});

await test("modern Retina Safari without deviceMemory starts high", () => {
  assert(detectQualityId({ isTouch: true, deviceMemory: null, cores: 6, pixelRatio: 3 }) === "high",
    "six-core 3x Safari signature still falls to medium");
});

await test("unknown six-core 2x mobile remains medium", () => {
  assert(detectQualityId({ isTouch: true, deviceMemory: null, cores: 6, pixelRatio: 2 }) === "medium",
    "ordinary unknown mobile was promoted without enough evidence");
});

await test("explicit current-generation user choice still wins", () => {
  assert(resolveQualityId("low", "high") === "low", "stored low choice was ignored");
  assert(resolveQualityId("high", "medium") === "high", "stored high choice was ignored");
  assert(resolveQualityId("old-medium", "high") === "high", "invalid stale choice overrode detection");
});

await test("high preset restores the visual features missing on medium", () => {
  assert(QUALITY_PRESETS.high.maxPixelRatio === 2, "high DPR cap changed");
  assert(QUALITY_PRESETS.high.antialias === true, "high antialiasing is off");
  assert(QUALITY_PRESETS.high.shadowMapSize === 2048, "high shadow map was reduced");
  assert(QUALITY_PRESETS.high.anisotropy === 8, "high texture filtering was reduced");
});

window.__results = results;
window.__done = true;
out.textContent = results.map((result) => `${result.pass ? "PASS" : "FAIL"} ${result.name}${result.detail ? ` | ${result.detail}` : ""}`).join("\n");
</script>
</body>
</html>
