<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>World V2 nature tests</title>
<script type="importmap">
{"imports":{"three":"./three-stub.js"}}
</script>
</head>
<body><pre id="out"></pre>
<script type="module">
import {
  BUILD_CATEGORIES,
  PRIMARY_ASSET_POLICY,
  RETIRED_LEGACY_NATURE_IDS,
  REUSABLE_LEGACY_NATURE_IDS,
  getBuildableAsset,
  getBuildableAssets,
  getAllBuildableAssets,
  isPrimaryBuilderAsset,
} from "../../src/editor/asset-catalog.js";
import { createBuilderAssetLoader } from "../../src/editor/asset-loader.js";

const results = [];
const out = document.querySelector("#out");
async function test(name, fn) {
  try {
    await fn();
    results.push({ name, pass: true, detail: "" });
  } catch (error) {
    results.push({ name, pass: false, detail: String(error?.message ?? error) });
  }
}
function assert(value, message) { if (!value) throw new Error(message); }

const palette = getBuildableAssets();
const allAssets = getAllBuildableAssets();
const v2 = palette.filter((asset) => asset.worldV2);
const paletteNature = palette.filter((asset) => asset.category === BUILD_CATEGORIES.NATURE);

await test("catalog exposes all 55 World V2 objects", () => {
  assert(v2.length === 55, `expected 55, got ${v2.length}`);
  assert(new Set(v2.map((asset) => asset.id)).size === 55, "duplicate v2 ids");
});

await test("Builder Nature shows V2 plus reusable legacy grass", () => {
  assert(paletteNature.length === 56, `expected 56 visible nature assets, got ${paletteNature.length}`);
  assert(palette.some((asset) => asset.id === "grass"), "legacy grass should remain placeable");
  assert(isPrimaryBuilderAsset(getBuildableAsset("grass")), "legacy grass should pass palette policy");
  for (const id of RETIRED_LEGACY_NATURE_IDS) {
    assert(!palette.some((asset) => asset.id === id), `${id} should stay hidden from Builder palette`);
  }
});

await test("retired legacy trees stay registered for old saves", () => {
  for (const id of RETIRED_LEGACY_NATURE_IDS) {
    const asset = getBuildableAsset(id);
    assert(asset?.modelPath?.includes("/builder/"), `${id} fallback missing`);
    assert(allAssets.some((entry) => entry.id === id), `${id} missing from full registry`);
  }
  assert(REUSABLE_LEGACY_NATURE_IDS.length === 1 && REUSABLE_LEGACY_NATURE_IDS[0] === "grass",
    "expected grass to be the only reusable legacy Nature asset");
  assert(allAssets.length - palette.length === RETIRED_LEGACY_NATURE_IDS.length,
    `expected exactly ${RETIRED_LEGACY_NATURE_IDS.length} fallback-only assets`);
});

await test("default/reset map contains no retired legacy trees", async () => {
  const response = await fetch(new URL("/maps/home-island.json", location.origin));
  assert(response.ok, `default map returned ${response.status}`);
  const map = await response.json();
  assert(Array.isArray(map.objects), "default map objects missing");
  for (const item of map.objects) {
    assert(!RETIRED_LEGACY_NATURE_IDS.includes(item.assetId),
      `reset map still references retired ${item.assetId}`);
  }
  assert(map.objects.some((item) => String(item.assetId).startsWith("v2-")),
    "reset map should use World V2 Nature assets");
});

await test("buildings and decor remain visible until they have replacement sets", () => {
  for (const id of ["house", "house2", "path_tile", "crate", "wine_barrel"]) {
    assert(palette.some((asset) => asset.id === id), `${id} unexpectedly hidden`);
  }
});

await test("every primary V2 Nature asset satisfies the production policy", () => {
  assert(PRIMARY_ASSET_POLICY.natureSet === "world-v2", "wrong primary Nature set");
  assert(PRIMARY_ASSET_POLICY.legacyNatureMode === "trees-fallback-only", "legacy mode changed");
  for (const asset of v2) {
    assert(isPrimaryBuilderAsset(asset), `${asset.id} rejected by primary policy`);
    assert(asset.id.startsWith(PRIMARY_ASSET_POLICY.stableIdPrefix), `${asset.id} has unstable prefix`);
    assert(Boolean(asset.nodeName), `${asset.id} missing nodeName`);
    assert(Number.isFinite(asset.sourceHeight) && asset.sourceHeight > 0, `${asset.id} missing sourceHeight`);
    assert(Number.isFinite(asset.sourceWidth) && asset.sourceWidth > 0, `${asset.id} missing sourceWidth`);
    assert(Number.isFinite(asset.tris) && asset.tris > 0, `${asset.id} missing tris`);
    assert(asset.terrainSnap === true, `${asset.id} must terrain-snap`);
  }
});

await test("World V2 catalog points at 12 shared GLBs", () => {
  const paths = new Set(v2.map((asset) => asset.modelPath));
  assert(paths.size === 12, `expected 12 source files, got ${paths.size}`);
  assert(v2.every((asset) => asset.nodeName), "missing nodeName");
  assert(v2.every((asset) => asset.modelPath.includes("/world-v2/nature/")), "wrong model root");
});

await test("all 12 GLB files exist and have a valid glTF binary header", async () => {
  const paths = [...new Set(v2.map((asset) => asset.modelPath))];
  for (const relative of paths) {
    const url = new URL(`/${relative.replace(/^\.\//, "")}`, location.origin);
    const response = await fetch(url);
    assert(response.ok, `${relative} returned ${response.status}`);
    const bytes = new Uint8Array(await response.arrayBuffer());
    assert(bytes.length >= 12, `${relative} is too small to be a GLB`);
    assert(bytes[0] === 0x67 && bytes[1] === 0x6c && bytes[2] === 0x54 && bytes[3] === 0x46,
      `${relative} is missing the glTF header`);
  }
});

await test("loader fetches one shared GLB for sibling variants", async () => {
  let loads = 0;
  function node(name) {
    return {
      name,
      clone() { return { name, traverse(fn) { fn({ isMesh: false }); } }; },
    };
  }
  const nodes = new Map([
    ["BirchTree_1", node("BirchTree_1")],
    ["BirchTree_2", node("BirchTree_2")],
  ]);
  const scene = {
    getObjectByName(name) { return nodes.get(name) ?? null; },
    clone() { return this; },
  };
  const gltfLoader = {
    load(path, resolve) {
      loads += 1;
      queueMicrotask(() => resolve({ scene }));
    },
  };
  const loader = createBuilderAssetLoader({ gltfLoader });
  const a = await loader.load("v2-birchtree-1");
  const b = await loader.load("v2-birchtree-2");
  assert(a.name === "BirchTree_1" && b.name === "BirchTree_2", "wrong named node cloned");
  assert(loads === 1, `shared GLB fetched ${loads} times`);
  assert(loader.has("v2-birchtree-1"), "shared source not cached");
});

await test("legacy catalog remains loadable during migration", () => {
  assert(getBuildableAsset("tree")?.modelPath?.includes("/builder/"), "legacy tree missing");
  assert(getBuildableAsset("grass")?.modelPath?.includes("/builder/"), "legacy grass missing");
  assert(getBuildableAsset("house")?.modelPath?.includes("/builder/"), "legacy house missing");
});

window.__results = results;
window.__done = true;
out.textContent = results.map((r) => `${r.pass ? "PASS" : "FAIL"} ${r.name}${r.detail ? ` | ${r.detail}` : ""}`).join("\n");
</script>
</body>
</html>
