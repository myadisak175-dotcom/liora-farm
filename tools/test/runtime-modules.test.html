<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Main runtime module tests</title>
<script type="importmap">
{"imports":{"three":"./three-stub.js"}}
</script>
</head>
<body><pre id="out"></pre>
<script type="module">
import { createNotifications } from "../../src/ui/notifications.js";
import { createFarmUI } from "../../src/ui/farm-ui.js";
import { bindPlayerActionButtons } from "../../src/ui/player-actions.js";
import { createPlayerRuntime } from "../../src/systems/player-runtime.js";
import { createLayoutRuntime } from "../../src/editor/layout-runtime.js";
import { createMapScope } from "../../src/systems/map-scope.js";

const results = [];
const out = document.querySelector("#out");
async function test(name, fn) {
  try {
    await fn();
    results.push({ name, pass: true, detail: "" });
  } catch (error) {
    results.push({ name, pass: false, detail: String(error?.message ?? error) });
  }
}
function assert(value, message) { if (!value) throw new Error(message); }

await test("main stays a composition root instead of re-growing extracted subsystems", async () => {
  const source = await fetch("../../src/main.js").then((response) => response.text());
  for (const forbidden of [
    "async function loadLayout",
    "async function resetLayout",
    "function exportMap",
    "function refreshFarmHud",
    "function updateFarmTarget",
    "function updatePlayer",
  ]) {
    assert(!source.includes(forbidden), `${forbidden} leaked back into main.js`);
  }
  for (const expected of [
    "createLayoutRuntime",
    "createPlayerRuntime",
    "createFarmUI",
    "createNotifications",
  ]) {
    assert(source.includes(expected), `${expected} is not wired by main.js`);
  }
});

await test("world links retain the release revision and cannot fall back to stale audio", () => {
  const scope = createMapScope({
    entries: [
      { id: "home-island", name: "Home" },
      { id: "blank-valley", name: "Valley" },
    ],
    requestedId: "home-island",
    revision: "audio14",
  });
  const home = new URL(scope.urlFor("home-island"));
  const valley = new URL(scope.urlFor("blank-valley"));
  assert(home.searchParams.get("v") === "audio14", "default world dropped the release revision");
  assert(!home.searchParams.has("map"), "default world kept a redundant map id");
  assert(valley.searchParams.get("v") === "audio14", "secondary world dropped the release revision");
  assert(valley.searchParams.get("map") === "blank-valley", "secondary world id changed");
});

await test("notifications preserve status and toast class behavior", () => {
  const status = document.createElement("div");
  status.className = "hidden";
  const toast = document.createElement("div");
  const ui = createNotifications({ statusElement: status, toastElement: toast });
  ui.setStatus("ready");
  assert(status.textContent === "ready", "status text changed");
  assert(!status.classList.contains("hidden"), "status stayed hidden");
  ui.toast("saved");
  assert(toast.textContent === "saved", "toast text changed");
  assert(toast.classList.contains("on"), "toast active class missing");
});

await test("layout runtime preserves default load, spawning, collider refresh and reset", async () => {
  const originalFetch = window.fetch;
  const events = [];
  const firstMap = {
    objects: [{ id: "a", assetId: "grass", x: 1, z: 2, rotation: 0, scale: 1 }],
    groundPaint: { version: 1, strokes: [] },
    terrainHeight: { version: 1, data: "height" },
  };
  const resetMap = {
    objects: [{ id: "b", assetId: "v2-rock-1", x: 3, z: 4, rotation: 0, scale: 1 }],
  };
  let fetchCount = 0;
  window.fetch = async () => ({
    ok: true,
    async json() { return fetchCount++ === 0 ? firstMap : resetMap; },
  });

  const items = [];
  const builder = {
    items,
    loadReport: null,
    addItem(item) { items.push(item); events.push(`add:${item.id}`); },
    save(options) { events.push(`save:${options?.immediate}`); },
    load() { events.push("load-saved"); },
    setInactiveItems(ids) { events.push(`inactive:${ids.length}`); },
    getColliders() { return ["collider"]; },
    resetTo(next) { items.splice(0, items.length, ...next); events.push(`reset:${next.length}`); },
  };
  const builderView = {
    async spawn(item) { events.push(`spawn:${item.id}`); },
    clear() { events.push("clear"); },
  };
  const layoutStore = {
    hasSavedLayout() { return false; },
    backupKey: "backup-key",
  };
  const world = {
    paint: {
      importData(data) { events.push(`paint:${Boolean(data)}`); },
      exportData() { return {}; },
    },
    height: {
      importData(data) { events.push(`height:${Boolean(data)}`); return true; },
      exportData() { return {}; },
    },
  };
  const ui = {
    warn(message) { events.push(`warn:${message}`); },
    render() { events.push("render"); },
  };
  const runtime = createLayoutRuntime({
    builder,
    builderView,
    layoutStore,
    world,
    defaultMapUrl: "./maps/home-island.json",
    getUI: () => ui,
    onToast: (message) => events.push(`toast:${message}`),
    onCollidersChange: (value) => events.push(`colliders:${value.length}`),
    onTerrainSync: () => events.push("terrain-sync"),
  });

  try {
    await runtime.load();
    assert(items.length === 1 && items[0].id === "a", "default objects were not restored");
    assert(events.includes("save:true"), "default layout was not persisted immediately");
    assert(events.includes("paint:true") && events.includes("height:true"), "default terrain data was not imported");
    assert(events.includes("spawn:a") && events.includes("colliders:1") && events.includes("render"), "spawn lifecycle changed");

    await runtime.reset();
    assert(items.length === 1 && items[0].id === "b", "reset objects changed");
    assert(events.includes("clear") && events.includes("spawn:b"), "reset did not clear and respawn");
    assert(events.includes("terrain-sync"), "reset no longer re-seats objects to terrain");
    assert(events.some((entry) => entry.startsWith("toast:โหลดสิ่งของเริ่มต้นแล้ว")), "reset success toast changed");
  } finally {
    window.fetch = originalFetch;
  }
});

await test("player runtime preserves movement-animation-fx update contract", () => {
  const calls = [];
  const position = { x: 2, y: 3, z: 4 };
  const player = {
    root: { position, rotation: { y: 0.75 } },
    mixer: { update(delta) { calls.push(["mixer", delta]); } },
    isSpecial() { return false; },
    fadeTo(...args) { calls.push(["fadeTo", ...args]); },
    playSpecial(name, done) { calls.push(["special", name]); done?.(); return true; },
  };
  const movement = {
    update(args) {
      calls.push(["movement", args.input.x, args.delta]);
      return { moving: true, running: false, direction: { x: 1, z: 0 }, waterDepth: 0.2 };
    },
  };
  const input = { get() { return { x: 0.5, z: 0, m: 0.5 }; } };
  const runFx = { update(...args) { calls.push(["runFx", ...args]); } };
  const contactShadow = { update(...args) { calls.push(["shadow", ...args]); } };
  const dayNight = { getHour() { return 9; } };
  const lighting = { update(pos) { calls.push(["lighting", pos.x]); } };
  const cameraTarget = { set(x, y, z) { calls.push(["camera", x, y, z]); } };
  const runtime = createPlayerRuntime({
    player,
    movement,
    input,
    animations: { idle: "idle", walk: "walk", run: "run" },
    config: { animationSpeed: { idle: 1, walk: 1.1, run: 1.2 }, water: { level: 0.3 } },
    runFx,
    contactShadow,
    dayNight,
    lighting,
  });
  runtime.update(0.016, { active: true, cameraTarget });
  assert(calls[0][0] === "movement" && calls[0][1] === 0.5, "movement input changed");
  assert(calls.some((entry) => entry[0] === "fadeTo" && entry[1] === "walk"), "walk animation missing");
  assert(calls.some((entry) => entry[0] === "runFx"), "run FX missing");
  assert(calls.some((entry) => entry[0] === "shadow"), "contact shadow missing");
  assert(calls.some((entry) => entry[0] === "camera" && entry[2] === 3.7), "camera target changed");
  assert(calls.at(-1)[0] === "lighting", "lighting follow order changed");
});

await test("farm UI keeps target labels and plant action behavior", () => {
  const button = document.createElement("button");
  const pouch = document.createElement("span");
  let planted = 0;
  let toast = "";
  const crops = {
    pouch: 4,
    getTarget() { return { index: 2, state: "empty", progress: 0 }; },
    plant(index) { planted = index; return true; },
    harvest() { return false; },
  };
  const playerRuntime = {
    position: { x: 0, y: 0, z: 0 },
    playSpecial(name, done) { done?.(); return name === "pick"; },
  };
  const farm = createFarmUI({
    crops,
    playerRuntime,
    button,
    pouchCount: pouch,
    animations: { pickUp: "pick", pullRadish: "pull" },
    onToast: (message) => { toast = message; },
  });
  farm.refresh();
  assert(pouch.textContent === "4", "pouch count changed");
  assert(button.disabled, "farm button should start disabled without a target");
  farm.update(0.2, { active: true });
  assert(button.textContent === "ปลูกผัก" && !button.disabled, "empty crop target label changed");
  button.click();
  assert(planted === 2, "plant target index changed");
  assert(toast === "ปลูกแล้ว 🌱", "plant toast changed");
});

await test("generic player action buttons still toggle active around specials", () => {
  const farm = document.createElement("button");
  farm.dataset.action = "farm";
  const hammer = document.createElement("button");
  hammer.dataset.action = "hammer";
  let played = "";
  bindPlayerActionButtons({
    buttons: [farm, hammer],
    animations: { hammer: "hammer-clip" },
    playSpecial(name, done) {
      played = name;
      assert(hammer.classList.contains("active") === false, "active set too early");
      setTimeout(done, 0);
      return true;
    },
  });
  hammer.click();
  assert(played === "hammer-clip", "wrong action animation");
  assert(hammer.classList.contains("active"), "active class not set after start");
  assert(farm.onclick === null, "farm button should remain owned by farm UI");
});

await new Promise((resolve) => setTimeout(resolve, 10));
window.__results = results;
window.__done = true;
out.textContent = results.map((r) => `${r.pass ? "PASS" : "FAIL"} ${r.name}${r.detail ? ` | ${r.detail}` : ""}`).join("\n");
</script>
</body>
</html>
