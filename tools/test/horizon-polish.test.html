<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>horizon polish tests</title>
<script type="importmap">{"imports":{"three":"./horizon-three-stub.js"}}</script>
</head>
<body><pre id="out">running…</pre>
<script>
const fail=(what)=>{document.querySelector("#out").textContent="ERROR: "+what;window.__results=[{name:"bootstrap",pass:false,detail:String(what)}];window.__done=true;};
addEventListener("error",(e)=>fail((e.error&&e.error.stack)||e.message));
addEventListener("unhandledrejection",(e)=>fail("unhandled rejection: "+((e.reason&&e.reason.stack)||e.reason)));
</script>
<script type="module">
import { createOuterWorldGround } from "../../src/systems/outer-world-ground.js";
import { CONFIG, BUILD } from "../../src/config.js";

const results=[];
const ok=(name,pass,detail="")=>results.push({name,pass:Boolean(pass),detail});

ok("build marker identifies the horizon polish deploy",BUILD==="horizon-4",String(BUILD));
ok("authored far texture fade remains outside the playable terrain",
  CONFIG.outerWorld.textureFadeStart>=CONFIG.terrain.size
  &&CONFIG.outerWorld.textureFadeEnd>CONFIG.outerWorld.textureFadeStart,
  `start=${CONFIG.outerWorld.textureFadeStart} end=${CONFIG.outerWorld.textureFadeEnd}`);
ok("Variant B floating islands remain enabled",
  CONFIG.distantRange.floatingIslands.enabled===true
  &&CONFIG.distantRange.floatingIslands.items.length===3);

const zoneSource=await fetch("../../src/zones/home-island.js").then((r)=>r.text());
ok("outer visual ground receives renderer anisotropy",
  /function tile\([^)]*anisotropy/.test(zoneSource)
  &&/texture\.anisotropy\s*=\s*anisotropy/.test(zoneSource)
  &&/baseMap\s*=\s*tile\([\s\S]{0,160}?anisotropy\s*\)/.test(zoneSource));

const ground=createOuterWorldGround({
  config:CONFIG.outerWorld,
  texture:{name:"stub-grass"},
  textureWorldSize:CONFIG.terrain.size,
});
ok("far-ground polish stays one mesh and one material",
  ground.stats.meshes===1&&ground.group.children.length===1);
ok("world edge has a protected blend band",
  ground.mesh.geometry.userData.edgeBlendWidth>=20,
  String(ground.mesh.geometry.userData.edgeBlendWidth));
ok("macro colour variation is enabled but kept subtle",
  ground.mesh.geometry.userData.macroVariationStrength>0
  &&ground.mesh.geometry.userData.macroVariationStrength<=0.2,
  String(ground.mesh.geometry.userData.macroVariationStrength));

const shader={
  uniforms:{},
  vertexShader:"#include <common>\n#include <begin_vertex>",
  fragmentShader:"#include <common>\n#include <map_fragment>",
};
ground.mesh.material.onBeforeCompile(shader);
ok("fade shader tracks radius and organic fade jitter",
  shader.vertexShader.includes("vOuterWorldRadius")
  &&shader.vertexShader.includes("vOuterFadeJitter")
  &&shader.fragmentShader.includes("outerWorldTextureFade"));
ok("anti-banding fade starts shortly outside the 80 m terrain",
  shader.uniforms.uOuterTextureFadeStart.value===CONFIG.terrain.size*0.75
  &&shader.uniforms.uOuterTextureFadeEnd.value===CONFIG.terrain.size*1.6,
  `effective=${shader.uniforms.uOuterTextureFadeStart.value}-${shader.uniforms.uOuterTextureFadeEnd.value}`);
ok("authored fade is preserved as metadata while safety caps are effective",
  ground.mesh.material.userData.textureFade.requestedStart===CONFIG.outerWorld.textureFadeStart
  &&ground.mesh.material.userData.textureFade.requestedEnd===CONFIG.outerWorld.textureFadeEnd
  &&ground.mesh.material.userData.textureFade.start<ground.mesh.material.userData.textureFade.requestedStart);
ok("fade jitter runs in the vertex path rather than per-fragment trig",
  shader.uniforms.uOuterTextureFadeJitter.value>0
  &&shader.vertexShader.includes("outerJitterA")
  &&!shader.fragmentShader.includes("sin("));
ok("edge/anti-banding polish does not add collision or gameplay geometry",
  ground.mesh.castShadow===false&&ground.mesh.receiveShadow===false
  &&CONFIG.worldLimit===38&&CONFIG.terrain.size===80);

ground.dispose();
window.__results=results;window.__done=true;
document.querySelector("#out").textContent=JSON.stringify(results,null,1);
</script></body></html>
