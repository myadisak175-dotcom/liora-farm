<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>horizon polish tests</title>
<script type="importmap">{"imports":{"three":"./horizon-three-stub.js"}}</script>
</head>
<body><pre id="out">running…</pre>
<script>
const fail=(what)=>{document.querySelector("#out").textContent="ERROR: "+what;window.__results=[{name:"bootstrap",pass:false,detail:String(what)}];window.__done=true;};
addEventListener("error",(e)=>fail((e.error&&e.error.stack)||e.message));
addEventListener("unhandledrejection",(e)=>fail("unhandled rejection: "+((e.reason&&e.reason.stack)||e.reason)));
</script>
<script type="module">
import { createOuterWorldGround, buildOuterWorldGeometry, createOuterWorldHeightSampler } from "../../src/systems/outer-world-ground.js";
import { CONFIG, BUILD } from "../../src/config.js";

const results=[];
const ok=(name,pass,detail="")=>results.push({name,pass:Boolean(pass),detail});

// Was pinned to the literal "horizon-4". A build marker changes on every
// deploy by definition, so that assertion failed permanently from the next
// deploy onward and taught everyone to ignore this file. Assert it exists.
ok("build marker is set",typeof BUILD==="string"&&BUILD.length>0,String(BUILD));
/**
 * The far ground used to fade its grass texture out with distance, on the
 * theory that a 5 m tile asked to describe hundreds of metres would streak at
 * grazing angles. It did not — mipmaps resolve a sub-pixel tile to its own
 * average, which is what the fade was replacing it with. What the fade did
 * produce was a flat textureless sheet starting 110 m out, with a visible line
 * where it began, and the field stopped reading as one piece of land.
 */
ok("the far ground carries no texture-fade settings any more",
  CONFIG.outerWorld.textureFadeStart===undefined
  &&CONFIG.outerWorld.textureFadeEnd===undefined
  &&CONFIG.outerWorld.textureFadeReach===undefined,
  JSON.stringify(Object.keys(CONFIG.outerWorld).filter((k)=>k.startsWith("textureFade"))));
// Same swap as horizon-layers: the authored GLB cluster replaced the
// procedural islands. `y` is asserted because it is the field that decides
// whether any of this is on screen at all -- see the "เกาะลอยฟ้าอยู่ในกรอบจอ"
// rule in horizon-settings.js.
ok("authored floating-island cluster is enabled and framed",
  CONFIG.floatingIslands.enabled===true
  &&CONFIG.floatingIslands.items.length>0
  &&CONFIG.floatingIslands.items.every((i)=>i.y>0&&i.radius>0));

const zoneSource=await fetch("../../src/zones/home-island.js").then((r)=>r.text());
ok("outer visual ground receives renderer anisotropy",
  /function tile\([^)]*anisotropy/.test(zoneSource)
  &&/texture\.anisotropy\s*=\s*anisotropy/.test(zoneSource)
  &&/baseMap\s*=\s*tile\([\s\S]{0,160}?anisotropy\s*\)/.test(zoneSource));

const GROUND=CONFIG.outerWorld;
const ground=createOuterWorldGround({
  config:GROUND,
  texture:{name:"stub-grass"},
  textureWorldSize:CONFIG.terrain.size,
});
ok("far-ground polish stays one mesh and one material",
  ground.stats.meshes===1&&ground.group.children.length===1);
ok("world edge has a protected blend band",
  ground.mesh.geometry.userData.edgeBlendWidth>=20,
  String(ground.mesh.geometry.userData.edgeBlendWidth));
ok("macro colour variation is enabled but kept subtle",
  ground.mesh.geometry.userData.macroVariationStrength>0
  &&ground.mesh.geometry.userData.macroVariationStrength<=0.2,
  String(ground.mesh.geometry.userData.macroVariationStrength));

const shader={
  uniforms:{},
  vertexShader:"#include <common>\n#include <begin_vertex>",
  // Both chunks the shading hooks into. The map chunk is here so the guard
  // below can prove nothing is injected into it any more; the opaque chunk is
  // where the haze lives and the stub used to omit it, which meant that half
  // of the shader went untested for as long as it existed.
  fragmentShader:"#include <common>\n#include <map_fragment>\n#include <opaque_fragment>",
};
ground.mesh.material.onBeforeCompile(shader);
ok("the distance shader tracks radius and an organic jitter",
  shader.vertexShader.includes("vOuterWorldRadius")
  &&shader.vertexShader.includes("vOuterEdgeJitter"));
/**
 * The guard. The grass map must reach the rim untouched — no crossfade, no
 * second diffuse, nothing keyed off distance in the map path at all.
 */
ok("the grass texture is never faded out with distance",
  !shader.fragmentShader.includes("outerWorldTextureFade")
  &&!shader.fragmentShader.includes("outerWorldBaseDiffuse")
  &&shader.uniforms.uOuterTextureFadeStart===undefined
  &&shader.uniforms.uOuterTextureFadeEnd===undefined,
  shader.fragmentShader.includes("outerWorldTextureFade")?"fade is back":"clean");
ok("only the haze is left, and it still reaches the rim",
  shader.uniforms.uOuterSkyBlendEnd.value<=GROUND.outerRadius
  &&shader.fragmentShader.includes("outerSkyBlend"),
  `blend ends ${shader.uniforms.uOuterSkyBlendEnd.value} of ${GROUND.outerRadius}`);
ok("the jitter runs in the vertex path rather than per-fragment trig",
  shader.uniforms.uOuterEdgeJitter.value>0
  &&shader.vertexShader.includes("outerJitterA")
  &&!shader.fragmentShader.includes("sin("));
/**
 * The tree line stands on this mesh, and the mesh is generated rather than
 * authored — so the only honest way to place scenery on it is to run the same
 * formula backwards. If the sampler and the vertices ever disagree, trees
 * float in one build and sink into the ground in the next.
 */
const sampler=createOuterWorldHeightSampler(CONFIG.outerWorld,CONFIG.terrain.size);
const vertices=buildOuterWorldGeometry(CONFIG.outerWorld,CONFIG.terrain.size).attributes.position.array;
let worstDrift=0,sampled=0;
for(let i=0;i<vertices.length;i+=3){
  const x=vertices[i],y=vertices[i+1],z=vertices[i+2];
  const radius=Math.hypot(x,z);
  if(radius<45||radius>140) continue;   // the band the tree line uses
  worstDrift=Math.max(worstDrift,Math.abs(sampler(x,z)-y)); sampled+=1;
}
ok("ground height sampler agrees with the mesh it stands on",
  sampled>200&&worstDrift<0.02,`${sampled} vertices, worst drift ${worstDrift.toFixed(4)} m`);

ok("edge/anti-banding polish does not add collision or gameplay geometry",
  ground.mesh.castShadow===false&&ground.mesh.receiveShadow===false
  &&CONFIG.worldLimit===38&&CONFIG.terrain.size===80);

ground.dispose();
window.__results=results;window.__done=true;
document.querySelector("#out").textContent=JSON.stringify(results,null,1);
</script></body></html>
