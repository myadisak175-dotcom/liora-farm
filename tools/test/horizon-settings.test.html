<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>horizon settings tests</title>
<script type="importmap">{"imports":{"three":"./horizon-three-stub.js"}}</script>
</head>
<body><pre id="out">running…</pre>
<script>
const fail=(what)=>{document.querySelector("#out").textContent="ERROR: "+what;window.__results=[{name:"bootstrap",pass:false,detail:String(what)}];window.__done=true;};
addEventListener("error",(e)=>fail((e.error&&e.error.stack)||e.message));
addEventListener("unhandledrejection",(e)=>fail("unhandled rejection: "+((e.reason&&e.reason.stack)||e.reason)));
</script>
<script type="module">
import {
  HORIZON_DIALS,HORIZON_TOGGLES,horizonDefaults,sanitizeHorizon,resolveHorizon,
  checkHorizonRules,horizonSnippet,groundExtent,
} from "../../src/systems/horizon-settings.js";
import { CONFIG } from "../../src/config.js";

const results=[];
const ok=(name,pass,detail="")=>results.push({name,pass:Boolean(pass),detail});
const ruleById=(rules,id)=>rules.find((r)=>r.id===id);
// CONFIG holds the built-range baseline; the painted horizon layers its own
// land and air over it, exactly as main.js does. Checking the raw CONFIG would
// measure a world the game never builds — painted bands standing in front of a
// 600 m ground that fog is still trying to close over.
const PAINTED={
  ...CONFIG,
  outerWorld:{...CONFIG.outerWorld,...(CONFIG.paintedBackdrop.world?.outerWorld??{})},
  fog:{...CONFIG.fog,...(CONFIG.paintedBackdrop.world?.fog??{})},
};
const check=(settings)=>checkHorizonRules(resolveHorizon(settings,PAINTED),PAINTED);
// The ridge rules only have anything to measure when the built ranges are the
// live horizon, so those checks run against a config with the painted bands
// turned off — the state anyone reaches with ?backdrop=0.
const BUILT_RANGES={...CONFIG,paintedBackdrop:{...CONFIG.paintedBackdrop,enabled:false}};
const checkBuilt=(settings)=>checkHorizonRules(resolveHorizon(settings,BUILT_RANGES),BUILT_RANGES);
const builtDefaults=horizonDefaults(BUILT_RANGES);

const defaults=horizonDefaults(PAINTED);
ok("defaults read back the authored config",
  defaults.fogNear===PAINTED.fog.near&&defaults.fogFar===PAINTED.fog.far
  &&defaults.groundRadius===PAINTED.outerWorld.outerRadius&&defaults.groundY===PAINTED.outerWorld.outerY,
  JSON.stringify(defaults));
ok("distance and height dials start neutral",
  [defaults.foothillDistance,defaults.foothillHeight,defaults.rangeDistance,
   defaults.rangeHeight,defaults.peakDistance,defaults.peakHeight].every((v)=>v===1));

const shipped=check(defaults);
ok("the shipping horizon passes every rule",shipped.every((r)=>r.pass),
  JSON.stringify(shipped.filter((r)=>!r.pass).map((r)=>r.label)));

let unreachable=[];
for(const dial of HORIZON_DIALS){
  if(!(dial.min<dial.max)) unreachable.push(`${dial.key} range`);
  const start=defaults[dial.key];
  if(start<dial.min-1e-9||start>dial.max+1e-9) unreachable.push(`${dial.key} default ${start} outside ${dial.min}..${dial.max}`);
}
ok("every dial default sits inside its slider range",unreachable.length===0,unreachable.join("; "));

let broken=[];
for(const dial of HORIZON_DIALS){
  for(const value of [dial.min,dial.max]){
    const resolved=resolveHorizon({...defaults,[dial.key]:value},PAINTED);
    const numbers=[resolved.fog.near,resolved.fog.far,resolved.cameraMinPitch,
      resolved.outerWorld.outerRadius,resolved.outerWorld.outerY,resolved.outerWorld.heightVariation,
      ...resolved.mountainBackdrop.near.chunks.map((c)=>c.radius),
      ...resolved.mountainBackdrop.near.chunks.map((c)=>c.height),
      ...resolved.mountainBackdrop.far.chunks.map((c)=>c.radius),
      ...resolved.distantRange.peaks.flatMap((r)=>[r.radiusMin,r.radiusMax,r.heightMin,r.heightMax,r.baseY]),
      resolved.distantRange.haze.opacity];
    if(!numbers.every((n)=>Number.isFinite(n))) broken.push(`${dial.key}=${value}`);
    if(resolved.fog.far<=resolved.fog.near) broken.push(`${dial.key}=${value} fog inverted`);
    if(resolved.outerWorld.outerRadius<=0) broken.push(`${dial.key}=${value} radius<=0`);
  }
}
ok("no slider extreme produces broken geometry input",broken.length===0,broken.join("; "));

const rough={...defaults,groundVariation:12};
const roughResolved=resolveHorizon(rough,PAINTED);
const roughGround=groundExtent(rough,PAINTED);
ok("rough ground pushes scenery bases down to stay buried",
  roughResolved.mountainBackdrop.near.baseY<roughGround.min
  &&roughResolved.mountainBackdrop.far.baseY<roughGround.min
  &&roughResolved.distantRange.peaks.every((r)=>r.baseY<roughGround.min));

ok("shrinking world past fog wall reports hard-edge rule",
  ruleById(checkBuilt({...builtDefaults,groundRadius:150}),"rim").pass===false);
// The same rule, asking the painted horizon's version of the question: with
// bands carrying the horizon the rim is hidden by standing behind one, so what
// breaks it is ground that runs past the nearest band instead of stopping.
ok("ground authored past the nearest painted band reports the rim rule",
  ruleById(check({...defaults,groundRadius:520}),"rim").pass===false
  &&ruleById(check(defaults),"rim").pass===true);
// And the wash that turned the last stretch of meadow into a cream bar: two
// individually mild numbers, compounding.
ok("fog and sky-blend compounding into a wall of haze is reported",
  ruleById(check({...defaults,fogNear:40,groundSkyBlend:0.5}),"airy").pass===false
  &&ruleById(check(defaults),"airy").pass===true,
  JSON.stringify(ruleById(check(defaults),"airy").detail));
ok("fog inside farm reports washed-out-farm rule",ruleById(check({...defaults,fogNear:40}),"farm").pass===false);
ok("top-down-only camera reports no-sky rule",ruleById(check({...defaults,cameraMinPitchDeg:40}),"view").pass===false);
ok("rough ground swallowing foothills reports rooting rule",ruleById(checkBuilt({...builtDefaults,groundVariation:12,foothillHeight:0.3}),"rooted").pass===false);
ok("mountains pushed past fog wall report invisible-scenery rule",ruleById(checkBuilt({...builtDefaults,foothillDistance:2,rangeDistance:2}),"visible").pass===false);

// Painted bands answer the same questions with different geometry: buried at
// the bottom, clear of the land at the top, and inside the camera's far plane.
const paintedRules=check(defaults);
ok("the shipped painted horizon passes its own rules",
  ruleById(paintedRules,"painted").pass===true&&ruleById(paintedRules,"rooted").pass===true,
  JSON.stringify([ruleById(paintedRules,"painted").detail,ruleById(paintedRules,"rooted").detail]));
const clippedBand={...PAINTED,paintedBackdrop:{...CONFIG.paintedBackdrop,
  bands:CONFIG.paintedBackdrop.bands.map((band)=>({...band,radius:CONFIG.camera.far+50}))}};
ok("a band authored past the camera's far plane is reported, not silently invisible",
  ruleById(checkHorizonRules(resolveHorizon(defaults,clippedBand),clippedBand),"painted").pass===false);
const floatingBand={...PAINTED,paintedBackdrop:{...CONFIG.paintedBackdrop,
  bands:CONFIG.paintedBackdrop.bands.map((band)=>({...band,y:400}))}};
ok("a band floating above the land reports the rooting rule",
  ruleById(checkHorizonRules(resolveHorizon(defaults,floatingBand),floatingBand),"rooted").pass===false);

const failing=check({...defaults,groundRadius:150,fogNear:40,cameraMinPitchDeg:40});
ok("every failing rule carries a fix and measurement",
  failing.filter((r)=>!r.pass).every((r)=>r.fix?.length>0&&r.detail?.length>0));

ok("garbage stored settings fall back to authored config",
  JSON.stringify(sanitizeHorizon(null,PAINTED))===JSON.stringify(defaults)
  &&JSON.stringify(sanitizeHorizon("nope",PAINTED))===JSON.stringify(defaults)
  &&JSON.stringify(sanitizeHorizon({fogNear:"abc"},PAINTED))===JSON.stringify(defaults));
ok("out-of-range stored settings are clamped",
  sanitizeHorizon({groundRadius:99999,cameraMinPitchDeg:-90},PAINTED).groundRadius===900
  &&sanitizeHorizon({groundRadius:99999,cameraMinPitchDeg:-90},PAINTED).cameraMinPitchDeg===6);
ok("unknown save keys are dropped",
  sanitizeHorizon({legacyKnob:5,fogNear:120},PAINTED).legacyKnob===undefined
  &&sanitizeHorizon({legacyKnob:5,fogNear:120},PAINTED).fogNear===120);
ok("toggles round-trip only as booleans",
  sanitizeHorizon({hazeEnabled:"yes"},PAINTED).hazeEnabled===defaults.hazeEnabled
  &&sanitizeHorizon({hazeEnabled:false},PAINTED).hazeEnabled===false);

const snippet=horizonSnippet(resolveHorizon(defaults,PAINTED));
ok("snippet names every authored block",
  ["camera.minPitch","fog:","outerRadius","heightVariation","mountainBackdrop.near",
   "mountainBackdrop.far","distantRange.peaks","floatingIslands.enabled"].every((k)=>snippet.includes(k)));
ok("snippet carries every ridge chunk",
  (snippet.match(/\{ angle:/g)??[]).length===CONFIG.mountainBackdrop.near.chunks.length+CONFIG.mountainBackdrop.far.chunks.length);
ok("snippet numbers are finite",!/NaN|Infinity|undefined/.test(snippet));

const allOff=resolveHorizon({...defaults,mountainsEnabled:false,peaksEnabled:false,hazeEnabled:false},PAINTED);
ok("switching layers off disables resolved config",
  allOff.mountainBackdrop.enabled===false&&allOff.distantRange.enabled===false&&allOff.distantRange.haze.enabled===false);
ok("GLB backdrop replaces procedural islands by default",
  resolveHorizon(defaults,PAINTED).distantRange.floatingIslands.enabled===false
  &&CONFIG.distantRange.floatingIslandBackdrop?.enabled===true);
ok("every toggle is covered by resolver",HORIZON_TOGGLES.every((t)=>t.key in defaults));

window.__results=results;window.__done=true;
document.querySelector("#out").textContent=JSON.stringify(results,null,1);
</script></body></html>
