<script type="module">
import { CONFIG } from "../../src/config.js";
import { BUILDABLE_ASSETS } from "../../src/editor/asset-catalog.js";
import { BLOOM_ASSET_IDS, NATURE_V2_ASSETS, isBloomAsset } from "../../src/editor/nature-catalog-v2.js";
import {
  BUTTERFLY_REST_CHANCE,
  FLOWER_SURFACES,
  createEnvironmentLifeFallback,
  findFlowerPatch,
  pickButterflyTarget,
  resolveEnvironmentCounts,
  stepButterfly,
} from "../../src/systems/environment-life.js";
import { QUALITY_PRESETS } from "../../src/systems/quality.js";

const results = [];
const out = document.querySelector("#out");
async function test(name, fn) {
  try { await fn(); results.push({ name, pass: true, detail: "" }); }
  catch (error) { results.push({ name, pass: false, detail: String(error?.message ?? error) }); }
}
function assert(value, message) { if (!value) throw new Error(message); }

await test("falling leaves stay off while butterfly budgets scale by tier", () => {
  const low = resolveEnvironmentCounts(QUALITY_PRESETS.low, CONFIG.environmentLife);
  const medium = resolveEnvironmentCounts(QUALITY_PRESETS.medium, CONFIG.environmentLife);
  const high = resolveEnvironmentCounts(QUALITY_PRESETS.high, CONFIG.environmentLife);
  assert(low.leaves === 0 && medium.leaves === 0 && high.leaves === 0, "falling leaves returned");
  assert(low.insects > 0, "low tier removed the requested butterflies");
  assert(low.insects < medium.insects && medium.insects < high.insects, "insect budgets do not scale by tier");
  assert(high.insects <= CONFIG.environmentLife.insects.maxCount, "high insect count exceeds its fixed pool");
});

await test("foliage only brushes gently around Liora", () => {
  assert(CONFIG.wind.interaction.radius <= 1.1, "interaction field became wide again");
  assert(CONFIG.wind.interaction.strength <= 0.28, "interaction force became harsh again");
});

await test("daylight is bright and cloud shade stays soft", () => {
  const luminance = (hex) => {
    const r = ((hex >> 16) & 255) / 255;
    const g = ((hex >> 8) & 255) / 255;
    const b = (hex & 255) / 255;
    return r * 0.2126 + g * 0.7152 + b * 0.0722;
  };
  assert(luminance(CONFIG.sky.horizonColor) > 0.94, "day horizon is gloomy again");
  assert(luminance(CONFIG.sky.cloudColor) > 0.9, "clouds turned grey");
  assert(CONFIG.sky.cloudOpacity <= 0.9, "cloud layer became a solid slab");
  assert(CONFIG.cloudShadows.strength <= 0.22, "cloud shadows became too dark");
});

await test("the daytime sky is a summer blue, not a pale haze", () => {
  const rgb = (hex) => [(hex >> 16) & 255, (hex >> 8) & 255, hex & 255].map((v) => v / 255);
  const [zr, zg, zb] = rgb(CONFIG.sky.zenithColor);
  const [hr, hg, hb] = rgb(CONFIG.sky.horizonColor);
  // Depth overhead: the blue has to be clearly deeper than the horizon band,
  // or the dome reads as haze from every camera angle.
  assert(zb - zr > 0.35, "the zenith lost its blue");
  assert(hr + hg + hb - (zr + zg + zb) > 0.6, "the horizon band no longer lifts away from the zenith");
  assert(CONFIG.sky.zenithHold < 0.8, "the gradient blends across the whole dome again");
  // A sun the player can actually see.
  assert(CONFIG.sky.sunSize > 0 && CONFIG.sky.sunGlow > 0, "the sky has no sun");
  assert(CONFIG.dayNight.daylight.zenith === CONFIG.sky.zenithColor, "the day palette and the sky dome drifted apart");
  assert(CONFIG.dayNight.daylight.horizon === CONFIG.sky.horizonColor, "the day palette and the sky dome drifted apart");
});

await test("butterflies use a colourful silhouette and moving mist has real flow", async () => {
  const [life, horizon] = await Promise.all([
    fetch("../../src/systems/environment-life.js").then((response) => response.text()),
    fetch("../../src/systems/background/fantasy-horizon.js").then((response) => response.text()),
  ]);
  assert(life.includes('insectMesh.name = "Butterflies"'), "flying life is no longer authored as butterflies");
  assert(life.includes("0xff78bb") && life.includes("0xa88cff") && life.includes("0x58d9e5"), "colourful butterfly palette is missing");
  assert(CONFIG.distantRange.haze.driftSpeed >= 0.004, "mist drift is too slow to perceive");
  assert(CONFIG.distantRange.haze.radialDrift > 0 && CONFIG.distantRange.haze.lift > 0, "mist can only rotate rigidly");
  assert(horizon.includes("haze?.update(time)"), "flowing mist is not ticked by the horizon system");
});

await test("decorative failure keeps the foliage interaction bridge alive", () => {
  const calls = [];
  const fallback = createEnvironmentLifeFallback({
    setInteraction(position, state) { calls.push({ position, state }); },
  });
  fallback.update(0.016, { position: { x: 2, z: 3 }, state: { moving: true } });
  assert(calls.length === 1 && calls[0].position.x === 2, "fallback dropped the player field");
  assert(fallback.stats.degraded === true, "fallback is not visible to diagnostics");
  fallback.dispose();
  assert(calls.at(-1).position === null, "fallback did not clear the player field");
});

await test("visible clouds and ground shadows share one drift speed", () => {
  const shadowWorldSpeed = CONFIG.cloudShadows.speed * CONFIG.cloudShadows.scale;
  assert(
    Math.abs(CONFIG.sky.cloudDriftSpeed - shadowWorldSpeed) < 0.05,
    `cloud=${CONFIG.sky.cloudDriftSpeed}, shadow=${shadowWorldSpeed}`
  );
  assert(CONFIG.wind.interaction.enabled, "foliage interaction is disabled in the authored world");
});

await test("the authored cloud layer sits inside the portrait sky band", () => {
  const approximateCameraY = CONFIG.camera.baseOffset.y;
  const elevation = Math.atan2(
    CONFIG.sky.cloudHeight - approximateCameraY,
    CONFIG.sky.cloudRingRadius
  );
  const visibleSky = CONFIG.camera.fov * Math.PI / 360 - CONFIG.camera.minPitch;
  assert(elevation < visibleSky, `cloud elevation ${(elevation * 180 / Math.PI).toFixed(1)}° exceeds ${(visibleSky * 180 / Math.PI).toFixed(1)}°`);
});

await test("cloud-shadow texture travels in the visible cloud direction", async () => {
  const source = await fetch("../../src/systems/cloud-shadows.js").then((response) => response.text());
  assert(source.includes("uCloudShadowScale - cloudDrift"), "large cloud shadow runs against the wind");
  assert(source.includes("uCloudShadowDetailScale - cloudDrift * 1.7"), "detail shadow runs against the wind");
});

await test("legacy and V2 ground cover both receive the shared plant shader", () => {
  assert(BUILDABLE_ASSETS.grass.windProfile === "grass", "legacy grass cannot move or part around Liora");
  assert(BUILDABLE_ASSETS["v2-grass-small"].worldV2, "V2 grass disappeared from the catalog");
  assert(BUILDABLE_ASSETS["v2-bush"].walkRadius === 0, "soft bushes became solid colliders");
});

await test("the composition root ticks sky, air life and foliage interaction", async () => {
  const [main, sky, life] = await Promise.all([
    fetch("../../src/main.js").then((response) => response.text()),
    fetch("../../src/systems/sky.js").then((response) => response.text()),
    fetch("../../src/systems/environment-life.js").then((response) => response.text()),
  ]);
  assert(main.includes("createEnvironmentLife"), "air-life system is not created");
  assert(main.includes('systems.add("environmentLife"'), "air-life system is not in the frame registry");
  assert(main.includes("sky.update(camera, delta)"), "visible clouds do not receive frame time");
  assert(sky.includes("cloudDriftSpeed") && sky.includes("wrapDistance"), "visible clouds are static again");
  assert(life.includes("wind?.setInteraction?.(player, state)"), "player position no longer reaches foliage");
});

await test("a butterfly crosses to where it is going instead of orbiting", () => {
  const flat = { groundAt: () => 0, overWater: () => false, random: () => 0.9, minHeight: 0.4, maxHeight: 1.6 };
  const insect = { x: 0, y: 1, z: 0, targetX: 3, targetY: 1, targetZ: 0, mode: "cruise", speed: 1, flapRate: 9, flapPhase: 0, wobblePhase: 0 };
  let closest = Infinity;
  for (let frame = 0; frame < 200; frame += 1) {
    stepButterfly(insect, 1 / 60, flat);
    closest = Math.min(closest, Math.hypot(insect.targetX - insect.x, insect.targetZ - insect.z));
  }
  assert(closest < 0.2, `never arrived, closest was ${closest.toFixed(2)}`);
  assert(insect.flapPhase > 0, "the wings never beat");
});

await test("the flight wanders instead of running down a straight line", () => {
  const flat = { groundAt: () => 0, overWater: () => false, random: () => 0.9, minHeight: 0.4, maxHeight: 1.6 };
  const insect = { x: 0, y: 1, z: 0, targetX: 6, targetY: 1, targetZ: 0, mode: "cruise", speed: 1, flapRate: 9, flapPhase: 0, wobblePhase: 0 };
  let drift = 0;
  for (let frame = 0; frame < 90; frame += 1) {
    stepButterfly(insect, 1 / 60, flat);
    drift = Math.max(drift, Math.abs(insect.z));
  }
  assert(drift > 0.01, "the path is a straight line");
  assert(drift < 1.2, `the path wandered off course by ${drift.toFixed(2)}`);
});

await test("butterflies settle, slow their wings, and take off again", () => {
  // random() = 0 always chooses to rest, and picks the shortest hop.
  const settling = { groundAt: () => 0, overWater: () => false, random: () => 0, minHeight: 0.4, maxHeight: 1.6, restSeconds: 1, restVariation: 0 };
  const insect = { x: 0, y: 1, z: 0, mode: "cruise", speed: 1.2, flapRate: 9, flapPhase: 0, wobblePhase: 0 };
  pickButterflyTarget(insect, settling);
  assert(insect.landing === true, "a butterfly that wants to land did not choose a landing spot");
  assert(insect.targetY < 0.2, "the landing spot is not on the ground");

  let rested = false;
  let flapWhileResting = Infinity;
  for (let frame = 0; frame < 600 && !rested; frame += 1) {
    stepButterfly(insect, 1 / 60, settling);
    if (insect.mode === "rest") rested = true;
  }
  assert(rested, "the butterfly never landed");
  for (let frame = 0; frame < 30; frame += 1) {
    stepButterfly(insect, 1 / 60, settling);
    flapWhileResting = Math.min(flapWhileResting, insect.flapRate);
  }
  assert(flapWhileResting < 6, `resting wings still beat at ${flapWhileResting.toFixed(1)}`);
  assert(Math.abs(insect.y) < 0.25, "a resting butterfly is hovering, not settled");
  // Now with a butterfly that does not want to land again the moment it lifts
  // off: it has to leave the ground and stay up.
  const flying = { ...settling, random: () => 0.9 };
  for (let frame = 0; frame < 240; frame += 1) stepButterfly(insect, 1 / 60, flying);
  assert(insect.mode === "cruise", "the butterfly never took off again");
  assert(insect.y > 0.25, `it took off but stayed at ${insect.y.toFixed(2)}`);
});

await test("a butterfly will cross water but never land on it", () => {
  const pond = { groundAt: () => 0, overWater: () => true, random: () => 0, minHeight: 0.4, maxHeight: 1.6 };
  const insect = { x: 0, y: 1, z: 0, mode: "cruise", speed: 1, flapRate: 9, flapPhase: 0, wobblePhase: 0 };
  for (let attempt = 0; attempt < 40; attempt += 1) {
    pickButterflyTarget(insect, pond);
    assert(insect.landing === false, "a butterfly tried to land on water");
    assert(insect.targetY >= 0.4, "a butterfly dropped to the water surface");
  }
  assert(BUTTERFLY_REST_CHANCE > 0 && BUTTERFLY_REST_CHANCE < 1, "resting is all-or-nothing");
});

await test("a stalled leg is abandoned and broken timing cannot break the flight", () => {
  const flat = { groundAt: () => 0, overWater: () => false, random: () => 0.5, minHeight: 0.4, maxHeight: 1.6 };
  const insect = { x: 0, y: 1, z: 0, targetX: 500, targetY: 1, targetZ: 0, mode: "cruise", speed: 0.6, flapRate: 9, flapPhase: 0, wobblePhase: 0, legTime: 0 };
  for (let frame = 0; frame < 900; frame += 1) stepButterfly(insect, 1 / 60, flat);
  assert(insect.targetX < 500, "an unreachable target is chased forever");
  const before = { x: insect.x, z: insect.z };
  stepButterfly(insect, Number.NaN, flat);
  stepButterfly(insect, -5, flat);
  assert(Number.isFinite(insect.x) && Number.isFinite(insect.y), "a broken frame time produced NaN positions");
  assert(insect.x === before.x && insect.z === before.z, "a broken frame time still moved the butterfly");
});

await test("the per-instance tint cannot render the swarm black again", async () => {
  const life = await fetch("../../src/systems/environment-life.js").then((response) => response.text());
  assert(life.includes("insectMesh.setColorAt"), "butterflies no longer get a per-instance colour");
  assert(life.includes("leafMesh.setColorAt"), "leaves no longer get a per-instance colour");
  // setColorAt feeds instanceColor. Turning vertexColors on as well switches
  // USE_COLOR on, and neither geometry carries a colour attribute — so every
  // instance sampled an unset attribute and rendered pure black. Every
  // butterfly in the game was a dark blob because of this one flag.
  assert(!/vertexColors:\s*true/.test(life), "vertexColors is on again with no colour attribute on the geometry");
});

await test("butterflies gather on planted flower bushes", () => {
  const player = { x: 0, z: 0 };
  const bushes = [{ x: 4, z: 1 }, { x: -3, z: 2 }, { x: 60, z: 60 }];
  for (let attempt = 0; attempt < 20; attempt += 1) {
    const patch = findFlowerPatch({ player, radius: 8.5, flowerSpots: () => bushes, random: Math.random });
    assert(patch.kind === "bush", `a planted bush was ignored (${patch.kind})`);
    assert(Math.hypot(patch.x, patch.z) < 8.5, "a patch was chosen outside the butterfly radius");
  }
  // A bush on the far side of the island is not a reason to fly there.
  const far = findFlowerPatch({ player, radius: 8.5, flowerSpots: () => [{ x: 90, z: 90 }], surfaceAt: () => "grass" });
  assert(far.kind !== "bush", "butterflies crossed the map to a bush out of range");
});

await test("without bushes they settle on painted flower meadow", () => {
  const player = { x: 0, z: 0 };
  // Only the eastern half is painted as flowering.
  const patch = findFlowerPatch({
    player, radius: 8.5, flowerSpots: () => [],
    surfaceAt: (x) => (x > 0 ? "flower_grass" : "dirt"),
    random: (() => { let i = 0; return () => [0.05, 0.4, 0.6, 0.2, 0.9, 0.5][i++ % 6]; })(),
  });
  assert(patch.kind === "painted", `painted flowers were ignored (${patch.kind})`);
  assert(patch.x > 0, "the patch landed on the unpainted side");
  assert(FLOWER_SURFACES.has("flower_grass"), "the painted flower surface is no longer recognized");
  // Plain grass everywhere still yields somewhere to go, rather than nothing.
  const open = findFlowerPatch({ player, radius: 8.5, surfaceAt: () => "grass" });
  assert(open.kind === "open" && Number.isFinite(open.x), "a meadow with no flowers left the butterflies homeless");
});

await test("a butterfly works its patch instead of drifting across the field", () => {
  const flat = { groundAt: () => 0, overWater: () => false, random: Math.random, minHeight: 0.4, maxHeight: 1.6, range: 1.5 };
  const insect = {
    x: 5, y: 1, z: 5, patchX: 5, patchZ: 5,
    mode: "cruise", speed: 1, flapRate: 9, flapPhase: 0, wobblePhase: 0,
  };
  pickButterflyTarget(insect, flat);
  let furthest = 0;
  for (let frame = 0; frame < 2000; frame += 1) {
    stepButterfly(insect, 1 / 60, flat);
    furthest = Math.max(furthest, Math.hypot(insect.x - 5, insect.z - 5));
  }
  assert(furthest < 3.4, `it wandered ${furthest.toFixed(2)}m from its flowers`);
  assert(furthest > 0.2, "it never moved around the patch at all");
});

await test("the meadow is not swarming with butterflies", () => {
  assert(CONFIG.environmentLife.insects.maxCount <= 6, `maxCount is ${CONFIG.environmentLife.insects.maxCount}`);
  for (const tier of Object.values(QUALITY_PRESETS)) {
    assert(tier.insectCount <= CONFIG.environmentLife.insects.maxCount,
      `${tier.id} asks for ${tier.insectCount} butterflies`);
  }
  assert(QUALITY_PRESETS.high.insectCount <= 6, "the high tier still fills the field with butterflies");
});

await test("a bloom is identified by what the asset is, not by its id text", () => {
  // The two that a substring match on the id gets wrong, in both directions.
  assert(BLOOM_ASSET_IDS.has("v2-plant-2"), "v2-plant-2 is a flower bush and was missed");
  assert(!BLOOM_ASSET_IDS.has("v2-bush"), "v2-bush is a plain green bush and was counted as flowers");
  assert(BLOOM_ASSET_IDS.has("v2-flower-1-clump") && BLOOM_ASSET_IDS.has("v2-petals-1"), "obvious flowers are missing");
  assert(!BLOOM_ASSET_IDS.has("v2-pinetree-1"), "a pine tree counted as flowers");
  for (const id of BLOOM_ASSET_IDS) assert(isBloomAsset(NATURE_V2_ASSETS[id]), `${id} does not survive its own predicate`);
  assert(BLOOM_ASSET_IDS.size >= 8, `only ${BLOOM_ASSET_IDS.size} flowering assets found`);
  // The frozen catalog item exposes modelPath/sourceHeight; reading `file` or
  // `height` returns undefined and fails quietly.
  const bloom = NATURE_V2_ASSETS["v2-plant-flowers"];
  assert(bloom.modelPath.endsWith("flower-bushes.glb") && bloom.file === undefined, "the catalog item shape changed");
  assert(Number.isFinite(bloom.sourceHeight) && bloom.height === undefined, "bloom height is no longer sourceHeight");
});

await test("a butterfly rests in the bloom, not on the grass under it", () => {
  const player = { x: 0, z: 0 };
  const patch = findFlowerPatch({ player, radius: 8.5, flowerSpots: () => [{ x: 2, z: 0, bloom: 0.8 }] });
  assert(patch.kind === "bush" && patch.bloom === 0.8, JSON.stringify(patch));

  const settling = { groundAt: () => 0, overWater: () => false, random: () => 0, minHeight: 0.4, maxHeight: 1.6 };
  const insect = { x: 2, y: 1.2, z: 0, patchX: 2, patchZ: 0, patchBloom: patch.bloom, mode: "cruise", speed: 1, flapRate: 9, flapPhase: 0, wobblePhase: 0 };
  pickButterflyTarget(insect, settling);
  assert(insect.landing === true, "it did not choose to land");
  assert(Math.abs(insect.targetY - 0.8) < 0.01, `it aimed at ${insect.targetY.toFixed(2)} instead of the flower head`);

  // Painted meadow has no bloom height, so that lands on the ground as before.
  const onGround = { ...insect, patchBloom: 0 };
  pickButterflyTarget(onGround, settling);
  assert(onGround.targetY < 0.2, "a painted-meadow landing left the ground");
});

await test("flowers planted while a butterfly is flying get found", async () => {
  const source = await fetch("../../src/systems/environment-life.js").then((response) => response.text());
  // Without this the patch is only re-read on respawn, so planting a bush next
  // to a butterfly does nothing until it happens to drift out of range.
  assert(source.includes("insect.patchTimer -= step"), "patches are never re-read while flying");
  assert(/patchTimer <= 0[\s\S]{0,120}findFlowerPatch/.test(source), "the timer does not lead to a new patch");
  assert(source.includes("function patchLifetime()"), "there is no patch lifetime at all");
  assert(CONFIG.environmentLife.insects.patchSeconds <= 30,
    `a butterfly holds a patch for ${CONFIG.environmentLife.insects.patchSeconds}s before looking again`);
});

window.__results = results;
window.__done = true;
out.textContent = results.map((result) => `${result.pass ? "PASS" : "FAIL"} ${result.name}${result.detail ? ` | ${result.detail}` : ""}`).join("\n");
</script>
