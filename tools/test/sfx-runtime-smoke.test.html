<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Sound effects runtime smoke</title></head>
<body data-mode="play">
<div id="toast"></div>
<div id="emote-menu">
  <button type="button" id="b-pick" data-action="pickUp">pick</button>
  <button type="button" id="b-hammer" data-action="hammer">hammer</button>
  <button type="button" id="b-mirror" data-action="mirror">mirror</button>
</div>
<button type="button" id="b-plain">plain</button>
<button type="button" id="b-farm" data-action="farm">farm</button>
<pre id="out"></pre>
<script type="module">
// The effects runtime runs against a fake AudioContext and a fake fetch so the
// test checks the wiring — which tap, event or toast makes which sound — not
// the speakers. "mirror" answers HTTP 404 and "hammer" is undecodable, to prove
// a missing or broken file leaves the game silent for that moment instead of
// failing.
const results = [];
const out = document.querySelector("#out");
async function test(name, fn) {
  try { await fn(); results.push({ name, pass: true, detail: "" }); }
  catch (error) { results.push({ name, pass: false, detail: String(error?.message ?? error) }); }
}
function assert(value, message) { if (!value) throw new Error(message); }
const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

const plays = [];
const contexts = [];
class FakeAudioContext {
  constructor() { this.state = "suspended"; this.destination = {}; contexts.push(this); }
  createGain() { return { gain: { value: 1 }, connect() {}, disconnect() {} }; }
  createBufferSource() {
    const node = {
      buffer: null,
      playbackRate: { value: 1 },
      onended: null,
      connect() {},
      disconnect() {},
      start() { plays.push({ name: node.buffer.name, rate: node.playbackRate.value }); },
    };
    return node;
  }
  decodeAudioData(data, ok, fail) {
    try {
      const name = new TextDecoder().decode(data);
      if (name === "BROKEN") throw new Error("undecodable");
      ok({ name });
    } catch (error) { fail(error); }
  }
  resume() { this.state = "running"; return Promise.resolve(); }
}
window.AudioContext = FakeAudioContext;
window.webkitAudioContext = undefined;

const requested = [];
const realFetch = window.fetch.bind(window);
window.fetch = async (input, ...rest) => {
  const url = String(input?.href ?? input);
  if (!url.includes("/assets/audio/sfx/")) return realFetch(input, ...rest);
  requested.push(url);
  const file = new URL(url).pathname.split("/").pop();
  if (file === "sfx_mirror.mp3") return { ok: false, status: 404, arrayBuffer: async () => new ArrayBuffer(0) };
  const name = file === "sfx_hammer.mp3" ? "BROKEN" : file.replace(/^sfx_|\.mp3$/g, "");
  return { ok: true, status: 200, arrayBuffer: async () => new TextEncoder().encode(name).buffer };
};

// What the game's own handlers do: a started emote marks its button active.
for (const id of ["b-pick", "b-hammer", "b-mirror"]) {
  document.getElementById(id).onclick = (event) => {
    if (event.currentTarget.dataset.refuse !== "1") event.currentTarget.classList.add("active");
  };
}

window.__lioraAudio = { muted: false };
const { WORLD_EVENTS } = await import("../../src/systems/world-events.js");
await import("../../src/audio-sfx.js?smoke=sfx1");

const last = () => plays.at(-1)?.name ?? null;
async function settle() { await sleep(30); }
async function until(check, ms = 2000) {
  const end = performance.now() + ms;
  while (performance.now() < end) { if (check()) return true; await sleep(10); }
  return check();
}

await test("nothing is created or fetched before the first touch", () => {
  assert(window.__lioraSfx, "sfx api missing");
  assert(contexts.length === 0, "an AudioContext was created before any gesture");
  assert(requested.length === 0, "files were fetched before any gesture");
  assert(window.__lioraSfx.status.context === "not-created", "status should say not-created");
});

window.dispatchEvent(new Event("pointerdown"));
await until(() => window.__lioraSfx.status.loaded.length + window.__lioraSfx.status.missing.length >= 10);

await test("the first touch creates one context and loads every file once", () => {
  assert(contexts.length === 1, `expected one context, got ${contexts.length}`);
  assert(requested.length === 10, `expected 10 fetches, got ${requested.length}`);
  window.dispatchEvent(new Event("pointerdown"));
  window.dispatchEvent(new Event("touchend"));
  assert(contexts.length === 1, "later touches must not create another context");
  assert(window.__lioraSfx.status.context === "running", "context should be resumed");
});

await test("a missing file and an undecodable file are reported, not thrown", () => {
  const { loaded, missing } = window.__lioraSfx.status;
  assert(loaded.length === 8, `expected 8 loaded, got ${loaded.length}: ${loaded}`);
  assert(missing.includes("mirror") && missing.includes("hammer"), `missing should list mirror and hammer: ${missing}`);
});

await test("a started emote plays its own sound, once", async () => {
  const before = plays.length;
  document.getElementById("b-pick").click();
  await settle();
  assert(plays.length === before + 1, `expected one new sound, got ${plays.length - before}`);
  assert(last() === "pick_up", `wrong sound: ${last()}`);
  document.getElementById("b-pick").classList.remove("active");
});

await test("a refused emote makes no sound", async () => {
  await sleep(320);
  const before = plays.length;
  const button = document.getElementById("b-pick");
  button.dataset.refuse = "1";
  button.click();
  await settle();
  delete button.dataset.refuse;
  assert(plays.length === before, "a refused emote must stay silent");
});

await test("an emote whose file is missing stays silent without error", async () => {
  const before = plays.length;
  document.getElementById("b-mirror").click();
  document.getElementById("b-hammer").click();
  await settle();
  assert(plays.length === before, "missing/undecodable emote files must play nothing");
});

await test("a plain button taps; the farm button does not", async () => {
  const before = plays.length;
  document.getElementById("b-farm").click();
  await settle();
  assert(plays.length === before, "the farm button must be silent at the tap");
  document.getElementById("b-plain").click();
  await settle();
  assert(plays.length === before + 1 && last() === "ui_tap", `expected a tap, got ${last()}`);
});

await test("a held button cannot machine-gun the tap sound", async () => {
  await sleep(80);
  const before = plays.length;
  for (let i = 0; i < 5; i += 1) document.getElementById("b-plain").click();
  await settle();
  assert(plays.length - before === 1, `expected 1 tap in a burst, got ${plays.length - before}`);
});

await test("farm actions and zone entry play through WORLD_EVENTS", async () => {
  const names = [];
  for (const action of ["hoe", "water", "plant", "harvest"]) {
    const before = plays.length;
    WORLD_EVENTS.emit({ type: "farm-action", action });
    assert(plays.length === before + 1, `${action} did not play`);
    names.push(last());
  }
  assert(names.join() === "hoe,water,plant,harvest", `wrong sounds: ${names}`);
  const before = plays.length;
  WORLD_EVENTS.emit({ type: "enter", node: { enabled: true, label: "Zone" } });
  assert(plays.length === before + 1 && last() === "zone_enter", `zone entry played ${last()}`);
  WORLD_EVENTS.emit({ type: "enter", node: { enabled: false } });
  WORLD_EVENTS.emit({ type: "exit", node: { enabled: true } });
  assert(plays.length === before + 1, "a disabled zone or an exit must be silent");
});

await test("a toast that arrives with an action sound does not chime on top", async () => {
  await sleep(750);
  const toast = document.querySelector("#toast");
  const before = plays.length;
  WORLD_EVENTS.emit({ type: "farm-action", action: "water" });
  toast.classList.add("on");
  await settle();
  assert(plays.length === before + 1 && last() === "water", `expected only the water sound, got ${plays.slice(before).map((p) => p.name)}`);
  toast.classList.remove("on");
});

await test("a lone toast chimes once, and not again while it is showing", async () => {
  await sleep(750);
  const toast = document.querySelector("#toast");
  const before = plays.length;
  toast.classList.add("on");
  await settle();
  assert(plays.length === before + 1 && last() === "toast", `expected a toast chime, got ${last()}`);
  toast.classList.add("on");
  toast.textContent = "second line";
  await settle();
  assert(plays.length === before + 1, "a toast already on screen must not chime again");
  toast.classList.remove("on");
});

await test("build mode stays quiet", async () => {
  await sleep(80);
  document.body.dataset.mode = "build";
  const before = plays.length;
  document.getElementById("b-plain").click();
  await settle();
  document.body.dataset.mode = "play";
  assert(plays.length === before, "the builder must make no button sounds");
});

await test("the player's mute choice silences effects and unmuting restores them", async () => {
  await sleep(80);
  window.__lioraAudio.muted = true;
  const before = plays.length;
  WORLD_EVENTS.emit({ type: "farm-action", action: "harvest" });
  document.getElementById("b-plain").click();
  await settle();
  assert(plays.length === before, "muted effects must not play");
  window.__lioraAudio.muted = false;
  await sleep(250);
  WORLD_EVENTS.emit({ type: "farm-action", action: "harvest" });
  assert(plays.length === before + 1 && last() === "harvest", "unmuting should bring sound back");
});

await test("repeated plays vary in pitch within the sound's jitter", async () => {
  const rates = new Set();
  for (let i = 0; i < 6; i += 1) {
    await sleep(210);
    WORLD_EVENTS.emit({ type: "farm-action", action: "hoe" });
    rates.add(plays.at(-1).rate);
  }
  for (const rate of rates) assert(rate >= 0.949 && rate <= 1.051, `rate ${rate} outside +/-5%`);
  assert(rates.size > 1, "six plays should not all share one pitch");
});

window.__results = results;
window.__done = true;
out.textContent = results.map((r) => `${r.pass ? "PASS" : "FAIL"} ${r.name}${r.detail ? ` | ${r.detail}` : ""}`).join("\n");
</script>
</body>
</html>
