<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Quality bootstrap regression</title></head>
<body><pre id="out"></pre>
<script type="module">
import { detectQualityId, resolveQualityId } from '../../src/systems/quality.js?test=bootstrap';

const results=[];
const out=document.querySelector('#out');
async function test(name,fn){try{await fn();results.push({name,pass:true,detail:''});}catch(error){results.push({name,pass:false,detail:String(error?.message??error)});}}
function assert(value,message){if(!value)throw new Error(message);}
const page=await fetch('../../index.html').then((response)=>response.text());

await test('index does not turn automatic quality into a saved preference',()=>{
  assert(!page.includes('localStorage.setItem("liora.quality.v2"'),'index still writes a permanent v2 quality choice');
  assert(!page.includes("localStorage.setItem('liora.quality.v2'"),'index still writes a permanent v2 quality choice');
});

await test('Retina Apple mobile still auto-detects High without the old bridge',()=>{
  const detected=detectQualityId({isTouch:true,deviceMemory:null,cores:6,pixelRatio:3,appleMobile:true});
  assert(detected==='high',`Retina Apple mobile detected as ${detected}`);
});

await test('explicit current-generation choice still wins',()=>{
  assert(resolveQualityId('low','high')==='low','explicit low was overwritten');
  assert(resolveQualityId('medium','high')==='medium','explicit medium was overwritten');
  assert(resolveQualityId(null,'high')==='high','automatic result did not survive');
});

await test('quality maintenance leaves authored world and current audio release alone',()=>{
  assert(page.includes('./src/main.js?v=world23'),'authored world revision changed');
  assert(page.includes('./src/audio-runtime.js?v=audio24-route2'),'audio selector revision is not the current iOS route repair');
});

await test('Safari cache aliases remain same-path version aliases',()=>{
  assert(page.includes('"./src/config.js": "./src/config.js?v='),'config cache alias is no longer a self-alias');
  assert(page.includes('"./src/systems/quality.js": "./src/systems/quality.js?v='),'quality cache alias is no longer a self-alias');
});

window.__results=results;window.__done=true;
out.textContent=results.map((r)=>`${r.pass?'PASS':'FAIL'} ${r.name}${r.detail?` | ${r.detail}`:''}`).join('\n');
</script>
</body></html>
