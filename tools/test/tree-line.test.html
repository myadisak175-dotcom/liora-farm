<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tree line tests</title>
<script type="importmap">
{"imports":{
  "three":"./tree-line-three-stub.js",
  "three/addons/loaders/GLTFLoader.js":"./tree-line-gltf-stub.js"
}}
</script>
</head>
<body><pre id="out"></pre>
<script type="module">
import { stubNatureScene } from "./tree-line-three-stub.js";
import { createTreeLine } from "../../src/systems/background/tree-line.js";

const results = [];
const out = document.querySelector("#out");
async function test(name, fn) {
  try { await fn(); results.push({ name, pass: true, detail: "" }); }
  catch (error) { results.push({ name, pass: false, detail: String(error?.message ?? error) }); }
}
function assert(value, message) { if (!value) throw new Error(message); }
const settle = () => new Promise((r) => setTimeout(r, 0));

const PINE = "./assets/models/world-v2/nature/pine-trees.glb";
const ASSETS = {
  tall: { id: "tall", modelPath: PINE, nodeName: "PineTree_2", sourceHeight: 6.91, tris: 2716 },
  short: { id: "short", modelPath: PINE, nodeName: "PineTree_3", sourceHeight: 2.35, tris: 1998 },
  bush: { id: "bush", modelPath: PINE, nodeName: "Bush", sourceHeight: 0.69, tris: 420 },
};
globalThis.__stubGltf = { [PINE]: stubNatureScene(["PineTree_2", "PineTree_3", "Bush"], 500) };

const base = {
  enabled: true, innerRadius: 52, outerRadius: 96, count: 300,
  sectors: 16, clumps: 9, clumpSpread: 0.3, minHeight: 1.5, seed: 4242,
  items: [{ id: "tall", weight: 2 }, { id: "short", weight: 1 }],
};
async function build(overrides = {}) {
  const line = await createTreeLine({ config: { ...base, ...overrides }, assets: ASSETS, heightAt: () => 1.5 });
  await settle(); await settle();
  return line;
}

/**
 * The reason this system is chunked at all. One InstancedMesh spanning the
 * whole ring can never leave the frustum, so every tree would be submitted
 * every frame while the phone shows about 5% of the ring.
 */
await test("the ring is split into sector groups, not one mesh", async () => {
  const line = await build();
  assert(line.group.children.length > 1, `only ${line.group.children.length} group(s) — the ring is not chunked`);
  assert(line.group.children.length <= base.sectors,
    `${line.group.children.length} groups for ${base.sectors} sectors`);
  for (const sector of line.group.children) {
    assert(/^TreeLineSector\d+$/.test(sector.name), `unexpected child ${sector.name}`);
  }
});


await test("authored GLB root transform survives cloning", async () => {
  const scene = stubNatureScene(["PineTree_2"], 500);
  const authored = scene.getObjectByName("PineTree_2");
  authored.scale.setScalar(100);
  authored.rotation.set(-Math.PI / 2, 0, 0);
  globalThis.__stubGltf[PINE] = scene;
  let observed = null;
  await createTreeLine({
    config: { ...base, count: 1, items: [{ id: "tall", weight: 1 }] },
    assets: ASSETS,
    heightAt: () => 1.5,
    onModel: (model) => { observed = { scale: model.scale.x, rotationX: model.rotation.x }; },
  });
  await settle(); await settle();
  assert(observed?.scale === 100, `authored scale was reset to ${observed?.scale}`);
  assert(Math.abs(observed.rotationX + Math.PI / 2) < 1e-9, `authored rotation was reset to ${observed?.rotationX}`);
  globalThis.__stubGltf[PINE] = stubNatureScene(["PineTree_2", "PineTree_3", "Bush"], 500);
});

await test("every instanced mesh stays frustum-cullable", async () => {
  const line = await build();
  for (const sector of line.group.children) {
    for (const mesh of sector.children) {
      assert(mesh.frustumCulled === true, `${mesh.name} opted out of frustum culling`);
      assert(mesh.boundingSphereRevision > 0, `${mesh.name} never computed a bounding sphere`);
    }
  }
});

await test("scenery casts and receives no shadows", async () => {
  const line = await build();
  for (const sector of line.group.children) {
    for (const mesh of sector.children) {
      assert(mesh.castShadow === false && mesh.receiveShadow === false, `${mesh.name} is in the shadow pass`);
    }
  }
});

/** Anything too short to resolve at this distance is refused, not drawn. */
await test("entries under minHeight are refused with a reason", async () => {
  const line = await build({ items: [{ id: "tall" }, { id: "bush" }] });
  assert(line.stats.skipped.some((s) => s.startsWith("bush:")), JSON.stringify(line.stats.skipped));
  assert(line.stats.trees > 0, "refusing the bush should not empty the band");
});

await test("an unknown catalog id is reported, not silently dropped", async () => {
  const line = await build({ items: [{ id: "tall" }, { id: "nope" }] });
  assert(line.stats.skipped.some((s) => s.includes("nope")), JSON.stringify(line.stats.skipped));
});

/** Same seed, same forest — otherwise the world reshuffles on every reload. */
await test("the same seed rebuilds the identical scatter", async () => {
  const a = await build();
  const b = await build();
  assert(a.stats.trees === b.stats.trees, `${a.stats.trees} vs ${b.stats.trees}`);
  const shape = (line) => line.group.children.map((s) => `${s.name}:${s.children.length}`).join(",");
  assert(shape(a) === shape(b), "same seed produced a different layout");
  const c = await build({ seed: 99 });
  assert(shape(c) !== shape(a), "different seeds produced the identical layout");
});

await test("disabled or empty config builds nothing but still returns a controller", async () => {
  const off = await build({ enabled: false });
  assert(off.group.children.length === 0 && typeof off.dispose === "function", "disabled line still built");
  const empty = await build({ items: [] });
  assert(empty.group.children.length === 0, "empty item list still built");
});

await test("dispose drops every sector", async () => {
  const line = await build();
  assert(line.group.children.length > 0, "nothing to dispose");
  line.dispose();
  assert(line.group.children.length === 0, "sectors survived dispose");
});

await test("trees stay inside the configured band", async () => {
  const line = await build();
  assert(line.stats.trees > 0, "no trees");
  assert(line.stats.meshes >= line.group.children.length, "sector without meshes");
});

out.textContent = results.map((r) => `${r.pass ? "PASS" : "FAIL"} ${r.name}${r.detail ? ` — ${r.detail}` : ""}`).join("\n");
window.__results = results;
window.__done = true;
</script>
</body>
</html>
