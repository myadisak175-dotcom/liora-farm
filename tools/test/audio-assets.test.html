<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Audio architecture tests</title></head>
<body><pre id="out"></pre>
<script type="module">
const results=[];
const out=document.querySelector('#out');
async function test(name,fn){try{await fn();results.push({name,pass:true,detail:''});}catch(error){results.push({name,pass:false,detail:String(error?.message??error)});}}
function assert(value,message){if(!value)throw new Error(message);}
const stepFiles=['footstep_grass_soft.mp3','footstep_grass_run_clean.mp3','footstep_run_dirt.mp3','footstep_run_ground.mp3','footstep_water_wade_bank.mp3'];
const streamFiles=['music_lanternfields_overture.mp3','ambience_morning_birdsong.mp3','ambience_forest_night.mp3','ambience_tree_wind.mp3'];
const allFiles=[...streamFiles,...stepFiles];
async function metadataFor(file){const audio=document.createElement('audio');audio.preload='metadata';audio.src=`../../assets/audio/${file}?v=audio21`;try{await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(new Error(`${file} metadata timed out`)),8000);audio.addEventListener('loadedmetadata',()=>{clearTimeout(timer);resolve();},{once:true});audio.addEventListener('error',()=>{clearTimeout(timer);reject(new Error(`${file} media error ${audio.error?.code??'unknown'}`));},{once:true});audio.load();});return audio.duration;}finally{audio.removeAttribute('src');audio.load();}}

await test('every shipped audio file remains valid media',async()=>{for(const file of allFiles){const duration=await metadataFor(file);assert(Number.isFinite(duration)&&duration>0.05,`${file} invalid duration ${duration}`);}});

await test('audio21 selector isolates Apple recovery from Android',async()=>{const source=await fetch('../../src/audio-runtime.js').then(r=>r.text());assert(source.includes('AUDIO_SELECTOR_REVISION = "audio21"'),'selector revision missing');assert(source.includes('route === "ios-context"'),'iOS route missing');assert(source.includes('audio-ios-runtime-v2.js'),'new iOS module missing');assert(source.includes('audio-native-runtime.js'),'native module missing');assert(!source.includes('?v=audio21'),'nested module import carries a query');assert(!source.includes('STREAM_FILES'),'selector still owns stream state');});

await test('Android native runtime is byte-path compatible with verified audio19',async()=>{const native=await fetch('../../src/audio-native-runtime.js').then(r=>r.text());assert(native.includes('const AUDIO_REVISION = "audio19"'),'verified native revision changed');assert(native.includes('function playNativeStep'),'native footstep path missing');assert(native.includes('document.createElement("audio")'),'native media path missing');assert(!native.includes('createBufferSource('),'Android unexpectedly moved to BufferSource');assert(!native.includes('decodeAudioData('),'Android unexpectedly decodes banks');});

await test('iOS no longer creates a live AudioContext at module boot',async()=>{const ios=await fetch('../../src/audio-ios-runtime-v2.js').then(r=>r.text());const createAt=ios.indexOf('function createLiveContext()');const unlockAt=ios.indexOf('async function activateFromGesture()');assert(createAt>=0&&unlockAt>createAt,'lazy context functions missing');assert(ios.includes('const ctx = new AudioContextCtor({ latencyHint: "interactive" })'),'live context constructor missing');const beforeCreate=ios.slice(0,createAt);assert(!beforeCreate.includes('new AudioContextCtor('),'live AudioContext is still constructed before a gesture');assert(ios.includes('OfflineAudioContextCtor'),'offline decoder missing');assert(ios.includes('ctx = contextForGesture()'),'unlock does not create/recover context from gesture');});

await test('iOS unlock cannot wait forever on WebKit resume',async()=>{const ios=await fetch('../../src/audio-ios-runtime-v2.js').then(r=>r.text());assert(ios.includes('RESUME_TIMEOUT_MS = 650'),'resume timeout guard missing');assert(ios.includes('settleWithin(resumeCall, RESUME_TIMEOUT_MS)'),'resume is not bounded');assert(ios.includes('contextNeedsRebuild = true'),'timed-out context is not marked for rebuild');assert(!ios.includes('await context.resume()'),'unbounded direct resume survived');});

await test('iOS explicitly rebuilds WebKit interrupted contexts',async()=>{const ios=await fetch('../../src/audio-ios-runtime-v2.js').then(r=>r.text());assert(ios.includes('context.state === "interrupted"'),'interrupted state is not handled');assert(ios.includes('abandonContext(`rebuild ${context.state}`)'),'interrupted context is not abandoned');assert(ios.includes('recoveries += 1'),'context rebuilds are not observable');assert(ios.includes('resumeTimeouts += 1'),'resume timeouts are not observable');});

await test('iOS uses one native music element and BufferSource footsteps',async()=>{const ios=await fetch('../../src/audio-ios-runtime-v2.js').then(r=>r.text());const mediaCreates=ios.match(/document\.createElement\("audio"\)/g)??[];assert(mediaCreates.length===1,`iOS creates ${mediaCreates.length} audio elements`);assert(!ios.includes('createMediaElementSource('),'music is still coupled to the recoverable context');const stepFn=ios.match(/function playStep\([\s\S]*?\n\}\n\nfunction update/)?.[0]??'';assert(stepFn.includes('context.createBufferSource()'),'footstep BufferSource missing');assert(stepFn.includes('source.start(context.currentTime + 0.003, offset, duration)'),'footstep is not scheduled on Web Audio');assert(!stepFn.includes('.currentTime ='),'footstep still seeks native media');assert(!stepFn.includes('.play()'),'footstep still plays native media');});

await test('iOS audio asset paths are module-relative',async()=>{const ios=await fetch('../../src/audio-ios-runtime-v2.js').then(r=>r.text());assert(ios.includes('new URL("../assets/audio/", import.meta.url)'),'audio base is page-relative');assert(ios.includes('url.searchParams.set("v", AUDIO_REVISION)'),'asset cache revision missing');});

await test('audio mute remains session-local on both routes',async()=>{const native=await fetch('../../src/audio-native-runtime.js').then(r=>r.text());const ios=await fetch('../../src/audio-ios-runtime-v2.js').then(r=>r.text());for(const [name,source] of [['native',native],['ios',ios]]){assert(!source.includes('liora.audio.muted'),`${name} restored obsolete persistent mute`);assert(!source.includes('localStorage'),`${name} persists audio state`);assert(source.includes('let muted = false'),`${name} does not start unmuted`);}});

await test('index cache-busts audio21 while world stays world23',async()=>{const page=await fetch('../../index.html').then(r=>r.text());const main=await fetch('../../src/main.js').then(r=>r.text());const audioRevision=page.match(/audio-runtime\.js\?v=([\w.-]+)/)?.[1];const entryRevision=page.match(/main\.js\?v=([\w.-]+)/)?.[1];const appRevision=main.match(/const APP_REVISION = "([\w.-]+)"/)?.[1];assert(audioRevision==='audio21',`unexpected selector ${audioRevision}`);assert(entryRevision===appRevision,`world entry ${entryRevision} disagrees with app ${appRevision}`);assert(audioRevision!==entryRevision,'audio release coupled to world release');});

await test('broken iOS runtime and older recovery helpers are absent',async()=>{for(const file of ['audio-ios-runtime.js','audio-bootstrap-v8.js','audio-single-world-recovery.js','audio-ios-footstep-fallback.js']){const response=await fetch(`../../src/${file}`,{cache:'no-store'});assert(response.status===404,`${file} still exists with HTTP ${response.status}`);}});

await test('terrain and water routing remains shared by both platforms',async()=>{const mix=await fetch('../../src/systems/audio-mix.js').then(r=>r.text());const native=await fetch('../../src/audio-native-runtime.js').then(r=>r.text());const ios=await fetch('../../src/audio-ios-runtime-v2.js').then(r=>r.text());assert(mix.includes('new Set(["dirt", "sand", "cracked_dirt"])'),'dirt family missing');assert(mix.includes('new Set(["rock", "cobblestone_path"])'),'hard family missing');assert(mix.includes('WATER_STEP_DEPTH = 0.055'),'water threshold changed');for(const [name,source] of [['native',native],['ios',ios]]){assert(source.includes('runBankForSurface(surface)'),`${name} ignores painted ground`);assert(source.includes('if (profileKey.startsWith("water")) return "water"'),`${name} ignores water bank`);}});

window.__results=results;window.__done=true;out.textContent=results.map(r=>`${r.pass?'PASS':'FAIL'} ${r.name}${r.detail?` | ${r.detail}`:''}`).join('\n');
</script>
</body></html>
