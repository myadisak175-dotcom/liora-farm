<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Audio architecture tests</title></head>
<body><pre id="out"></pre>
<script type="module">
const results=[];
const out=document.querySelector('#out');
async function test(name,fn){try{await fn();results.push({name,pass:true,detail:''});}catch(error){results.push({name,pass:false,detail:String(error?.message??error)});}}
function assert(value,message){if(!value)throw new Error(message);}
const stepFiles=['footstep_grass_soft.mp3','footstep_grass_run_clean.mp3','footstep_run_dirt.mp3','footstep_run_ground.mp3','footstep_water_wade_bank.mp3'];
const streamFiles=['music_lanternfields_overture.mp3','ambience_morning_birdsong.mp3','ambience_forest_night.mp3','ambience_tree_wind.mp3'];
const allFiles=[...streamFiles,...stepFiles];
async function metadataFor(file){const audio=document.createElement('audio');audio.preload='metadata';audio.src=`../../assets/audio/${file}?v=audio20`;try{await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(new Error(`${file} metadata timed out`)),8000);audio.addEventListener('loadedmetadata',()=>{clearTimeout(timer);resolve();},{once:true});audio.addEventListener('error',()=>{clearTimeout(timer);reject(new Error(`${file} media error ${audio.error?.code??'unknown'}`));},{once:true});audio.load();});return audio.duration;}finally{audio.removeAttribute('src');audio.load();}}

await test('every shipped audio file remains valid media',async()=>{for(const file of allFiles){const duration=await metadataFor(file);assert(Number.isFinite(duration)&&duration>0.05,`${file} invalid duration ${duration}`);}});

await test('audio20 is a platform selector, not another state machine',async()=>{const source=await fetch('../../src/audio-runtime.js').then(r=>r.text());assert(source.includes('AUDIO_SELECTOR_REVISION = "audio20"'),'selector revision missing');assert(source.includes('route === "ios-context"'),'iOS route missing');assert(source.includes('await import("./audio-ios-runtime.js")'),'canonical iOS module import missing');assert(source.includes('await import("./audio-native-runtime.js")'),'canonical native module import missing');assert(!source.includes('audio-ios-runtime.js?v='),'nested iOS import carries a query');assert(!source.includes('audio-native-runtime.js?v='),'nested native import carries a query');assert(!source.includes('STREAM_FILES'),'selector still owns stream state');assert(!source.includes('STEP_BANKS'),'selector still owns footstep state');});

await test('Android native runtime is preserved as the verified audio19 implementation',async()=>{const native=await fetch('../../src/audio-native-runtime.js').then(r=>r.text());assert(native.includes('const AUDIO_REVISION = "audio19"'),'verified native revision changed');assert(native.includes('function playNativeStep'),'native footstep path missing');assert(native.includes('document.createElement("audio")'),'native media path missing');assert(!native.includes('createBufferSource('),'Android unexpectedly moved to BufferSource');assert(!native.includes('decodeAudioData('),'Android unexpectedly decodes MP3 banks');});

await test('iOS uses one context and one native music element',async()=>{const ios=await fetch('../../src/audio-ios-runtime.js').then(r=>r.text());const mediaCreates=ios.match(/document\.createElement\("audio"\)/g)??[];assert(mediaCreates.length===1,`iOS creates ${mediaCreates.length} audio elements`);assert(ios.includes('createMediaElementSource(music)'),'music is not routed into the single context');assert(ios.includes('context.createBufferSource()'),'buffer playback missing');assert(ios.includes('context.decodeAudioData(bytes)'),'decoded iOS banks missing');assert(ios.includes('routing: "ios-single-context"'),'diagnostic route missing');});

await test('iOS footsteps never seek or replay an HTMLAudio element',async()=>{const ios=await fetch('../../src/audio-ios-runtime.js').then(r=>r.text());const stepFn=ios.match(/function playStep\([\s\S]*?\n\}\n\nfunction update/)?.[0]??'';assert(stepFn.includes('context.createBufferSource()'),'step does not allocate a BufferSource');assert(stepFn.includes('source.start(context.currentTime + 0.003, offset, duration)'),'step cue is not scheduled through Web Audio');assert(!stepFn.includes('.currentTime ='),'step still seeks a media element');assert(!stepFn.includes('.play()'),'step still calls HTMLMediaElement.play');assert(/source\.start\([\s\S]*?playedSteps \+= 1/.test(stepFn),'played count moves before BufferSource start');});

await test('iOS ambience is decoded before sound unlock',async()=>{const ios=await fetch('../../src/audio-ios-runtime.js').then(r=>r.text());const preloadAt=ios.indexOf('for (const name of ["birds", "night", "wind"]) void preloadAmbience(name);');const unlockAt=ios.indexOf('async function activateFromGesture()');assert(preloadAt>=0&&unlockAt>=0&&preloadAt<unlockAt,'ambience decode is deferred into the unlock gesture');assert(ios.includes('for (const key of Object.keys(STEP_BANKS)) void preloadStepBank(key);'),'step banks are not predecoded');});

await test('iOS keeps ambience on gain nodes instead of play-pause churn',async()=>{const ios=await fetch('../../src/audio-ios-runtime.js').then(r=>r.text());assert(ios.includes('track.gain.gain.setTargetAtTime'),'ambience gain crossfade missing');assert(ios.includes('source.loop = true'),'ambience loop source missing');assert(!ios.includes('shouldStreamPlay('),'iOS still gates ambience with media play/pause hysteresis');});

await test('audio mute remains session-local on both routes',async()=>{const native=await fetch('../../src/audio-native-runtime.js').then(r=>r.text());const ios=await fetch('../../src/audio-ios-runtime.js').then(r=>r.text());for(const [name,source] of [['native',native],['ios',ios]]){assert(!source.includes('liora.audio.muted'),`${name} restored obsolete persistent mute`);assert(!source.includes('localStorage'),`${name} persists audio state`);assert(source.includes('let muted = false'),`${name} does not start unmuted`);}});

await test('index cache-busts the selector while leaving world revision independent',async()=>{const page=await fetch('../../index.html').then(r=>r.text());const main=await fetch('../../src/main.js').then(r=>r.text());const audioRevision=page.match(/audio-runtime\.js\?v=([\w.-]+)/)?.[1];const entryRevision=page.match(/main\.js\?v=([\w.-]+)/)?.[1];const appRevision=main.match(/const APP_REVISION = "([\w.-]+)"/)?.[1];assert(audioRevision==='audio20',`unexpected selector ${audioRevision}`);assert(entryRevision===appRevision,`world entry ${entryRevision} disagrees with app ${appRevision}`);assert(audioRevision!==entryRevision,'audio release coupled to world release');});

await test('old split recovery modules remain deleted',async()=>{for(const file of ['audio-bootstrap-v8.js','audio-single-world-recovery.js','audio-ios-footstep-fallback.js']){const response=await fetch(`../../src/${file}`,{cache:'no-store'});assert(response.status===404,`${file} still exists with HTTP ${response.status}`);}});

await test('terrain and water routing is shared by both platforms',async()=>{const mix=await fetch('../../src/systems/audio-mix.js').then(r=>r.text());const native=await fetch('../../src/audio-native-runtime.js').then(r=>r.text());const ios=await fetch('../../src/audio-ios-runtime.js').then(r=>r.text());assert(mix.includes('new Set(["dirt", "sand", "cracked_dirt"])'),'dirt family missing');assert(mix.includes('new Set(["rock", "cobblestone_path"])'),'hard family missing');assert(mix.includes('WATER_STEP_DEPTH = 0.055'),'water threshold changed');for(const [name,source] of [['native',native],['ios',ios]]){assert(source.includes('runBankForSurface(surface)'),`${name} ignores painted ground`);assert(source.includes('if (profileKey.startsWith("water")) return "water"'),`${name} ignores water bank`);}});

window.__results=results;window.__done=true;out.textContent=results.map(r=>`${r.pass?'PASS':'FAIL'} ${r.name}${r.detail?` | ${r.detail}`:''}`).join('\n');
</script>
</body></html>
