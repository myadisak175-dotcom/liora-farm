<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Audio asset tests</title>
</head>
<body><pre id="out"></pre>
<script type="module">
const results = [];
const out = document.querySelector("#out");
async function test(name, fn) {
  try { await fn(); results.push({ name, pass: true, detail: "" }); }
  catch (error) { results.push({ name, pass: false, detail: String(error?.message ?? error) }); }
}
function assert(value, message) { if (!value) throw new Error(message); }

const runtimeFiles = [
  "footstep_grass_soft.mp3",
  "footstep_grass_run_clean.mp3",
  "footstep_run_dirt.mp3",
  "footstep_run_ground.mp3",
  "footstep_water_wade_bank.mp3",
];
const streamFiles = [
  "music_lanternfields_overture.mp3",
  "ambience_morning_birdsong.mp3",
  "ambience_forest_night.mp3",
  "ambience_tree_wind.mp3",
];

await test("every runtime audio file fetches and decodes in Chromium", async () => {
  const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
  assert(AudioContextCtor, "Web Audio is unavailable in the test browser");
  const context = new AudioContextCtor();
  try {
    for (const file of runtimeFiles) {
      const response = await fetch(`../../assets/audio/${file}`);
      assert(response.ok, `${file} returned HTTP ${response.status}`);
      const decoded = await context.decodeAudioData(await response.arrayBuffer());
      assert(decoded.duration > 0.1, `${file} decoded as an empty clip`);
    }
  } finally {
    await context.close();
  }
});

await test("every streaming track exposes valid browser metadata", async () => {
  for (const file of streamFiles) {
    const audio = document.createElement("audio");
    audio.preload = "metadata";
    audio.src = `../../assets/audio/${file}`;
    await new Promise((resolve, reject) => {
      const timer = setTimeout(() => reject(new Error(`${file} metadata timed out`)), 8000);
      audio.addEventListener("loadedmetadata", () => { clearTimeout(timer); resolve(); }, { once: true });
      audio.addEventListener("error", () => {
        clearTimeout(timer);
        reject(new Error(`${file} returned media error ${audio.error?.code ?? "unknown"}`));
      }, { once: true });
      audio.load();
    });
    assert(Number.isFinite(audio.duration) && audio.duration > 1, `${file} has invalid duration`);
    audio.removeAttribute("src");
    audio.load();
  }
});

await test("the runtime never references the corrupt legacy leaf file", async () => {
  const source = await fetch("../../src/audio-bootstrap-v8.js").then((response) => response.text());
  const filesBlock = source.match(/const FILES = Object\.freeze\(\{([\s\S]*?)\n\}\);/)?.[1] ?? "";
  assert(!filesBlock.includes("footstep_forest_leaves.mp3"), "corrupt leaf MP3 is still referenced");
  assert(filesBlock.includes("footstep_grass_soft.mp3"), "clean walking fallback is missing");
  assert(source.includes("unlockFromGameGesture"), "normal game touches no longer unlock or retry audio");
  assert(source.includes('document.addEventListener("pointerdown", unlockFromGameGesture, { capture: true })'), "mobile retry listener became one-shot again");
  assert(source.includes('document.createElement("audio")'), "long tracks are no longer streamed natively");
  assert(source.includes("normalizeFootstep"), "quiet footstep files are no longer normalized");
  for (const file of streamFiles) assert(source.includes(file), `${file} is not wired into the runtime`);
});

await test("a device that ignores element volume still gets a real mix", async () => {
  const source = await fetch("../../src/audio-bootstrap-v8.js").then((response) => response.text());
  // iOS silently drops writes to HTMLMediaElement.volume, which used to play
  // every long track at full level at once. The probe decides the routing.
  assert(source.includes("function detectElementVolume()"), "element volume support is no longer probed");
  assert(source.includes("probe.volume = 0.5"), "the volume probe no longer writes a test level");
  assert(source.includes("if (elementVolumeSupported) track.audio.volume = level;"), "native stream crossfade is missing");
  const graph = source.match(/function attachStreamGraph\(\) \{([\s\S]*?)\n\}/)?.[1] ?? "";
  assert(graph.includes("createMediaElementSource"), "there is no fallback for read-only volume");
  assert(graph.includes("if (elementVolumeSupported || !context || !ambienceBus) return;"), "Android media can be routed through Web Audio again");
  const graphUses = source.match(/createMediaElementSource/g) ?? [];
  assert(graphUses.length === 1, "media elements are routed through Web Audio outside the fallback");
});

await test("the player's choice to silence the game survives a world switch", async () => {
  const source = await fetch("../../src/audio-bootstrap-v8.js").then((response) => response.text());
  assert(source.includes('const MUTE_KEY = "liora.audio.muted"'), "the mute choice is no longer stored");
  assert(source.includes("let muted = readStoredMuted();"), "a reload no longer restores the mute choice");
  // Mute has exactly one writer, because clearing the flag anywhere else left
  // the master gain at zero and silenced every footstep until the next reload.
  const writes = source.match(/^\s*muted = /gm) ?? [];
  assert(writes.length === 2, `mute is written from ${writes.length} places instead of ensureAudio and setMuted`);
  assert(/muted = false;\n  storeMuted\(false\);/.test(source), "unlocking no longer records that sound is on");
  assert(/muted = Boolean\(next\);\n  storeMuted\(muted\);/.test(source), "setMuted no longer records the choice");
  assert(/setMuted\(next\) \{[\s\S]*?master\.gain\.setTargetAtTime/.test(source), "unmuting no longer restores the master gain");
});

await test("terrain and water select distinct movement banks", async () => {
  const source = await fetch("../../src/audio-bootstrap-v8.js").then((response) => response.text());
  const mix = await fetch("../../src/systems/audio-mix.js").then((response) => response.text());
  assert(mix.includes('new Set(["dirt", "sand", "cracked_dirt"])'), "dirt-family routing is missing");
  assert(mix.includes('new Set(["rock", "cobblestone_path"])'), "hard-ground routing is missing");
  assert(mix.includes("WATER_STEP_DEPTH = 0.055"), "water depth no longer selects splash steps");
  assert(source.includes('String(runtime?.surface ?? "grass")'), "ground-paint surface is not read at footfall time");
  assert(source.includes("RUN_DIRT_CUES") && source.includes("RUN_GROUND_CUES") && source.includes("WATER_CUES"), "new cue banks are not wired");
  assert(source.includes("setStreamTarget(streams?.wind"), "tree wind does not breathe with the ambience mix");
  assert(source.includes("setStreamTarget(streams?.birds"), "daytime bird stream is missing");
  assert(source.includes("setStreamTarget(streams?.night"), "night forest stream is missing");
});

await test("one missing long track cannot silence footsteps or the other streams", async () => {
  const source = await fetch("../../src/audio-bootstrap-v8.js").then((response) => response.text());
  assert(source.includes("result[name] = null"), "stream creation is not isolated per file");
  assert(source.includes("Promise.allSettled"), "footstep fallbacks no longer settle independently");
  assert(source.includes("last-resort fallback"), "procedural ambience fallback is missing");
  assert(source.includes("แตะปุ่มเสียงอีกครั้ง"), "blocked mobile playback no longer prompts a retry");
  // A track the browser refused, or that a phone call paused, has to come back
  // without waiting for the player to find the sound button.
  assert(source.includes("function retryBlockedStreams(nowMs)"), "blocked streams are only retried from a gesture again");
  assert(source.includes("retryBlockedStreams(now)"), "the retry pass never runs");
  assert(source.includes('audio.addEventListener("pause"'), "an interrupted track is no longer noticed");
  assert(source.includes("track.reloads >= STREAM_RELOAD_LIMIT"), "a permanently missing file would be retried forever");
});

await test("a phone that stalls or refuses a resume does not lose a layer of the mix", async () => {
  const source = await fetch("../../src/audio-bootstrap-v8.js").then((response) => response.text());
  // "Playing" is not the same as audible: a stalled mobile stream keeps the
  // state and stops the clock, so the media position is what gets checked.
  assert(source.includes("STREAM_STALL_MS"), "a stalled stream is never noticed");
  assert(source.includes('setRuntimeError(track.name, "stalled")'), "a stalled stream is not reported or restarted");
  assert(source.includes("Math.abs(position - track.lastMediaTime)"), "a looping track would be misread as stalled");
  // Stopping a silent track is only ever an optimization; if this device will
  // not start it again, the mix must keep it running unheard instead.
  assert(source.includes("pauseGatingBroken = true"), "a refused resume no longer disables pause gating");
  assert(source.includes("function canSilenceWithoutPausing(track)"), "silence now depends on pausing even where volume works");
  assert(/const keepAlive = pauseGatingBroken && canSilenceWithoutPausing\(track\);/.test(source), "the keep-alive fallback is not wired into playback");
});

await test("a footstep failure cannot take the long tracks down with it", async () => {
  const source = await fetch("../../src/audio-bootstrap-v8.js").then((response) => response.text());
  // Where element volume is read-only the streams are routed through the same
  // context the footsteps use, and a media element cannot be handed back to
  // native output once routed. Closing that context on a decode failure left
  // the ambience playing in name only, with `unlocked` true so nothing retried.
  assert(source.includes("if (!trackList().some((track) => track.node))"), "a footstep failure closes a context the long tracks are routed through");
  const failure = source.match(/console\.warn\("Liora footstep audio init failed"[\s\S]*?\n    \}/)?.[0] ?? "";
  assert(failure.includes("buffers = null"), "a failed footstep load no longer clears its buffers");
  assert(/if \(!trackList\(\)[\s\S]*?context\?\.close/.test(failure), "the context is closed before checking for routed streams");
});

await test("a release cannot ship new audio behind a stale world-switch revision", async () => {
  const page = await fetch("../../index.html").then((response) => response.text());
  const mainSource = await fetch("../../src/main.js").then((response) => response.text());
  const audioRevision = page.match(/audio-bootstrap-v8\.js\?v=([\w.-]+)/)?.[1];
  const entryRevision = page.match(/main\.js\?v=([\w.-]+)/)?.[1];
  const appRevision = mainSource.match(/const APP_REVISION = "([\w.-]+)"/)?.[1];
  assert(audioRevision, "the audio bootstrap lost its cache-busting revision");
  assert(entryRevision === audioRevision, `the entry module ships ${entryRevision} while audio ships ${audioRevision}`);
  // Switching worlds is a reload, and the revision on that URL is what stops a
  // phone reusing the previous release's cached index document — which would
  // quietly load the previous audio bootstrap with it.
  assert(appRevision === audioRevision, `world-switch URLs would still carry ${appRevision} after an ${audioRevision} release`);
  // A release that changes how the world looks but keeps the previous
  // release's revision ships behind a cache key players already hold.
  const config = await fetch("../../src/config.js").then((response) => response.text());
  const build = config.match(/export const BUILD = "([\w.-]+)"/)?.[1];
  assert(build && build !== audioRevision, "the build marker is missing");
  assert(/sourceHeight/.test(mainSource), "main reads a catalog height field the frozen item does not have");
  const audioTest = await fetch("../../audio-test.html").then((response) => response.text());
  assert(audioTest.includes(`?v=${audioRevision}`), "the audio test page links back to a stale revision");
});

window.__results = results;
window.__done = true;
out.textContent = results.map((result) => `${result.pass ? "PASS" : "FAIL"} ${result.name}${result.detail ? ` | ${result.detail}` : ""}`).join("\n");
</script>
</body>
</html>
