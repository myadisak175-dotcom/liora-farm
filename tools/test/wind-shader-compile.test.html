<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Wind GLSL compile test</title></head>
<body><pre id="out"></pre>
<script type="module">
import { applyWindToMaterial } from "../../src/systems/wind/wind-material.js";

const results = [];
const out = document.querySelector("#out");
function assert(value, message) { if (!value) throw new Error(message); }
async function test(name, fn) {
  try { await fn(); results.push({ name, pass: true, detail: "" }); }
  catch (error) { results.push({ name, pass: false, detail: String(error?.message ?? error) }); }
}

function fakeMaterial() {
  return {
    name: "Leaves",
    userData: {},
    onBeforeCompile() {},
    customProgramCacheKey() { return "base"; },
    clone() { return fakeMaterial(); },
  };
}

function compile(gl, type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  const ok = gl.getShaderParameter(shader, gl.COMPILE_STATUS);
  const log = gl.getShaderInfoLog(shader) || "";
  if (!ok) throw new Error(log || "shader compile failed");
  return shader;
}

await test("wind vertex displacement compiles as WebGL1 GLSL", () => {
  const canvas = document.createElement("canvas");
  const gl = canvas.getContext("webgl");
  assert(gl, "WebGL context unavailable");

  const material = applyWindToMaterial({
    material: fakeMaterial(),
    geometry: {
      boundingBox: null,
      computeBoundingBox() { this.boundingBox = { min: { y: 0 }, max: { y: 4 } }; },
    },
    mesh: { name: "Leaves" },
    profileName: "tree",
    uniforms: {
      time: { value: 0 },
      direction: { value: { x: 1, y: 0 } },
      strength: { value: 0.55 },
      speed: { value: 0.75 },
      gustStrength: { value: 0.3 },
      gustSpeed: { value: 0.18 },
      gustScale: { value: 0.07 },
    },
    quality: { isTouch: true },
    clone: true,
  });

  const shader = {
    uniforms: {},
    vertexShader: `
precision highp float;
uniform mat4 modelMatrix;
attribute vec3 position;
#include <common>
void main() {
  vec3 transformed = position;
  #include <begin_vertex>
  gl_Position = vec4(transformed, 1.0);
}`,
  };
  material.onBeforeCompile(shader, {});

  // Three.js expands these chunks before the driver sees GLSL. This minimal
  // compile harness supplied everything the injected code needs, so remove the
  // two placeholder include lines after injection.
  const vertex = shader.vertexShader
    .replaceAll("#include <common>", "")
    .replaceAll("#include <begin_vertex>", "");
  const fragment = `precision mediump float; void main(){ gl_FragColor = vec4(1.0); }`;

  const vs = compile(gl, gl.VERTEX_SHADER, vertex);
  const fs = compile(gl, gl.FRAGMENT_SHADER, fragment);
  const program = gl.createProgram();
  gl.attachShader(program, vs);
  gl.attachShader(program, fs);
  gl.linkProgram(program);
  assert(gl.getProgramParameter(program, gl.LINK_STATUS), gl.getProgramInfoLog(program) || "program link failed");
});

window.__results = results;
window.__done = true;
out.textContent = results.map((r) => `${r.pass ? "PASS" : "FAIL"} ${r.name}${r.detail ? ` | ${r.detail}` : ""}`).join("\n");
</script>
</body>
</html>
