<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Wind GLSL compile test</title></head>
<body><pre id="out"></pre>
<script type="module">
import { applyWindToMaterial } from "../../src/systems/wind/wind-material.js";

const results = [];
const out = document.querySelector("#out");
function assert(value, message) { if (!value) throw new Error(message); }
async function test(name, fn) {
  try { await fn(); results.push({ name, pass: true, detail: "" }); }
  catch (error) { results.push({ name, pass: false, detail: String(error?.message ?? error) }); }
}

function fakeMaterial() {
  return {
    name: "Leaves",
    userData: {},
    onBeforeCompile() {},
    customProgramCacheKey() { return "base"; },
    clone() { return fakeMaterial(); },
  };
}

function compile(gl, type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  const ok = gl.getShaderParameter(shader, gl.COMPILE_STATUS);
  const log = gl.getShaderInfoLog(shader) || "";
  if (!ok) throw new Error(log || "shader compile failed");
  return shader;
}

/**
 * Both variants have to compile. Pooled plants are drawn as instances, so the
 * `USE_INSTANCING` branch reaches the driver only on that path — a syntax error
 * there would show up as invisible grass on a real device and nowhere else.
 * The fragment shader is compiled too because Nature palette grading is chained
 * onto the same shared material hook.
 */
function compileWind({ instancing }) {
  const canvas = document.createElement("canvas");
  const gl = canvas.getContext("webgl");
  assert(gl, "WebGL context unavailable");

  const material = applyWindToMaterial({
    material: fakeMaterial(),
    geometry: {
      boundingBox: null,
      computeBoundingBox() { this.boundingBox = { min: { y: 0 }, max: { y: 4 } }; },
    },
    mesh: { name: "Leaves" },
    profileName: "grass",
    uniforms: {
      time: { value: 0 },
      direction: { value: { x: 1, y: 0 } },
      strength: { value: 0.55 },
      speed: { value: 0.75 },
      gustStrength: { value: 0.3 },
      gustSpeed: { value: 0.18 },
      gustScale: { value: 0.07 },
      paletteStrength: { value: 0.28 },
    },
    quality: { isTouch: true },
    clone: true,
  });

  const shader = {
    uniforms: {},
    vertexShader: `
precision highp float;
${instancing ? "#define USE_INSTANCING" : ""}
uniform mat4 modelMatrix;
attribute vec3 position;
${instancing ? "attribute mat4 instanceMatrix;" : ""}
#include <common>
void main() {
  vec3 transformed = position;
  #include <begin_vertex>
  gl_Position = vec4(transformed, 1.0);
}`,
    fragmentShader: `
precision mediump float;
#include <common>
void main() {
  vec4 diffuseColor = vec4(0.15, 0.78, 0.18, 1.0);
  #include <color_fragment>
  gl_FragColor = diffuseColor;
}`,
  };
  material.onBeforeCompile(shader, {});

  // Three.js expands these chunks before the driver sees GLSL. This minimal
  // compile harness supplied everything the injected code needs, so remove the
  // placeholder include lines after injection.
  const vertex = shader.vertexShader
    .replaceAll("#include <common>", "")
    .replaceAll("#include <begin_vertex>", "");
  const fragment = shader.fragmentShader
    .replaceAll("#include <common>", "")
    .replaceAll("#include <color_fragment>", "");

  const vs = compile(gl, gl.VERTEX_SHADER, vertex);
  const fs = compile(gl, gl.FRAGMENT_SHADER, fragment);
  const program = gl.createProgram();
  gl.attachShader(program, vs);
  gl.attachShader(program, fs);
  gl.linkProgram(program);
  assert(gl.getProgramParameter(program, gl.LINK_STATUS), gl.getProgramInfoLog(program) || "program link failed");
  return shader;
}

await test("wind + nature palette compile as WebGL1 GLSL", () => {
  const shader = compileWind({ instancing: false });
  assert(shader.vertexShader.includes("mat4 lioraWindModel = modelMatrix;"), "non-instanced path lost its model matrix");
  assert(shader.vertexShader.includes("lioraInteractionPosition"), "foliage interaction uniforms are missing");
  assert(shader.fragmentShader.includes("lioraNaturePaletteStrength"), "palette strength uniform missing");
  assert(shader.fragmentShader.includes("lioraPaletteGreen"), "green-only palette mask missing");
});

await test("the instanced variant compiles and reads instanceMatrix", () => {
  const shader = compileWind({ instancing: true });
  assert(
    shader.vertexShader.includes("mat4 lioraWindModel = modelMatrix * instanceMatrix;"),
    "pooled plants would all share one world position, and sway in lockstep"
  );
  assert(shader.vertexShader.includes("lioraInteractionFalloff"), "instanced plants lost player interaction");
  assert(shader.fragmentShader.includes("lioraPaletteAmount"), "instanced plants lost the palette grade");
});

window.__results = results;
window.__done = true;
out.textContent = results.map((r) => `${r.pass ? "PASS" : "FAIL"} ${r.name}${r.detail ? ` | ${r.detail}` : ""}`).join("\n");
</script>
</body>
</html>
