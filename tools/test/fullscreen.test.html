<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fullscreen control tests</title>
</head>
<body><pre id="out"></pre>
<script type="module">
import {
  createFullscreenControl,
  isFullscreenActive,
  supportsFullscreen,
} from "../../src/ui/fullscreen.js";

const results = [];
const out = document.querySelector("#out");
async function test(name, fn) {
  try { await fn(); results.push({ name, pass: true, detail: "" }); }
  catch (error) { results.push({ name, pass: false, detail: String(error?.message ?? error) }); }
}
function assert(value, message) { if (!value) throw new Error(message); }

function makeButton() {
  const button = document.createElement("button");
  document.body.append(button);
  return button;
}

/** A browser with the standard API, driven by hand. */
function standardBrowser() {
  const listeners = new Map();
  const doc = {
    fullscreenElement: null,
    fullscreenEnabled: true,
    exitFullscreen() { doc.fullscreenElement = null; doc.fire("fullscreenchange"); return Promise.resolve(); },
    addEventListener(type, fn) { listeners.set(type, [...(listeners.get(type) ?? []), fn]); },
    removeEventListener(type, fn) { listeners.set(type, (listeners.get(type) ?? []).filter((f) => f !== fn)); },
    fire(type) { for (const fn of listeners.get(type) ?? []) fn(); },
  };
  const root = {
    calls: [],
    requestFullscreen(options) {
      root.calls.push(options);
      doc.fullscreenElement = root;
      doc.fire("fullscreenchange");
      return Promise.resolve();
    },
  };
  return { doc, root, win: { navigator: {}, matchMedia: () => ({ matches: false }) } };
}

await test("the standard API is used, and the toggle goes both ways", async () => {
  const { doc, root, win } = standardBrowser();
  const button = makeButton();
  const control = createFullscreenControl({ button, root, doc, win });
  assert(control.supported === true, "a browser with the API was treated as unsupported");
  assert(button.getAttribute("aria-pressed") === "false", "the button starts pressed");

  await control.toggle();
  assert(doc.fullscreenElement === root, "the game never entered fullscreen");
  assert(root.calls[0]?.navigationUI === "hide", "Android's address bar is allowed back over the joystick");
  assert(button.getAttribute("aria-pressed") === "true", "the button does not show the active state");

  await control.toggle();
  assert(doc.fullscreenElement === null, "the toggle cannot leave fullscreen");
  assert(button.getAttribute("aria-pressed") === "false", "the button stayed active after leaving");
  control.dispose();
});

await test("an old WebKit prefix still works", async () => {
  const doc = {
    webkitFullscreenElement: null,
    webkitExitFullscreen() { doc.webkitFullscreenElement = null; return Promise.resolve(); },
    addEventListener() {}, removeEventListener() {},
  };
  const root = {
    webkitRequestFullscreen() { doc.webkitFullscreenElement = root; return Promise.resolve(); },
  };
  const win = { navigator: {}, matchMedia: () => ({ matches: false }) };
  assert(supportsFullscreen(root, doc), "the prefixed API was not recognized");
  const control = createFullscreenControl({ button: makeButton(), root, doc, win });
  await control.toggle();
  assert(doc.webkitFullscreenElement === root, "the prefixed request was never called");
  await control.toggle();
  assert(doc.webkitFullscreenElement === null, "the prefixed exit was never called");
});

await test("an iPhone is told how to get there instead of tapping a dead button", async () => {
  // Safari on iPhone has no requestFullscreen on an element at all.
  const doc = { addEventListener() {}, removeEventListener() {} };
  const root = {};
  const win = { navigator: { standalone: false }, matchMedia: () => ({ matches: false }) };
  const messages = [];
  const control = createFullscreenControl({ button: makeButton(), root, doc, win, notify: (text) => messages.push(text) });
  assert(control.supported === false, "an iPhone was treated as supporting fullscreen");
  const handled = await control.toggle();
  assert(handled === false, "an unsupported toggle reported success");
  assert(messages.length === 1, "the player was told nothing");
  assert(messages[0].includes("หน้าจอโฮม"), `the message does not explain Add to Home Screen: ${messages[0]}`);
});

await test("a home-screen launch already counts as fullscreen", () => {
  const standalone = { navigator: { standalone: true }, matchMedia: () => ({ matches: false }) };
  assert(isFullscreenActive({}, standalone), "an iOS home-screen launch was not recognized");
  const installed = { navigator: {}, matchMedia: (query) => ({ matches: query.includes("standalone") }) };
  assert(isFullscreenActive({}, installed), "an installed web app was not recognized");
  assert(!isFullscreenActive({}, { navigator: {}, matchMedia: () => ({ matches: false }) }), "an ordinary tab reported fullscreen");

  const button = makeButton();
  createFullscreenControl({ button, root: {}, doc: { addEventListener() {}, removeEventListener() {} }, win: standalone });
  assert(button.disabled === true, "the toggle stays live with nothing left to hide");
});

await test("a refused request tells the player and leaves the button honest", async () => {
  const doc = { fullscreenElement: null, fullscreenEnabled: true, addEventListener() {}, removeEventListener() {} };
  const root = { requestFullscreen: () => Promise.reject(new Error("gesture required")) };
  const win = { navigator: {}, matchMedia: () => ({ matches: false }) };
  const messages = [];
  const button = makeButton();
  const control = createFullscreenControl({ button, root, doc, win, notify: (text) => messages.push(text) });
  const handled = await control.toggle();
  assert(handled === false, "a refused request reported success");
  assert(messages.length === 1, "a refused request said nothing to the player");
  assert(button.getAttribute("aria-pressed") === "false", "the button claims fullscreen after being refused");
});

await test("the HUD ships the button and the standalone tags iOS needs", async () => {
  const page = await fetch("../../index.html").then((response) => response.text());
  assert(/id="fullscreen"/.test(page), "the HUD has no fullscreen button");
  assert(/apple-mobile-web-app-capable/.test(page), "an iOS home-screen launch would still open in Safari");
  const main = await fetch("../../src/main.js").then((response) => response.text());
  assert(main.includes("createFullscreenControl"), "the button is never wired up");
  assert(main.includes("notify: toast"), "a refusal would be silent instead of reaching the toast");
});

window.__results = results;
window.__done = true;
out.textContent = results.map((result) => `${result.pass ? "PASS" : "FAIL"} ${result.name}${result.detail ? ` | ${result.detail}` : ""}`).join("\n");
</script>
</body>
</html>
