<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Player water shader test</title>
<script type="importmap">
{"imports":{"three":"./three-stub.js"}}
</script>
</head>
<body><pre id="out"></pre>
<script type="module">
import { applyPlayerWaterToMaterial } from "../../src/systems/player-water.js";

const results = [];
const out = document.querySelector("#out");
function assert(value, message) { if (!value) throw new Error(message); }
async function test(name, fn) {
  try { await fn(); results.push({ name, pass: true, detail: "" }); }
  catch (error) { results.push({ name, pass: false, detail: String(error?.message ?? error) }); }
}

function fakeMaterial() {
  return {
    userData: {},
    needsUpdate: false,
    onBeforeCompile() {},
    customProgramCacheKey() { return "player"; },
  };
}

function compile(gl, type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  const ok = gl.getShaderParameter(shader, gl.COMPILE_STATUS);
  const log = gl.getShaderInfoLog(shader) || "";
  if (!ok) throw new Error(log || "shader compile failed");
  return shader;
}

function buildShader() {
  const uniforms = {
    level: { value: -0.6 },
    depth: { value: 0.35 },
    minDepth: { value: 0.035 },
    clipInset: { value: 0.012 },
    waterlineWidth: { value: 0.085 },
    tintStrength: { value: 0.24 },
    tint: { value: { r: 0.5, g: 0.8, b: 0.9 } },
  };
  const material = applyPlayerWaterToMaterial({
    material: fakeMaterial(),
    uniforms,
  });
  const shader = {
    uniforms: {},
    vertexShader: `
precision highp float;
uniform mat4 modelMatrix;
attribute vec3 position;
#include <common>
void main() {
  vec3 transformed = position;
  #include <project_vertex>
  gl_Position = vec4(transformed, 1.0);
}`,
    fragmentShader: `
precision mediump float;
#include <common>
void main() {
  vec4 diffuseColor = vec4(0.75, 0.62, 0.50, 1.0);
  #include <color_fragment>
  gl_FragColor = diffuseColor;
}`,
  };
  material.onBeforeCompile(shader, {});
  return { material, shader, uniforms };
}

await test("player waterline uses the movement depth uniform", () => {
  const { shader, uniforms } = buildShader();
  assert(shader.uniforms.lioraWaterDepth === uniforms.depth, "water depth was copied instead of shared");
  assert(shader.uniforms.lioraWaterLevel === uniforms.level, "water level was copied instead of shared");
  assert(shader.fragmentShader.includes("discard"), "submerged geometry is not clipped");
  assert(shader.fragmentShader.includes("lioraWetBand"), "waterline tint band is missing");
});

await test("player waterline shader compiles and links as WebGL1 GLSL", () => {
  const { shader } = buildShader();
  const canvas = document.createElement("canvas");
  const gl = canvas.getContext("webgl");
  assert(gl, "WebGL context unavailable");

  const vertex = shader.vertexShader
    .replaceAll("#include <common>", "")
    .replaceAll("#include <project_vertex>", "");
  const fragment = shader.fragmentShader
    .replaceAll("#include <common>", "")
    .replaceAll("#include <color_fragment>", "");

  const vs = compile(gl, gl.VERTEX_SHADER, vertex);
  const fs = compile(gl, gl.FRAGMENT_SHADER, fragment);
  const program = gl.createProgram();
  gl.attachShader(program, vs);
  gl.attachShader(program, fs);
  gl.linkProgram(program);
  assert(gl.getProgramParameter(program, gl.LINK_STATUS), gl.getProgramInfoLog(program) || "program link failed");
});

await test("waterline keeps the player's existing material draw call", () => {
  const { material } = buildShader();
  assert(material.userData?.lioraPlayerWater === true, "material was not tagged as water-decorated");
  assert(material.customProgramCacheKey().includes("liora-player-water-v1"), "shader cache key is missing");
});

window.__results = results;
window.__done = true;
out.textContent = results.map((r) => `${r.pass ? "PASS" : "FAIL"} ${r.name}${r.detail ? ` | ${r.detail}` : ""}`).join("\n");
</script>
</body>
</html>
