<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Local store tests</title>
<script type="importmap">
{"imports":{"three":"./three-stub.js"}}
</script>
</head>
<body><pre id="out"></pre>
<script type="module">
import { createLocalStore } from "../../src/systems/local-store.js";
import { createLayoutStore } from "../../src/editor/layout-store.js";

const results = [];
const out = document.querySelector("#out");
async function test(name, fn) {
  try { await fn(); results.push({ name, pass: true, detail: "" }); }
  catch (error) { results.push({ name, pass: false, detail: String(error?.message ?? error) }); }
}
function assert(value, message) { if (!value) throw new Error(message); }

let keySeed = 0;
function freshKey() {
  keySeed += 1;
  const key = `liora.test.store.${Date.now()}.${keySeed}`;
  localStorage.removeItem(key);
  localStorage.removeItem(`${key}.backup`);
  return key;
}

await test("a readable save round-trips unchanged", () => {
  const key = freshKey();
  const store = createLocalStore({ key, version: 1 });
  assert(store.has() === false, "empty key should report nothing stored");
  assert(store.load() === null, "empty key should load as null");
  assert(store.lastIssue === null, "an empty key is not a problem worth reporting");

  assert(store.save({ version: 1, value: 42 }) === true, "save failed");
  assert(store.has() === true, "stored key not detected");
  assert(store.load().value === 42, "payload did not survive the round trip");
  assert(store.lastIssue === null, "a clean load reported an issue");
  assert(localStorage.getItem(store.backupKey) === null, "a clean load should not leave a backup");
});

/**
 * The bug this whole module exists for: a save from another schema version used
 * to be dropped, and the next autosave then overwrote it. An island's worth of
 * work disappeared with no warning.
 */
await test("a payload from another schema version is kept, not lost", () => {
  const key = freshKey();
  const older = JSON.stringify({ version: 1, precious: "an island" });
  localStorage.setItem(key, older);

  const store = createLocalStore({ key, version: 2 });
  assert(store.load() === null, "an unreadable version must not be handed back as data");
  assert(store.lastIssue?.kind === "version-mismatch", `wrong issue kind: ${store.lastIssue?.kind}`);
  assert(store.lastIssue?.backupKey === store.backupKey, "issue does not point at the backup");
  assert(localStorage.getItem(store.backupKey) === older, "the old payload was not preserved");

  // The autosave that used to destroy it now only overwrites the live key.
  store.save({ version: 2, precious: null });
  assert(localStorage.getItem(store.backupKey) === older, "autosave ate the backup");
});

await test("unparseable JSON is kept too", () => {
  const key = freshKey();
  localStorage.setItem(key, "{not json at all");
  const store = createLocalStore({ key, version: 1 });
  assert(store.load() === null, "corrupt data must not be handed back");
  assert(store.lastIssue?.kind === "unreadable", `wrong issue kind: ${store.lastIssue?.kind}`);
  assert(localStorage.getItem(store.backupKey) === "{not json at all", "corrupt data was dropped");
});

await test("a correctly versioned payload with an unusable body is kept", () => {
  const key = freshKey();
  const raw = JSON.stringify({ version: 1, strokes: "not an array" });
  localStorage.setItem(key, raw);

  const store = createLocalStore({ key, version: 1 });
  const payload = store.load();
  assert(payload !== null, "the version matched, so the payload should parse");
  // This is the caller's job: only it knows what a usable body looks like.
  assert(store.rejectLoaded("malformed") === true, "reject should report that it kept a copy");
  assert(store.lastIssue?.kind === "malformed", `wrong issue kind: ${store.lastIssue?.kind}`);
  assert(localStorage.getItem(store.backupKey) === raw, "malformed body was dropped");
});

await test("a failed write is reported rather than swallowed", () => {
  const key = freshKey();
  const store = createLocalStore({ key, version: 1 });
  const original = localStorage.setItem;
  localStorage.setItem = () => { throw new Error("QuotaExceededError"); };
  try {
    assert(store.save({ version: 1 }) === false, "a failed save must report failure");
    assert(store.lastIssue?.kind === "save-failed", `wrong issue kind: ${store.lastIssue?.kind}`);
  } finally {
    localStorage.setItem = original;
  }
});

await test("layout store keeps its schema and its issue kinds", () => {
  const key = freshKey();
  const store = createLayoutStore({ storageKey: key });

  const payload = store.save([{ id: "a", assetId: "tree", x: 1, z: 2, rotation: 0, scale: 1 }]);
  assert(payload.version === 1, "layout schema version changed");
  assert(Array.isArray(payload.items) && payload.items.length === 1, "layout items changed shape");
  assert(Number.isFinite(payload.savedAt), "savedAt disappeared from the layout schema");
  assert(store.hasSavedLayout() === true, "hasSavedLayout broke");
  assert(store.load()[0].assetId === "tree", "layout did not round-trip");

  // layout-runtime keys its warning off this exact string.
  localStorage.setItem(key, JSON.stringify({ version: 99, items: [] }));
  assert(store.load().length === 0, "a foreign version must not load as items");
  assert(store.lastIssue?.kind === "version-mismatch", "layout-runtime's warning key changed");
  assert(store.backupKey === `${key}.backup`, "backup key naming changed");

  const malformed = JSON.stringify({ version: 1, items: "nope" });
  localStorage.setItem(key, malformed);
  assert(store.load().length === 0, "a malformed body must not load as items");
  assert(localStorage.getItem(store.backupKey) === malformed, "malformed layout was dropped");

  store.clear();
  assert(store.hasSavedLayout() === false, "clear did not remove the layout");
});

window.__results = results;
window.__done = true;
out.textContent = results.map((r) => `${r.pass ? "PASS" : "FAIL"} ${r.name}${r.detail ? ` | ${r.detail}` : ""}`).join("\n");
</script>
</body>
</html>
