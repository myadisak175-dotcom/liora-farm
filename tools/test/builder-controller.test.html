<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Builder controller tests</title></head>
<body><pre id="out"></pre>
<script type="module">
import { createBuilderState } from "../../src/editor/builder-state.js";
import { createBuilderController } from "../../src/editor/builder-controller.js";

const results = [];
const out = document.querySelector("#out");
function test(name, fn) {
  try {
    const value = fn();
    const pass = value !== false;
    results.push({ name, pass, detail: pass ? "" : "returned false" });
  } catch (error) {
    results.push({ name, pass: false, detail: String(error?.message ?? error) });
  }
}
function assert(value, message) { if (!value) throw new Error(message); }

const catalog = {
  house: {
    id: "house", defaultScale: 1, minScale: 0.5, maxScale: 2,
    footprintRadius: 1, blockRadius: 1, walkRadius: 0.9,
    maxGroundSlope: 0.16, groundProbeRadius: 0.9,
  },
  path: {
    id: "path", defaultScale: 1, minScale: 0.5, maxScale: 2,
    footprintRadius: 1, blockRadius: 0, walkRadius: 0,
  },
};
function store() {
  let saved = [];
  return {
    save(items) { saved = items.map((item) => ({ ...item })); return { version: 1, items: saved }; },
    load() { return saved.map((item) => ({ ...item })); },
    get lastIssue() { return null; },
  };
}
function controller({ ground = () => 0, worldHalfSize = 5 } = {}) {
  return createBuilderController({
    state: createBuilderState(), catalog, layoutStore: store(),
    worldHalfSize, getGroundHeight: ground, saveDebounceMs: 0,
  });
}

test("flat ground accepts a house", () => {
  const c = controller();
  assert(c.validatePlacement("house", { x: 0, z: 0, scale: 1 }).ok, "flat placement rejected");
});

test("steep ground rejects a house", () => {
  const c = controller({ ground: (x) => x * 0.5 });
  const result = c.validatePlacement("house", { x: 0, z: 0, scale: 1 });
  assert(!result.ok && result.code === "slope", `expected slope, got ${result.code}`);
});

test("path duplicates cannot nearly stack", () => {
  const c = controller();
  c.addItem({ id: "p1", assetId: "path", x: 0, z: 0, rotation: 0, scale: 1 });
  const near = c.validatePlacement("path", { x: 0.6, z: 0, scale: 1 });
  const clear = c.validatePlacement("path", { x: 0.95, z: 0, scale: 1 });
  assert(!near.ok && near.code === "stacked", "near path was allowed to z-fight");
  assert(clear.ok, "reasonable path overlap was rejected");
});

test("edge resolver can slide around an obstacle", () => {
  const c = controller();
  c.addItem({ id: "h1", assetId: "house", x: 3, z: 0, rotation: 0, scale: 1 });
  const resolved = c.resolvePlacement("house", { id: "h2", assetId: "house", x: 4.6, z: 0.6, rotation: 0, scale: 1 });
  assert(resolved, "candidate stayed stuck at island edge");
  assert(Math.abs(resolved.x) <= 3.751 && Math.abs(resolved.z) <= 3.751, "resolved outside edge");
  assert(c.validatePlacement("house", resolved).ok, "resolved position is invalid");
});

test("inactive failed models do not create colliders", () => {
  const c = controller();
  c.addItem({ id: "h1", assetId: "house", x: 0, z: 0, rotation: 0, scale: 1 });
  assert(c.getColliders().length === 1, "expected collider before deactivation");
  c.setInactiveItems(["h1"]);
  assert(c.getColliders().length === 0, "inactive object still collides");
});

window.__results = results;
window.__done = true;
out.textContent = results.map((r) => `${r.pass ? "PASS" : "FAIL"} ${r.name}${r.detail ? ` | ${r.detail}` : ""}`).join("\n");
</script>
</body>
</html>
