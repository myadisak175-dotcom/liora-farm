<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>terrain height tests</title>
<script type="importmap">
{"imports":{"three":"./mountain-three-stub.js"}}
</script>
</head>
<body><pre id="out">running…</pre>
<script>
const fail=(what)=>{document.querySelector("#out").textContent="ERROR: "+what;window.__results=[{name:"bootstrap",pass:false,detail:String(what)}];window.__done=true;};
addEventListener("error",(e)=>fail((e.error&&e.error.stack)||e.message));
addEventListener("unhandledrejection",(e)=>fail("unhandled rejection: "+((e.reason&&e.reason.stack)||e.reason)));
</script>
<script type="module">
import { createTerrainHeight, SCULPT_TOOLS } from "../../src/systems/terrain-height.js";
import { createRidgeProfile, createWorldBoundary } from "../../src/systems/world-boundary.js";
import { createOuterWorldGround } from "../../src/systems/outer-world-ground.js";
import { createMountainBackdrop } from "../../src/systems/mountain-backdrop.js";
import { CONFIG } from "../../src/config.js";
const results = [];
const ok = (name, pass, detail = "") => results.push({ name, pass: Boolean(pass), detail });
const near = (a, b, eps = 1e-3) => Math.abs(a - b) <= eps;
const make = (reservedAreas = []) => createTerrainHeight({
  config: { ...CONFIG.sculpt, storageKey: `test.height.${Math.random()}` },
  worldSize: CONFIG.terrain.size,
  spacing: CONFIG.terrain.spacing,
  reservedAreas,
});

ok("Home Farm uses an open 80 m gameplay terrain",
  CONFIG.terrain.size === 80
    && CONFIG.island.size === 80
    && CONFIG.worldLimit === 38
    && CONFIG.worldBoundary.enabled === false
    && CONFIG.worldBoundary.type === "none",
  `terrain=${CONFIG.terrain.size} island=${CONFIG.island.size} limit=${CONFIG.worldLimit}`);

const flat = make();
let hit = flat.raycast({ x: 2, y: 10, z: -3 }, { x: 0, y: -1, z: 0 });
ok("vertical ray hits flat terrain", hit && near(hit.x, 2) && near(hit.y, 0) && near(hit.z, -3), JSON.stringify(hit));

const ridge = make();
const ix = Math.round((0 + CONFIG.terrain.size / 2) / CONFIG.terrain.spacing);
const iz = ix;
ridge.heights[iz * ridge.cells + ix] = 8;
const inv = 1 / Math.hypot(12, 8);
hit = ridge.raycast({ x: -8, y: 8, z: 0 }, { x: 12 * inv, y: -8 * inv, z: 0 });
ok("raycast returns the nearest narrow-ridge hit", hit && hit.x < -0.2 && hit.x > -0.45 && hit.y > 2.5,
  JSON.stringify(hit));

const blocked = make([{ x: 0, z: 0, radius: 5 }]);
blocked.beginStroke({ tool: SCULPT_TOOLS.RAISE, radius: 1.5, strength: 1, x: 0, z: 0 });
ok("tick is false when constraints prevent every change", blocked.tick(0.2) === false);
ok("no-op stroke does not create an undo step", blocked.endStroke() === false && blocked.undoDepth === 0,
  `undoDepth=${blocked.undoDepth}`);

const raised = make();
raised.beginStroke({ tool: SCULPT_TOOLS.RAISE, radius: 1.5, strength: 1, x: 0, z: 0 });
ok("tick is true when terrain actually changes", raised.tick(0.2) === true);
ok("changed stroke closes normally", raised.endStroke() === true && raised.undoDepth === 1,
  `undoDepth=${raised.undoDepth}`);

const legacy = createTerrainHeight({
  config: { ...CONFIG.sculpt, storageKey: `test.height.legacy.${Math.random()}` },
  worldSize: 56,
  spacing: CONFIG.terrain.spacing,
});
legacy.beginStroke({ tool: SCULPT_TOOLS.RAISE, radius: 2, strength: 1.2, x: 10, z: 8 });
legacy.tick(0.8);
legacy.endStroke();
const legacyHeight = legacy.sample(10, 8);
const expanded = make();
const migrated = expanded.importData(legacy.exportData(), { save: false });
ok("80 m terrain migrates a 56 m sculpt save in world coordinates",
  migrated && near(expanded.sample(10, 8), legacyHeight, 0.03),
  `old=${legacyHeight} new=${expanded.sample(10, 8)}`);
ok("newly added outer gameplay land starts flat after migration",
  Math.abs(expanded.sample(37, 0)) < 0.02,
  `height=${expanded.sample(37, 0)}`);

const openBoundaryBase = make();
const openBoundary = createWorldBoundary({
  config: CONFIG.worldBoundary,
  baseHeight: openBoundaryBase,
  worldSize: CONFIG.terrain.size,
  spacing: CONFIG.terrain.spacing,
});
ok("disabled Home Farm boundary leaves editable terrain authoritative",
  openBoundary.profile.enabled === false
    && openBoundary.height === openBoundaryBase
    && openBoundary.heightView === openBoundaryBase
    && openBoundary.createMesh() === null);

const ridgeConfig = {
  enabled: true,
  type: "ridge",
  radius: 30.5,
  feather: 4.75,
  height: 4.8,
  noiseAmplitude: 1.75,
  noiseScale: 0.055,
  noiseSeed: 91,
};
const profile = createRidgeProfile(ridgeConfig);
ok("ridge fixture leaves its centre untouched", near(profile.floor(0, 0), 0));
ok("ridge fixture reaches full height before an 80 m outer rim",
  near(profile.floor(0, CONFIG.terrain.size / 2), ridgeConfig.height, 0.02),
  `edge=${profile.floor(0, CONFIG.terrain.size / 2)}`);

const boundaryBase = make();
const boundary = createWorldBoundary({
  config: ridgeConfig,
  baseHeight: boundaryBase,
  worldSize: CONFIG.terrain.size,
  spacing: CONFIG.terrain.spacing,
});
ok("generated ridge remains neutral to the editable terrain save", boundaryBase.isFlat() && boundary.height.isFlat());
ok("composite ridge height view contains generated height", boundary.heightView.heights.some((value) => value > 4));

hit = boundary.height.raycast({ x: 38.5, y: 10, z: 0 }, { x: 0, y: -1, z: 0 });
ok("editor raycast still sees an enabled generated ridge",
  hit && hit.y > 4, JSON.stringify(hit));

const beforeDig = boundary.height.sample(34, 0);
boundary.height.beginStroke({ tool: SCULPT_TOOLS.LOWER, radius: 2.2, strength: 1.2, x: 34, z: 0 });
boundary.height.tick(1.5);
boundary.height.endStroke();
ok("sculpting cannot dig through an enabled world boundary",
  boundary.height.sample(34, 0) + 1e-3 >= profile.floor(34, 0),
  `before=${beforeDig} after=${boundary.height.sample(34, 0)} floor=${profile.floor(34, 0)}`);

let weakest = Infinity;
for (let a = 0; a < 32; a += 1) {
  const angle = a / 32 * Math.PI * 2;
  let steepest = 0;
  for (let d = ridgeConfig.radius - ridgeConfig.noiseAmplitude; d < 38.5; d += 0.25) {
    steepest = Math.max(steepest, boundary.height.slopeAt(Math.cos(angle) * d, Math.sin(angle) * d));
  }
  weakest = Math.min(weakest, steepest);
}
ok("ridge fixture exceeds maxWalkSlope in every sampled direction", weakest > CONFIG.maxWalkSlope,
  `weakest=${weakest.toFixed(2)} max=${CONFIG.maxWalkSlope}`);

const payload = boundary.height.exportData();
const restoredBase = make();
restoredBase.importData(payload, { save: false });
const lowerConfig = { ...ridgeConfig, height: 2.8 };
const retuned = createWorldBoundary({
  config: lowerConfig,
  baseHeight: restoredBase,
  worldSize: CONFIG.terrain.size,
  spacing: CONFIG.terrain.spacing,
});
ok("generated ridge can still be retuned lower after save/load",
  near(retuned.height.sample(0, 39.5), 2.8, 0.06),
  `edge=${retuned.height.sample(0, 39.5)}`);

const outerInnerY = CONFIG.outerWorld.innerYOffset;
const outerWorld = createOuterWorldGround({
  config: { ...CONFIG.outerWorld, innerY: outerInnerY },
  textureWorldSize: CONFIG.terrain.size,
});
ok("outer world is exactly one visual mesh",
  outerWorld.stats.meshes === 1 && outerWorld.group.children.length === 1,
  JSON.stringify(outerWorld.stats));
ok("outer world stays out of the shadow pass",
  outerWorld.mesh.castShadow === false && outerWorld.mesh.receiveShadow === false);
ok("outer world reaches far beyond the 80 m gameplay terrain",
  CONFIG.outerWorld.outerRadius >= CONFIG.terrain.size / 2 + 35,
  `outer=${CONFIG.outerWorld.outerRadius} playableHalf=${CONFIG.terrain.size / 2}`);
ok("outer world keeps a small geometry budget",
  outerWorld.stats.triangles === CONFIG.outerWorld.segments * CONFIG.outerWorld.rings * 2 && outerWorld.stats.triangles <= 4200,
  `triangles=${outerWorld.stats.triangles}`);
const outerPosition = outerWorld.mesh.geometry.getAttribute("position");
const outerColor = outerWorld.mesh.geometry.getAttribute("color");
const outerUv = outerWorld.mesh.geometry.getAttribute("uv");
ok("outer world position/color/uv counts stay aligned",
  outerPosition.count === outerColor.count && outerPosition.count === outerUv.count);
ok("outer world seam begins just under the open gameplay terrain",
  near(outerPosition.array[1], outerInnerY, 1e-5),
  `firstY=${outerPosition.array[1]} expected=${outerInnerY}`);
const last = outerPosition.array.length - 3;
const lastRadius = Math.hypot(outerPosition.array[last], outerPosition.array[last + 2]);
ok("outer world outer ring reaches configured radius and height",
  near(lastRadius, CONFIG.outerWorld.outerRadius, 0.01) && near(outerPosition.array[last + 1], CONFIG.outerWorld.outerY, 0.01),
  `radius=${lastRadius} y=${outerPosition.array[last + 1]}`);
outerWorld.dispose();
ok("outer world disposes geometry and material",
  outerWorld.mesh.geometry.disposed && outerWorld.mesh.material.disposed);
const disabledOuter = createOuterWorldGround({ config: { enabled: false } });
ok("outer world can be disabled without gameplay side effects",
  disabledOuter.group.children.length === 0 && disabledOuter.stats.meshes === 0);

const backdrop = createMountainBackdrop(CONFIG.mountainBackdrop);
ok("layered horizon builds one merged mesh per ridge band",
  backdrop.stats.meshes === 2 && backdrop.group.children.length === 2,
  JSON.stringify(backdrop.stats));
ok("both ridge bands carry chunks",
  CONFIG.mountainBackdrop.near.chunks.length > 0 && CONFIG.mountainBackdrop.far.chunks.length > 0);
ok("distant mountains stay out of the shadow pass",
  backdrop.meshes.every((mesh) => mesh.castShadow === false && mesh.receiveShadow === false));
ok("distant mountains keep position and vertex-color counts aligned",
  backdrop.meshes.every((mesh) =>
    mesh.geometry.getAttribute("position").count === mesh.geometry.getAttribute("color").count
  ));
ok("layered mountain backdrop remains a tiny geometry budget",
  backdrop.stats.triangles > 0 && backdrop.stats.triangles <= 1400,
  `triangles=${backdrop.stats.triangles}`);
const farPositions = backdrop.meshes[0].geometry.getAttribute("position").array;
let minFarY = Infinity;
let maxFarY = -Infinity;
for (let i = 1; i < farPositions.length; i += 3) {
  minFarY = Math.min(minFarY, farPositions[i]);
  maxFarY = Math.max(maxFarY, farPositions[i]);
}
ok("far scenic mountains bury their base and clear the foothills",
  minFarY <= CONFIG.mountainBackdrop.far.baseY
    && maxFarY >= Math.max(...CONFIG.mountainBackdrop.near.chunks.map((chunk) => chunk.height)),
  `minY=${minFarY} maxY=${maxFarY}`);
backdrop.dispose();
ok("mountain backdrop disposes geometry and materials",
  backdrop.meshes.every((mesh) => mesh.geometry.disposed && mesh.material.disposed));
const disabledBackdrop = createMountainBackdrop({ enabled: false });
ok("mountain backdrop can be disabled without gameplay side effects",
  disabledBackdrop.group.children.length === 0 && disabledBackdrop.stats.meshes === 0);

openBoundary.dispose();
boundary.dispose();
retuned.dispose();
legacy.dispose();
expanded.dispose();
window.__results = results;
window.__done = true;
document.querySelector("#out").textContent = JSON.stringify(results, null, 1);
</script></body></html>
