<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Liora — Soft Splat Ground Test</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#bfe5f3;touch-action:none;font-family:system-ui,sans-serif}
canvas{display:block}
#title{position:fixed;left:12px;top:12px;z-index:10;color:#fff;font-weight:900;text-shadow:0 2px 6px #234;font-size:18px}
#sub{font-size:12px;font-weight:700;margin-top:4px}
#panel{position:fixed;left:10px;right:10px;bottom:14px;z-index:20;display:flex;gap:7px;align-items:center;overflow-x:auto;padding:9px;background:rgba(25,48,57,.88);backdrop-filter:blur(9px);border:1px solid rgba(255,255,255,.28);border-radius:18px;box-shadow:0 8px 25px rgba(0,0,0,.25)}
button{flex:0 0 auto;height:43px;border:1px solid rgba(255,255,255,.38);border-radius:12px;background:rgba(66,96,105,.95);color:#fff;padding:0 12px;font-weight:850;font-size:13px}
button.active{outline:3px solid rgba(255,255,255,.85);background:rgba(74,132,107,.98)}
label{flex:0 0 auto;color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px}
input{width:90px}
#status{position:fixed;right:12px;top:12px;z-index:10;background:rgba(25,48,57,.78);color:#fff;border-radius:13px;padding:8px 10px;font-size:12px;font-weight:800}
#hint{position:fixed;left:50%;top:64px;transform:translateX(-50%);z-index:10;background:rgba(25,48,57,.72);color:#fff;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:800;white-space:nowrap}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script>
</head>
<body>
<div id="title">Soft Splat Ground Test<div id="sub">แยกจาก Builder หลัก 100% • ทดสอบเฉพาะขอบฟุ้ง</div></div>
<div id="status">0 strokes</div>
<div id="hint">เลือก ดิน แล้วลากนิ้วบนพื้น</div>
<div id="panel">
  <button data-layer="4">🌿 หญ้า</button>
  <button data-layer="0" class="active">🟫 ดิน</button>
  <button data-layer="1">🏖️ ทราย</button>
  <button data-layer="2">🪨 หิน</button>
  <button data-layer="3">⌫ ลบ</button>
  <label>ขนาด <input id="size" type="range" min="0.7" max="5" step="0.1" value="2.2"></label>
  <button id="undo">↶ Undo</button>
  <button id="clear">Clear</button>
</div>
<script type="module">
import * as THREE from 'three';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xdff4ff);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,100);
camera.position.set(9,12,12);
camera.lookAt(0,0,0);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.body.prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xfff6dd,0x53694a,2.1));
const sun=new THREE.DirectionalLight(0xffedc4,2.2);
sun.position.set(-8,14,8);scene.add(sun);

const loader=new THREE.TextureLoader();
function prep(url){
  const t=loader.load(url);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.colorSpace=THREE.SRGBColorSpace;
  t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
  return t;
}
const grass=prep('../assets/textures/grass.webp');
const dirt=prep('../assets/textures/dirt.webp');
const sand=prep('../assets/textures/sand.webp');
const rock=prep('../assets/textures/rock.webp');

const WORLD=42;
const RES=768;
const splatCanvas=document.createElement('canvas');
splatCanvas.width=splatCanvas.height=RES;
const ctx=splatCanvas.getContext('2d',{willReadFrequently:true});
ctx.fillStyle='#000';ctx.fillRect(0,0,RES,RES);
const splatTex=new THREE.CanvasTexture(splatCanvas);
splatTex.colorSpace=THREE.NoColorSpace;
splatTex.generateMipmaps=false;
splatTex.minFilter=THREE.LinearFilter;
splatTex.magFilter=THREE.LinearFilter;
splatTex.wrapS=splatTex.wrapT=THREE.ClampToEdgeWrapping;

const mat=new THREE.MeshStandardMaterial({map:grass,roughness:1,metalness:0});
mat.onBeforeCompile=shader=>{
  shader.uniforms.uSplat={value:splatTex};
  shader.uniforms.uGrass={value:grass};
  shader.uniforms.uDirt={value:dirt};
  shader.uniforms.uSand={value:sand};
  shader.uniforms.uRock={value:rock};
  shader.fragmentShader=shader.fragmentShader
    .replace('#include <common>',`#include <common>\nuniform sampler2D uSplat;\nuniform sampler2D uGrass;\nuniform sampler2D uDirt;\nuniform sampler2D uSand;\nuniform sampler2D uRock;`)
    .replace('#include <map_fragment>',`
vec2 uv0=vMapUv;
vec2 tiled=uv0*12.0;
vec3 s=texture2D(uSplat,uv0).rgb;
float wd=s.r;
float ws=s.g;
float wr=s.b;
float wg=1.0-clamp(wd+ws+wr,0.0,1.0);
vec3 g=texture2D(uGrass,tiled).rgb*wg+
       texture2D(uDirt,tiled).rgb*wd+
       texture2D(uSand,tiled).rgb*ws+
       texture2D(uRock,tiled).rgb*wr;
g/=max(wg+wd+ws+wr,0.001);
diffuseColor*=vec4(g,1.0);
`);
};
mat.customProgramCacheKey=()=> 'liora-soft-splat-standalone-v2';

const ground=new THREE.Mesh(new THREE.PlaneGeometry(WORLD,WORLD,1,1),mat);
ground.rotation.x=-Math.PI/2;
scene.add(ground);

// faint gridless variation marker around the center so it is easy to see where paint lands
const centerRing=new THREE.Mesh(
  new THREE.RingGeometry(2.9,3.0,96),
  new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.12,side:THREE.DoubleSide,depthWrite:false})
);
centerRing.rotation.x=-Math.PI/2;centerRing.position.y=.01;scene.add(centerRing);

const LAYER={DIRT:0,SAND:1,ROCK:2,ERASE:3,GRASS:4};
const INK={0:'255,0,0',1:'0,255,0',2:'0,0,255'};
const strokes=[];
let layer=LAYER.DIRT;
let radius=2.2;
const strength=.9;
const half=WORLD/2;
const ppu=RES/WORLD;

function rgb(s){return s.split(',').map(Number)}
function mix(a,b,t){const A=rgb(a),B=rgb(b);return A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')}
function grad(cx,cy,r,inner,outer){
  const g=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
  // This is the old long-feather falloff: tiny solid core + very long soft transition.
  g.addColorStop(0,`rgb(${inner})`);
  g.addColorStop(.20,`rgb(${inner})`);
  g.addColorStop(.42,`rgb(${mix(inner,outer,.18)})`);
  g.addColorStop(.62,`rgb(${mix(inner,outer,.42)})`);
  g.addColorStop(.78,`rgb(${mix(inner,outer,.68)})`);
  g.addColorStop(.90,`rgb(${mix(inner,outer,.86)})`);
  g.addColorStop(.97,`rgb(${mix(inner,outer,.96)})`);
  g.addColorStop(1,`rgb(${outer})`);
  return g;
}
function stamp(cx,cy,r,g,mode,alpha){
  ctx.save();ctx.globalCompositeOperation=mode;ctx.globalAlpha=alpha;ctx.fillStyle=g;
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();ctx.restore();
}
function draw(x,z,r,l,a){
  const cx=(x+half)*ppu;
  const cy=(z+half)*ppu;
  const rr=Math.max(1,r*ppu);
  if(l===LAYER.ERASE||l===LAYER.GRASS){
    stamp(cx,cy,rr,grad(cx,cy,rr,'0,0,0','255,255,255'),'multiply',a);
    return;
  }
  const ink=INK[l];if(!ink)return;
  stamp(cx,cy,rr,grad(cx,cy,rr,ink,'255,255,255'),'multiply',a);
  stamp(cx,cy,rr,grad(cx,cy,rr,ink,'0,0,0'),'lighter',a);
}
function commit(){splatTex.needsUpdate=true;document.querySelector('#status').textContent=`${strokes.length} strokes`}
function clearCanvas(){ctx.save();ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.fillStyle='#000';ctx.fillRect(0,0,RES,RES);ctx.restore()}
function replay(){clearCanvas();for(const s of strokes)draw(...s);commit()}
function paint(x,z){const s=[+x.toFixed(2),+z.toFixed(2),+radius.toFixed(2),layer,strength];strokes.push(s);draw(...s);commit()}

const ray=new THREE.Raycaster();
const ndc=new THREE.Vector2();
let active=null,last=null;
function point(e){
  const r=renderer.domElement.getBoundingClientRect();
  ndc.x=((e.clientX-r.left)/r.width)*2-1;
  ndc.y=-((e.clientY-r.top)/r.height)*2+1;
  ray.setFromCamera(ndc,camera);
  return ray.intersectObject(ground,false)[0]?.point||null;
}
function apply(e,first=false){
  const p=point(e);if(!p)return;
  if(!first&&last&&Math.hypot(p.x-last.x,p.z-last.z)<radius*.16)return;
  paint(p.x,p.z);last={x:p.x,z:p.z};
}
renderer.domElement.addEventListener('pointerdown',e=>{active=e.pointerId;renderer.domElement.setPointerCapture?.(active);e.preventDefault();apply(e,true)},{passive:false});
renderer.domElement.addEventListener('pointermove',e=>{if(e.pointerId!==active)return;e.preventDefault();apply(e,false)},{passive:false});
function end(e){if(e.pointerId===active){active=null;last=null}}
renderer.domElement.addEventListener('pointerup',end);
renderer.domElement.addEventListener('pointercancel',end);

const buttons=[...document.querySelectorAll('[data-layer]')];
function refresh(){for(const b of buttons)b.classList.toggle('active',Number(b.dataset.layer)===layer)}
for(const b of buttons)b.onclick=()=>{layer=Number(b.dataset.layer);refresh()};
document.querySelector('#size').oninput=e=>radius=Number(e.target.value);
document.querySelector('#undo').onclick=()=>{if(strokes.length){strokes.pop();replay()}};
document.querySelector('#clear').onclick=()=>{strokes.length=0;replay()};

function animate(){requestAnimationFrame(animate);renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
