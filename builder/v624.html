#boot>div{background:#173c4bcc;padding:16px 20px;border-radius:18px;max-width:84vw}

<body>
<div id="boot"><div id="boot-box">กำลังโหลด Builder v6.24…<small>Live Collision • Sit • Vault • Gameplay markers</small></div></div>
<script>
(async()=>{
  const BASE="./index.html?v=623";
  const bootBox=()=>document.querySelector("#boot-box");
  const fail=(message)=>{
    console.error(message);
    const el=bootBox();
    if(el)el.innerHTML=`เปิด Builder v6.24 ไม่สำเร็จ<small>${String(message)}</small><button onclick="location.reload()" style="margin-top:10px;padding:8px 12px">ลองใหม่</button>`;
  };

  try{
    const r=await fetch(BASE,{cache:"no-store"});
    if(!r.ok)throw new Error(`Builder v6.23 HTTP ${r.status}`);
    let source=await r.text();

    const anchor='    patches[0]=["Liora — Home Island Builder v6.16 Night Lamps","Liora — Home Island Builder v6.23 Ground Paint 4"];';
    if(!source.includes(anchor))throw new Error("v6.23 gameplay injection anchor missing");

    const gameplayCode=`
// ---------------- Gameplay Collision + Interaction v1 ----------------
const GAMEPLAY_ASSET_PROFILES=Object.freeze({
  tree:{colliders:[
    {type:"circle",x:-.42,z:.02,radius:.34,height:1.5},
    {type:"circle",x:.42,z:-.02,radius:.34,height:1.5}
  ]},
  palm:{colliders:[{type:"circle",x:0,z:0,radius:.38,height:1.5}]},
  pine:{colliders:[{type:"circle",x:0,z:0,radius:.40,height:1.6}]},
  crate:{colliders:[{type:"box",x:0,z:0,width:.82,depth:.82,height:1.0}]},
  wine_barrel:{colliders:[{type:"circle",x:0,z:0,radius:.42,height:1.15}]},
  crate_set:{colliders:[
    {type:"box",x:-.55,z:.02,width:.82,depth:.78,height:1.05},
    {type:"box",x:.42,z:-.18,width:.82,depth:.78,height:1.05},
    {type:"box",x:.18,z:.48,width:.72,depth:.66,height:.78}
  ]},
  bench:{
    colliders:[{type:"box",x:0,z:0,width:1.7,depth:.62,height:.9}],
    interactions:[
      {type:"sit",id:"seat_left",x:-.42,y:.52,z:-.02,facing:180},
      {type:"sit",id:"seat_right",x:.42,y:.52,z:-.02,facing:180}
    ]
  },
  wood_fence:{
    colliders:[{type:"box",x:0,z:0,width:1.7,depth:.22,height:.78}],
    interactions:[{type:"vault",id:"fence_vault",x:0,y:.15,z:0,axis:"z",distance:1.05,maxHeight:.9}]
  },
  path_lamp:{colliders:[{type:"circle",x:0,z:0,radius:.24,height:1.1}]}
});

const gameplayDebugState={enabled:false,roots:new Map()};
const cloneGameplayProfile=profile=>profile?JSON.parse(JSON.stringify(profile)):null;
const PLAYER_COLLISION_RADIUS=.28;
const _gameplayLocalPoint=new THREE.Vector3();
const _gameplayWorldPoint=new THREE.Vector3();

function attachGameplayProfile(holder){
  if(!holder||holder.userData?.gameplayProfile)return holder;
  const profile=GAMEPLAY_ASSET_PROFILES[holder.userData?.assetId];
  if(profile)holder.userData.gameplayProfile=cloneGameplayProfile(profile);
  return holder;
}

function resolvePlayerGameplayCollisions(target=player){
  if(!target||typeof builderState==="undefined"||!Array.isArray(builderState.placed))return false;
  let collided=false;

  // A few lightweight passes are enough for corners and grouped assets.
  for(let pass=0;pass<3;pass++){
    let movedThisPass=false;
    for(const holder of builderState.placed){
      if(!holder?.parent)continue;
      attachGameplayProfile(holder);
      const profile=holder.userData?.gameplayProfile;
      if(!profile?.colliders?.length)continue;

      holder.updateWorldMatrix(true,false);
      const uniformScale=Math.max(.0001,Math.abs(holder.scale.x)||1);
      const playerRadiusLocal=PLAYER_COLLISION_RADIUS/uniformScale;

      _gameplayWorldPoint.set(target.position.x,target.position.y,target.position.z);
      _gameplayLocalPoint.copy(_gameplayWorldPoint);
      holder.worldToLocal(_gameplayLocalPoint);

      for(const c of profile.colliders){
        let pushed=false;

        if(c.type==="circle"){
          const cx=c.x||0,cz=c.z||0;
          const minR=(c.radius||.5)+playerRadiusLocal;
          let dx=_gameplayLocalPoint.x-cx;
          let dz=_gameplayLocalPoint.z-cz;
          let d=Math.hypot(dx,dz);
          if(d<minR){
            if(d<.0001){dx=1;dz=0;d=1;}
            const k=minR/d;
            _gameplayLocalPoint.x=cx+dx*k;
            _gameplayLocalPoint.z=cz+dz*k;
            pushed=true;
          }
        }else if(c.type==="box"){
          const cx=c.x||0,cz=c.z||0;
          const hx=(c.width||1)*.5+playerRadiusLocal;
          const hz=(c.depth||1)*.5+playerRadiusLocal;
          const lx=_gameplayLocalPoint.x-cx;
          const lz=_gameplayLocalPoint.z-cz;
          if(Math.abs(lx)<hx&&Math.abs(lz)<hz){
            const penX=hx-Math.abs(lx);
            const penZ=hz-Math.abs(lz);
            if(penX<penZ){
              _gameplayLocalPoint.x=cx+(lx<0?-hx:hx);
            }else{
              _gameplayLocalPoint.z=cz+(lz<0?-hz:hz);
            }
            pushed=true;
          }
        }

        if(pushed){
          _gameplayWorldPoint.copy(_gameplayLocalPoint);
          holder.localToWorld(_gameplayWorldPoint);
          target.position.x=_gameplayWorldPoint.x;
          target.position.z=_gameplayWorldPoint.z;
          collided=true;
          movedThisPass=true;

          // Recalculate local position after every push so multi-collider sets work correctly.
          _gameplayWorldPoint.set(target.position.x,target.position.y,target.position.z);
          _gameplayLocalPoint.copy(_gameplayWorldPoint);
          holder.worldToLocal(_gameplayLocalPoint);
        }
      }
    }
    if(!movedThisPass)break;
  }
  return collided;
}
window.resolveLioraBuilderCollisions=resolvePlayerGameplayCollisions;

function makeGameplayDebugRoot(holder){
  const profile=holder?.userData?.gameplayProfile;
  if(!profile)return null;
  const root=new THREE.Group();
  root.matrixAutoUpdate=false;
  root.renderOrder=999;

  const colliderMat=new THREE.MeshBasicMaterial({color:0xff5a5a,wireframe:true,transparent:true,opacity:.95,depthTest:false});
  const sitMat=new THREE.MeshBasicMaterial({color:0x4cff87,transparent:true,opacity:.95,depthTest:false});
  const vaultMat=new THREE.MeshBasicMaterial({color:0x52c8ff,transparent:true,opacity:.95,depthTest:false});

  for(const c of profile.colliders||[]){
    let mesh=null;
    const h=Math.max(.08,c.height||1);
    if(c.type==="circle")mesh=new THREE.Mesh(new THREE.CylinderGeometry(c.radius||.5,c.radius||.5,h,20,1,true),colliderMat);
    else mesh=new THREE.Mesh(new THREE.BoxGeometry(c.width||1,h,c.depth||1),colliderMat);
    mesh.position.set(c.x||0,h*.5,c.z||0);
    mesh.renderOrder=999;
    root.add(mesh);
  }

  for(const i of profile.interactions||[]){
    const mat=i.type==="vault"?vaultMat:sitMat;
    const marker=new THREE.Mesh(new THREE.SphereGeometry(.11,12,8),mat);
    marker.position.set(i.x||0,i.y||.12,i.z||0);
    marker.renderOrder=1000;
    root.add(marker);
    if(i.type==="vault"){
      const bar=new THREE.Mesh(new THREE.BoxGeometry(.14,.06,Math.max(.8,i.distance||1)),mat);
      bar.position.copy(marker.position);
      bar.position.y+=.12;
      root.add(bar);
    }
  }
  scene.add(root);
  gameplayDebugState.roots.set(holder,root);
  return root;
}

function removeGameplayDebugRoot(holder){
  const root=gameplayDebugState.roots.get(holder);
  if(!root)return;
  scene.remove(root);
  root.traverse(o=>{o.geometry?.dispose?.();});
  gameplayDebugState.roots.delete(holder);
}

function refreshGameplayDebug(){
  for(const [holder] of gameplayDebugState.roots){if(!holder?.parent)removeGameplayDebugRoot(holder);}
  for(const holder of builderState.placed){
    attachGameplayProfile(holder);
    const has=!!holder.userData?.gameplayProfile;
    if(gameplayDebugState.enabled&&has&&!gameplayDebugState.roots.has(holder))makeGameplayDebugRoot(holder);
    if((!gameplayDebugState.enabled||!has)&&gameplayDebugState.roots.has(holder))removeGameplayDebugRoot(holder);
  }
  const btn=document.querySelector("#builder-gameplay-toggle");
  btn?.classList.toggle("active",gameplayDebugState.enabled);
  if(btn)btn.textContent=gameplayDebugState.enabled?"◉ Collision":"◎ Collision";
}

function updateGameplayDebugTransforms(){
  if(!gameplayDebugState.enabled)return;
  for(const [holder,root] of gameplayDebugState.roots){
    if(!holder?.parent)continue;
    holder.updateWorldMatrix(true,false);
    root.matrix.copy(holder.matrixWorld);
  }
}

function getLioraBuilderGameplayData(){
  return builderState.placed.map((holder,index)=>({
    id:index,
    assetId:holder.userData?.assetId||"unknown",
    position:{x:holder.position.x,y:holder.position.y,z:holder.position.z},
    rotationY:holder.rotation.y,
    scale:{x:holder.scale.x,y:holder.scale.y,z:holder.scale.z},
    gameplay:cloneGameplayProfile(holder.userData?.gameplayProfile)
  })).filter(item=>item.gameplay);
}
window.LioraGameplayProfiles=GAMEPLAY_ASSET_PROFILES;
window.getLioraBuilderGameplayData=getLioraBuilderGameplayData;

const _buildObjectGameplayBase=buildObject;
buildObject=function(...args){
  const holder=_buildObjectGameplayBase(...args);
  if(holder)attachGameplayProfile(holder);
  queueMicrotask(refreshGameplayDebug);
  return holder;
};

queueMicrotask(()=>{
  for(const holder of builderState.placed)attachGameplayProfile(holder);
  document.querySelector("#builder-gameplay-toggle")?.addEventListener("click",()=>{
    gameplayDebugState.enabled=!gameplayDebugState.enabled;
    refreshGameplayDebug();
    setBuilderMessage(gameplayDebugState.enabled
      ?"Collision View • แดง=พื้นที่ชน • เขียว=จุดนั่ง • ฟ้า=จุดกระโดดข้าม"
      :"Collision View ปิดแล้ว");
  });
  refreshGameplayDebug();
});

// ---------------- Home Island Builder v2 ----------------`;

    const injected=`    patches.push([\n      \"// ---------------- Home Island Builder v2 ----------------\",\n      ${JSON.stringify(gameplayCode)}\n    ]);\n\n    patches.push([\n      '<button class=\"builder-btn\" id=\"builder-undo\">↶ Undo</button>',\n      '<button class=\"builder-btn\" id=\"builder-gameplay-toggle\">◎ Collision</button>\\n      <button class=\"builder-btn\" id=\"builder-undo\">↶ Undo</button>'\n    ]);\n\n    patches.push([\n      '    player.position.x+=moveDir.x*speed*dt;\\n    player.position.z+=moveDir.z*speed*dt;',\n      '    player.position.x+=moveDir.x*speed*dt;\\n    player.position.z+=moveDir.z*speed*dt;\\n    resolvePlayerGameplayCollisions(player);'\n    ]);\n\n    patches.push([\n      '  updateBuilderNightLights();\\n  renderer.render(scene,camera);',\n      '  updateBuilderNightLights();\\n  updateGameplayDebugTransforms();\\n  renderer.render(scene,camera);'\n    ]);\n\n    patches[0]=[\"Liora — Home Island Builder v6.16 Night Lamps\",\"Liora — Home Island Builder v6.24 Live Collision\"];\n    patches[1]=[\"Builder v6.16 • automatic night lamps • Persistent models • MapSafe\",\"Builder v6.24 • LIVE Collision • Sit • Vault • Ground Paint • MapSafe\"];`;

    source=source.replace(anchor,injected);
    source=source.replace("กำลังโหลด Builder Paint v6.23…","กำลังโหลด Builder v6.24…");
    document.open();
    document.write(source);
    document.close();
  }catch(err){fail(err?.message||err);}
})();
</script>
