canvas{display:block}
#info{position:fixed;left:12px;top:12px;color:#fff;text-shadow:0 2px 5px #234;font-weight:800;z-index:5}
#sub{font-size:12px;font-weight:500;margin-top:3px}
#status{position:fixed;right:12px;top:12px;background:#173c4bbb;color:#fff;padding:8px 10px;border-radius:12px;font-size:12px;z-index:5}
#joy{position:fixed;left:20px;bottom:26px;width:126px;height:126px;border-radius:50%;background:#ffffff35;border:2px solid #ffffff66;z-index:5}
#stick{position:absolute;left:39px;top:39px;width:48px;height:48px;border-radius:50%;background:#ffffffb5}
#zoom{position:fixed;right:18px;bottom:28px;display:flex;flex-direction:column;gap:9px;z-index:5}
#zoom button{width:50px;height:50px;border-radius:50%;border:2px solid #ffffff88;background:#173c4bbb;color:white;font-size:26px;font-weight:700}
#actions{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;display:flex;gap:7px;max-width:58vw;overflow-x:auto;padding:4px;z-index:6}
#actions button{border:1px solid #ffffff88;background:#173c4bd9;color:#fff;padding:9px 11px;border-radius:14px;white-space:nowrap;font-size:12px;font-weight:700}
#actions button.active{outline:2px solid #fff}

  /* Home Island Builder */
  #builder-toggle{
    position:fixed;top:78px;right:18px;z-index:40;
    border:1px solid rgba(255,255,255,.55);
    background:rgba(35,71,84,.9);color:white;
    border-radius:18px;padding:10px 14px;font-weight:700;
    box-shadow:0 6px 18px rgba(0,0,0,.2);
  }
  #builder-panel{
    position:fixed;left:0;right:0;bottom:0;z-index:45;
    display:none;gap:8px;align-items:center;
    padding:10px 10px calc(10px + env(safe-area-inset-bottom));
    background:rgba(28,45,51,.88);
    backdrop-filter:blur(8px);
    overflow-x:auto;
  }
  body.builder-on #builder-panel{display:flex}
  body.builder-on #joystick{opacity:1;pointer-events:auto}
  body.builder-on [data-action]{opacity:.22;pointer-events:none}
  .builder-btn,.asset-btn{
    flex:0 0 auto;border:1px solid rgba(255,255,255,.45);
    background:rgba(50,88,101,.92);color:#fff;
    border-radius:14px;padding:10px 12px;font-weight:700;
  }
  .asset-btn.active,.builder-btn.active{outline:3px solid rgba(255,255,255,.7)}
  #builder-status{
    position:fixed;left:50%;bottom:82px;transform:translateX(-50%);
    z-index:46;display:none;max-width:80vw;
    background:rgba(25,45,52,.85);color:white;padding:8px 12px;border-radius:14px;
    font-size:14px;text-align:center;
  }
  body.builder-on #builder-status{display:block}


  /* Home Island Builder v2 */
  #builder-panel{
    gap:10px;
    padding:10px 10px calc(12px + env(safe-area-inset-bottom));
  }
  #asset-strip{
    display:flex;gap:8px;overflow-x:auto;flex:1 0 100%;
    padding-bottom:2px;scroll-snap-type:x proximity;
  }
  .asset-card{
    min-width:82px;height:70px;scroll-snap-align:start;
    border:1px solid rgba(255,255,255,.35);
    border-radius:14px;background:rgba(45,76,86,.92);
    color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:4px;font-weight:700;
  }
  .asset-card .thumb{
    width:44px;height:38px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.08);font-size:25px;
  }
  .asset-card.active{outline:3px solid rgba(132,255,172,.9)}
  #builder-tools{
    display:flex;gap:8px;overflow-x:auto;flex:1 0 100%;
  }
  #builder-confirm{
    background:rgba(62,139,84,.95);
  }
  #builder-cancel{
    background:rgba(121,64,64,.92);
  }
  #builder-ghost-label{
    position:fixed;left:50%;top:112px;transform:translateX(-50%);
    z-index:47;display:none;
    background:rgba(20,40,47,.78);color:#fff;
    border:1px solid rgba(255,255,255,.3);
    border-radius:999px;padding:6px 10px;font-size:12px;
  }
  body.builder-on #builder-ghost-label{display:block}


  /* v2.1 mobile ergonomics: leave the lower-left thumb zone free for walking. */
  body.builder-on #builder-panel{
    left:148px;
    right:8px;
    bottom:10px;
    width:auto;
    max-height:205px;
    border-radius:18px;
    border:1px solid rgba(255,255,255,.2);
    box-shadow:0 8px 28px rgba(0,0,0,.28);
    flex-direction:column;
    align-items:stretch;
    overflow:hidden;
  }
  body.builder-on #asset-strip,
  body.builder-on #builder-tools{
    flex:0 0 auto;
    width:100%;
    overflow-x:auto;
    overflow-y:hidden;
    -webkit-overflow-scrolling:touch;
  }
  @media (max-width:520px){
    body.builder-on #builder-panel{left:132px}
    .asset-card{min-width:72px}
    .builder-btn{padding:9px 10px}
  }


  /* Builder v2.2: compact mobile control tray */
  body.builder-on #builder-panel{
    left:168px;
    right:10px;
    bottom:14px;
    max-height:none;
    padding:8px;
    gap:6px;
    border-radius:20px;
    background:rgba(24,44,52,.88);
    backdrop-filter:blur(10px);
    overflow:hidden;
  }

  body.builder-on #asset-strip{
    height:62px;
    gap:6px;
    padding:0;
    overflow-x:auto;
    scrollbar-width:none;
  }
  body.builder-on #asset-strip::-webkit-scrollbar{display:none}

  .asset-card{
    min-width:66px;
    height:58px;
    padding:4px 6px;
    border-radius:12px;
    gap:2px;
    font-size:12px;
  }
  .asset-card .thumb{
    width:36px;
    height:32px;
    font-size:21px;
    border-radius:8px;
  }

  body.builder-on #builder-tools{
    height:52px;
    gap:6px;
    padding:0;
    overflow-x:auto;
    scrollbar-width:none;
  }
  body.builder-on #builder-tools::-webkit-scrollbar{display:none}

  .builder-btn{
    min-width:68px;
    height:46px;
    padding:6px 9px;
    border-radius:12px;
    font-size:13px;
    white-space:nowrap;
  }

  #builder-status{
    left:auto;
    right:18px;
    bottom:142px;
    transform:none;
    max-width:240px;
    font-size:12px;
    padding:6px 10px;
    border-radius:12px;
    pointer-events:none;
  }

  #builder-ghost-label{
    top:auto;
    left:auto;
    right:18px;
    bottom:182px;
    transform:none;
    font-size:11px;
    padding:5px 9px;
    pointer-events:none;
  }

  #builder-toggle{
    top:82px;
    right:18px;
    padding:9px 14px;
    border-radius:16px;
  }

  @media (max-width:430px){
    body.builder-on #builder-panel{
      left:154px;
      right:8px;
      bottom:10px;
    }
    .asset-card{min-width:62px}
    .builder-btn{min-width:64px}
    #builder-status{right:12px;bottom:136px;max-width:210px}
    #builder-ghost-label{right:12px;bottom:174px}
  }


  /* Builder v2.3: draggable control tray */
  #builder-drag-handle{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    height:30px;
    flex:0 0 30px;
    margin:-2px 0 2px;
    border-radius:12px;
    background:rgba(255,255,255,.08);
    color:rgba(255,255,255,.92);
    font-size:12px;
    font-weight:700;
    user-select:none;
    touch-action:none;
    cursor:grab;
  }
  #builder-drag-handle:active{cursor:grabbing}
  body.builder-on #builder-panel.dragging{
    transition:none !important;
    opacity:.96;
  }


  /* Builder v2.4: iPhone-style resizable sheet */
  #builder-sheet-grabber{
    width:52px;
    height:5px;
    border-radius:999px;
    background:rgba(255,255,255,.48);
    margin:2px auto 4px;
    flex:0 0 auto;
    touch-action:none;
    cursor:ns-resize;
  }

  body.builder-on #builder-panel{
    min-height:84px;
    max-height:72vh;
    resize:none;
    overflow:hidden;
    transition:height .22s ease, opacity .18s ease;
  }

  body.builder-on #builder-panel.sheet-collapsed{
    height:88px !important;
  }
  body.builder-on #builder-panel.sheet-collapsed #asset-strip{
    display:none;
  }
  body.builder-on #builder-panel.sheet-collapsed #builder-tools{
    height:48px;
  }
  body.builder-on #builder-panel.sheet-collapsed .builder-btn{
    min-width:68px;
    height:42px;
  }

  body.builder-on #builder-panel.sheet-medium{
    height:168px;
  }

  body.builder-on #builder-panel.sheet-large{
    height:270px;
  }

  #builder-sheet-size{
    border:0;
    background:transparent;
    color:rgba(255,255,255,.9);
    font-size:12px;
    font-weight:700;
    padding:0 6px;
    height:24px;
    margin-left:auto;
  }

  #builder-drag-handle{
    height:26px;
    flex:0 0 26px;
    margin:0;
    padding:0 8px;
    justify-content:flex-start;
    gap:6px;
  }


  /* Builder v2.5: pinch-to-resize panel */
  body.builder-on #builder-panel.pinch-resizing{
    transition:none !important;
    will-change:width,height;
  }


  /* Builder v3 contextual UI */
  #builder-mode-tabs{
    display:flex;
    gap:6px;
    margin:2px 0 6px;
  }
  .mode-tab{
    flex:1;
    height:34px;
    border:1px solid rgba(255,255,255,.22);
    border-radius:12px;
    background:rgba(255,255,255,.06);
    color:#fff;
    font-weight:800;
  }
  .mode-tab.danger-tab{background:rgba(120,60,60,.7)}
  .mode-tab.active{
    background:rgba(76,126,143,.95);
    outline:2px solid rgba(255,255,255,.2);
  }
  .builder-context{display:none}
  .builder-context.active{display:block}
  .context-row{
    display:flex;
    gap:6px;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .context-row::-webkit-scrollbar{display:none}
  .builder-btn.primary{background:rgba(62,139,84,.95)}
  .builder-btn.danger{background:rgba(128,67,67,.95)}
  #selected-object-label{
    padding:8px 10px;
    margin-bottom:6px;
    border-radius:12px;
    background:rgba(255,255,255,.06);
    color:rgba(255,255,255,.92);
    font-size:12px;
    font-weight:700;
  }
  #builder-autosave{
    margin-top:6px;
    text-align:right;
    font-size:11px;
    color:rgba(199,255,214,.95);
    opacity:.9;
  }
  body.builder-on #builder-panel.sheet-collapsed{
    height:92px !important;
  }
  body.builder-on #builder-panel.sheet-collapsed #builder-mode-tabs,
  body.builder-on #builder-panel.sheet-collapsed .builder-context,
  body.builder-on #builder-panel.sheet-collapsed #builder-autosave{
    display:none !important;
  }


  #builder-legend{
    display:flex;
    gap:8px;
    align-items:center;
    margin-top:6px;
    font-size:11px;
    color:rgba(255,255,255,.88);
    flex-wrap:wrap;
  }
  .legend-dot{
    width:10px;height:10px;border-radius:50%;
    display:inline-block;margin-right:4px;
    box-shadow:0 0 8px currentColor;
  }
  .legend-preview{color:#7dff9a}
  .legend-invalid{color:#ff7b7b}
  .legend-built{color:#6ecbff}


  /* Builder v4 — simplified Create/Delete UX */
  #simple-mode-row{
    display:grid;
    grid-template-columns:1fr 1fr 1fr 1fr;
    gap:6px;
    margin:4px 0 8px;
  }
  #simple-mode-row .mode-tab{
    height:42px;
    font-size:14px;
  }
  .simple-hint{
    color:#fff;
    font-size:12px;
    padding:10px;
    margin-bottom:7px;
    border-radius:12px;
    background:rgba(130,58,58,.35);
    border:1px solid rgba(255,130,130,.25);
  }
  body.builder-on #builder-panel{
    min-width:250px;
  }


  /* Builder v5.2 placement gesture hints */
  #builder-gesture-hint{
    margin-top:6px;
    padding:7px 9px;
    border-radius:11px;
    background:rgba(255,255,255,.06);
    color:rgba(255,255,255,.92);
    font-size:11px;
    line-height:1.35;
  }


  .v6-context{display:none}
  .v6-context.active{display:block}
  .v6-row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
  .v6-row::-webkit-scrollbar{display:none}
  .v6-title{
    margin-bottom:6px;padding:7px 9px;border-radius:11px;
    background:rgba(255,255,255,.06);color:#fff;font-size:12px;font-weight:800
  }
  .v6-hint{
    margin-top:6px;padding:6px 8px;border-radius:10px;
    background:rgba(255,255,255,.05);color:rgba(255,255,255,.84);font-size:11px
  }
  #builder-done{min-width:86px}
  #builder-autosave{margin-top:5px;font-size:10px;text-align:right;color:rgba(196,255,210,.9)}

  #builder-map-status{
    margin-top:4px;
    font-size:10px;
    text-align:right;
    color:rgba(255,255,255,.72);
  }
</style>

// Home Island terrain v1 — gentle hills around deliberately flat gameplay pads.
function terrainGaussian(x,z,cx,cz,radius,height){
  const dx=x-cx,dz=z-cz;
  return height*Math.exp(-(dx*dx+dz*dz)/(2*radius*radius));
}
function terrainFlatKeep(x,z){
  const zones=[
    {x:-5.8,z:-1.8,r:3.4,f:2.5}, // farm
    {x:6.6,z:-6.8,r:4.7,f:3.0},  // cottage
    {x:0,z:1.5,r:3.0,f:2.8}      // central play space
  ];
  let keep=1;
  for(const q of zones){
    const d=Math.hypot(x-q.x,z-q.z);
    const t=THREE.MathUtils.smoothstep(d,q.r,q.r+q.f);
    keep*=t;
  }
  return keep;
}
function getTerrainHeight(x,z){
  let h=0;
  h+=terrainGaussian(x,z,4.5,-12,6.5,.95);
  h+=terrainGaussian(x,z,-11.5,-8.5,5.2,.62);
  h+=terrainGaussian(x,z,12.5,7.5,5.8,.48);
  h+=(Math.sin(x*.18+z*.07)*.035+Math.sin(z*.14-x*.05)*.02275);
  h*=terrainFlatKeep(x,z);
  return Math.max(-.02,h);
}

const terrainGeo=new THREE.PlaneGeometry(42,42,72,72);
const terrainPos=terrainGeo.attributes.position;
for(let i=0;i<terrainPos.count;i++){
  const x=terrainPos.getX(i);
  const localY=terrainPos.getY(i);
  const z=-localY;
  terrainPos.setZ(i,getTerrainHeight(x,z));
}
terrainPos.needsUpdate=true;
terrainGeo.computeVertexNormals();

const ground=new THREE.Mesh(
  terrainGeo,
  new THREE.MeshStandardMaterial({map:grass,roughness:1,metalness:0})
);
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
ground.renderOrder=0;
scene.add(ground);

// Floating island test: lightweight cliff skirt under the approved ground plane.
const islandGroup=new THREE.Group();
scene.add(islandGroup);

const islandSize=42;
const cliffDepth=4.5;
const rockMat=new THREE.MeshStandardMaterial({
  color:0x8b6a4d,
  roughness:1,
  metalness:0
});
const dirtMat=new THREE.MeshStandardMaterial({
  color:0x6e4f37,
  roughness:1,
  metalness:0
});

// Main lower slab
const slab=new THREE.Mesh(
  new THREE.BoxGeometry(islandSize-1.2,cliffDepth,islandSize-1.2),
  rockMat
);
slab.position.y=-cliffDepth/2-0.05;
slab.receiveShadow=true;
slab.castShadow=true;
islandGroup.add(slab);

// Slightly smaller lower core to suggest tapering.
const core=new THREE.Mesh(
  new THREE.BoxGeometry(islandSize-5.0,1.7,islandSize-5.0),
  dirtMat
);
core.position.y=-cliffDepth-0.75;
core.receiveShadow=true;
core.castShadow=true;
islandGroup.add(core);

// Decorative rocky edge blocks to break the perfect rectangular silhouette.
const edgeRockGeo=new THREE.DodecahedronGeometry(1.05,0);
for(let i=0;i<28;i++){
  const r=new THREE.Mesh(edgeRockGeo,rockMat);
  const side=i%4;
  const t=((i/28)*2-1)*(islandSize*.42);
  if(side===0) r.position.set(t,-1.15,-islandSize*.49);
  if(side===1) r.position.set(islandSize*.49,-1.15,t);
  if(side===2) r.position.set(t,-1.15,islandSize*.49);
  if(side===3) r.position.set(-islandSize*.49,-1.15,t);
  r.scale.setScalar(.75+Math.random()*.55);
  r.rotation.set(Math.random(),Math.random(),Math.random());
  r.castShadow=true;
  r.receiveShadow=true;
  islandGroup.add(r);
}

// Procedural sky dome: no image texture, very light for mobile.
const skyGeometry=new THREE.SphereGeometry(85,32,16);
const skyMaterial=new THREE.ShaderMaterial({
  side:THREE.BackSide,
  depthWrite:false,
  uniforms:{
    zenithColor:{value:new THREE.Color(0x68bdf0)},
    horizonColor:{value:new THREE.Color(0xdff4ff)},
    lowerColor:{value:new THREE.Color(0xb9dff2)}
  },
  vertexShader:`
    varying vec3 vWorldDirection;
    void main(){
      vWorldDirection=normalize(position);
      gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);
    }
  `,
  fragmentShader:`
    uniform vec3 zenithColor;
    uniform vec3 horizonColor;
    uniform vec3 lowerColor;
    varying vec3 vWorldDirection;
    void main(){
      float y=clamp(vWorldDirection.y,-1.0,1.0);
      vec3 color;
      if(y>=0.0){
        float t=smoothstep(0.0,0.85,y);
        color=mix(horizonColor,zenithColor,t);
      }else{
        float t=smoothstep(0.0,0.75,-y);
        color=mix(horizonColor,lowerColor,t);
      }
      gl_FragColor=vec4(color,1.0);
    }
  `
});
const skyDome=new THREE.Mesh(skyGeometry,skyMaterial);
skyDome.frustumCulled=false;
skyDome.renderOrder=-100;
scene.add(skyDome);

// Lightweight stars for night.
const starCount=220;
const starPositions=new Float32Array(starCount*3);
for(let i=0;i<starCount;i++){
  const theta=Math.random()*Math.PI*2;
  const y=Math.random()*.92+.08;
  const r=Math.sqrt(1-y*y)*82;
  starPositions[i*3]=Math.cos(theta)*r;
  starPositions[i*3+1]=y*82;
  starPositions[i*3+2]=Math.sin(theta)*r;

const fxCanvas=document.createElement('canvas');
fxCanvas.width=32; fxCanvas.height=32;
const fxCtx=fxCanvas.getContext('2d');
const fxGrad=fxCtx.createRadialGradient(16,16,2,16,16,15);
fxGrad.addColorStop(0,'rgba(255,255,255,1)');
fxGrad.addColorStop(.45,'rgba(255,255,255,.72)');
fxGrad.addColorStop(1,'rgba(255,255,255,0)');
fxCtx.fillStyle=fxGrad;
fxCtx.fillRect(0,0,32,32);
const fxTexture=new THREE.CanvasTexture(fxCanvas);
fxTexture.colorSpace=THREE.SRGBColorSpace;

const runParticles=[];
let runFxTimer=0;
let runFxIndex=0;
for(let i=0;i<24;i++){
  const mat=new THREE.SpriteMaterial({
    map:fxTexture,
    color:0xe9dfc6,
    transparent:true,
    opacity:0,
    depthWrite:false,
    depthTest:true
  });
  const sprite=new THREE.Sprite(mat);
  sprite.visible=false;
  sprite.renderOrder=6;
  scene.add(sprite);
  runParticles.push({
    sprite,
    age:0,
    life:.38,
    velocity:new THREE.Vector3(),
    startScale:.32
  });
}

function spawnRunFx(position,dir){
  const p=runParticles[runFxIndex];
  runFxIndex=(runFxIndex+1)%runParticles.length;

  const sideX=-dir.z, sideZ=dir.x;
  const sideOffset=(Math.random()-.5)*.42;
  const back=.28+Math.random()*.16;

  p.sprite.position.set(
    position.x-dir.x*back+sideX*sideOffset,
    .11+Math.random()*.05,
    position.z-dir.z*back+sideZ*sideOffset
  );
  p.velocity.set(
    -dir.x*.38+sideX*(Math.random()-.5)*.34,
    .34+Math.random()*.18,
    -dir.z*.38+sideZ*(Math.random()-.5)*.34
  );
  p.age=0;
  p.life=.38*(.85+Math.random()*.3);
  p.startScale=.32*(.8+Math.random()*.45);
  p.sprite.scale.setScalar(p.startScale);
  p.sprite.material.opacity=.42;
  p.sprite.visible=true;
}

function updateRunFx(position,dir,running,dt){
  if(running && dir.lengthSq()>.0001){
    runFxTimer-=dt;
    if(runFxTimer<=0){
      runFxTimer=.085*(.82+Math.random()*.36);
      spawnRunFx(position,dir);
    }
  }else{
    runFxTimer=0;
  }

  for(const p of runParticles){
    if(!p.sprite.visible) continue;
    p.age+=dt;
    const t=p.age/p.life;
    if(t>=1){
      p.sprite.visible=false;
      p.sprite.material.opacity=0;
      continue;
    }
    p.sprite.position.addScaledVector(p.velocity,dt);
    p.velocity.y-=.55*dt;
    p.sprite.scale.setScalar(p.startScale*(1+.85*t));
    p.sprite.material.opacity=.42*(1-t)*(1-t*.35);
  }
}

// Robust terrain snapping for vegetation.
// Uses actual world-space bounds after scaling/rotation so each model's real base
// touches the terrain even when Meshy pivots differ.

// v6.13 — Walkable Builder surfaces.
// Path tiles remain ordinary Builder objects/map data; only their rendered mesh
// can contribute a higher floor surface for Liora and for objects placed above them.
const walkableRaycaster=new THREE.Raycaster();
const walkableRayOrigin=new THREE.Vector3();
const walkableRayDirection=new THREE.Vector3(0,-1,0);

function getWalkableSurfaceHeight(x,z,ignoreHolder=null){
  const terrainY=getTerrainHeight(x,z);

  // builderState is initialized before gameplay/Builder interaction begins.
  if(typeof builderState==="undefined" || !Array.isArray(builderState.placed)){
    return terrainY;
  }

  const walkableMeshes=[];
  for(const holder of builderState.placed){
    if(!holder || !holder.parent || holder===ignoreHolder)continue;
    if(holder.userData?.assetId!=="path_tile")continue;

    holder.traverse(o=>{
      if(o.isMesh && o.userData?.walkableSurface===true)walkableMeshes.push(o);
    });
  }

  if(!walkableMeshes.length)return terrainY;

  walkableRayOrigin.set(x,40,z);
  walkableRaycaster.set(walkableRayOrigin,walkableRayDirection);
  walkableRaycaster.near=0;
  walkableRaycaster.far=80;

  const hits=walkableRaycaster.intersectObjects(walkableMeshes,false);
  if(!hits.length)return terrainY;

  // Raycaster is sorted nearest-first: from above this is the highest surface.
  const surfaceY=hits[0].point.y;
  return Number.isFinite(surfaceY) ? Math.max(terrainY,surfaceY) : terrainY;
}

function snapHolderToTerrain(holder, x, z, extraY=.012){
  holder.updateMatrixWorld(true);
  const box=new THREE.Box3().setFromObject(holder);

  // A Path always belongs to the terrain; it must not stack itself on another Path.
  // Every other placeable object may use the highest walkable Path beneath it.
  const surfaceY=holder.userData?.assetId==="path_tile"
    ? getTerrainHeight(x,z)
    : getWalkableSurfaceHeight(x,z,holder);

  if(Number.isFinite(box.min.y)){
    holder.position.y += surfaceY - box.min.y + extraY;
    holder.updateMatrixWorld(true);
  }
}

function fadeTo(name, duration=.18, loop=true, timeScale=1){
  const next=actions[name];
  if(!next) return;
  next.setEffectiveTimeScale(timeScale);
  if(currentAction===next) return;
  if(currentAction) currentAction.fadeOut(duration);
  next.reset();
  next.enabled=true;
  next.setEffectiveTimeScale(timeScale);
  next.setEffectiveWeight(1);
  next.setLoop(loop ? THREE.LoopRepeat : THREE.LoopOnce, loop ? Infinity : 1);
  next.clampWhenFinished=!loop;
  next.fadeIn(duration).play();
  currentAction=next;
}

const joyEl=document.querySelector('#joy'),stick=document.querySelector('#stick');
function moveStick(e){
  const r=joyEl.getBoundingClientRect();
  const cx=r.left+r.width/2,cy=r.top+r.height/2;
  let dx=e.clientX-cx,dy=e.clientY-cy;
  const max=40,l=Math.hypot(dx,dy)||1;
  if(l>max){dx*=max/l;dy*=max/l}
  joy.x=dx/max;joy.y=dy/max;
  stick.style.transform=`translate(${dx}px,${dy}px)`;
}
joyEl.addEventListener('pointerdown',e=>{pointer=e.pointerId;joyEl.setPointerCapture(pointer);moveStick(e)});
joyEl.addEventListener('pointermove',e=>{if(e.pointerId===pointer)moveStick(e)});
function end(e){if(e.pointerId===pointer){pointer=null;joy.x=joy.y=0;stick.style.transform='translate(0,0)'}}

let lastX=0,lastY=0;
let pinchStart=null,pinchZoom=1;

const minPitch=THREE.MathUtils.degToRad(28);
const maxPitch=THREE.MathUtils.degToRad(55);

function setZoom(v){
  zoom=THREE.MathUtils.clamp(v,.65,1.55);
}

function resetCamera(){
  zoom=1;
  yaw=initialYaw;
  pitch=initialPitch;
}

function cameraOffset(){
  const distance=baseLength*zoom;
  const horizontal=Math.cos(pitch)*distance;
  return new THREE.Vector3(
    Math.sin(yaw)*horizontal,
    Math.sin(pitch)*distance,
    Math.cos(yaw)*horizontal
  );
}

document.querySelector('#zin').onclick=()=>setZoom(zoom-.12);
document.querySelector('#zout').onclick=()=>setZoom(zoom+.12);
document.querySelector('#camera-reset').onclick=resetCamera;

const canvas=renderer.domElement;

canvas.addEventListener('pointerdown',e=>{
  if(e.pointerType==='touch' && e.isPrimary===false) return;
  orbitPointer=e.pointerId;
  lastX=e.clientX;
  lastY=e.clientY;
  canvas.setPointerCapture?.(orbitPointer);
});

canvas.addEventListener('pointermove',e=>{
  if(e.pointerId!==orbitPointer || pinchStart) return;
  const dx=e.clientX-lastX;
  const dy=e.clientY-lastY;
  lastX=e.clientX;
  lastY=e.clientY;
  yaw-=dx*.006;
  pitch=THREE.MathUtils.clamp(pitch+dy*.0045,minPitch,maxPitch);
});

function endOrbit(e){
  if(e.pointerId===orbitPointer) orbitPointer=null;
}
canvas.addEventListener('pointerup',endOrbit);
canvas.addEventListener('pointercancel',endOrbit);

canvas.addEventListener('touchstart',e=>{
  if(e.touches.length!==2) return;
  pinchStart=Math.hypot(
    e.touches[0].clientX-e.touches[1].clientX,
    e.touches[0].clientY-e.touches[1].clientY
  );
  pinchZoom=zoom;
  orbitPointer=null;
},{passive:false});

canvas.addEventListener('touchmove',e=>{
  if(e.touches.length!==2 || !pinchStart) return;
  e.preventDefault();
  const d=Math.hypot(
    e.touches[0].clientX-e.touches[1].clientX,
    e.touches[0].clientY-e.touches[1].clientY
  );
  setZoom(pinchZoom*(pinchStart/d));
},{passive:false});

canvas.addEventListener('touchend',e=>{
  if(e.touches.length<2) pinchStart=null;
});

function c(hex){return new THREE.Color(hex);}
function mix(a,b,t){return c(a).lerp(c(b),t);}
function range(h,a,b){return h<a||h>b?null:(h-a)/(b-a);}

function updateDayNight(dt){
  gameHour=(gameHour+dt*(24/realSecondsPerDay))%24;

  let zenith=c(0x68bdf0),horizon=c(0xdff4ff),lower=c(0xb9dff2);
  let sunColor=c(0xffedc4),sunIntensity=2.5;
  let hemiSky=c(0xfff5dd),hemiGround=c(0x496448),hemiIntensity=2.2;
  let starsAmount=0;

  let t=range(gameHour,5,7.5);
  if(t!==null){
    zenith=mix(0x152b5a,0x68bdf0,t);
    horizon=mix(0xf29b78,0xdff4ff,t);
    lower=mix(0x5a6b91,0xb9dff2,t);
    sunColor=mix(0xffb066,0xffedc4,t);
    sunIntensity=THREE.MathUtils.lerp(.35,2.5,t);
    hemiSky=mix(0x6f84b5,0xfff5dd,t);
    hemiGround=mix(0x24364b,0x496448,t);
    hemiIntensity=THREE.MathUtils.lerp(.8,2.2,t);
    starsAmount=1-t;
  }else{
    t=range(gameHour,16.5,19.5);
    if(t!==null){
      zenith=mix(0x68bdf0,0x182b5d,t);
      horizon=t<.55?mix(0xdff4ff,0xf18f68,t/.55):mix(0xf18f68,0x6a5578,(t-.55)/.45);
      lower=mix(0xb9dff2,0x394866,t);
      sunColor=mix(0xffedc4,0xff955f,t);
      sunIntensity=THREE.MathUtils.lerp(2.5,.25,t);
      hemiSky=mix(0xfff5dd,0x7182ad,t);
      hemiGround=mix(0x496448,0x243348,t);
      hemiIntensity=THREE.MathUtils.lerp(2.2,.75,t);
      starsAmount=THREE.MathUtils.smoothstep(t,.65,1);
    }else if(gameHour>=19.5||gameHour<5){
      zenith=c(0x081735);horizon=c(0x26385f);lower=c(0x101d35);
      sunColor=c(0xaac8ff);sunIntensity=.12;
      hemiSky=c(0x4c66a1);hemiGround=c(0x162033);hemiIntensity=.62;
      starsAmount=1;
    }
  }

  skyMaterial.uniforms.zenithColor.value.copy(zenith);
  skyMaterial.uniforms.horizonColor.value.copy(horizon);
  skyMaterial.uniforms.lowerColor.value.copy(lower);
  scene.background.copy(horizon);
  if(scene.fog)scene.fog.color.copy(horizon);

  sun.color.copy(sunColor);
  sun.intensity=sunIntensity;
  hemi.color.copy(hemiSky);
  hemi.groundColor.copy(hemiGround);
  hemi.intensity=hemiIntensity;
  starMaterial.opacity=starsAmount*.9;
  stars.visible=starMaterial.opacity>.01;

  const sunPhase=((gameHour-6)/24)*Math.PI*2;
  const elevation=Math.sin(sunPhase);
  const azimuth=sunPhase*.72-.8;
  const len=15;
  const horizontal=Math.max(.28,Math.abs(elevation));
  sunOffset.set(
    Math.cos(azimuth)*horizontal,
    Math.max(.22,Math.abs(elevation)),
    Math.sin(azimuth)*horizontal
  ).normalize().multiplyScalar(len);

  const hh=Math.floor(gameHour)%24;
  const mm=Math.floor((gameHour-Math.floor(gameHour))*60);
  const label=gameHour>=5&&gameHour<8?'Morning':gameHour<17?'Day':gameHour<20?'Sunset':'Night';
  dayClock.textContent=`${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')} • ${label}`;
}

const builderState={
  enabled:false,
  selectedAsset:null,
  selectedObject:null,
  editSnapshot:null,
  ghost:null,
  ghostValid:false,
  history:[],
  templates:{tree:null,palm:null,pine:null,house:null},
  placed:[],
  snapMode:"free",
  moveMode:false,
  pointerId:null,
  pinchStart:null,
  pinchScale:1,
  twistStartAngle:null,
  twistStartRotation:0,
  mode:"build",
  deleteMode:false,
};

const raycaster=new THREE.Raycaster();
const pointerNdc=new THREE.Vector2();
const groundPlane=new THREE.Plane(new THREE.Vector3(0,1,0),0);
const rayHit=new THREE.Vector3();


function setBuilderMode(mode){
  if(mode==="edit") setBuilderContext("edit");
  else setBuilderContext("idle");
}

function updateSelectedLabel(){
  const el=document.querySelector("#selected-object-label");
  if(!el)return;
  const o=builderState.selectedObject;
  el.textContent=o ? `${o.userData.assetId} selected` : "No object selected";
}


const MAP_SCHEMA_VERSION=1;
const MAP_ID="home-island";

function serializeCanonicalMap(){
  return {
    version:MAP_SCHEMA_VERSION,
    mapId:MAP_ID,
    savedAt:new Date().toISOString(),
    objects:builderState.placed
      .filter(o=>o?.parent)
      .map((o,index)=>({
        id:o.userData.builderId || `${o.userData.assetId}-${index+1}`,
        assetId:o.userData.assetId,
        x:+o.position.x.toFixed(4),
        z:+o.position.z.toFixed(4),
        rotation:+o.rotation.y.toFixed(6),
        scale:+o.scale.x.toFixed(4)
      }))
  };
}

function setMapStatus(text){
  const el=document.querySelector("#builder-map-status");
  if(el)el.textContent=text;
}

function exportCanonicalMap(){
  const payload=serializeCanonicalMap();
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download=`${MAP_ID}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  setMapStatus(`Exported ${payload.objects.length} objects ✓`);
}

function validateMapPayload(payload){
  if(!payload || typeof payload!=="object")throw new Error("Invalid map file");
  if(payload.version!==MAP_SCHEMA_VERSION)throw new Error(`Unsupported map version: ${payload.version}`);
  if(!Array.isArray(payload.objects))throw new Error("Map objects must be an array");
  return payload.objects.map((item,index)=>{
    if(!item || typeof item!=="object")throw new Error(`Invalid object at index ${index}`);
    if(typeof item.assetId!=="string")throw new Error(`Missing assetId at index ${index}`);
    const x=Number(item.x), z=Number(item.z);
    const rotation=Number(item.rotation??0), scale=Number(item.scale??1);
    if(![x,z,rotation,scale].every(Number.isFinite))throw new Error(`Invalid transform at index ${index}`);
    return {
      id:typeof item.id==="string"?item.id:`${item.assetId}-${index+1}`,
      assetId:item.assetId,
      x,z,rotation,scale
    };
  });
}

function clearPlacedBuilderObjects(){
  clearBuilderSelection();
  for(const obj of [...builderState.placed]){
    if(obj?.parent)scene.remove(obj);
  }
  builderState.placed.length=0;
  builderState.history.length=0;
}

function importCanonicalMap(payload){
  const items=validateMapPayload(payload);
  clearPlacedBuilderObjects();

  let restored=0, skipped=0;
  for(const item of items){
    const template=builderState.templates[item.assetId];
    if(!template){
      console.warn(`Skipping unknown/unloaded asset: ${item.assetId}`);
      skipped++;
      continue;
    }
    const obj=buildObject(item.assetId,item.x,item.z,item.rotation,item.scale);
    if(!obj){
      skipped++;
      continue;
    }
    obj.userData.builderId=item.id;
    restored++;
  }

  autoSaveLayout();
  setBuilderContext("idle");
  setBuilderMessage(`นำเข้าแผนที่แล้ว ${restored} objects`);
  setMapStatus(skipped?`Imported ${restored}, skipped ${skipped}`:`Imported ${restored} objects ✓`);
  return {restored,skipped};
}

async function importCanonicalMapFile(file){
  const text=await file.text();
  const payload=JSON.parse(text);
  return importCanonicalMap(payload);
}

function autoSaveLayout(){
  localStorage.setItem("liora-home-island-layout-v3-clean",JSON.stringify(serializeLayout()));

function setBuilderContext(kind){

  document.querySelector("#builder-place-context").classList.toggle("active",kind==="place");
  document.querySelector("#builder-edit-context").classList.toggle("active",kind==="edit");

function setBuilderMessage(text){

  if(el)el.textContent=text;
}
function setGhostLabel(text){

  if(el)el.textContent=text;
}
function snapValue(v){
  if(builderState.snapMode==="0.5") return Math.round(v*2)/2;
  if(builderState.snapMode==="1") return Math.round(v);
  return v;
}

function setObjectSelectedVisual(object,selected){
  if(!object)return;

  object.traverse(node=>{
    if(!node.isMesh)return;

    // Store each mesh's original material only once.
    if(selected){
      if(!node.userData._builderOriginalMaterial){
        node.userData._builderOriginalMaterial=node.material;

        const sourceMaterials=Array.isArray(node.material)?node.material:[node.material];
        const selectedMaterials=sourceMaterials.map(source=>{
          if(!source)return source;
          const mat=source.clone();

          // Keep texture/details, but tint the actual object so selection is obvious.
          if(mat.color){
            mat.color=mat.color.clone();
            mat.color.lerp(new THREE.Color(0xffd65a),0.26);
          }
          if("emissive" in mat && mat.emissive){
            mat.emissive=mat.emissive.clone();
            mat.emissive.set(0x8a6818);
            mat.emissiveIntensity=0.28;
          }

          mat.needsUpdate=true;
          return mat;
        });

        node.material=Array.isArray(node.material)?selectedMaterials:selectedMaterials[0];
      }
    }else{
      const original=node.userData._builderOriginalMaterial;
      if(original){
        const current=Array.isArray(node.material)?node.material:[node.material];
        for(const mat of current){
          if(mat && mat!==original && typeof mat.dispose==="function")mat.dispose();
        }
        node.material=original;
        delete node.userData._builderOriginalMaterial;
      }
    }
  });
}


function clearBuilderSelection(){
  const current=builderState.selectedObject;
  if(current){
    setObjectSelectedVisual(current,false);
    const ring=current.userData?.selectionRing;
    if(ring)ring.visible=false;
  }
  builderState.selectedObject=null;
  builderState.editSnapshot=null;
}

function captureEditSnapshot(object){
  if(!object)return null;
  return {
    x:object.position.x, y:object.position.y, z:object.position.z,
    rotation:object.rotation.y, scale:object.scale.x
  };
}

function restoreEditSnapshot(){
  const object=builderState.selectedObject;
  const snap=builderState.editSnapshot;
  if(!object||!snap)return false;
  object.position.set(snap.x,snap.y,snap.z);
  object.rotation.y=snap.rotation;
  object.scale.setScalar(snap.scale);
  snapHolderToTerrain(object,object.position.x,object.position.z,.012);
  return true;
}

function commitEditSnapshot(){ builderState.editSnapshot=null; }

function markSelected(object){
  const previous=builderState.selectedObject;
  if(previous && previous!==object){
    setObjectSelectedVisual(previous,false);
    const oldRing=previous.userData?.selectionRing;
    if(oldRing)oldRing.visible=false;
    commitEditSnapshot();
  }
  if(!object){
    clearBuilderSelection();
    setBuilderContext("idle");
    return;
  }
  builderState.selectedObject=object;
  builderState.editSnapshot=captureEditSnapshot(object);
  setObjectSelectedVisual(object,true);
  const ring=object.userData?.selectionRing;
  if(ring?.material){
    ring.visible=true; ring.material.color.set(0xffd65a); ring.material.opacity=.92;
  }
  const label=document.querySelector("#selected-object-label");
  if(label)label.textContent=`${object.userData.assetId} selected`;
  setBuilderContext("edit");
  setBuilderMessage("แก้ไขได้ • กด ยกเลิก ถ้าเผลอเปลี่ยน");
}
function createSelectionRing(){
  const mat=new THREE.MeshBasicMaterial({
    color:0x6ecbff,
    transparent:true,
    opacity:.72,
    side:THREE.DoubleSide,
    depthWrite:false,
    depthTest:true
  });
  const ring=new THREE.Mesh(new THREE.RingGeometry(.62,.78,48),mat);
  ring.rotation.x=-Math.PI/2;
  ring.position.y=.035;
  ring.renderOrder=35;
  ring.visible=builderState.enabled;
  return ring;
}
function registerTemplate(assetId, model){
  if(builderState.templates[assetId])return;
  builderState.templates[assetId]=model.clone(true);
}
function setGhostMaterial(root,valid){
  root.traverse(o=>{
    if(!o.isMesh)return;
    const mats=Array.isArray(o.material)?o.material:[o.material];
    o.material=mats.map(m=>{
      if(!m)return m;
      const clone=m.clone();
      clone.transparent=true;
      clone.opacity=.46;
      clone.depthWrite=false;
      clone.color=clone.color?.clone?.()||new THREE.Color(0xffffff);
      clone.color.multiply(new THREE.Color(valid?0xa7ffb8:0xff9b9b));
      return clone;
    });
    if(o.material.length===1)o.material=o.material[0];
  });
}
function assetPlacementRadius(assetId){
  return (assetId==="house"||assetId==="house2") ? 2.65 : 1.15;
}

function isPlacementValid(x,z,assetId=builderState.ghost?.userData?.assetId){
  const radius=assetPlacementRadius(assetId);
  const limit=17.2-radius*.35;
  if(Math.abs(x)>limit||Math.abs(z)>limit)return false;

  for(const o of builderState.placed){
    if(!o.parent)continue;
    const dx=o.position.x-x,dz=o.position.z-z;
    const minDistance=radius+assetPlacementRadius(o.userData.assetId)*.72;
    if(Math.hypot(dx,dz)<minDistance)return false;
  }
  return true;
}

function createPreviewRing(){
  const mat=new THREE.MeshBasicMaterial({
    color:0x7dff9a,
    transparent:true,
    opacity:.9,
    side:THREE.DoubleSide,
    depthWrite:false,
    depthTest:true
  });
  const ring=new THREE.Mesh(new THREE.RingGeometry(.72,.90,56),mat);
  ring.rotation.x=-Math.PI/2;
  ring.position.y=.04;
  ring.renderOrder=45;
  return ring;
}

function updateBuilderRingsVisibility(){
  for(const o of builderState.placed){
    const ring=o?.userData?.selectionRing;
    if(ring)ring.visible=false;
  }
  if(builderState.selectedObject?.userData?.selectionRing){
    builderState.selectedObject.userData.selectionRing.visible=builderState.enabled;
  }
  if(builderState.ghost?.userData?.previewRing){
    builderState.ghost.userData.previewRing.visible=builderState.enabled;
  }
}

function buildObject(assetId, x, z, rotation=0, scale=1){
  const template=builderState.templates[assetId];
  if(!template)return null;
  const holder=new THREE.Group();
  holder.userData.builderObject=true;
  holder.userData.assetId=assetId;
  holder.userData.builderId=(crypto.randomUUID?crypto.randomUUID():`${assetId}-${Date.now()}-${Math.random().toString(36).slice(2)}`);
  holder.position.set(x,0,z);
  holder.rotation.y=rotation;
  holder.scale.setScalar(scale);

  const model=template.clone(true);
  model.traverse(o=>{
    if(o.isMesh){
      o.castShadow=true;
      o.receiveShadow=true;
      if(assetId==="path_tile")o.userData.walkableSurface=true;
    }
  });
  holder.add(model);
  const ring=createSelectionRing();
  if(assetId==="house"||assetId==="house2") ring.scale.setScalar(2.35);
  ring.material.color.set(0x6ecbff);
  ring.material.opacity=.72;
  holder.userData.selectionRing=ring;
  holder.add(ring);

  scene.add(holder);
  snapHolderToTerrain(holder,x,z,.012);
  builderState.placed.push(holder);
  return holder;
}
function createGhost(assetId){
  // Starting a new placement must clear any previous edit selection.
  clearBuilderSelection();

  if(builderState.ghost){
    scene.remove(builderState.ghost);
    builderState.ghost=null;
  }
  const template=builderState.templates[assetId];
  if(!template){
    console.warn(`Builder asset template not ready: ${assetId}`);
    setBuilderMessage("Asset กำลังโหลด ลองอีกครั้งอีกนิดค่ะ");
    return;
  }

  const holder=new THREE.Group();
  holder.userData.assetId=assetId;
  const model=template.clone(true);
  holder.add(model);

  const previewRing=createPreviewRing();
  if(assetId==="house"||assetId==="house2") previewRing.scale.setScalar(2.35);
  holder.userData.previewRing=previewRing;
  holder.add(previewRing);

  setGhostMaterial(holder,true);
  scene.add(holder);
  builderState.ghost=holder;
  setGhostLabel(`${assetId} preview • drag on ground`);
}
function updateGhostVisual(){
  if(!builderState.ghost)return;

  const previewRing=builderState.ghost.userData.previewRing;
  if(previewRing?.material){
    previewRing.material.color.set(builderState.ghostValid?0x7dff9a:0xff7b7b);
    previewRing.material.opacity=builderState.ghostValid?.95:.88;
  }

  builderState.ghost.traverse(o=>{
    if(!o.isMesh)return;
    const mats=Array.isArray(o.material)?o.material:[o.material];
    for(const m of mats){
      if(!m?.color)continue;
      m.color.set(builderState.ghostValid?0xa7ffb8:0xff9b9b);
      m.opacity=.46;
    }
  });
}
function serializeLayout(){
  return builderState.placed.filter(o=>o.parent).map(o=>({
    assetId:o.userData.assetId,
    x:+o.position.x.toFixed(3),
    z:+o.position.z.toFixed(3),
    rotation:+o.rotation.y.toFixed(4),
    scale:+o.scale.x.toFixed(3)
  }));
}
function saveLayout(){
  localStorage.setItem("liora-home-island-layout-v3-clean",JSON.stringify(serializeLayout()));
  setBuilderMessage("Layout saved on this device ✓");
}
function loadLayout(){
  const raw=localStorage.getItem("liora-home-island-layout-v3-clean");
  if(!raw)return;
  try{
    const arr=JSON.parse(raw);
    if(!Array.isArray(arr))return;
    for(const item of arr){
      buildObject(item.assetId,item.x,item.z,item.rotation,item.scale);
    }
    if(arr.length)setBuilderMessage(`Loaded ${arr.length} saved objects`);
  }catch(err){console.warn("Layout load failed",err);}
}
function pushHistory(action){
  builderState.history.push(action);
  if(builderState.history.length>50)builderState.history.shift();
}
function removeBuilderObject(obj,record=true){
  if(!obj||!obj.userData.builderObject)return;
  const snapshot={
    assetId:obj.userData.assetId,
    x:obj.position.x,z:obj.position.z,
    rotation:obj.rotation.y,scale:obj.scale.x
  };
  if(record)pushHistory({type:"delete",snapshot});
  const index=builderState.placed.indexOf(obj);
  if(index>=0)builderState.placed.splice(index,1);
  scene.remove(obj);
  if(builderState.selectedObject===obj)builderState.selectedObject=null;
  updateSelectedLabel();
  autoSaveLayout();
}
function screenToTerrain(event){
  const rect=renderer.domElement.getBoundingClientRect();
  pointerNdc.x=((event.clientX-rect.left)/rect.width)*2-1;
  pointerNdc.y=-((event.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(pointerNdc,camera);
  if(!raycaster.ray.intersectPlane(groundPlane,rayHit))return null;
  return new THREE.Vector3(snapValue(rayHit.x),0,snapValue(rayHit.z));
}
function findBuilderObjectFromEvent(event){
  const rect=renderer.domElement.getBoundingClientRect();
  pointerNdc.x=((event.clientX-rect.left)/rect.width)*2-1;
  pointerNdc.y=-((event.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(pointerNdc,camera);
  const hits=raycaster.intersectObjects(builderState.placed,true);
  if(!hits.length)return null;
  let o=hits[0].object;
  while(o&&!o.userData.builderObject)o=o.parent;
  return o||null;
}
function placeGhost(){
  const g=builderState.ghost;
  if(!g||!builderState.ghostValid)return;
  const obj=buildObject(g.userData.assetId,g.position.x,g.position.z,g.rotation.y,g.scale.x);
  if(obj){
    pushHistory({type:"add",object:obj});
    autoSaveLayout();
    setBuilderMessage(`${g.userData.assetId} placed ✓`);
  }
  scene.remove(g);
  builderState.ghost=null;
  builderState.selectedAsset=null;
  document.querySelectorAll("[data-build-asset]").forEach(b=>b.classList.remove("active"));
  setBuilderContext("idle");
}
function cancelGhost(){
  clearBuilderSelection();
  if(builderState.ghost){
    scene.remove(builderState.ghost);
    builderState.ghost=null;
  }
  builderState.selectedAsset=null;
  document.querySelectorAll("[data-build-asset]").forEach(b=>b.classList.remove("active"));
  setBuilderMessage("ยกเลิกแล้ว");
  setBuilderContext("idle");
}
function rotateCurrent(dir){
  const target=builderState.ghost||builderState.selectedObject;
  if(!target)return;
  target.rotation.y+=THREE.MathUtils.degToRad(15*dir);

  if(builderState.ghost){
    setGhostLabel(`หมุน ${(THREE.MathUtils.radToDeg(target.rotation.y)%360+360)%360|0}°`);
  }
  if(target===builderState.selectedObject)autoSaveLayout();
}
function scaleCurrent(mult){
  const target=builderState.ghost||builderState.selectedObject;
  if(!target)return;
  target.scale.multiplyScalar(mult);
  snapHolderToTerrain(target,target.position.x,target.position.z,.012);
  if(target===builderState.selectedObject)autoSaveLayout();
}
function cycleSnap(){
  builderState.snapMode=
    builderState.snapMode==="free"?"0.5":
    builderState.snapMode==="0.5"?"1":"free";
  document.querySelector("#builder-snap").textContent=
    builderState.snapMode==="free"?"Snap: Free":`Snap: ${builderState.snapMode}m`;
}

renderer.domElement.addEventListener("pointerdown",event=>{
  if(!builderState.enabled)return;
  // Accept non-primary touch pointers so the left thumb can keep walking
  // on the joystick while the right finger drags a build preview/object.
  if(builderState.pointerId!==null && builderState.pointerId!==event.pointerId)return;
  builderState.pointerId=event.pointerId;
  const picked=findBuilderObjectFromEvent(event);

  if(builderState.deleteMode){
    if(picked){
      removeBuilderObject(picked,true);
      setBuilderMessage("ลบแล้ว • แตะต้นอื่นเพื่อลบต่อ");
      autoSaveLayout();
    }
    event.stopImmediatePropagation();
    return;
  }

  if(picked && !builderState.ghost){
    markSelected(picked);
    builderState.moveMode=true;
    setBuilderMessage(`${picked.userData.assetId} • ลากเพื่อย้าย`);
    event.stopImmediatePropagation();
    return;
  }

  if(builderState.ghost){
    const hit=screenToTerrain(event);
    if(hit){
      builderState.ghost.position.set(hit.x,0,hit.z);
      snapHolderToTerrain(builderState.ghost,hit.x,hit.z,.012);
      builderState.ghostValid=isPlacementValid(hit.x,hit.z);
      updateGhostVisual();
    }
    event.stopImmediatePropagation();
  }
},true);

renderer.domElement.addEventListener("pointermove",event=>{
  if(!builderState.enabled)return;
  if(builderState.pointerId!==null && event.pointerId!==builderState.pointerId)return;

  if(builderState.ghost){
    const hit=screenToTerrain(event);
    if(!hit)return;
    builderState.ghost.position.set(hit.x,0,hit.z);
    snapHolderToTerrain(builderState.ghost,hit.x,hit.z,.012);
    builderState.ghostValid=isPlacementValid(hit.x,hit.z);
    updateGhostVisual();
    event.stopImmediatePropagation();
    return;
  }

  if(builderState.moveMode && builderState.selectedObject){
    const hit=screenToTerrain(event);
    if(!hit)return;
    builderState.selectedObject.position.x=hit.x;
    builderState.selectedObject.position.z=hit.z;
    snapHolderToTerrain(builderState.selectedObject,hit.x,hit.z,.012);
    event.stopImmediatePropagation();
  }
},true);

renderer.domElement.addEventListener("pointerup",event=>{
  if(!builderState.enabled)return;
  if(builderState.pointerId!==null && event.pointerId!==builderState.pointerId)return;
  if(builderState.moveMode && builderState.selectedObject)autoSaveLayout();
  builderState.pointerId=null;
  builderState.moveMode=false;
  event.stopImmediatePropagation();
},true);

renderer.domElement.addEventListener("pointercancel",event=>{
  if(!builderState.enabled)return;
  if(builderState.pointerId!==null && event.pointerId!==builderState.pointerId)return;
  builderState.pointerId=null;
  builderState.moveMode=false;
},true);

// Two-finger placement gesture: pinch = scale, twist = rotate.
function gestureAngle(touches){
  return Math.atan2(
    touches[1].clientY-touches[0].clientY,
    touches[1].clientX-touches[0].clientX
  );
}

renderer.domElement.addEventListener("touchstart",event=>{
  if(!builderState.enabled || event.touches.length!==2)return;

  const target=builderState.ghost||builderState.selectedObject;
  if(!target)return;

  builderState.pinchStart=Math.hypot(
    event.touches[0].clientX-event.touches[1].clientX,
    event.touches[0].clientY-event.touches[1].clientY
  );
  builderState.pinchScale=target.scale.x;

  builderState.twistStartAngle=gestureAngle(event.touches);
  builderState.twistStartRotation=target.rotation.y;

  event.preventDefault();
},{passive:false});

renderer.domElement.addEventListener("touchmove",event=>{
  if(!builderState.enabled || event.touches.length!==2 || !builderState.pinchStart)return;

  const target=builderState.ghost||builderState.selectedObject;
  if(!target)return;

  event.preventDefault();

  // Pinch scale.
  const dist=Math.hypot(
    event.touches[0].clientX-event.touches[1].clientX,
    event.touches[0].clientY-event.touches[1].clientY
  );
  const scale=THREE.MathUtils.clamp(
    builderState.pinchScale*(dist/builderState.pinchStart),
    .45,2.25
  );
  target.scale.setScalar(scale);

  // Twist rotation, similar to build modes in mobile games.
  const angle=gestureAngle(event.touches);
  let delta=angle-builderState.twistStartAngle;
  if(delta>Math.PI)delta-=Math.PI*2;
  if(delta<-Math.PI)delta+=Math.PI*2;
  target.rotation.y=builderState.twistStartRotation-delta;

  snapHolderToTerrain(target,target.position.x,target.position.z,.012);

  if(builderState.ghost){
    builderState.ghostValid=isPlacementValid(
      target.position.x,target.position.z,target.userData.assetId
    );
    updateGhostVisual();
    setGhostLabel(`หมุน ${(THREE.MathUtils.radToDeg(target.rotation.y)%360+360)%360|0}° • ขนาด ${target.scale.x.toFixed(2)}x`);
  }

  event.stopPropagation();
},{passive:false});

renderer.domElement.addEventListener("touchend",event=>{
  if(event.touches.length>=2)return;

  const target=builderState.selectedObject;
  const hadGesture=builderState.pinchStart!==null;

  builderState.pinchStart=null;
  builderState.twistStartAngle=null;

  if(hadGesture && target && !builderState.ghost){
    autoSaveLayout();
  }
});

const sheetGrabber=document.querySelector("#builder-sheet-grabber");
const sheetSizeButton=document.querySelector("#builder-sheet-size");
let sheetResizePointer=null;
let sheetResizeStartY=0;
let sheetResizeStartHeight=0;

function setSheetPreset(name,save=true){

  if(name==="collapsed"){

  }else if(name==="large"){

    sheetSizeButton.textContent="ย่อ";
  }else{
    builderPanel.classList.add("sheet-medium");
    sheetSizeButton.textContent="ย่อ";
    name="medium";
  }
  if(save)localStorage.setItem("liora-builder-sheet-size-v1",name);
}

function restoreSheetPreset(){
  const saved=localStorage.getItem("liora-builder-sheet-size-v1")||"medium";
  setSheetPreset(saved,false);
}

sheetSizeButton.addEventListener("click",event=>{
  event.preventDefault();
  event.stopPropagation();
  const collapsed=builderPanel.classList.contains("sheet-collapsed");
  const large=builderPanel.classList.contains("sheet-large");

  else if(large)setSheetPreset("collapsed");
  else setSheetPreset("collapsed");
});

sheetGrabber.addEventListener("pointerdown",event=>{
  if(!builderState.enabled)return;
  sheetResizePointer=event.pointerId;
  sheetResizeStartY=event.clientY;
  sheetResizeStartHeight=builderPanel.getBoundingClientRect().height;
  builderPanel.classList.remove("sheet-collapsed","sheet-medium","sheet-large");
  builderPanel.style.transition="none";
  sheetGrabber.setPointerCapture?.(event.pointerId);

});

sheetGrabber.addEventListener("pointermove",event=>{

  const delta=sheetResizeStartY-event.clientY;
  const maxH=Math.min(innerHeight*.72,360);
  const next=THREE.MathUtils.clamp(sheetResizeStartHeight+delta,84,maxH);
  builderPanel.style.height=`${next}px`;
  event.preventDefault();
  event.stopPropagation();
});

function finishSheetResize(event){
  if(event.pointerId!==sheetResizePointer)return;
  sheetResizePointer=null;
  builderPanel.style.transition="";
  const h=builderPanel.getBoundingClientRect().height;
  if(h<118)setSheetPreset("collapsed");
  else if(h>220)setSheetPreset("large");
  else setSheetPreset("medium");

}

// Draggable builder tray -------------------------------------------------
const builderPanel=document.querySelector("#builder-panel");
const builderDragHandle=document.querySelector("#builder-drag-handle");

// Pinch-to-resize the builder tray itself --------------------------------
let panelPinchStart=null;
let panelPinchStartWidth=0;
let panelPinchStartHeight=0;

function panelTouchDistance(touches){
  if(touches.length<2)return 0;
  return Math.hypot(
    touches[0].clientX-touches[1].clientX,
    touches[0].clientY-touches[1].clientY
  );
}

builderPanel.addEventListener("touchstart",event=>{
  if(!builderState.enabled || event.touches.length!==2)return;
  panelPinchStart=panelTouchDistance(event.touches);
  const r=builderPanel.getBoundingClientRect();
  panelPinchStartWidth=r.width;
  panelPinchStartHeight=r.height;
  builderPanel.classList.add("pinch-resizing");
  event.preventDefault();
  event.stopPropagation();
},{passive:false});

builderPanel.addEventListener("touchmove",event=>{
  if(!builderState.enabled || event.touches.length!==2 || !panelPinchStart)return;
  event.preventDefault();

  const d=panelTouchDistance(event.touches);
  const factor=THREE.MathUtils.clamp(d/panelPinchStart,.72,1.45);

  const minW=Math.min(210,innerWidth-16);
  const maxW=Math.max(minW,innerWidth-16);
  const minH=84;
  const maxH=Math.min(innerHeight*.72,360);

  const nextW=THREE.MathUtils.clamp(panelPinchStartWidth*factor,minW,maxW);
  const nextH=THREE.MathUtils.clamp(panelPinchStartHeight*factor,minH,maxH);

  builderPanel.classList.remove("sheet-collapsed","sheet-medium","sheet-large");
  builderPanel.style.width=`${nextW}px`;
  builderPanel.style.height=`${nextH}px`;
  builderPanel.style.right="auto";
  builderPanel.style.bottom="auto";

  // Keep the sheet on-screen while resizing around its current position.
  const r=builderPanel.getBoundingClientRect();
  const margin=8;
  let left=r.left;
  let top=r.top;
  if(left+r.width>innerWidth-margin) left=innerWidth-r.width-margin;
  if(top+r.height>innerHeight-margin) top=innerHeight-r.height-margin;
  left=Math.max(margin,left);
  top=Math.max(margin,top);
  builderPanel.style.left=`${left}px`;
  builderPanel.style.top=`${top}px`;

  event.stopPropagation();
},{passive:false});

builderPanel.addEventListener("touchend",event=>{
  if(!panelPinchStart)return;
  if(event.touches.length>=2)return;

  panelPinchStart=null;
  builderPanel.classList.remove("pinch-resizing");

  const r=builderPanel.getBoundingClientRect();
  localStorage.setItem(
    "liora-builder-panel-size-v1",
    JSON.stringify({width:r.width,height:r.height})
  );
  savePanelPosition();
},{passive:false});

function restorePanelSize(){
  const raw=localStorage.getItem("liora-builder-panel-size-v1");
  if(!raw)return;
  try{
    const s=JSON.parse(raw);
    if(!Number.isFinite(s.width)||!Number.isFinite(s.height))return;
    const minW=Math.min(210,innerWidth-16);
    const maxW=Math.max(minW,innerWidth-16);
    const minH=84;
    const maxH=Math.min(innerHeight*.72,360);
    builderPanel.classList.remove("sheet-collapsed","sheet-medium","sheet-large");
    builderPanel.style.width=`${THREE.MathUtils.clamp(s.width,minW,maxW)}px`;
    builderPanel.style.height=`${THREE.MathUtils.clamp(s.height,minH,maxH)}px`;
  }catch{}
}

let panelDragPointer=null;
let panelDragOffsetX=0;
let panelDragOffsetY=0;

function clampPanelToViewport(left,top){
  const rect=builderPanel.getBoundingClientRect();
  const margin=8;
  const maxLeft=Math.max(margin,innerWidth-rect.width-margin);
  const maxTop=Math.max(margin,innerHeight-rect.height-margin);
  return {
    left:THREE.MathUtils.clamp(left,margin,maxLeft),
    top:THREE.MathUtils.clamp(top,margin,maxTop)
  };
}

function applySavedPanelPosition(){
  const raw=localStorage.getItem("liora-builder-panel-pos-v1");
  if(!raw)return;
  try{
    const p=JSON.parse(raw);
    if(!Number.isFinite(p.left)||!Number.isFinite(p.top))return;
    const c=clampPanelToViewport(p.left,p.top);
    builderPanel.style.left=`${c.left}px`;
    builderPanel.style.top=`${c.top}px`;
    builderPanel.style.right="auto";
    builderPanel.style.bottom="auto";
  }catch{}
}

function savePanelPosition(){
  const r=builderPanel.getBoundingClientRect();
  localStorage.setItem(
    "liora-builder-panel-pos-v1",
    JSON.stringify({left:r.left,top:r.top})
  );
}

builderDragHandle.addEventListener("pointerdown",event=>{
  if(!builderState.enabled)return;
  panelDragPointer=event.pointerId;
  const r=builderPanel.getBoundingClientRect();
  panelDragOffsetX=event.clientX-r.left;
  panelDragOffsetY=event.clientY-r.top;

  // Switch from CSS bottom/right anchoring to explicit left/top coordinates.
  builderPanel.style.left=`${r.left}px`;
  builderPanel.style.top=`${r.top}px`;
  builderPanel.style.right="auto";
  builderPanel.style.bottom="auto";
  builderPanel.classList.add("dragging");
  builderDragHandle.setPointerCapture?.(event.pointerId);
  event.preventDefault();
  event.stopPropagation();
});

builderDragHandle.addEventListener("pointermove",event=>{
  if(event.pointerId!==panelDragPointer)return;
  const c=clampPanelToViewport(
    event.clientX-panelDragOffsetX,
    event.clientY-panelDragOffsetY
  );
  builderPanel.style.left=`${c.left}px`;
  builderPanel.style.top=`${c.top}px`;
  event.preventDefault();
  event.stopPropagation();
});

function finishPanelDrag(event){
  if(event.pointerId!==panelDragPointer)return;
  panelDragPointer=null;
  builderPanel.classList.remove("dragging");
  savePanelPosition();
  event.preventDefault();
  event.stopPropagation();
}
builderDragHandle.addEventListener("pointerup",finishPanelDrag);
builderDragHandle.addEventListener("pointercancel",finishPanelDrag);

addEventListener("resize",()=>{
  if(!builderState.enabled)return;
  const r=builderPanel.getBoundingClientRect();
  const c=clampPanelToViewport(r.left,r.top);
  builderPanel.style.left=`${c.left}px`;
  builderPanel.style.top=`${c.top}px`;
  builderPanel.style.right="auto";
  builderPanel.style.bottom="auto";
  savePanelPosition();
});

let builderLoadTried=false;
function tryLoadBuilderLayout(){
  if(builderLoadTried)return;
  if(builderState.templates.tree&&builderState.templates.palm&&builderState.templates.pine&&builderState.templates.house){
    builderLoadTried=true;
    loadLayout();
  }
}

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.04);
  updateDayNight(dt);

  let x=joy.x,z=joy.y;
  if(keys.a||keys.arrowleft)x-=1;
  if(keys.d||keys.arrowright)x+=1;
  if(keys.w||keys.arrowup)z-=1;
  if(keys.s||keys.arrowdown)z+=1;

  const magnitude=Math.hypot(x,z);
  const moving=magnitude>.05;

  let runFxRunning=false;
  let runFxDir=new THREE.Vector3();

  if(moving && !specialAction){
    x/=Math.max(1,magnitude);
    z/=Math.max(1,magnitude);

    // Camera-relative movement: joystick directions follow the screen
    // even after rotating the orbit camera.
    const camForward=new THREE.Vector3();
    camera.getWorldDirection(camForward);
    camForward.y=0;
    camForward.normalize();

    const camRight=new THREE.Vector3()
      .crossVectors(camForward,new THREE.Vector3(0,1,0))
      .normalize();

    const moveDir=new THREE.Vector3()
      .addScaledVector(camRight,x)
      .addScaledVector(camForward,-z)
      .normalize();

    const run=magnitude>.78;
    const speed=run?5.2:2.4;
    runFxRunning=run;
    runFxDir.copy(moveDir);

    player.position.x+=moveDir.x*speed*dt;
    player.position.z+=moveDir.z*speed*dt;

    const targetAngle=Math.atan2(moveDir.x,moveDir.z);
    let d=Math.atan2(
      Math.sin(targetAngle-player.rotation.y),
      Math.cos(targetAngle-player.rotation.y)
    );
    player.rotation.y+=d*Math.min(1,10*dt);

    fadeTo(run?'Running':'Walking',.15,true,run?1:.9);
  } else if(!specialAction){
    fadeTo('Idle_9',.18,true,1);
  }

  updateRunFx(player.position,runFxDir,runFxRunning,dt);
  contactShadow.position.x=player.position.x;
  contactShadow.position.z=player.position.z;
  contactMaterial.opacity=(gameHour>=19||gameHour<6)?.38:.31;

  const footSide=.115, footForward=.035;
  const fx=Math.sin(player.rotation.y), fz=Math.cos(player.rotation.y);
  const sx=Math.cos(player.rotation.y), sz=-Math.sin(player.rotation.y);
  leftFootShadow.position.set(
    player.position.x-sx*footSide+fx*footForward,.026,
    player.position.z-sz*footSide+fz*footForward
  );
  rightFootShadow.position.set(
    player.position.x+sx*footSide+fx*footForward,.026,
    player.position.z+sz*footSide+fz*footForward
  );
  leftFootShadow.material.opacity=rightFootShadow.material.opacity=(gameHour>=19||gameHour<6)?.40:.34;

  if(mixer) mixer.update(dt);

  player.position.x=THREE.MathUtils.clamp(player.position.x,-18,18);
  player.position.z=THREE.MathUtils.clamp(player.position.z,-18,18);
  
  player.position.y=getWalkableSurfaceHeight(player.position.x,player.position.z);

  // Keep contact shadows attached to the current terrain elevation.
  contactShadow.position.y=player.position.y+.022;
  leftFootShadow.position.y=player.position.y+.026;
  rightFootShadow.position.y=player.position.y+.026;

  // Dynamic shadow: keep shadow coverage centered on Liora,
  // while preserving the day/night sun direction.
  sun.position.set(
    player.position.x+sunOffset.x,
    player.position.y+sunOffset.y,
    player.position.z+sunOffset.z
  );
  sun.target.position.set(player.position.x,player.position.y,player.position.z);
  sun.target.updateMatrixWorld();

  look.set(player.position.x,player.position.y+.7,player.position.z);

  if(!followReady){
    followTarget.copy(look);
    followReady=true;
  }else{
    deltaToFollow.copy(look).sub(followTarget);
    deltaToFollow.y=0;
    const followDistance=deltaToFollow.length();

    if(followDistance>followDeadZone){
      desiredFollow.copy(look);
      desiredFollow.addScaledVector(
        deltaToFollow,
        -followDeadZone/followDistance
      );
      followTarget.lerp(
        desiredFollow,
        1-Math.exp(-followSharpness*dt)
      );
    }
    followTarget.y=look.y;
  }

  const desiredCamera=followTarget.clone().add(cameraOffset());
  camera.position.lerp(
    desiredCamera,
    1-Math.exp(-cameraSharpness*dt)
  );
  camera.lookAt(followTarget);
  skyDome.position.copy(camera.position);
  stars.position.copy(camera.position);
  renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
