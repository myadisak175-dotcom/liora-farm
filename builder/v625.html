<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Liora — loading Builder v6.25…</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#a8d8ec;font-family:system-ui,sans-serif}
#boot{position:fixed;inset:0;display:grid;place-items:center;color:#fff;font-weight:800;text-shadow:0 2px 5px #234}
#boot>div{background:#173c4bcc;padding:16px 20px;border-radius:18px;max-width:84vw}
#boot small{display:block;margin-top:6px;font-weight:500}
</style>
</head>
<body>
<div id="boot"><div id="boot-box">กำลังโหลด Builder v6.25…<small>Ground Footprint Collision • Tree Duo • House • Crate Set</small></div></div>
<script>
(async()=>{
  try{
    const r=await fetch('./v624.html?v=624gameplay2',{cache:'no-store'});
    if(!r.ok)throw new Error(`Builder v6.24 HTTP ${r.status}`);
    let source=await r.text();

    // Tree Duo: two independent trunk footprints. Collision stays 2D and compact.
    const oldTree=`  tree:{colliders:[\n    {type:\"circle\",x:-.42,z:.02,radius:.34,height:1.5},\n    {type:\"circle\",x:.42,z:-.02,radius:.34,height:1.5}\n  ]},`;
    const newTree=`  tree:{colliders:[\n    {type:\"circle\",x:-.50,z:.08,radius:.31,height:.25},\n    {type:\"circle\",x:.56,z:-.08,radius:.31,height:.25}\n  ]},`;
    if(!source.includes(oldTree))throw new Error('Tree Duo profile anchor missing');
    source=source.replace(oldTree,newTree);

    // Crate set: several small footprints instead of large boxes through the visible stack.
    const oldCrates=`  crate_set:{colliders:[\n    {type:\"box\",x:-.55,z:.02,width:.82,depth:.78,height:1.05},\n    {type:\"box\",x:.42,z:-.18,width:.82,depth:.78,height:1.05},\n    {type:\"box\",x:.18,z:.48,width:.72,depth:.66,height:.78}\n  ]},`;
    const newCrates=`  crate_set:{colliders:[\n    {type:\"box\",x:-.48,z:.02,width:.60,depth:.58,height:.22},\n    {type:\"box\",x:.34,z:-.20,width:.60,depth:.58,height:.22},\n    {type:\"box\",x:.10,z:.43,width:.56,depth:.54,height:.22}\n  ]},`;
    if(!source.includes(oldCrates))throw new Error('Crate set profile anchor missing');
    source=source.replace(oldCrates,newCrates);

    const oldLamp=`  path_lamp:{colliders:[{type:\"circle\",x:0,z:0,radius:.24,height:1.1}]}\n});`;
    const houseProfiles=`  house:{\n    colliders:[\n      {type:\"box\",x:0,z:.30,width:2.62,depth:1.62,height:.22},\n      {type:\"box\",x:-1.05,z:-.62,width:.52,depth:.48,height:.22},\n      {type:\"box\",x:1.05,z:-.62,width:.52,depth:.48,height:.22}\n    ],\n    interactions:[{type:\"door\",id:\"front_door\",x:0,y:.08,z:-1.08,facing:180,distance:.9}]\n  },\n  house2:{\n    colliders:[\n      {type:\"box\",x:0,z:.26,width:2.68,depth:1.66,height:.22},\n      {type:\"box\",x:-1.06,z:-.66,width:.52,depth:.50,height:.22},\n      {type:\"box\",x:1.06,z:-.66,width:.52,depth:.50,height:.22}\n    ],\n    interactions:[{type:\"door\",id:\"front_door\",x:0,y:.08,z:-1.10,facing:180,distance:.9}]\n  },\n  blue_cottage:{\n    colliders:[\n      {type:\"box\",x:0,z:.26,width:2.56,depth:1.58,height:.22},\n      {type:\"box\",x:-.98,z:-.62,width:.48,depth:.46,height:.22},\n      {type:\"box\",x:.98,z:-.62,width:.48,depth:.46,height:.22}\n    ],\n    interactions:[{type:\"door\",id:\"front_door\",x:0,y:.08,z:-1.04,facing:180,distance:.9}]\n  },\n  path_lamp:{colliders:[{type:\"circle\",x:0,z:0,radius:.24,height:.22}]}\n});`;
    if(!source.includes(oldLamp))throw new Error('House profile injection anchor missing');
    source=source.replace(oldLamp,houseProfiles);

    // Builder authoring starts with guides visible; gameplay/Done hides them.
    const debugOff='const gameplayDebugState={enabled:false,roots:new Map()};';
    const debugOn='const gameplayDebugState={enabled:true,roots:new Map()};';
    if(!source.includes(debugOff))throw new Error('Collision debug state anchor missing');
    source=source.replace(debugOff,debugOn);

    // Debug helpers are children of their holder. This makes rotation/scale/position exact.
    const addRoot='  scene.add(root);\n  gameplayDebugState.roots.set(holder,root);';
    const addRootFixed='  holder.add(root);\n  gameplayDebugState.roots.set(holder,root);';
    if(!source.includes(addRoot))throw new Error('Debug parent anchor missing');
    source=source.replace(addRoot,addRootFixed);

    const removeRoot='  scene.remove(root);\n  root.traverse(o=>{o.geometry?.dispose?.();});';
    const removeRootFixed='  root.parent?.remove(root);\n  root.traverse(o=>{o.geometry?.dispose?.();});';
    if(!source.includes(removeRoot))throw new Error('Debug remove anchor missing');
    source=source.replace(removeRoot,removeRootFixed);

    // Children already inherit holder transforms; do not copy world matrices a second time.
    const updateTransforms=`function updateGameplayDebugTransforms(){\n  if(!gameplayDebugState.enabled)return;\n  for(const [holder,root] of gameplayDebugState.roots){\n    if(!holder?.parent)continue;\n    holder.updateWorldMatrix(true,false);\n    root.matrix.copy(holder.matrixWorld);\n  }\n}`;
    const updateTransformsFixed=`function updateGameplayDebugTransforms(){\n  const visible=gameplayDebugState.enabled && !!builderState?.enabled;\n  for(const [holder,root] of gameplayDebugState.roots){\n    if(!holder?.parent)continue;\n    root.visible=visible;\n  }\n}`;
    if(!source.includes(updateTransforms))throw new Error('Debug transform anchor missing');
    source=source.replace(updateTransforms,updateTransformsFixed);

    // Keep visual guides as thin ground footprints, regardless of collision metadata height.
    const visualHeight='    const h=Math.max(.08,c.height||1);';
    const visualHeightFixed='    const h=.12;';
    if(!source.includes(visualHeight))throw new Error('Debug footprint height anchor missing');
    source=source.replace(visualHeight,visualHeightFixed);

    // Generic interaction markers (door etc.) use amber so they are distinct from sit/vault.
    const markerMat='    const mat=i.type==="vault"?vaultMat:sitMat;';
    const markerMatFixed='    const mat=i.type==="vault"?vaultMat:i.type==="sit"?sitMat:new THREE.MeshBasicMaterial({color:0xffc857,transparent:true,opacity:.95,depthTest:false});';
    if(!source.includes(markerMat))throw new Error('Interaction marker material anchor missing');
    source=source.replace(markerMat,markerMatFixed);

    source=source.replace('Liora — loading Builder v6.24…','Liora — loading Builder v6.25…');
    source=source.replace('Builder v6.24 • LIVE Collision • Sit • Vault • Ground Paint • MapSafe','Builder v6.25 • Ground Footprint Collision • Tree Duo • House • MapSafe');
    source=source.replace('Liora — Home Island Builder v6.24 Live Collision','Liora — Home Island Builder v6.25 Footprint Collision');

    document.open();
    document.write(source);
    document.close();
  }catch(err){
    console.error(err);
    document.querySelector('#boot-box').innerHTML=`เปิด Builder v6.25 ไม่สำเร็จ<small>${String(err?.message||err)}</small><button onclick="location.reload()" style="margin-top:10px;padding:8px 12px">ลองใหม่</button>`;
  }
})();
</script>
</body>
</html>
