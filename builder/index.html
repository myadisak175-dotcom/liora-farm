  if(builderState.templates[assetId])return;\n  builderState.templates[assetId]=model.clone(true);\n  tryLoadBuilderLayout();\n}"],["function tryLoadBuilderLayout(){\n  if(builderLoadTried)return;\n  if(builderState.templates.tree&&builderState.templates.palm&&builderState.templates.pine&&builderState.templates.house){\n    builderLoadTried=true;\n    loadLayout();\n  }\n}","const BUILDER_SAVE_ASSET_IDS=[\n  \"tree\",\"palm\",\"pine\",\"house\",\"house2\",\n  \"grass\",\"crate\",\"wine_barrel\",\"path_tile\",\n  \"wood_bridge\",\"blue_cottage\",\"wood_fence\",\"path_lamp\",\"crate_set\",\"bench\"\n];\n\nfunction tryLoadBuilderLayout(){\n  if(builderLoadTried)return;\n  if(BUILDER_SAVE_ASSET_IDS.every(id=>builderState.templates[id])){\n    builderLoadTried=true;\n    loadLayout();\n  }\n}"],["function loadLayout(){\n  const raw=localStorage.getItem(\"liora-home-island-layout-v3-clean\");\n  if(!raw)return;\n  try{\n    const arr=JSON.parse(raw);\n    if(!Array.isArray(arr))return;\n    for(const item of arr){\n      buildObject(item.assetId,item.x,item.z,item.rotation,item.scale);\n    }\n    if(arr.length)setBuilderMessage(`Loaded ${arr.length} saved objects`);\n  }catch(err){console.warn(\"Layout load failed\",err);}\n}","function loadLayout(){\n  const raw=localStorage.getItem(\"liora-home-island-layout-v3-clean\");\n  if(!raw)return;\n  try{\n    const arr=JSON.parse(raw);\n    if(!Array.isArray(arr))return;\n    let restored=0;\n    for(const item of arr){\n      const obj=buildObject(item.assetId,item.x,item.z,item.rotation,item.scale);\n      if(obj)restored++;\n    }\n    if(restored)setBuilderMessage(`Loaded ${restored} saved objects`);\n  }catch(err){console.warn(\"Layout load failed\",err);}\n}"],["if(holder.userData?.assetId!==\"path_tile\")continue;","if(holder.userData?.assetId!==\"path_tile\" && holder.userData?.assetId!==\"wood_bridge\")continue;"],["const surfaceY=holder.userData?.assetId===\"path_tile\"\n    ? getTerrainHeight(x,z)","const surfaceY=(holder.userData?.assetId===\"path_tile\"||holder.userData?.assetId===\"wood_bridge\")\n    ? getTerrainHeight(x,z)"],["if(assetId===\"path_tile\")o.userData.walkableSurface=true;","if(assetId===\"path_tile\"||assetId===\"wood_bridge\")o.userData.walkableSurface=true;"],["function assetPlacementRadius(assetId){\n  return (assetId===\"house\"||assetId===\"house2\") ? 2.65 : 1.15;\n}","function assetPlacementRadius(assetId){\n  if(assetId===\"house\"||assetId===\"house2\"||assetId===\"blue_cottage\")return 2.65;\n  if(assetId===\"wood_bridge\")return 2.25;\n  if(assetId===\"wood_fence\")return .72;\n  if(assetId===\"path_lamp\")return .55;\n  if(assetId===\"bench\")return 1.0;\n  if(assetId===\"crate_set\")return .95;\n  if(assetId===\"grass\")return .45;\n  if(assetId===\"path_tile\")return .4;\n  return 1.15;\n}"],["  for(const o of builderState.placed){\n    if(!o.parent)continue;\n    const dx=o.position.x-x,dz=o.position.z-z;\n    const minDistance=radius+assetPlacementRadius(o.userData.assetId)*.72;\n    if(Math.hypot(dx,dz)<minDistance)return false;\n  }","  const surfaceAssets=new Set([\"path_tile\",\"wood_bridge\"]);\n  for(const o of builderState.placed){\n    if(!o.parent)continue;\n    const existingId=o.userData.assetId;\n    if(surfaceAssets.has(assetId)||surfaceAssets.has(existingId))continue;\n    const dx=o.position.x-x,dz=o.position.z-z;\n    const minDistance=radius+assetPlacementRadius(existingId)*.72;\n    if(Math.hypot(dx,dz)<minDistance)return false;\n  }"],["if(assetId===\"house\"||assetId===\"house2\") ring.scale.setScalar(2.35);","if(assetId===\"house\"||assetId===\"house2\"||assetId===\"blue_cottage\") ring.scale.setScalar(2.35);\n  if(assetId===\"wood_bridge\") ring.scale.setScalar(2.0);"],["if(assetId===\"house\"||assetId===\"house2\") previewRing.scale.setScalar(2.35);","if(assetId===\"house\"||assetId===\"house2\"||assetId===\"blue_cottage\") previewRing.scale.setScalar(2.35);\n  if(assetId===\"wood_bridge\") previewRing.scale.setScalar(2.0);"],["      <button class=\"asset-card\" data-build-asset=\"path_tile\"><span class=\"thumb\">🧱</span><span>Path</span></button>","      <button class=\"asset-card\" data-build-asset=\"path_tile\"><span class=\"thumb\">🧱</span><span>Path</span></button>\n      <button class=\"asset-card\" data-build-asset=\"wood_bridge\"><span class=\"thumb\">🌉</span><span>Bridge</span></button>\n      <button class=\"asset-card\" data-build-asset=\"blue_cottage\"><span class=\"thumb\">🏘️</span><span>Blue Cottage</span></button>\n      <button class=\"asset-card\" data-build-asset=\"wood_fence\"><span class=\"thumb\">🪵</span><span>Fence</span></button>\n      <button class=\"asset-card\" data-build-asset=\"path_lamp\"><span class=\"thumb\">🏮</span><span>Lamp</span></button>\n      <button class=\"asset-card\" data-build-asset=\"crate_set\"><span class=\"thumb\">📦</span><span>Crate Set</span></button>\n      <button class=\"asset-card\" data-build-asset=\"bench\"><span class=\"thumb\">🪑</span><span>Bench</span></button>"],["document.querySelector('#status').textContent=`7 animations • ${(bytes.length/1024/1024).toFixed(1)} MB ✓`;","document.querySelector('#status').textContent=`7 animations ✓`;"],["  URL.revokeObjectURL(modelURL);\n",""]];
  try{
    let html=await fetch(BASELINE,{cache:"no-store"}).then(r=>{
      if(!r.ok)throw new Error(`Baseline HTTP ${r.status}`);
      return r.text();
    });
    for(let i=0;i<patches.length;i++){
      const [oldText,newText]=patches[i];
      if(!html.includes(oldText))throw new Error(`v6.15 patch ${i+1} anchor missing`);
      html=html.replace(oldText,newText);
    }
    if(!html.includes('assets/models/builder/wood_bridge.glb'))throw new Error("New asset catalog missing");
    if(!html.includes('liora-home-island-layout-v3-clean'))throw new Error("Save key missing");
    document.open();
    document.write(html);
    document.close();
