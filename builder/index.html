(async()=>{

     .replaceAll("Builder v6.17 • Dirt Paint • Night Lamps • MapSafe","Builder v6.18 • Textured Dirt • Soft Edge • MapSafe");
  const a=s.indexOf("function makeDirtTexture(){\\n"),b=s.indexOf("const dirtPaintMaterial=",a);
  if(a<0||b<0)throw Error("dirt anchors");
  const f=`function makeDirtTexture(){\\n  const texture=new THREE.TextureLoader().load(\\\"data:image/webp;base64,${b64.trim()}\\\");\\n  texture.colorSpace=THREE.SRGBColorSpace;\\n  texture.wrapS=texture.wrapT=THREE.RepeatWrapping;\\n  texture.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());\\n  return texture;\\n}\\n\\nfunction makeGroundSoftMask(){\\n  const c=document.createElement(\\\"canvas\\\");c.width=c.height=64;\\n  const x=c.getContext(\\\"2d\\\"),g=x.createRadialGradient(32,32,20,32,32,32);\\n  g.addColorStop(0,\\\"#fff\\\");g.addColorStop(.76,\\\"#fff\\\");g.addColorStop(1,\\\"rgba(255,255,255,0)\\\");\\n  x.fillStyle=g;x.fillRect(0,0,64,64);return new THREE.CanvasTexture(c);\\n}\\n\\n`;

 }catch(e){console.error(e);document.querySelector("#boot").innerHTML=`<div>โหลดไม่สำเร็จ<br><small>${String(e.message||e)}</small><br><button onclick="location.reload()">ลองใหม่</button></div>`}
