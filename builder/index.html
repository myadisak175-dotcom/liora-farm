<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Liora — loading v6.16…</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#a8d8ec;font-family:system-ui,sans-serif}
#boot{position:fixed;inset:0;display:grid;place-items:center;color:white;font-weight:800;text-shadow:0 2px 5px #234}
#boot>div{background:#173c4bcc;padding:16px 20px;border-radius:18px}
</style>
</head>
<body>
<div id="boot"><div>กำลังโหลด Liora v6.16…</div></div>
<script>
(async()=>{
  // Reuse the pinned v6.15 patch manifest, then append only the v6.16 lamp changes.
  const V615_SOURCE="https://raw.githubusercontent.com/myadisak175-dotcom/liora-farm/fae401741916474bbaa0cb7bc4f8e17a07b575fe/builder/index.html";
  try{
    const loaderSource=await fetch(V615_SOURCE,{cache:"no-store"}).then(r=>{
      if(!r.ok)throw new Error(`v6.15 manifest HTTP ${r.status}`);
      return r.text();
    });

    const baselineMatch=loaderSource.match(/const BASELINE="([^"]+)";/);
    const patchesMatch=loaderSource.match(/const patches=(\[[\s\S]*?\]);\n  try\{/);
    if(!baselineMatch||!patchesMatch)throw new Error("อ่าน v6.15 patch manifest ไม่สำเร็จ");

    const BASELINE=baselineMatch[1];
    const patches=Function(`"use strict";return (${patchesMatch[1]});`)();

    patches.push(
      ["Liora — Home Island Builder v6.15 Persistent Asset Pack","Liora — Home Island Builder v6.16 Night Lamps"],
      ["Builder v6.15 • 6 new assets • Persistent models • MapSafe","Builder v6.16 • automatic night lamps • Persistent models • MapSafe"],
      [
        "  holder.add(model);\n  const ring=createSelectionRing();",
        "  holder.add(model);\n\n  // v6.16: placed path lamps emit warm light automatically at night.\n  if(assetId===\"path_lamp\"){\n    const lampLight=new THREE.PointLight(0xffb35a,0,7.5,1.7);\n    lampLight.position.set(0,1.72,0);\n    lampLight.castShadow=false;\n    holder.userData.builderLamp=lampLight;\n    holder.add(lampLight);\n  }\n\n  const ring=createSelectionRing();"
      ],
      [
        "// ---------------- Home Island Builder v2 ----------------",
        "// ---------------- Automatic path lamps ----------------\nfunction getNightLampAmount(hour){\n  if(hour>=19.0 || hour<5.0)return 1;\n  if(hour>=17.5 && hour<19.0)return THREE.MathUtils.smoothstep(hour,17.5,19.0);\n  if(hour>=5.0 && hour<6.5)return 1-THREE.MathUtils.smoothstep(hour,5.0,6.5);\n  return 0;\n}\n\nfunction updateBuilderNightLights(){\n  const amount=getNightLampAmount(gameHour);\n  for(const obj of builderState.placed){\n    const light=obj?.userData?.builderLamp;\n    if(!light)continue;\n    light.intensity=2.4*amount;\n    light.distance=7.5;\n  }\n}\n\n// ---------------- Home Island Builder v2 ----------------"
      ],
      [
        "  renderer.render(scene,camera);",
        "  updateBuilderNightLights();\n  renderer.render(scene,camera);"
      ]
    );

    let html=await fetch(BASELINE,{cache:"no-store"}).then(r=>{
      if(!r.ok)throw new Error(`Baseline HTTP ${r.status}`);
      return r.text();
    });

    for(let i=0;i<patches.length;i++){
      const [oldText,newText]=patches[i];
      if(!html.includes(oldText))throw new Error(`v6.16 patch ${i+1} anchor missing`);
      html=html.replace(oldText,newText);
    }

    if(!html.includes('holder.userData.builderLamp=lampLight'))throw new Error("Night lamp code missing");
    if(!html.includes('liora-home-island-layout-v3-clean'))throw new Error("Save key missing");
    if(!html.includes('assets/models/builder/path_lamp.glb'))throw new Error("Path lamp asset missing");

    document.open();
    document.write(html);
    document.close();
  }catch(err){
    console.error(err);
    document.querySelector("#boot").innerHTML=`<div>โหลด Builder ไม่สำเร็จ<br><small>${String(err.message||err)}</small><br><button onclick="location.reload()">ลองใหม่</button></div>`;
  }
})();
</script>
</body>
</html>
