<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Liora — loading v6.20…</title>
<style>html,body{margin:0;width:100%;height:100%;background:#a8d8ec;font-family:system-ui,sans-serif}#boot{position:fixed;inset:0;display:grid;place-items:center;color:#fff;font-weight:800;text-shadow:0 2px 5px #234}#boot>div{background:#173c4bcc;padding:16px 20px;border-radius:18px}</style>
</head>
<body><div id="boot"><div>กำลังโหลด Liora v6.20…</div></div>
<script>
(async()=>{
 const V617="https://raw.githubusercontent.com/myadisak175-dotcom/liora-farm/b5db07b19ece045e3d65c56fa5adb1710a9139ab/builder/index.html";
 const TEX="https://raw.githubusercontent.com/myadisak175-dotcom/liora-farm/main/builder/assets/textures/dirt_brush.b64";
 try{
  const [source,b64]=await Promise.all([
   fetch(V617,{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("v6.17 HTTP "+r.status);return r.text()}),
   fetch(TEX,{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("texture HTTP "+r.status);return r.text()})
  ]);
  const match=source.match(/const groundPatches=(\[[\s\S]*?\]);\n  try\{/);
  if(!match)throw Error("Ground patch manifest missing");
  const patches=JSON.parse(match[1]);
  const textureURI="data:image/webp;base64,"+b64.trim();
  const gp=patches.find(p=>p[1]&&p[1].includes("function makeDirtTexture()"));
  if(!gp)throw Error("Ground paint patch missing");

  gp[1]=gp[1].replace(/function makeDirtTexture\(\)\{[\s\S]*?return texture;\n\}/,`function makeDirtTexture(){
  const texture=new THREE.TextureLoader().load("${textureURI}");
  texture.colorSpace=THREE.SRGBColorSpace;
  texture.wrapS=texture.wrapT=THREE.RepeatWrapping;
  texture.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
  return texture;
}`);

  gp[1]=gp[1].replace('const dirtPaintMaterial=new THREE.MeshStandardMaterial({',`function makeEdgeMask(){
  const c=document.createElement("canvas");c.width=c.height=128;
  const x=c.getContext("2d"),g=x.createRadialGradient(64,64,25,64,64,64);
  g.addColorStop(0,"rgba(255,255,255,1)");g.addColorStop(.55,"rgba(255,255,255,.92)");g.addColorStop(.82,"rgba(255,255,255,.45)");g.addColorStop(1,"rgba(255,255,255,0)");
  x.fillStyle=g;x.fillRect(0,0,128,128);return new THREE.CanvasTexture(c);
}
const edgePaintMaterial=new THREE.MeshStandardMaterial({map:makeDirtTexture(),alphaMap:makeEdgeMask(),transparent:true,alphaTest:.03,roughness:1,metalness:0,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2});

const dirtPaintMaterial=new THREE.MeshStandardMaterial({`);
  gp[1]=gp[1].replace('const mesh=new THREE.Mesh(geometry,dirtPaintMaterial);','const mesh=new THREE.Mesh(geometry,type==="edge"?edgePaintMaterial:dirtPaintMaterial);');
  gp[1]=gp[1].replace('else if(groundPaintState.mode==="dirt")createGroundPaintTile(ix,iz,"dirt");','else if(groundPaintState.mode==="dirt")createGroundPaintTile(ix,iz,"dirt");\n      else if(groundPaintState.mode==="edge"){removeGroundPaintTile(ix,iz);createGroundPaintTile(ix,iz,"edge");}');
  gp[1]=gp[1].replace('const erase=document.querySelector("#ground-erase-btn");','const erase=document.querySelector("#ground-erase-btn");\n  const edge=document.querySelector("#ground-edge-btn");');
  gp[1]=gp[1].replace('erase?.classList.toggle("active",groundPaintState.mode==="erase");','erase?.classList.toggle("active",groundPaintState.mode==="erase");\n  edge?.classList.toggle("active",groundPaintState.mode==="edge");');
  gp[1]=gp[1].replace('groundPaintState.mode==="dirt"\n      ?"Dirt Paint • ลากนิ้วบนพื้นเพื่อระบาย"','groundPaintState.mode==="dirt"\n      ?"Dirt Paint • ลากนิ้วบนพื้นเพื่อระบาย"\n      :groundPaintState.mode==="edge"\n      ?"Edge Brush • ลากตามขอบดินเพื่อเก็บขอบเอง"');
  gp[1]=gp[1].replace('document.querySelector("#ground-erase-btn")?.addEventListener("click",()=>setGroundPaintMode("erase"));','document.querySelector("#ground-erase-btn")?.addEventListener("click",()=>setGroundPaintMode("erase"));\n  document.querySelector("#ground-edge-btn")?.addEventListener("click",()=>setGroundPaintMode("edge"));');

  const ui=patches.find(p=>p[1]&&p[1].includes('id="ground-dirt-btn"'));
  if(!ui)throw Error("Ground UI patch missing");
  ui[1]=ui[1].replace('<button class="asset-card" id="ground-erase-btn">','<button class="asset-card" id="ground-edge-btn"><span class="thumb">🖌️</span><span>Edge</span></button>\n      <button class="asset-card" id="ground-erase-btn">');

  patches[0]=["Liora — Home Island Builder v6.16 Night Lamps","Liora — Home Island Builder v6.20 Manual Edge Brush"];
  patches[1]=["Builder v6.16 • automatic night lamps • Persistent models • MapSafe","Builder v6.20 • Dirt + Edge Brush • Stable Paint • MapSafe"];
  const patched=source.replace(match[0],"const groundPatches="+JSON.stringify(patches)+";\n  try{");
  document.open();document.write(patched);document.close();
 }catch(e){console.error(e);document.querySelector('#boot').innerHTML=`<div>โหลด Builder ไม่สำเร็จ<br><small>${String(e.message||e)}</small><br><button onclick="location.reload()">ลองใหม่</button></div>`}
})();
</script></body></html>
