<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Liora — loading v6.19…</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#a8d8ec;font-family:system-ui,sans-serif}
#boot{position:fixed;inset:0;display:grid;place-items:center;color:#fff;font-weight:800;text-shadow:0 2px 5px #234}
#boot>div{background:#173c4bcc;padding:16px 20px;border-radius:18px}
</style>
</head>
<body>
<div id="boot"><div>กำลังโหลด Liora v6.19…</div></div>
<script>
(async()=>{
  const V617="https://raw.githubusercontent.com/myadisak175-dotcom/liora-farm/b5db07b19ece045e3d65c56fa5adb1710a9139ab/builder/index.html";
  const TEX="https://raw.githubusercontent.com/myadisak175-dotcom/liora-farm/main/builder/assets/textures/dirt_brush.b64";

  try{
    const [source,b64]=await Promise.all([
      fetch(V617,{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("v6.17 HTTP "+r.status);return r.text();}),
      fetch(TEX,{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("texture HTTP "+r.status);return r.text();})
    ]);

    // Parse v6.17's patch array as DATA instead of editing escaped source by hand.
    const match=source.match(/const groundPatches=(\[[\s\S]*?\]);\n  try\{/);
    if(!match)throw new Error("Ground patch manifest missing");

    const patches=JSON.parse(match[1]);
    const textureURI="data:image/webp;base64,"+b64.trim();

    const groundPatch=patches.find(p=>p[1]&&p[1].includes("function makeDirtTexture()"));
    if(!groundPatch)throw new Error("Ground paint patch missing");

    groundPatch[1]=groundPatch[1].replace(
      /function makeDirtTexture\(\)\{[\s\S]*?return texture;\n\}/,
      `function makeDirtTexture(){
  const texture=new THREE.TextureLoader().load("${textureURI}");
  texture.colorSpace=THREE.SRGBColorSpace;
  texture.wrapS=texture.wrapT=THREE.RepeatWrapping;
  texture.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
  return texture;
}`
    );

    // Keep all working v6.17 pointer/drag/save code exactly intact.
    patches[0]=[
      "Liora — Home Island Builder v6.16 Night Lamps",
      "Liora — Home Island Builder v6.19 Textured Ground Paint"
    ];
    patches[1]=[
      "Builder v6.16 • automatic night lamps • Persistent models • MapSafe",
      "Builder v6.19 • Textured Dirt • Stable Paint • MapSafe"
    ];

    const patchedSource=source.replace(
      match[0],
      "const groundPatches="+JSON.stringify(patches)+";\n  try{"
    );

    document.open();
    document.write(patchedSource);
    document.close();
  }catch(err){
    console.error(err);
    document.querySelector("#boot").innerHTML=
      `<div>โหลด Builder ไม่สำเร็จ<br><small>${String(err.message||err)}</small><br><button onclick="location.reload()">ลองใหม่</button></div>`;
  }
})();
</script>
</body>
</html>
