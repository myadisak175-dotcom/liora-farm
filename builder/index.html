<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>Liora — Island Builder</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#C9DEE0}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#stage{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
#error{position:fixed;inset:20px;z-index:100;display:none;align-items:center;justify-content:center;padding:20px;border-radius:18px;background:#241B18E8;color:#FFE8D0;font:600 14px/1.5 system-ui;white-space:pre-wrap;text-align:center}
</style>
</head>
<body>
<div id="stage"></div>
<div id="error"></div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { createBuilderState } from "../src/editor/builder-state.js";
import { createBuilderController } from "../src/editor/builder-controller.js";
import { createLayoutStore } from "../src/editor/layout-store.js";
import { createBuilderAssetLoader } from "../src/editor/asset-loader.js";
import { loadCatalog } from "../src/editor/asset-catalog.js";
import { createBuilderView } from "../src/editor/builder-view.js";
import { createBuilderUI } from "../src/editor/builder-ui.js";

const stage=document.querySelector("#stage");
const errorBox=document.querySelector("#error");

const WORLD_V3=[
  // Home farm — one readable focal cluster.
  {id:"v3-home",assetId:"house",x:-9,z:-8,rotation:.12,scale:1},
  {id:"v3-home-bench",assetId:"bench",x:-5,z:-7,rotation:-.18,scale:1},
  {id:"v3-home-lamp",assetId:"path_lamp",x:-6,z:-4.5,rotation:0,scale:1},
  {id:"v3-home-crates",assetId:"crate_set",x:-12,z:-8,rotation:.45,scale:1},
  {id:"v3-home-barrel",assetId:"wine_barrel",x:-11,z:-11,rotation:.1,scale:1},
  {id:"v3-fence-a",assetId:"wood_fence",x:-12,z:-3,rotation:0,scale:1},
  {id:"v3-fence-b",assetId:"wood_fence",x:-10,z:-3,rotation:0,scale:1},
  {id:"v3-fence-c",assetId:"wood_fence",x:-8,z:-3,rotation:0,scale:1},

  // Continuous 1.5 m path: no gaps, one simple bend toward village.
  {id:"v3-path-01",assetId:"path_tile",x:-6,z:-3,rotation:0,scale:1},
  {id:"v3-path-02",assetId:"path_tile",x:-4.5,z:-3,rotation:0,scale:1},
  {id:"v3-path-03",assetId:"path_tile",x:-3,z:-3,rotation:0,scale:1},
  {id:"v3-path-04",assetId:"path_tile",x:-1.5,z:-3,rotation:0,scale:1},
  {id:"v3-path-05",assetId:"path_tile",x:0,z:-3,rotation:0,scale:1},
  {id:"v3-path-06",assetId:"path_tile",x:1.5,z:-3,rotation:0,scale:1},
  {id:"v3-path-07",assetId:"path_tile",x:1.5,z:-1.5,rotation:0,scale:1},
  {id:"v3-path-08",assetId:"path_tile",x:1.5,z:0,rotation:0,scale:1},
  {id:"v3-path-09",assetId:"path_tile",x:1.5,z:1.5,rotation:0,scale:1},
  {id:"v3-path-10",assetId:"path_tile",x:1.5,z:3,rotation:0,scale:1},
  {id:"v3-path-11",assetId:"path_tile",x:1.5,z:4.5,rotation:0,scale:1},
  {id:"v3-path-12",assetId:"path_tile",x:1.5,z:6,rotation:0,scale:1},
  {id:"v3-path-13",assetId:"path_tile",x:1.5,z:7.5,rotation:0,scale:1},
  {id:"v3-path-14",assetId:"path_tile",x:3,z:7.5,rotation:0,scale:1},
  {id:"v3-path-15",assetId:"path_tile",x:4.5,z:7.5,rotation:0,scale:1},
  {id:"v3-path-16",assetId:"path_tile",x:6,z:7.5,rotation:0,scale:1},

  // Small village cluster.
  {id:"v3-village-a",assetId:"house2",x:9,z:10,rotation:-.45,scale:1},
  {id:"v3-village-b",assetId:"blue_cottage",x:15,z:8,rotation:-.85,scale:1},
  {id:"v3-village-bench",assetId:"bench",x:8,z:6,rotation:.3,scale:1},
  {id:"v3-village-lamp",assetId:"path_lamp",x:6,z:6,rotation:0,scale:1},
  {id:"v3-village-crates",assetId:"crate_set",x:14,z:11,rotation:.35,scale:1},

  // Forest masses — grouped instead of evenly spaced around a ring.
  {id:"v3-tree-01",assetId:"tree",x:-20,z:-15,rotation:.2,scale:1.35},
  {id:"v3-tree-02",assetId:"pine",x:-18,z:-10,rotation:.7,scale:1.25},
  {id:"v3-tree-03",assetId:"tree",x:-21,z:-4,rotation:1.1,scale:1.45},
  {id:"v3-tree-04",assetId:"pine",x:-19,z:3,rotation:.35,scale:1.35},
  {id:"v3-tree-05",assetId:"tree",x:-16,z:10,rotation:.8,scale:1.4},
  {id:"v3-tree-06",assetId:"pine",x:-11,z:16,rotation:1.3,scale:1.3},
  {id:"v3-tree-07",assetId:"tree",x:17,z:17,rotation:.4,scale:1.4},
  {id:"v3-tree-08",assetId:"pine",x:21,z:12,rotation:1,scale:1.3},
  {id:"v3-tree-09",assetId:"tree",x:22,z:5,rotation:.6,scale:1.45},
  {id:"v3-tree-10",assetId:"pine",x:21,z:-3,rotation:1.2,scale:1.3},
  {id:"v3-tree-11",assetId:"tree",x:17,z:-12,rotation:.25,scale:1.45},
  {id:"v3-tree-12",assetId:"pine",x:10,z:-18,rotation:.9,scale:1.3},
  {id:"v3-tree-13",assetId:"tree",x:2,z:-21,rotation:.5,scale:1.4},

  // Sparse ground accents.
  {id:"v3-grass-01",assetId:"grass",x:-4,z:-11,rotation:.2,scale:1},
  {id:"v3-grass-02",assetId:"grass",x:-1,z:-8,rotation:1.2,scale:.9},
  {id:"v3-grass-03",assetId:"grass",x:5,z:-5,rotation:.7,scale:1},
  {id:"v3-grass-04",assetId:"grass",x:7,z:1,rotation:1.6,scale:.9},
  {id:"v3-grass-05",assetId:"grass",x:-5,z:9,rotation:.3,scale:1}
];

function addWorldBackdrop(scene){
  const near=new THREE.MeshStandardMaterial({color:0x84978B,roughness:1,metalness:0,flatShading:true});
  const far=new THREE.MeshStandardMaterial({color:0xA5B3AC,roughness:1,metalness:0,flatShading:true});
  const geometry=new THREE.ConeGeometry(1,1,7,2);
  const ring=new THREE.Group();
  const mountains=[
    [-105,-95,22,20,1.15],[-58,-118,18,16,.9],[-5,-126,26,24,1.25],[48,-116,20,18,1],[96,-92,27,25,1.2],
    [120,-46,19,18,.95],[128,4,25,23,1.1],[118,55,21,20,1],[91,101,24,22,1.15],[42,121,19,17,.9],
    [-10,128,27,25,1.2],[-64,116,21,19,1],[-106,88,25,23,1.1],[-126,36,19,18,.9],[-126,-33,24,22,1.05]
  ];
  mountains.forEach(([x,z,w,h,d],i)=>{
    const m=new THREE.Mesh(geometry,i%3===0?far:near);
    m.position.set(x,h*.47-2,z);m.scale.set(w,h,w*d);m.rotation.y=(i*.73)%Math.PI;
    m.castShadow=false;m.receiveShadow=false;ring.add(m);
  });
  scene.add(ring);
}

async function boot(){
  let catalog;
  try{catalog=await loadCatalog({url:"../assets/catalog.json",root:"../"});}
  catch(error){errorBox.style.display="flex";errorBox.textContent=`โหลดรายการ asset ไม่สำเร็จ\n${error?.message??error}`;throw error;}

  const sky=0xC9DEE0;
  const scene=new THREE.Scene();scene.background=new THREE.Color(sky);scene.fog=new THREE.Fog(sky,62,190);
  const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.1,600);camera.position.set(20,15,24);
  const renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight,false);
  renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.03;stage.appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0xE7F3EF,0x526146,1.45));
  const sun=new THREE.DirectionalLight(0xFFE2A8,2.5);sun.position.set(-28,13,20);sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-42;sun.shadow.camera.right=42;sun.shadow.camera.top=42;sun.shadow.camera.bottom=-42;scene.add(sun);

  const ground=new THREE.Mesh(new THREE.PlaneGeometry(90,90),new THREE.MeshStandardMaterial({color:0x789A58,roughness:1}));
  ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);addWorldBackdrop(scene);

  const orbit=new OrbitControls(camera,renderer.domElement);orbit.enableDamping=true;orbit.dampingFactor=.09;
  orbit.maxPolarAngle=Math.PI*.47;orbit.minDistance=6;orbit.maxDistance=58;orbit.target.set(0,0,0);

  const state=createBuilderState();const layoutStore=createLayoutStore();
  const controller=createBuilderController({state,catalog,layoutStore});
  const assetLoader=createBuilderAssetLoader({gltfLoader:new GLTFLoader()});
  const view=createBuilderView({scene,camera,renderer,orbit,assetLoader});
  const ui=createBuilderUI({mount:document.body,controller,view,catalog});

  controller.load();
  const params=new URLSearchParams(location.search);
  if(params.get("world")==="v3"){
    controller.items.splice(0,controller.items.length,...WORLD_V3.map(item=>({...item})));
    controller.save();
  }
  await view.syncItems(controller.items);

  orbit.addEventListener("start",()=>{ui.element.style.opacity=".18";});
  orbit.addEventListener("end",()=>{ui.element.style.opacity="1";});

  let downAt=null;
  renderer.domElement.addEventListener("pointerdown",event=>{downAt={x:event.clientX,y:event.clientY};});
  renderer.domElement.addEventListener("pointerup",event=>{
    if(!downAt)return;const moved=Math.hypot(event.clientX-downAt.x,event.clientY-downAt.y);downAt=null;
    if(moved>=10||controller.isPlacing)return;
    const id=view.pickAt(event.clientX,event.clientY);
    if(id){controller.selectItem(id);view.highlight(id);ui.setSelection(id);}
    else{controller.clearSelection();view.highlight(null);ui.setSelection(null);}
  });

  function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
  addEventListener("resize",resize);
  renderer.setAnimationLoop(()=>{orbit.update();view.update();renderer.render(scene,camera);});
}

boot().catch(error=>{console.error("Builder boot failed",error);errorBox.style.display="flex";errorBox.textContent=`Builder error\n${error?.message??error}`;});
</script>
</body>
</html>
