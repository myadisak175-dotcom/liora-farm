function addWorldBackdrop(scene) {
  const mountainMaterial = new THREE.MeshStandardMaterial({
    color: 0x78907B,
    roughness: 1,
    metalness: 0,
    flatShading: true,
  });
  const farMountainMaterial = new THREE.MeshStandardMaterial({
    color: 0x91A69A,
    roughness: 1,
    metalness: 0,
    flatShading: true,
  });
  const baseGeometry = new THREE.ConeGeometry(1, 1, 7, 2);
  const ring = new THREE.Group();
  const mountains = [
    [-48,-50,16,19,1.15],[-28,-58,13,15,.9],[-6,-61,18,23,1.25],[20,-58,14,18,1],[43,-49,20,25,1.2],
    [58,-27,14,18,.9],[61,1,19,24,1.1],[58,30,15,20,1],[43,51,18,22,1.15],[18,59,14,18,.9],
    [-8,62,20,25,1.2],[-34,57,15,19,1],[-53,42,19,23,1.1],[-61,17,14,18,.9],[-61,-15,18,22,1.05]
  ];
  mountains.forEach(([x,z,w,h,d], index) => {
    const mountain = new THREE.Mesh(baseGeometry, index % 3 === 0 ? farMountainMaterial : mountainMaterial);
    mountain.position.set(x, h * .46 - 1.5, z);
    mountain.scale.set(w, h, w * d);
    mountain.rotation.y = (index * 0.73) % Math.PI;
    mountain.receiveShadow = false;
    mountain.castShadow = false;
    ring.add(mountain);
  });
  scene.add(ring);
}

async function boot() {
  let catalog;
  try {
    catalog = await loadCatalog({ url: "../assets/catalog.json", root: "../" });
  } catch (error) {
    errorBox.style.display = "flex";
    errorBox.textContent = `โหลดรายการ asset ไม่สำเร็จ\n${error?.message ?? error}`;
    throw error;
  }

  const sky = 0xC9DEE0;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(sky);
  scene.fog = new THREE.Fog(sky, 34, 105);

  const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.1, 400);
  camera.position.set(14, 11, 16);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight, false);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  stage.appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0xE7F3EF, 0x526146, 1.45));
  const sun = new THREE.DirectionalLight(0xFFE2A8, 2.65);
  sun.position.set(-24, 12, 18);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -34;
  sun.shadow.camera.right = 34;
  sun.shadow.camera.top = 34;
  sun.shadow.camera.bottom = -34;
  scene.add(sun);

  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(70, 70),
    new THREE.MeshStandardMaterial({ color: 0x789A58, roughness: 1 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);
  addWorldBackdrop(scene);

  const orbit = new OrbitControls(camera, renderer.domElement);
  orbit.enableDamping = true;
  orbit.dampingFactor = 0.09;
  orbit.maxPolarAngle = Math.PI * 0.47;
  orbit.minDistance = 6;
  orbit.maxDistance = 46;
  orbit.target.set(0, 0, 0);

  const state = createBuilderState();
  const layoutStore = createLayoutStore();
  const controller = createBuilderController({ state, catalog, layoutStore });
  const assetLoader = createBuilderAssetLoader({ gltfLoader: new GLTFLoader() });
  const view = createBuilderView({ scene, camera, renderer, orbit, assetLoader });
  const ui = createBuilderUI({ mount: document.body, controller, view, catalog });

  controller.load();
  const params = new URLSearchParams(location.search);
  if (params.get("world") === "v1") {
    controller.items.splice(0, controller.items.length, ...WORLD_V1.map((item) => ({ ...item })));
    controller.save();
    history.replaceState(null, "", location.pathname);
  }
  await view.syncItems(controller.items);

  orbit.addEventListener("start", () => { ui.element.style.opacity = ".18"; });
  orbit.addEventListener("end", () => { ui.element.style.opacity = "1"; });

  let downAt = null;
  renderer.domElement.addEventListener("pointerdown", (event) => {
    downAt = { x: event.clientX, y: event.clientY };
  });
  renderer.domElement.addEventListener("pointerup", (event) => {
    if (!downAt) return;
    const moved = Math.hypot(event.clientX - downAt.x, event.clientY - downAt.y);
    downAt = null;
    if (moved >= 10 || controller.isPlacing) return;

    const id = view.pickAt(event.clientX, event.clientY);
    if (id) {
      controller.selectItem(id);
      view.highlight(id);
      ui.setSelection(id);
    } else {
      controller.clearSelection();
      view.highlight(null);
      ui.setSelection(null);
    }
  });

  function resize() {
    renderer.setSize(innerWidth, innerHeight, false);
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
  }
  addEventListener("resize", resize);

  renderer.setAnimationLoop(() => {
    orbit.update();
    view.update();
    renderer.render(scene, camera);
  });
}

boot().catch((error) => {
  console.error("Builder boot failed", error);
});
</script>
