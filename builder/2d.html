<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Liora's Farm — 2D</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#b9df8c;font-family:system-ui,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}#tip{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:2;background:#173c4bdd;color:#fff;padding:9px 13px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}#joy{position:fixed;left:22px;bottom:24px;width:112px;height:112px;border:2px solid #ffffff99;border-radius:50%;background:#173c4b44;z-index:2}#stick{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:#fff;border:2px solid #173c4b88}
</style></head><body><div id="tip">🌱 Liora's Farm • โหมด 2D</div><canvas id="game"></canvas><div id="joy"><div id="stick"></div></div><script>
const c=document.querySelector('#game'),x=c.getContext('2d'),joy=document.querySelector('#joy'),stick=document.querySelector('#stick');let dpr=1,W=0,H=0,jid=null,jx=0,jy=0,t=0,p={x:.38,y:.60};function size(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',size);size();function joyMove(e){const r=joy.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),m=Math.hypot(dx,dy)||1,k=Math.min(1,38/m),a=dx*k,b=dy*k;jx=a/38;jy=b/38;stick.style.transform=`translate(${a}px,${b}px)`}joy.onpointerdown=e=>{jid=e.pointerId;joy.setPointerCapture(jid);joyMove(e)};joy.onpointermove=e=>{if(e.pointerId===jid)joyMove(e)};function stop(e){if(e.pointerId===jid){jid=null;jx=jy=0;stick.style.transform='translate(0,0)'}}joy.onpointerup=joy.onpointercancel=stop;addEventListener('keydown',e=>{if(e.key==='ArrowLeft')jx=-1;if(e.key==='ArrowRight')jx=1;if(e.key==='ArrowUp')jy=-1;if(e.key==='ArrowDown')jy=1});addEventListener('keyup',()=>{jx=jy=0});function tree(px,py){x.fillStyle='#865b3d';x.fillRect(px-5,py+12,10,25);x.fillStyle='#4f8652';x.beginPath();x.arc(px,py,26,0,7);x.fill();x.fillStyle='#6fa85a';x.beginPath();x.arc(px-16,py+5,18,0,7);x.arc(px+15,py+5,18,0,7);x.fill()}function draw(){t+=.02;p.x=Math.max(.08,Math.min(.92,p.x+jx*.0018));p.y=Math.max(.12,Math.min(.88,p.y+jy*.0018));x.clearRect(0,0,W,H);x.fillStyle='#b9df8c';x.fillRect(0,0,W,H);x.fillStyle='#7fc4df';x.beginPath();x.moveTo(W*.60,0);x.bezierCurveTo(W*.42,H*.25,W*.72,H*.56,W*.50,H);x.lineTo(W,H);x.lineTo(W,0);x.fill();x.fillStyle='#e8cb97';x.beginPath();x.ellipse(W*.38,H*.56,W*.28,H*.27,-.08,0,7);x.fill();x.fillStyle='#c8845e';x.fillRect(W*.27,H*.36,W*.22,H*.16);x.fillStyle='#9f5e55';x.beginPath();x.moveTo(W*.24,H*.36);x.lineTo(W*.38,H*.25);x.lineTo(W*.52,H*.36);x.fill();[[.12,.22],[.22,.16],[.15,.72],[.74,.22],[.82,.38],[.67,.74],[.88,.78]].forEach(a=>tree(W*a[0],H*a[1]));x.fillStyle='#b8844d';for(let i=0;i<5;i++)x.fillRect(W*(.22+i*.045),H*.68,24,8);const px=W*p.x,py=H*p.y;x.fillStyle='#0003';x.beginPath();x.ellipse(px,py+23,20,8,0,0,7);x.fill();x.fillStyle='#f5efe4';x.beginPath();x.arc(px,py,17,0,7);x.fill();x.fillStyle='#d47b78';x.fillRect(px-15,py+13,30,25);x.fillStyle='#6e4938';x.beginPath();x.arc(px-5,py-3,3,0,7);x.arc(px+5,py-3,3,0,7);x.fill();requestAnimationFrame(draw)}draw();
</script></body></html>
