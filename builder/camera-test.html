<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Liora Camera Lab</title><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#a8d8ec;touch-action:none;font-family:system-ui,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}#lab{position:fixed;z-index:20;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 10px);display:flex;gap:7px;align-items:center}#lab button{border:1px solid #ffffff88;background:#173c4bd9;color:#fff;border-radius:999px;padding:10px 12px;font-weight:800}#lab button.on{background:#e8a33d;color:#1b1508}#label{margin-left:auto;background:#173c4bd9;color:#fff;border-radius:999px;padding:9px 11px;font-size:10px;font-weight:800}#err{display:none;position:fixed;z-index:30;left:12px;right:12px;top:70px;background:#7b2f2fee;color:#fff;padding:10px;border-radius:12px;font-size:11px}#joy{position:fixed;left:22px;bottom:calc(env(safe-area-inset-bottom) + 24px);width:112px;height:112px;border-radius:50%;background:#ffffff35;border:2px solid #ffffff66;z-index:20;touch-action:none}#stick{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px;border-radius:50%;background:#ffffffc8;pointer-events:none}#zoom{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 28px);display:flex;flex-direction:column;gap:9px;z-index:20}#zoom button{width:50px;height:50px;border-radius:50%;border:2px solid #ffffff88;background:#173c4bbb;color:white;font-size:24px;font-weight:800}</style></head><body><div id="lab"><button data-cam="A">A</button><button data-cam="B">B</button><button data-cam="C" class="on">C</button><span id="label">C • Dead-zone Smooth</span></div><div id="err"></div><div id="joy"><div id="stick"></div></div><div id="zoom"><button id="reset">↻</button><button id="zin">＋</button><button id="zout">−</button></div><script type="module">import * as THREE from 'three';import{createPlayer}from'../src/entities/player.js';const err=document.querySelector('#err');onerror=e=>{err.style.display='block';err.textContent='Error: '+e};onunhandledrejection=e=>{err.style.display='block';err.textContent='Load error: '+(e.reason?.message||e.reason)};const scene=new THREE.Scene();scene.background=new THREE.Color(0xa8d8ec);scene.fog=new THREE.Fog(0xa8d8ec,30,70);const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,120),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xe7f3ef,0x526146,1.5));const sun=new THREE.DirectionalLight(0xffe2a8,2.3);sun.position.set(-12,16,10);scene.add(sun);const tex=await new THREE.TextureLoader().loadAsync('../assets/textures/grass.webp');tex.wrapS=tex.wrapT=THREE.RepeatWrapping;tex.repeat.set(12,12);tex.colorSpace=THREE.SRGBColorSpace;const ground=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.MeshStandardMaterial({map:tex,roughness:1}));ground.rotation.x=-Math.PI/2;scene.add(ground);for(let i=0;i<12;i++){const g=new THREE.Mesh(new THREE.CylinderGeometry(.35,.5,1.2,8),new THREE.MeshStandardMaterial({color:i%2?0x5e8145:0x8a6843,roughness:1}));g.position.set((i%4-1.5)*6,.6,(Math.floor(i/4)-1)*7);scene.add(g)}const player=await createPlayer({url:'../assets/models/player/liora_all_animations_web.glb',height:1.7,renderOrder:10,animations:{idle:'Idle_9',walk:'Walking',run:'Running'}});scene.add(player.root);const joy=document.querySelector('#joy'),stick=document.querySelector('#stick');let jid=null,jx=0,jy=0;function jc(){const r=joy.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2,rad:r.width*.34}}function uj(e){const c=jc(),dx=e.clientX-c.x,dy=e.clientY-c.y,l=Math.hypot(dx,dy)||1,k=Math.min(1,c.rad/l),x=dx*k,y=dy*k;jx=x/c.rad;jy=y/c.rad;stick.style.transform=`translate(${x}px,${y}px)`}joy.onpointerdown=e=>{jid=e.pointerId;joy.setPointerCapture?.(jid);uj(e);e.stopPropagation()};joy.onpointermove=e=>{if(e.pointerId===jid){uj(e);e.stopPropagation()}};function ej(e){if(e.pointerId!==jid)return;jid=null;jx=jy=0;stick.style.transform='translate(0,0)';e.stopPropagation()}joy.onpointerup=joy.onpointercancel=ej;const base=new THREE.Vector3(8,10,10),baseLen=base.length(),iy=Math.atan2(base.x,base.z),ip=Math.asin(base.y/baseLen);let yaw=iy,pitch=ip,zoom=1,mode='C',orbitId=null,lx=0,ly=0,follow=new THREE.Vector3(),desired=new THREE.Vector3(),dvec=new THREE.Vector3(),ready=false;const target=new THREE.Vector3(),fwd=new THREE.Vector3(),right=new THREE.Vector3(),mv=new THREE.Vector3(),up=new THREE.Vector3(0,1,0);const presets={A:{name:'A • Direct Follow',dead:0,follow:99,pos:99},B:{name:'B • Orbit Smooth',dead:0,follow:99,pos:5.5},C:{name:'C • Dead-zone Smooth',dead:.55,follow:3.2,pos:5.5}};function reset(){yaw=iy;pitch=ip;zoom=1;ready=false}function off(){const d=baseLen*zoom,h=Math.cos(pitch)*d;return new THREE.Vector3(Math.sin(yaw)*h,Math.sin(pitch)*d,Math.cos(yaw)*h)}function camUpdate(dt){const p=presets[mode];if(!ready){follow.copy(target);ready=true}if(p.dead===0){if(p.follow>90)follow.copy(target);else follow.lerp(target,1-Math.exp(-p.follow*dt))}else{dvec.copy(target).sub(follow);dvec.y=0;const d=dvec.length();if(d>p.dead){desired.copy(target).addScaledVector(dvec,-p.dead/d);follow.lerp(desired,1-Math.exp(-p.follow*dt))}follow.y=target.y}const want=follow.clone().add(off());if(p.pos>90)camera.position.copy(want);else camera.position.lerp(want,1-Math.exp(-p.pos*dt));camera.lookAt(follow)}document.querySelectorAll('[data-cam]').forEach(b=>b.onclick=()=>{mode=b.dataset.cam;document.querySelectorAll('[data-cam]').forEach(x=>x.classList.toggle('on',x===b));document.querySelector('#label').textContent=presets[mode].name;ready=false});document.querySelector('#reset').onclick=reset;document.querySelector('#zin').onclick=()=>zoom=THREE.MathUtils.clamp(zoom-.12,.65,1.55);document.querySelector('#zout').onclick=()=>zoom=THREE.MathUtils.clamp(zoom+.12,.65,1.55);renderer.domElement.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'&&!e.isPrimary)return;orbitId=e.pointerId;lx=e.clientX;ly=e.clientY});renderer.domElement.addEventListener('pointermove',e=>{if(e.pointerId!==orbitId)return;const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;yaw-=dx*.006;pitch=THREE.MathUtils.clamp(pitch+dy*.0045,THREE.MathUtils.degToRad(28),THREE.MathUtils.degToRad(55))});renderer.domElement.addEventListener('pointerup',e=>{if(e.pointerId===orbitId)orbitId=null});renderer.domElement.addEventListener('pointercancel',e=>{if(e.pointerId===orbitId)orbitId=null});function dir(x,z){camera.getWorldDirection(fwd);fwd.y=0;fwd.normalize();right.crossVectors(fwd,up).normalize();mv.set(0,0,0).addScaledVector(right,x).addScaledVector(fwd,z);if(mv.lengthSq()>.001)mv.normalize();return mv}const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.04),m=Math.min(1,Math.hypot(jx,jy));if(m>.05){const v=dir(jx,-jy),run=m>.78,s=run?5.2:3.2;player.root.position.addScaledVector(v,s*dt);const a=Math.atan2(v.x,v.z),df=Math.atan2(Math.sin(a-player.root.rotation.y),Math.cos(a-player.root.rotation.y));player.root.rotation.y+=df*Math.min(1,10*dt);player.fadeTo(run?'Running':'Walking',.15,true)}else player.fadeTo('Idle_9',.18,true);player.mixer.update(dt);target.set(player.root.position.x,.7,player.root.position.z);camUpdate(dt);renderer.render(scene,camera)}loop();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});</script></body></html>
