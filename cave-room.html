<title>ห้องของระบบถ้ำ</title>
<!--
  cave-room.html  —  ANY room of the caves' kit, to walk in: cave-room.html?room=NAME (without it: test, the kit's test room).
  The kit (the user: "ตอนนี้ต้องวางระบบไว้ก่อน เหมือนที่เราวางระบบ heightmap hill village"): a room is its description
  (tools/cave-rooms/NAME.json), baked by tools/make-cave-room.py, built by cave-room.js (its ground: cave-ground.js; its
  light: cave-light.js; her level in it, floors over one another too: cave-level.js). This page is the same for every room:
  it knows none of them. Vivi plays as in the game (player-moves.js: her run, climbing, the magic jump; the game's touch
  screen); the forest sprite floats at her shoulder and is a light where she goes. The buttons on the right put her at each
  of the room's places (at its own height: a room has floors over one another).
  The test room (its first piece: ground, laid stone, light): a hall with the way in; a round well with a stair of laid
  stone winding a turn and a half down round it, over itself; a bridge across the well; a tunnel from the well's floor under
  the hall to a lower chamber; a nook whose plan is a picture drawn by hand. No water, mist or things yet (the kit's next
  pieces), no map.
  ?sound=0: no sound.
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a1420; font-family: system-ui, sans-serif; touch-action: none; -webkit-user-select: none; user-select: none; }
  canvas { display: block; touch-action: none; }
  #name { position: fixed; left: calc(14px + env(safe-area-inset-left)); top: calc(8px + env(safe-area-inset-top)); max-width: calc(50vw - 64px); pointer-events: none;
    font: 700 16px system-ui; color: #f2fbff; text-shadow: 0 1px 6px #000c; }
  #name small { display: block; font: 500 12px system-ui; opacity: 0.85; margin-top: 3px; }
  #bar { position: fixed; right: calc(8px + env(safe-area-inset-right)); top: calc(8px + env(safe-area-inset-top)); display: flex; flex-direction: column; align-items: flex-end; gap: 6px; z-index: 3; }
  #bar button { border: 1px solid #9fe9ff66; border-radius: 999px; padding: 7px 11px; background: #0c2730cc; color: #eafcff; font: 700 12px system-ui; touch-action: manipulation; text-align: left; }
  #bar button.on { background: #1d5a63e6; border-color: #b8f6ffcc; }
  /* the stick and the jump button: the game's own (index.html) */
  #stick { position: fixed; width: 112px; height: 112px; margin: -56px 0 0 -56px; border-radius: 50%; pointer-events: none; opacity: 0;
    background: rgba(255, 255, 255, .2); border: 2px solid rgba(255, 255, 255, .6); transition: opacity .12s; }
  #stick i { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%;
    background: rgba(255, 255, 255, .82); box-shadow: 0 2px 8px rgba(40, 60, 30, .25); }
  #jumpBtn { position: fixed; right: max(24px, calc(env(safe-area-inset-right) + 14px)); bottom: max(16px, calc(env(safe-area-inset-bottom) + 10px));
    z-index: 4; width: 64px; height: 64px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .7); background: rgba(255, 255, 255, .24);
    color: #fff; font: 600 12px system-ui, sans-serif; text-shadow: 0 1px 3px rgba(40, 60, 30, .6); touch-action: none; user-select: none;
    -webkit-user-select: none; -webkit-tap-highlight-color: transparent; display: grid; place-items: center; padding: 0; }
  #jumpBtn svg { width: 22px; height: 22px; margin-bottom: -6px; }
  #jumpBtn.down { background: rgba(255, 255, 255, .5); }
  #hint { position: fixed; left: 0; right: 0; bottom: calc(12px + env(safe-area-inset-bottom)); padding: 0 120px 0 24px; text-align: center; pointer-events: none;
    font: 500 12px system-ui; color: #dff8ff; opacity: .85; text-shadow: 0 1px 4px #000c; }
  #wait { position: fixed; inset: 0; display: grid; place-items: center; background: #0a1420; color: #cdf3ff; font: 600 15px system-ui; z-index: 9; text-align: center; }
  #wait small { display: block; opacity: .7; font-weight: 500; margin-top: 6px; }
  @media (max-width: 640px) { #name small { display: none; } #hint { display: none; } }
  @media (max-height: 520px) {                       /* a phone on its side: the buttons down the right edge, smaller */
    #bar { gap: 4px; top: calc(6px + env(safe-area-inset-top)); }
    #bar button { padding: 5px 9px; font-size: 11px; }
    #name { font-size: 14px; }
    #name small { display: none; }
  }
</style>

<body>
<div id="name"><span id="title">ห้องของระบบถ้ำ</span><small>ระบบถ้ำกลาง · ชิ้นแรก: พื้น หิน แสง</small></div>
<div id="bar"></div>
<div id="stick"><i></i></div>
<button id="jumpBtn" type="button" aria-label="กระโดด"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15l7-7 7 7"/></svg><br>กระโดด</span></button>
<div id="hint">ซ้าย: เดิน วิ่ง · ขวา: หมุนกล้อง · กระโดดซ้ำกลางอากาศ: 4 ชั้น · ปุ่มขวาบน: ไปแต่ละจุด</div>
<div id="wait">กำลังโหลดถ้ำ…<small id="step"></small></div>
<script type="module">
import * as THREE from 'three';
import { createCaveRoom } from './cave-room.js';
import { createCaveLevel } from './cave-level.js';
import { MADE as BOSS_MADE } from './boss-hall-sounds.js';
import { loadPlayable } from './characters.js';
import { CHARACTER_ANIM } from './character-anim.js';
import { VAULT_ANIM } from './vault-anim.js';
import { CHARACTER_ANIM as MOCAP_ANIM } from './magic-jump-mocap-anim.js';
import { CHARACTER_ANIM as FLOW_ANIM } from './magic-jump-flow-anim.js';
import { CLIMB_TOP_ANIM } from './climb-top-anim.js';
import { createPlayer } from './player-moves.js';
import { createMagicCircles } from './magic-circle-fx.js';
import { createStepSounds } from './step-sounds.js';
import { createSpriteCompanion } from './sprite-companion.js';
import { updateAnimals } from './stylized-animals.js';

const Q = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance', preserveDrawingBuffer: Q.has('shot') });
// as the game (index.html): the kit's shaders write their colours as they are (raw sRGB); three's own get the conversion back
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
THREE.ShaderChunk.colorspace_fragment = 'gl_FragColor = sRGBTransferOETF( gl_FragColor );';
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, +Q.get('dpr') || 1.5));
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.12, 220);
const fit = () => {
  camera.aspect = innerWidth / innerHeight; camera.fov = camera.aspect < 1 ? 70 : 55; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
};
addEventListener('resize', fit); fit();
const stepEl = document.getElementById('step');
const onStep = async (t) => { stepEl.textContent = t + '…'; await new Promise((r) => requestAnimationFrame(() => setTimeout(r, 0))); };
const noCave = (root) => root.traverse((o) => { for (const m of [].concat(o.material || [])) { m.userData = m.userData || {}; m.userData.noCave = true; } });

// ---- the room (whichever is asked for), and the level she plays in it
const room = await createCaveRoom({ name: (Q.get('room') || 'test').replace(/[^\w-]/g, ''), onStep });
scene.add(room.group);
scene.background = new THREE.Color().setRGB(room.fogColor.x, room.fogColor.y, room.fogColor.z);
document.getElementById('title').textContent = room.layout.title || room.name;
document.title = room.layout.title || room.name;
const level = createCaveLevel(room);

// ---- her (Vivi), with the game's moves and their clips (as index.html: the vault, the magic jump, her way over a cliff's top)
await onStep('ปลุก Vivi');
const PLAYER_ANIM = { ...CHARACTER_ANIM, clips: { ...CHARACTER_ANIM.clips, ...VAULT_ANIM.clips, ...MOCAP_ANIM.clips, ...FLOW_ANIM.clips, ...CLIMB_TOP_ANIM.clips } };
const hero = await loadPlayable('vivi', PLAYER_ANIM, { height: 1.75 });
const circles = createMagicCircles({ seed: 2 });            // the magic jump's circles: their own light
scene.add(circles.object);
noCave(circles.object);
if (circles.setNight) circles.setNight(true);
// her steps (on bare rock and laid stone: the boss hall's takes), her jumps and landings, on the AudioContext her first touch wakes
const soundVol = Q.has('sound') ? +Q.get('sound') : 1;
const sounds = soundVol > 0 ? createStepSounds({ level, volume: soundVol, own: { stone: [1, 2, 3, 4, 5, 6].map((i) => `boss/step-${i}.mp3?v=${BOSS_MADE}`) } }) : null;
const player = createPlayer({ character: hero, level, camera, dom: renderer.domElement, ui: document.getElementById('stick'), circles, sounds, ramp: true, dash: false, roll: false });
scene.add(player.object);
noCave(player.blob);
const jumpBtn = document.getElementById('jumpBtn');
jumpBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); jumpBtn.classList.add('down'); player.jump(); });
for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) jumpBtn.addEventListener(ev, () => jumpBtn.classList.remove('down'));

// the sprite: it goes everywhere with her (sprite-companion.js), and here it is a light
await onStep('ปลุกสไปรต์');
const sprite = await createSpriteCompanion({ level: { heightAt: (x, z) => level.standAt(x, z), colliders: level.colliders }, scene, player });
sprite.shadow.visible = false;                              // (it is the light: no shadow under it)
noCave(sprite.object);
const body = sprite.object.getObjectByName('body') || sprite.object;
const glowTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(255,240,205,0.85)'); gr.addColorStop(0.25, 'rgba(255,226,170,0.35)'); gr.addColorStop(1, 'rgba(255,210,150,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.NoColorSpace; return t;
})();
const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0xffffff, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
halo.material.userData.noCave = true;
halo.scale.setScalar(1.7); halo.renderOrder = 6;
scene.add(halo);
let lampOn = true;

// ---- the cave's light on everything (once all is in the scene)
await onStep('จุดแสงในถ้ำ');
const patched = room.light.apply(scene);
const spritePos = new THREE.Vector3();
const lampAt = () => { body.getWorldPosition(spritePos); spritePos.y += 0.25; room.light.setSprite(spritePos, lampOn); halo.position.copy(spritePos); halo.visible = lampOn; };

// ---- the buttons: each of the room's places (at its own height), and the sprite's light
const bar = document.getElementById('bar');
level.places.forEach((p) => {
  const b = document.createElement('button'); b.type = 'button';
  b.textContent = `📍 ${p.name}`;
  b.onclick = () => player.teleport(p.x, p.z, p.heading, p.y);
  bar.append(b);
});
const lampBtn = document.createElement('button'); lampBtn.type = 'button'; lampBtn.className = 'on'; lampBtn.textContent = '💡 แสงสไปรต์';
lampBtn.onclick = () => { lampOn = !lampOn; lampBtn.classList.toggle('on', lampOn); };
bar.append(lampBtn);

// ---- a frame
function step(dt) {
  dt = Math.min(dt, 0.05);
  player.update(dt);
  updateAnimals(dt);                                         // (the sprite)
  circles.update(dt, camera);
  room.update(dt, camera);
  lampAt();
}
let fixedCam = null;
function draw() {
  if (fixedCam) { camera.position.set(fixedCam[0], fixedCam[1], fixedCam[2]); camera.lookAt(fixedCam[3], fixedCam[4], fixedCam[5]); }
  renderer.render(scene, camera);
}

// for a test (or the console): run(s) steps the game without drawing (then draws once); keys('KeyW', true) holds a key
window.caveTrial = {
  ready: false, held: false, player, level, room, hero, camera, renderer, scene, patched, sounds,
  run(seconds, { fps = 30, show = true, each = null } = {}) { this.held = true; for (let u = 0; u < seconds - 1e-6; u += 1 / fps) { step(1 / fps); if (each) each(); } if (show) draw(); },
  place(i) { const p = level.places[i]; player.teleport(p.x, p.z, p.heading, p.y); },
  keys(code, down) { dispatchEvent(new KeyboardEvent(down ? 'keydown' : 'keyup', { code })); },
  fix(...v) { fixedCam = v.length ? v : null; },
  lamp(on) { lampOn = on; lampBtn.classList.toggle('on', on); },
  draw, info() { return renderer.info.render; },
};

// ---- warm up every shader before she is shown, then go
await onStep('เตรียมภาพ');
step(1 / 60);
try { await renderer.compileAsync(scene, camera); } catch (e) { renderer.compile(scene, camera); }
document.getElementById('wait').remove();
window.caveTrial.ready = true;
let then = performance.now(), shown = 0;
function tick(now) {
  requestAnimationFrame(tick);
  if (now - shown < 1000 / 61) return;
  shown = now;
  const dt = (now - then) / 1000; then = now;
  if (window.caveTrial.held) return;
  step(dt);
  draw();
}
requestAnimationFrame(tick);
</script>
