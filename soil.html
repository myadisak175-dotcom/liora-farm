<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7fb4e6">
<title>แปลงดิน — ทดลอง</title>
<!--
  soil.html  —  the farm's tilled ground, by itself (farm-soil.js), and what lies on the farm before it can be dug
  (farm-debris.js: weeds, rocks, branches, stumps, cleared with magic). One job: see how the beds look in every state, clear,
  dig and water them by hand, before any of it goes into the game. Nothing here goes into the game.
    squares of a metre, dug one at a time; beds of squares side by side are one bed, with no grid to be seen
    the furrows painted on the ground and standing up out of it (ความนูนของร่อง: how high); dry, wet (drying in patches),
    magic, cursed (with the curse's thorns on it)
    ?ridge=0.14   the ridges that high (metres) from the start
  Tap a square to use the tool chosen. One finger turns the view, two move it and come nearer.
    ?novivi   without Vivi beside the beds
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #7fb4e6; font-family: system-ui, sans-serif; touch-action: none; }
  canvas { display: block; }
  #name { position: fixed; left: 0; right: 0; top: calc(10px + env(safe-area-inset-top)); text-align: center; pointer-events: none;
    font: 700 17px system-ui; color: #fff; text-shadow: 0 1px 6px #0007; }
  #name small { display: block; font: 500 12px system-ui; opacity: 0.92; margin-top: 3px; }
  .tag { position: fixed; transform: translate(-50%, -100%); pointer-events: none; font: 700 12px system-ui; color: #fff;
    background: #3a2c22cc; border: 1px solid #ffffff66; border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
  #ui { position: fixed; left: 0; right: 0; bottom: calc(10px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 0 8px; }
  .bar { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
  .bar button { border: 1px solid #ffffffaa; border-radius: 999px; padding: 9px 12px; background: #4a3a2cd9; color: #fff; font: 700 13px system-ui; touch-action: manipulation; }
  .bar button.on { background: #b07a3c; }
  #say { min-height: 18px; font: 600 12px system-ui; color: #fff; text-shadow: 0 1px 4px #0009; text-align: center; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
  "./stylized-nature.js": "./stylized-nature.js?v=dry4",
  "./stylized-grassfield.js": "./stylized-grassfield.js?v=ring1dry1gust1pave1",
  "./stylized-character.js": "./stylized-character.js?v=wade1size1once1spring1unit1hold1",
  "./character-anim.js": "./character-anim.js?v=ual2sprint1roll1climb3swim1vault1",
  "./farm-soil.js": "./farm-soil.js?v=2",
  "./farm-debris.js": "./farm-debris.js?v=2"
} }
</script>
</head>
<body>
<div id="name">แปลงดิน · ทดลอง<small>แตะช่องเพื่อใช้เครื่องมือ · นิ้วเดียวหมุน · สองนิ้วเลื่อนและซูม</small></div>
<div id="ui">
  <div id="say"></div>
  <div class="bar" id="tools"></div>
  <div class="bar"><label style="display:flex;align-items:center;gap:8px;background:#4a3a2cd9;border:1px solid #ffffffaa;border-radius:999px;padding:6px 14px;color:#fff;font:700 13px system-ui">ความนูนของร่อง <input id="ridge" type="range" min="0" max="0.22" step="0.01" value="0.1" style="width:min(40vw,180px);accent-color:#b07a3c"> <b id="ridgeVal">10 ซม.</b></label></div>
  <div class="bar">
    <button id="fast">⏩ ให้ดินแห้งเร็ว</button>
    <button id="reset">🔄 แปลงตัวอย่างใหม่</button>
    <button id="mess">🌾 ทำให้รกใหม่</button>
  </div>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import * as N from './stylized-nature.js';
import * as G from './stylized-grassfield.js';
import { createFarmSoil } from './farm-soil.js';
import { createFarmDebris, setDebrisSun } from './farm-debris.js';
import { createThornClump } from './thorn-vine.js';
import { createMagicComboFx } from './magic-combo-fx.js';

const Q = new URLSearchParams(location.search);
const phone = matchMedia('(pointer: coarse)').matches;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, phone ? 1.75 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

// ---- a meadow, as the game's: its sky, its ground and its painted grass
const scene = new THREE.Scene();
{
  const c = document.createElement('canvas'); c.width = 4; c.height = 256;
  const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#2f72c4'); gr.addColorStop(0.55, '#7fb4e6'); gr.addColorStop(1, '#dcecf5');
  g.fillStyle = gr; g.fillRect(0, 0, 4, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  scene.background = t;
}
const FAR = '#d6e8ef';
scene.add(N.createAlphaFix());
N.setHaze({ color: FAR, near: 45, far: 150, max: 0.6 });
const R = 60;
const heightFn = (x, z) => {                                  // flat where the farm is, rolling gently beyond it
  const d = Math.max(Math.abs(x) - 12, Math.abs(z) - 9, 0);
  return (Math.sin(x * 0.11) * 0.8 + Math.cos(z * 0.09 + 1.3) * 0.7 + Math.sin((x + z) * 0.05) * 1.2) * Math.min(1, d / 14);
};
const field = G.createHeightField({ radius: R, center: [0, 0], cells: 240, heightFn });
const H = field.heightAt;
const map = G.createGroundMap({ radius: R, size: 768, seed: 4, heightAt: H, dirt: 0 });
{                                                             // the farm's grass is short (trodden, cut once): what lies on it can be seen
  const S = map.size, k = S / (2 * R);
  for (let j = 0; j < S; j++) for (let i = 0; i < S; i++) {
    const x = (i + 0.5) / k - R, z = (j + 0.5) / k - R, out = Math.max(Math.abs(x) - 9.5, Math.abs(z) - 6.5);
    if (out > 2) continue;
    const o = (j * S + i) * 4 + 3, f = Math.min(1, Math.max(0, out / 2));
    map.data[o] = Math.round(map.data[o] * (0.5 + 0.5 * f * f * (3 - 2 * f)));
  }
  map.texture.needsUpdate = true;
}
const terrain = G.createTerrain(field, map, { far: FAR });
scene.add(terrain);
const grass = G.createFollowGrass({ map, field, count: phone ? 110000 : 160000, tile: 62, seed: 5, thin: Math.sqrt(200000 / (phone ? 110000 : 160000)), far: FAR });
grass.userData.setPainterly(true);
scene.add(grass);

// ---- the farm: 18 squares by 12, a metre each
const load = async name => {
  const t = await new THREE.TextureLoader().loadAsync('./assets/ground/' + name);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4; t.colorSpace = THREE.NoColorSpace;
  return t;
};
const [paint, crack, cliff] = await Promise.all([load('path-paint.webp'), load('dry-paint.webp'), load('cliff-paint.webp')]).catch(() => [null, null, null]);
const COLS = 18, ROWS = 12, X0 = -9, Z0 = -6;
const soil = createFarmSoil({ x0: X0, z0: Z0, cols: COLS, rows: ROWS, heightAt: H, map, paint, crack });
scene.add(soil.mesh);
const sunDir = new THREE.Vector3(-0.62, 0.62, 0.48).normalize();
soil.setSun(sunDir); setDebrisSun(sunDir);

// what lies on the farm before it can be dug (farm-debris.js), and the clearing magic's splash: the water's own (magic-combo-fx.js)
const debris = createFarmDebris({ heightAt: H, rockPaint: cliff ? { texture: cliff, tile: [8, 4] } : null });
scene.add(debris.object);
const fx = createMagicComboFx(); fx.look('water'); scene.add(fx.object);
const MESS = [['weed', 0.36], ['pebbles', 0.08], ['stone', 0.07], ['boulder', 0.04], ['branch', 0.1], ['stump', 0.04]];
let messSeed = 1;
function mess(all = false) {                                    // the farm overgrown: every square not dug (all: the lower part only, as the page opens)
  const rng = (s => () => { s = (s * 16807) % 2147483647; return s / 2147483647; })(messSeed++ * 7919 + 11);
  for (let j = 0; j < ROWS; j++) for (let i = 0; i < COLS; i++) {
    const key = i + ',' + j, st = soil.get(i, j);
    if (st.tilled > 0.01 || st.cursed > 0.01 || debris.on(key) || (all && j < 6) || (Math.abs(i - 7) <= 1 && Math.abs(j - 8) <= 1)) continue;
    let r = rng(), kind = null;
    for (const [k, p] of MESS) { if (r < p) { kind = k; break; } r -= p; }
    if (!kind) continue;
    const [x, z] = soil.middle(i, j);
    debris.put(key, kind, x + (rng() - 0.5) * 0.2, z + (rng() - 0.5) * 0.2, 1 + Math.floor(rng() * 999));
  }
}

// the curse's thorns on a cursed square (every other one: a bed of them, not a thicket)
const thorns = new Map();
const thornOn = (i, j) => {
  const k = i + ',' + j;
  if (thorns.has(k) || (i + j) % 2) return;
  const [x, z] = soil.middle(i, j), t = createThornClump({ seed: 1 + i * 7 + j * 13, look: 'curse', size: 0.3, count: 3 });
  t.position.set(x + ((i * 37 + j * 11) % 5 - 2) * 0.08, H(x, z) - 0.02, z + ((i * 13 + j * 29) % 5 - 2) * 0.08);
  t.scale.setScalar(0.01);                                    // (they come up out of the ground: see the loop)
  scene.add(t); thorns.set(k, t);
};
const thornOff = (i, j) => { const k = i + ',' + j, t = thorns.get(k); if (!t) return; scene.remove(t); t.traverse(o => { if (o.geometry) o.geometry.dispose(); }); thorns.delete(k); };

// ---- the sample beds: one of each state (an L-shaped one: squares side by side are one bed), and a square by itself
const BEDS = [
  { name: 'ไถแล้ว ดินแห้ง', sq: [[1, 1], [2, 1], [3, 1], [1, 2], [2, 2], [3, 2], [1, 3], [2, 3], [3, 3], [1, 4], [1, 5], [2, 4], [2, 5]] },
  { name: 'รดน้ำแล้ว', sq: [], box: [6, 1, 8, 4], wet: true },
  { name: 'ดินมีมนต์', sq: [], box: [10, 1, 12, 4], magic: true },
  { name: 'ดินต้องสาป', sq: [], box: [14, 1, 16, 4], cursed: true },
  { name: 'ขุดช่องเดียว', sq: [[7, 8]] },
];
for (const b of BEDS) if (b.box) for (let j = b.box[1]; j <= b.box[3]; j++) for (let i = b.box[0]; i <= b.box[2]; i++) b.sq.push([i, j]);
function sample() {
  for (let j = 0; j < ROWS; j++) for (let i = 0; i < COLS; i++) { soil.untill(i, j); thornOff(i, j); }
  for (const b of BEDS) for (const [i, j] of b.sq) {
    if (b.cursed) { soil.curse(i, j); thornOn(i, j); continue; }
    soil.till(i, j);
    if (b.wet) soil.water(i, j, (i - 6) * 0.15 + (j - 1) * 0.1);
    if (b.magic) soil.enrich(i, j);
  }
}
const tags = BEDS.map(b => { const el = document.createElement('div'); el.className = 'tag'; el.textContent = b.name; document.body.append(el); return el; });

// ---- Vivi beside the beds, for their size
let vivi = null;
if (!Q.has('novivi')) (async () => {
  try {
    const [{ loadCharacter }, { VIVI_GLB }, { CHARACTER_ANIM }] = await Promise.all([import('./stylized-character.js'), import('./vivi-data.js'), import('./character-anim.js')]);
    vivi = await loadCharacter(VIVI_GLB, CHARACTER_ANIM);
    if (vivi.setSize) vivi.setSize(1.75 / vivi.baseHeight);
    vivi.play('idle');
    vivi.object.position.set(X0 + 5.2, H(X0 + 5.2, Z0 + 3.4), Z0 + 3.4);
    vivi.object.rotation.y = 2.6;
    scene.add(vivi.object);
  } catch (err) { console.warn('Vivi not loaded', err); }
})();

// ---- the camera
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 600);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.maxPolarAngle = Math.PI * 0.47; controls.minDistance = 2; controls.maxDistance = 60;
controls.target.set(0, H(0, -1.5), -1.5);
camera.position.set(4, 9, 13);
controls.update();

// ---- the tools: tap a square
const TOOLS = [
  ['clear', '🪄 เวทเคลียร์', 'แตะของรก (หญ้ารก หิน กิ่งไม้ ตอไม้) เพื่อเคลียร์ด้วยเวทน้ำ ก้อนใหญ่กับตอไม้ต้องหลายครั้ง'],
  ['till', '⛏ ไถ', 'แตะช่องหญ้าเพื่อขุดเป็นดิน'],
  ['water', '💧 รดน้ำ', 'แตะช่องที่ขุดแล้วเพื่อรดน้ำ'],
  ['rain', '🌧 เวทฝน', 'แตะเพื่อให้ฝนตกรอบๆ จุดนั้น ดินจะเปียกลามออกไป'],
  ['magic', '✨ มนต์', 'แตะช่องที่ขุดแล้วเพื่อใส่มนต์'],
  ['curse', '🥀 คำสาป', 'แตะช่องเพื่อสาป'],
  ['lift', '🌱 ถอนคำสาป', 'แตะช่องที่ต้องสาปเพื่อฟื้นฟู'],
  ['grass', '🌿 คืนเป็นหญ้า', 'แตะช่องเพื่อให้กลับเป็นหญ้า'],
];
let tool = 'till', fast = false;
const say = text => { document.getElementById('say').textContent = text; };
const bar = document.getElementById('tools');
const drawTools = () => {
  bar.replaceChildren(...TOOLS.map(([id, label, hint]) => {
    const b = document.createElement('button'); b.textContent = label; if (id === tool) b.className = 'on';
    b.onclick = () => { tool = id; say(hint); drawTools(); };
    return b;
  }));
};
drawTools(); say(TOOLS[0][2]);
document.getElementById('fast').onclick = e => {
  fast = !fast; soil.dryTime = fast ? 12 : 120;
  e.target.classList.toggle('on', fast);
  say(fast ? 'ดินเปียกแห้งใน 12 วินาที' : 'ดินเปียกแห้งใน 2 นาที (ในเกมจะเป็นหนึ่งวัน)');
};
document.getElementById('reset').onclick = () => { sample(); say('วางแปลงตัวอย่างใหม่แล้ว'); };
document.getElementById('mess').onclick = () => { mess(); say('ฟาร์มรกอีกแล้ว ใช้ 🪄 เวทเคลียร์'); };
const ridgeIn = document.getElementById('ridge');
const setRidge = h => { soil.ridge = h; document.getElementById('ridgeVal').textContent = Math.round(h * 100) + ' ซม.'; };
ridgeIn.addEventListener('input', () => setRidge(+ridgeIn.value));
setRidge(+(Q.get('ridge') || ridgeIn.value)); ridgeIn.value = soil.ridge;      // (?ridge=0.14: that high from the start)

// where a tap meets the ground, and the square there marked for a moment
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const cursor = new THREE.LineLoop(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, depthTest: false }));
cursor.renderOrder = 10; scene.add(cursor);
let cursorT = 0;
const markSquare = (i, j) => {
  const C = [[0, 0], [1, 0], [1, 1], [0, 1]], pts = [];
  for (let e = 0; e < 4; e++) {
    const [ax, az] = C[e], [bx, bz] = C[(e + 1) % 4];
    for (let k = 0; k < 4; k++) { const t = k / 4, px = X0 + i + ax + (bx - ax) * t, pz = Z0 + j + az + (bz - az) * t; pts.push(new THREE.Vector3(px, H(px, pz) + 0.05, pz)); }
  }
  cursor.geometry.dispose(); cursor.geometry = new THREE.BufferGeometry().setFromPoints(pts);
  cursorT = 0.9;
};
const apply = (x, z) => {
  const at = soil.at(x, z);
  if (!at) return say('นอกแปลงทดลอง');
  const [i, j] = at, s = soil.get(i, j), dug = s.tilled > 0.5, cursed = s.cursed > 0.5;
  markSquare(i, j);
  const key = i + ',' + j, junk = debris.on(key);
  if (tool === 'clear') {
    if (!junk) return say(cursed ? 'เถาหนามคำสาปเคลียร์ไม่ได้ ต้อง 🌱 ถอนคำสาป' : 'ช่องนี้ไม่มีของรก');
    const r = debris.cast(key);
    fx.burst(new THREE.Vector3(r.x, r.y, r.z), r.size, false, 'water');
    return say(r.gone ? '' : `อีก ${junk.casts - 1} ครั้ง`);
  }
  if (junk && tool !== 'grass') return say('ต้องเคลียร์ของรกก่อน (🪄 เวทเคลียร์)');
  if (tool === 'till') { if (cursed) return say('ช่องนี้ต้องสาป ต้องถอนคำสาปก่อน'); soil.till(i, j); }
  else if (tool === 'water') { if (!dug && !cursed) return say('ต้องขุดก่อนถึงจะรดน้ำได้'); soil.water(i, j); }
  else if (tool === 'rain') soil.rain(x, z, 1.8);
  else if (tool === 'magic') { if (!dug) return say('ต้องขุดก่อนถึงจะใส่มนต์ได้'); if (cursed) return say('ดินต้องสาปรับมนต์ไม่ได้'); soil.enrich(i, j); }
  else if (tool === 'curse') { soil.curse(i, j); thornOn(i, j); }
  else if (tool === 'lift') { soil.lift(i, j); thornOff(i, j); }
  else if (tool === 'grass') { soil.untill(i, j); thornOff(i, j); }
  say('');
};
let down = null;
renderer.domElement.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, t: performance.now(), n: (down && down.n || 0) + 1 }; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!down) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y), quick = performance.now() - down.t < 450;
  down = null;
  if (moved > 10 || !quick) return;
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObject(terrain, false)[0];
  if (hit) apply(hit.point.x, hit.point.z);
});

sample(); mess(true);
const messTag = document.createElement('div'); messTag.className = 'tag'; messTag.textContent = 'ฟาร์มรก · ใช้ 🪄 เวทเคลียร์'; document.body.append(messTag);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
const clock = new THREE.Clock(), v3 = new THREE.Vector3(), look = new THREE.Vector3();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  N.update(dt);
  soil.update(dt);
  debris.update(dt);
  fx.update(dt, camera);
  for (const t of thorns.values()) if (t.scale.x < 1) t.scale.setScalar(Math.min(1, t.scale.x + dt * 2.2));      // (up out of the ground)
  if (vivi) vivi.update(dt);
  controls.update();
  camera.getWorldDirection(look);
  grass.userData.follow(controls.target, look);
  cursorT = Math.max(0, cursorT - dt); cursor.material.opacity = Math.min(1, cursorT * 2) * 0.9;
  BEDS.forEach((b, k) => {                                    // each sample bed's name over it
    const [i, j] = b.sq[0], [i2, j2] = b.sq[b.sq.length - 1], cx = X0 + (Math.min(i, i2) + Math.max(i, i2) + 1) / 2, cz = Z0 + Math.min(j, j2);
    v3.set(cx, H(cx, cz) + 0.35, cz).project(camera);
    const el = tags[k], on = v3.z < 1;
    el.style.display = on ? '' : 'none';
    if (on) { el.style.left = (v3.x * 0.5 + 0.5) * innerWidth + 'px'; el.style.top = (-v3.y * 0.5 + 0.5) * innerHeight + 'px'; }
  });
  v3.set(X0 + 12.5, H(X0 + 12.5, Z0 + 6.6) + 0.9, Z0 + 6.6).project(camera);
  messTag.style.display = v3.z < 1 ? '' : 'none';
  messTag.style.left = (v3.x * 0.5 + 0.5) * innerWidth + 'px'; messTag.style.top = (-v3.y * 0.5 + 0.5) * innerHeight + 'px';
  renderer.render(scene, camera);
});
window.__soil = { soil, debris, fx, scene, camera, controls, grass, apply, sample, mess, set tool(t) { tool = t; drawTools(); } };
</script>
</body>
</html>
