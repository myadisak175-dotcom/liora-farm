<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>Liora Camera Test — Old Smooth Follow</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#a8d8ec;touch-action:none;font-family:system-ui,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}#info{position:fixed;left:12px;top:calc(env(safe-area-inset-top) + 12px);z-index:5;color:#fff;background:#173c4bbb;padding:9px 12px;border-radius:14px;font-size:12px;font-weight:800;pointer-events:none}#joy{position:fixed;left:22px;bottom:calc(env(safe-area-inset-bottom) + 24px);width:112px;height:112px;border-radius:50%;background:#ffffff35;border:2px solid #ffffff66;z-index:6;touch-action:none}#stick{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px;border-radius:50%;background:#ffffffc8;pointer-events:none}#zoom{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 28px);display:flex;flex-direction:column;gap:9px;z-index:7}#zoom button{width:50px;height:50px;border-radius:50%;border:2px solid #ffffff88;background:#173c4bbb;color:white;font-size:24px;font-weight:800}</style>
</head>
<body>
<div id="info">Old Smooth Camera Test<br><small>เดินซ้ายล่าง • ลากฉากเพื่อหมุน • 2 นิ้วซูม</small></div>
<div id="joy"><div id="stick"></div></div>
<div id="zoom"><button id="camera-reset">↻</button><button id="zin">＋</button><button id="zout">−</button></div>
<script type="module">
import * as THREE from 'three';
import {createPlayer} from './src/entities/player.js';

const CONFIG={worldLimit:18,playerHeight:1.7,walkSpeed:3.2,runSpeed:5.2,runThreshold:.78,camera:{fov:38,near:.1,far:100,baseOffset:new THREE.Vector3(8,10,10),minZoom:.65,maxZoom:1.55,zoomStep:.12,orbitSensitivity:.006,pitchSensitivity:.0045,minPitch:THREE.MathUtils.degToRad(28),maxPitch:THREE.MathUtils.degToRad(55),followDeadZone:.55,followSharpness:3.2,positionSharpness:5.5}};
const ANIMS={idle:'Idle_9',walk:'Walking',run:'Running'};
const scene=new THREE.Scene();scene.background=new THREE.Color(0xa8d8ec);scene.fog=new THREE.Fog(0xa8d8ec,24,54);
const camera=new THREE.PerspectiveCamera(CONFIG.camera.fov,innerWidth/innerHeight,CONFIG.camera.near,CONFIG.camera.far);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=true;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe7f3ef,0x526146,1.5));const sun=new THREE.DirectionalLight(0xffe2a8,2.3);sun.position.set(-12,16,10);scene.add(sun);
const tex=await new THREE.TextureLoader().loadAsync('./assets/textures/grass.webp');tex.wrapS=tex.wrapT=THREE.RepeatWrapping;tex.repeat.set(8,8);tex.colorSpace=THREE.SRGBColorSpace;const ground=new THREE.Mesh(new THREE.PlaneGeometry(42,42),new THREE.MeshStandardMaterial({map:tex,roughness:1}));ground.rotation.x=-Math.PI/2;scene.add(ground);
const player=await createPlayer({url:'./assets/models/player/liora_all_animations_web.glb',height:CONFIG.playerHeight,renderOrder:10,animations:ANIMS});scene.add(player.root);

// joystick
const joy=document.querySelector('#joy'),stick=document.querySelector('#stick');let jId=null,jx=0,jy=0;const joyCenter=()=>{const r=joy.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2,rad:r.width*.34}};function updateJoy(e){const c=joyCenter(),dx=e.clientX-c.x,dy=e.clientY-c.y,len=Math.hypot(dx,dy)||1,k=Math.min(1,c.rad/len),px=dx*k,py=dy*k;jx=px/c.rad;jy=py/c.rad;stick.style.transform=`translate(${px}px,${py}px)`}joy.addEventListener('pointerdown',e=>{jId=e.pointerId;joy.setPointerCapture?.(jId);updateJoy(e);e.stopPropagation()});joy.addEventListener('pointermove',e=>{if(e.pointerId===jId){updateJoy(e);e.stopPropagation()}});function endJoy(e){if(e.pointerId!==jId)return;jId=null;jx=jy=0;stick.style.transform='translate(0,0)';e.stopPropagation()}joy.addEventListener('pointerup',endJoy);joy.addEventListener('pointercancel',endJoy);

// exact old smooth camera logic
const C=CONFIG.camera,baseLength=C.baseOffset.length(),initialYaw=Math.atan2(C.baseOffset.x,C.baseOffset.z),initialPitch=Math.asin(C.baseOffset.y/baseLength);let zoom=1,yaw=initialYaw,pitch=initialPitch,orbitPointer=null,lastX=0,lastY=0,pinchStart=null,pinchZoom=1;const followTarget=new THREE.Vector3(),desiredFollow=new THREE.Vector3(),deltaToTarget=new THREE.Vector3();let followReady=false;function setZoom(v){zoom=THREE.MathUtils.clamp(v,C.minZoom,C.maxZoom)}function reset(){zoom=1;yaw=initialYaw;pitch=initialPitch}function currentOffset(){const d=baseLength*zoom,h=Math.cos(pitch)*d;return new THREE.Vector3(Math.sin(yaw)*h,Math.sin(pitch)*d,Math.cos(yaw)*h)}function updateFollow(target,dt){if(!followReady){followTarget.copy(target);followReady=true;return}deltaToTarget.copy(target).sub(followTarget);deltaToTarget.y=0;const d=deltaToTarget.length();if(d>C.followDeadZone){desiredFollow.copy(target).addScaledVector(deltaToTarget,-C.followDeadZone/d);followTarget.lerp(desiredFollow,1-Math.exp(-C.followSharpness*dt))}followTarget.y=target.y}function updateCamera(target,dt){updateFollow(target,dt);camera.position.lerp(followTarget.clone().add(currentOffset()),1-Math.exp(-C.positionSharpness*dt));camera.lookAt(followTarget)}
document.querySelector('#zin').onclick=()=>setZoom(zoom-C.zoomStep);document.querySelector('#zout').onclick=()=>setZoom(zoom+C.zoomStep);document.querySelector('#camera-reset').onclick=reset;
renderer.domElement.addEventListener('pointerdown',e=>{if(e.target!==renderer.domElement||e.pointerType==='touch'&&e.isPrimary===false)return;orbitPointer=e.pointerId;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture?.(orbitPointer)});renderer.domElement.addEventListener('pointermove',e=>{if(e.pointerId!==orbitPointer||pinchStart)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;yaw-=dx*C.orbitSensitivity;pitch=THREE.MathUtils.clamp(pitch+dy*C.pitchSensitivity,C.minPitch,C.maxPitch)});const endOrbit=e=>{if(e.pointerId===orbitPointer)orbitPointer=null};renderer.domElement.addEventListener('pointerup',endOrbit);renderer.domElement.addEventListener('pointercancel',endOrbit);renderer.domElement.addEventListener('touchstart',e=>{if(e.touches.length!==2)return;pinchStart=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);pinchZoom=zoom;orbitPointer=null},{passive:false});renderer.domElement.addEventListener('touchmove',e=>{if(e.touches.length!==2||!pinchStart)return;e.preventDefault();const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);setZoom(pinchZoom*(pinchStart/d))},{passive:false});renderer.domElement.addEventListener('touchend',e=>{if(e.touches.length<2)pinchStart=null});

const clock=new THREE.Clock(),target=new THREE.Vector3(),camForward=new THREE.Vector3(),camRight=new THREE.Vector3(),move=new THREE.Vector3(),up=new THREE.Vector3(0,1,0);function cameraRelative(x,z){camera.getWorldDirection(camForward);camForward.y=0;camForward.normalize();camRight.crossVectors(camForward,up).normalize();move.set(0,0,0).addScaledVector(camRight,x).addScaledVector(camForward,z);if(move.lengthSq()>.0001)move.normalize();return move}
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.04),m=Math.min(1,Math.hypot(jx,jy));if(m>.05){const dir=cameraRelative(jx,-jy),running=m>CONFIG.runThreshold,speed=running?CONFIG.runSpeed:CONFIG.walkSpeed;player.root.position.x+=dir.x*speed*dt;player.root.position.z+=dir.z*speed*dt;const a=Math.atan2(dir.x,dir.z),diff=Math.atan2(Math.sin(a-player.root.rotation.y),Math.cos(a-player.root.rotation.y));player.root.rotation.y+=diff*Math.min(1,10*dt);player.fadeTo(running?ANIMS.run:ANIMS.walk,.15,true)}else player.fadeTo(ANIMS.idle,.18,true);player.root.position.x=THREE.MathUtils.clamp(player.root.position.x,-CONFIG.worldLimit,CONFIG.worldLimit);player.root.position.z=THREE.MathUtils.clamp(player.root.position.z,-CONFIG.worldLimit,CONFIG.worldLimit);player.mixer.update(dt);target.set(player.root.position.x,.7,player.root.position.z);updateCamera(target,dt);renderer.render(scene,camera)}loop();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body></html>
