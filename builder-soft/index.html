<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Liora v6.14 + Soft Splat Test</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#a8d8ec;font-family:system-ui,sans-serif}
#boot{position:fixed;inset:0;display:grid;place-items:center;color:#fff;font-weight:800;text-shadow:0 2px 5px #234}
#boot>div{background:#173c4bcc;padding:16px 20px;border-radius:18px;max-width:82vw}
#boot small{display:block;margin-top:6px;font-weight:500}
</style>
</head>
<body>
<div id="boot"><div id="boot-box">กำลังโหลด v6.14 + Soft Splat…<small>ตัวทดสอบแยก • ไม่แตะ Builder หลัก</small></div></div>
<script>
(async()=>{
  const SOURCE="https://raw.githubusercontent.com/myadisak175-dotcom/liora-farm/8b2aef1c30935a8c0196aa9930b984930f959459/builder/index.html";
  const boot=document.querySelector("#boot-box");
  const fail=message=>{
    console.error(message);
    if(boot)boot.innerHTML=`เปิดตัวทดสอบไม่สำเร็จ<small>${String(message)}</small><button onclick="location.reload()" style="margin-top:10px;padding:8px 12px">ลองใหม่</button>`;
  };
  try{
    const response=await fetch(SOURCE,{cache:"no-store"});
    if(!response.ok)throw new Error(`v6.14 HTTP ${response.status}`);
    let source=await response.text();
    source=source.replace("<head>","<head>\n<base href=\"../builder/\">");
    source=source.replace(
      "<title>Liora — Home Island Builder v6.14 Smooth Walkable Path</title>",
      "<title>Liora — v6.14 + Soft Splat Test</title>"
    );
    source=source.replace(
      "Builder v6.14 • Smooth Walkable Path • Safe Edit • MapSafe",
      "Builder v6.14 • TRUE Soft Splat Test • Safe Edit • MapSafe"
    );
    source=source.replace("</head>","<style id=\"soft-splat-test-style\">\n#soft-paint-panel{\n  position:fixed;left:10px;right:10px;bottom:158px;z-index:80;\n  display:none;gap:6px;align-items:center;overflow-x:auto;\n  padding:8px;border-radius:16px;background:rgba(24,44,52,.92);\n  border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(10px);\n  box-shadow:0 8px 24px rgba(0,0,0,.25)\n}\n#soft-paint-panel.on{display:flex}\n#soft-paint-panel button{\n  flex:0 0 auto;height:40px;border:1px solid rgba(255,255,255,.35);\n  background:rgba(50,88,101,.92);color:#fff;border-radius:11px;\n  padding:6px 9px;font-weight:800;white-space:nowrap\n}\n#soft-paint-panel button.active{outline:3px solid rgba(255,255,255,.72)}\n#soft-paint-panel label{\n  flex:0 0 auto;display:flex;align-items:center;gap:5px;\n  color:#fff;font-size:11px;font-weight:700\n}\n#soft-paint-panel input{width:82px}\n#soft-paint-count{flex:0 0 auto;color:#d9f6ff;font-size:11px;font-weight:800}\n#soft-paint-toggle.active{outline:3px solid rgba(255,255,255,.78)!important;background:rgba(70,132,112,.96)!important}\n</style>\n</head>");
    const groundOld="const ground=new THREE.Mesh(\n  terrainGeo,\n  new THREE.MeshStandardMaterial({map:grass,roughness:1,metalness:0})\n);";
    const groundNew="// v6.14 + TRUE SOFT SPLAT -------------------------------------------------\n// Ported from the old separated splat system. This blends textures in ONE\n// ground material; it does not place square/circular overlay tiles.\nfunction softPrepareTexture(texture){\n  texture.wrapS=texture.wrapT=THREE.RepeatWrapping;\n  texture.repeat.set(8,8);\n  texture.colorSpace=THREE.SRGBColorSpace;\n  texture.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());\n  return texture;\n}\nconst softDirtTex=softPrepareTexture(texLoader.load(\"../assets/textures/dirt.webp\"));\nconst softSandTex=softPrepareTexture(texLoader.load(\"../assets/textures/sand.webp\"));\nconst softRockTex=softPrepareTexture(texLoader.load(\"../assets/textures/rock.webp\"));\n\nconst softSplatCanvas=document.createElement(\"canvas\");\nsoftSplatCanvas.width=softSplatCanvas.height=512;\nconst softSplatCtx=softSplatCanvas.getContext(\"2d\",{willReadFrequently:true});\nsoftSplatCtx.fillStyle=\"#000\";\nsoftSplatCtx.fillRect(0,0,512,512);\nconst softSplatTexture=new THREE.CanvasTexture(softSplatCanvas);\nsoftSplatTexture.colorSpace=THREE.NoColorSpace;\nsoftSplatTexture.generateMipmaps=false;\nsoftSplatTexture.minFilter=THREE.LinearFilter;\nsoftSplatTexture.magFilter=THREE.LinearFilter;\nsoftSplatTexture.wrapS=softSplatTexture.wrapT=THREE.ClampToEdgeWrapping;\n\nconst softGroundMaterial=new THREE.MeshStandardMaterial({map:grass,roughness:1,metalness:0});\nsoftGroundMaterial.onBeforeCompile=shader=>{\n  shader.uniforms.uSoftSplat={value:softSplatTexture};\n  shader.uniforms.uSoftGrass={value:grass};\n  shader.uniforms.uSoftDirt={value:softDirtTex};\n  shader.uniforms.uSoftSand={value:softSandTex};\n  shader.uniforms.uSoftRock={value:softRockTex};\n  shader.fragmentShader=shader.fragmentShader\n    .replace(\"#include <common>\",`#include <common>\nuniform sampler2D uSoftSplat;\nuniform sampler2D uSoftGrass;\nuniform sampler2D uSoftDirt;\nuniform sampler2D uSoftSand;\nuniform sampler2D uSoftRock;`)\n    .replace(\"#include <map_fragment>\",`\nvec2 softUv=vMapUv;\nvec2 softTileUv=softUv*8.0;\nvec3 softSplat=texture2D(uSoftSplat,softUv).rgb;\nfloat softDirt=softSplat.r;\nfloat softSand=softSplat.g;\nfloat softRock=softSplat.b;\nfloat softGrass=1.0-clamp(softDirt+softSand+softRock,0.0,1.0);\nvec3 softGround=\n  texture2D(uSoftGrass,softTileUv).rgb*softGrass+\n  texture2D(uSoftDirt,softTileUv).rgb*softDirt+\n  texture2D(uSoftSand,softTileUv).rgb*softSand+\n  texture2D(uSoftRock,softTileUv).rgb*softRock;\nsoftGround/=max(softGrass+softDirt+softSand+softRock,0.001);\ndiffuseColor*=vec4(softGround,1.0);\n`);\n};\nsoftGroundMaterial.customProgramCacheKey=()=>\"liora-v614-soft-splat-test-v1\";\n\nconst SOFT_SPLAT_LAYERS={DIRT:0,SAND:1,ROCK:2,ERASE:3,GRASS:4};\nconst SOFT_SPLAT_INK={0:\"255,0,0\",1:\"0,255,0\",2:\"0,0,255\"};\nconst softStrokes=[];\nconst softWorldSize=42;\nconst softHalf=softWorldSize/2;\nconst softPixelsPerUnit=512/softWorldSize;\nlet softPaintEnabled=false;\nlet softLayer=SOFT_SPLAT_LAYERS.DIRT;\nlet softRadius=1.6;\nconst softStrength=.85;\nconst softStorageKey=\"liora.v614.soft-splat.draft.v1\";\nlet softSaveTimer=null;\n\nfunction softParseRgb(rgb){return rgb.split(\",\").map(Number)}\nfunction softMixRgb(a,b,amount){\n  const ca=softParseRgb(a),cb=softParseRgb(b);\n  return ca.map((value,index)=>Math.round(value+(cb[index]-value)*amount)).join(\",\");\n}\nfunction softRadialGradient(cx,cy,r,innerRgb,outerRgb){\n  const gradient=softSplatCtx.createRadialGradient(cx,cy,0,cx,cy,r);\n  gradient.addColorStop(0,`rgb(${innerRgb})`);\n  gradient.addColorStop(.34,`rgb(${innerRgb})`);\n  gradient.addColorStop(.62,`rgb(${softMixRgb(innerRgb,outerRgb,.35)})`);\n  gradient.addColorStop(.82,`rgb(${softMixRgb(innerRgb,outerRgb,.72)})`);\n  gradient.addColorStop(.94,`rgb(${softMixRgb(innerRgb,outerRgb,.92)})`);\n  gradient.addColorStop(1,`rgb(${outerRgb})`);\n  return gradient;\n}\nfunction softStamp(cx,cy,r,gradient,mode,alpha){\n  softSplatCtx.save();\n  softSplatCtx.globalCompositeOperation=mode;\n  softSplatCtx.globalAlpha=alpha;\n  softSplatCtx.fillStyle=gradient;\n  softSplatCtx.beginPath();\n  softSplatCtx.arc(cx,cy,r,0,Math.PI*2);\n  softSplatCtx.fill();\n  softSplatCtx.restore();\n}\nfunction softDrawStroke(x,z,radius,layer,strength){\n  const cx=(x+softHalf)*softPixelsPerUnit;\n  const cy=(z+softHalf)*softPixelsPerUnit;\n  const r=Math.max(1,radius*softPixelsPerUnit);\n  const alpha=THREE.MathUtils.clamp(strength,0,1);\n  if(layer===SOFT_SPLAT_LAYERS.ERASE||layer===SOFT_SPLAT_LAYERS.GRASS){\n    softStamp(cx,cy,r,softRadialGradient(cx,cy,r,\"0,0,0\",\"255,255,255\"),\"multiply\",alpha);\n  }else{\n    const ink=SOFT_SPLAT_INK[layer];\n    if(!ink)return;\n    softStamp(cx,cy,r,softRadialGradient(cx,cy,r,ink,\"255,255,255\"),\"multiply\",alpha);\n    softStamp(cx,cy,r,softRadialGradient(cx,cy,r,ink,\"0,0,0\"),\"lighter\",alpha);\n  }\n}\nfunction softCommit(){softSplatTexture.needsUpdate=true}\nfunction softClearCanvas(){\n  softSplatCtx.save();\n  softSplatCtx.globalCompositeOperation=\"source-over\";\n  softSplatCtx.globalAlpha=1;\n  softSplatCtx.fillStyle=\"#000\";\n  softSplatCtx.fillRect(0,0,512,512);\n  softSplatCtx.restore();\n}\nfunction softReplay(){\n  softClearCanvas();\n  for(const s of softStrokes)softDrawStroke(...s);\n  softCommit();\n}\nfunction softSave(){\n  clearTimeout(softSaveTimer);\n  softSaveTimer=setTimeout(()=>{\n    try{localStorage.setItem(softStorageKey,JSON.stringify({version:1,strokes:softStrokes}))}\n    catch(e){console.warn(e)}\n  },250);\n}\nfunction softPaintAt(x,z){\n  const stroke=[+x.toFixed(2),+z.toFixed(2),+softRadius.toFixed(2),softLayer,+softStrength.toFixed(2)];\n  softStrokes.push(stroke);\n  softDrawStroke(...stroke);\n  softCommit();\n  softSave();\n  softRefreshUi();\n}\nfunction softLoad(){\n  try{\n    const raw=localStorage.getItem(softStorageKey);\n    if(!raw)return;\n    const data=JSON.parse(raw);\n    if(data?.version!==1||!Array.isArray(data.strokes))return;\n    softStrokes.push(...data.strokes);\n    softReplay();\n  }catch(e){console.warn(\"[soft-splat] draft load failed\",e)}\n}\n\nconst ground=new THREE.Mesh(\n  terrainGeo,\n  softGroundMaterial\n);";
    if(!source.includes(groundOld))throw new Error("v6.14 ground anchor not found");
    source=source.replace(groundOld,groundNew);
    source=source.replace(
      "    <div id=\"asset-strip\">\n",
      "    <div id=\"asset-strip\">\n      <button class=\"asset-card\" id=\"soft-paint-toggle\"><span class=\"thumb\">🎨</span><span>Ground</span></button>\n"
    );
    source=source.replace("</body>","<div id=\"soft-paint-panel\">\n  <button type=\"button\" data-soft-layer=\"4\">🌿 หญ้า</button>\n  <button type=\"button\" data-soft-layer=\"0\">🟫 ดิน</button>\n  <button type=\"button\" data-soft-layer=\"1\">🏖️ ทราย</button>\n  <button type=\"button\" data-soft-layer=\"2\">🪨 หิน</button>\n  <button type=\"button\" data-soft-layer=\"3\">⌫ ลบ</button>\n  <label>ขนาด <input id=\"soft-paint-size\" type=\"range\" min=\".5\" max=\"4.5\" step=\".1\" value=\"1.6\"></label>\n  <button type=\"button\" id=\"soft-paint-undo\">↶ Undo</button>\n  <span id=\"soft-paint-count\">0</span>\n</div>\n</body>");
    const paintSetupAnchor="ground.renderOrder=0;\nscene.add(ground);";
    const paintSetup="ground.renderOrder=0;\nscene.add(ground);\n\n// Soft Splat mobile controls. Registered before orbit/builder canvas handlers,\n// so painting cannot accidentally rotate the camera or move Builder objects.\nconst softPanel=document.querySelector(\"#soft-paint-panel\");\nconst softToggle=document.querySelector(\"#soft-paint-toggle\");\nconst softSize=document.querySelector(\"#soft-paint-size\");\nconst softCount=document.querySelector(\"#soft-paint-count\");\nconst softLayerButtons=[...document.querySelectorAll(\"[data-soft-layer]\")];\nconst softRaycaster=new THREE.Raycaster();\nconst softNdc=new THREE.Vector2();\nconst softActivePointers=new Set();\nlet softPainting=false;\nlet softLastX=0,softLastZ=0;\n\nfunction softRefreshUi(){\n  if(softCount)softCount.textContent=`${softStrokes.length} strokes`;\n  softToggle?.classList.toggle(\"active\",softPaintEnabled);\n  softPanel?.classList.toggle(\"on\",softPaintEnabled&&document.body.classList.contains(\"builder-on\"));\n  for(const button of softLayerButtons){\n    button.classList.toggle(\"active\",Number(button.dataset.softLayer)===softLayer);\n  }\n}\nfunction setSoftPaintEnabled(value){\n  softPaintEnabled=Boolean(value);\n  softPainting=false;\n  softRefreshUi();\n}\nfunction softPointFromEvent(event){\n  const rect=renderer.domElement.getBoundingClientRect();\n  softNdc.x=((event.clientX-rect.left)/rect.width)*2-1;\n  softNdc.y=-((event.clientY-rect.top)/rect.height)*2+1;\n  softRaycaster.setFromCamera(softNdc,camera);\n  const hit=softRaycaster.intersectObject(ground,false)[0];\n  return hit?.point||null;\n}\nfunction softShouldRecord(x,z){\n  return Math.hypot(x-softLastX,z-softLastZ)>=softRadius/3;\n}\nfunction softApplyEvent(event,isFirst){\n  const point=softPointFromEvent(event);\n  if(!point)return;\n  if(!isFirst&&!softShouldRecord(point.x,point.z))return;\n  softPaintAt(point.x,point.z);\n  softLastX=point.x;softLastZ=point.z;\n}\nfunction softPointerDown(event){\n  softActivePointers.add(event.pointerId);\n  if(!softPaintEnabled||!document.body.classList.contains(\"builder-on\")||softActivePointers.size>1)return;\n  event.preventDefault();\n  event.stopImmediatePropagation();\n  softPainting=true;\n  softApplyEvent(event,true);\n}\nfunction softPointerMove(event){\n  if(!softPaintEnabled||!softPainting)return;\n  if(softActivePointers.size>1){softPainting=false;return}\n  event.preventDefault();\n  event.stopImmediatePropagation();\n  softApplyEvent(event,false);\n}\nfunction softPointerEnd(event){\n  softActivePointers.delete(event.pointerId);\n  if(!softPaintEnabled)return;\n  if(softPainting){\n    event.preventDefault();\n    event.stopImmediatePropagation();\n  }\n  softPainting=false;\n}\nrenderer.domElement.addEventListener(\"pointerdown\",softPointerDown,true);\nrenderer.domElement.addEventListener(\"pointermove\",softPointerMove,true);\nrenderer.domElement.addEventListener(\"pointerup\",softPointerEnd,true);\nrenderer.domElement.addEventListener(\"pointercancel\",softPointerEnd,true);\n\nsoftToggle?.addEventListener(\"click\",event=>{\n  event.preventDefault();event.stopPropagation();\n  setSoftPaintEnabled(!softPaintEnabled);\n});\nsoftLayerButtons.forEach(button=>button.addEventListener(\"click\",()=>{\n  softLayer=Number(button.dataset.softLayer);\n  softRefreshUi();\n}));\nsoftSize?.addEventListener(\"input\",()=>{softRadius=Number(softSize.value)});\ndocument.querySelector(\"#soft-paint-undo\")?.addEventListener(\"click\",()=>{\n  if(!softStrokes.length)return;\n  softStrokes.pop();softReplay();softSave();softRefreshUi();\n});\ndocument.addEventListener(\"click\",event=>{\n  if(event.target.closest?.(\"[data-build-asset]\"))setSoftPaintEnabled(false);\n},true);\nnew MutationObserver(()=>{\n  if(!document.body.classList.contains(\"builder-on\"))setSoftPaintEnabled(false);\n  else softRefreshUi();\n}).observe(document.body,{attributes:true,attributeFilter:[\"class\"]});\n\nsoftLoad();\nsoftRefreshUi();";
    if(!source.includes(paintSetupAnchor))throw new Error("v6.14 paint setup anchor not found");
    source=source.replace(paintSetupAnchor,paintSetup);
    document.open();
    document.write(source);
    document.close();
  }catch(error){
    fail(error?.message||error);
  }
})();
</script>
</body>
</html>
