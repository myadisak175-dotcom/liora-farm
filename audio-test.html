<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Liora Audio Test</title>
<style>
body{margin:0;padding:24px;background:#102a33;color:#f6fbfa;font:16px/1.45 system-ui,sans-serif}main{max-width:680px;margin:auto}h1{font-size:24px}.card{padding:14px 16px;margin:12px 0;border:1px solid #ffffff35;border-radius:16px;background:#ffffff0e}.name{font-weight:700;margin-bottom:8px}.status{font-size:13px;opacity:.8;margin-top:6px}audio{width:100%}a{color:#a7e7df}</style>
</head>
<body><main>
<h1>🎧 Liora Audio Foundation v4</h1>
<p>กด Play เพื่อตรวจไฟล์ที่เกมใช้จริง เพลงและเสียงบรรยากาศจะสตรีมเพื่อลดการใช้ RAM บนมือถือ และเกมจะค่อย ๆ เปลี่ยนเสียงนกเป็นเสียงป่าตามเวลา</p>
<div id="list"></div>
<p><a href="./?map=world-blockout-v1">← กลับเกม</a></p>
<script>
const tracks=[
  ["เพลงหลัก — Lanternfields Overture","assets/audio/music_lanternfields_overture.mp3"],
  ["เช้า/กลางวัน — เสียงนก","assets/audio/ambience_morning_birdsong.mp3"],
  ["เย็น/กลางคืน — ป่า ลม และจิ้งหรีด","assets/audio/ambience_forest_night.mp3"],
  ["เดินช้าบนหญ้า","assets/audio/footstep_grass_soft.mp3"],
  ["วิ่งบนหญ้า","assets/audio/footstep_grass_run_clean.mp3"],
];
const list=document.querySelector('#list');
for(const [name,src] of tracks){
  const card=document.createElement('div');card.className='card';
  const title=document.createElement('div');title.className='name';title.textContent=name;
  const audio=document.createElement('audio');audio.controls=true;audio.preload='metadata';audio.src=src;
  const status=document.createElement('div');status.className='status';status.textContent='กำลังตรวจไฟล์…';
  audio.addEventListener('loadedmetadata',()=>status.textContent=`พร้อม • ${Number(audio.duration||0).toFixed(1)} วินาที`);
  audio.addEventListener('error',()=>{status.textContent='❌ โหลดไม่ได้';status.style.color='#ffb4aa';});
  card.append(title,audio,status);list.append(card);
}
</script>
</main></body></html>
