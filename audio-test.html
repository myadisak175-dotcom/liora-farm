<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Liora Audio Test</title>
<style>
body{margin:0;padding:24px;background:#102a33;color:#f6fbfa;font:16px/1.45 system-ui,sans-serif}main{max-width:680px;margin:auto}h1{font-size:24px}h2{font-size:19px;margin-top:28px}.card{padding:14px 16px;margin:12px 0;border:1px solid #ffffff35;border-radius:16px;background:#ffffff0e}.name{font-weight:700;margin-bottom:8px}.status{font-size:13px;opacity:.8;margin-top:6px}audio{width:100%}a{color:#a7e7df}button.run{appearance:none;width:100%;padding:14px;border-radius:14px;border:1px solid #ffffff45;background:#1c5568;color:#fff;font:700 17px system-ui,sans-serif}button.run:disabled{opacity:.55}button.copy{appearance:none;margin-top:10px;padding:9px 14px;border-radius:11px;border:1px solid #ffffff3a;background:#ffffff14;color:#fff;font:600 14px system-ui,sans-serif}#report{white-space:pre-wrap;font:12.5px/1.5 ui-monospace,monospace;margin:12px 0 0;padding:12px;border-radius:12px;background:#00000047;min-height:1.5em}.ok{color:#9ff0c8}.bad{color:#ffb4aa}.warn{color:#ffd79a}
</style>
</head>
<body><main>
<h1>🎧 Liora Audio 19 — Native Media Test</h1>
<p>หน้านี้ตรวจเส้นทางเดียวกับเกมรุ่นใหม่: HTML Audio โดยตรง ไม่มี Web Audio / AudioContext สำหรับเสียงเดิน</p>

<h2>ตรวจเครื่องนี้</h2>
<div class="card">
  <button type="button" class="run" id="run">▶ เริ่มตรวจเสียง</button>
  <pre id="report">กดปุ่มด้านบนเพื่อเริ่ม</pre>
  <button type="button" class="copy" id="copy" hidden>คัดลอกผล</button>
</div>

<h2>ฟังไฟล์จริงทีละไฟล์</h2>
<div id="list"></div>
<p><a href="./?v=audio19">← กลับเกม audio19</a></p>
<p><a href="./?v=audio19&audiodebug=1">เปิดเกมพร้อม Audio Debug</a></p>

<script>
const REV='audio19';
const STREAMS=[
  ['เพลงหลัก','assets/audio/music_lanternfields_overture.mp3'],
  ['เสียงนก','assets/audio/ambience_morning_birdsong.mp3'],
  ['ป่ากลางคืน','assets/audio/ambience_forest_night.mp3'],
  ['ลมพัดต้นไม้','assets/audio/ambience_tree_wind.mp3'],
];
const STEPS=[
  ['เดินหญ้า','assets/audio/footstep_grass_soft.mp3'],
  ['วิ่งหญ้า','assets/audio/footstep_grass_run_clean.mp3'],
  ['วิ่งดิน','assets/audio/footstep_run_dirt.mp3'],
  ['วิ่งพื้นแข็ง','assets/audio/footstep_run_ground.mp3'],
  ['ลุยน้ำ','assets/audio/footstep_water_wade_bank.mp3'],
];
const ALL=[...STREAMS,...STEPS];

const list=document.querySelector('#list');
for(const [name,src] of ALL){
  const card=document.createElement('div');card.className='card';
  const title=document.createElement('div');title.className='name';title.textContent=name;
  const audio=document.createElement('audio');audio.controls=true;audio.preload='metadata';audio.playsInline=true;audio.src=`${src}?v=${REV}`;
  const status=document.createElement('div');status.className='status';status.textContent='กำลังอ่านไฟล์…';
  audio.addEventListener('loadedmetadata',()=>status.textContent=`พร้อม • ${Number(audio.duration||0).toFixed(2)} วินาที`);
  audio.addEventListener('error',()=>{status.textContent=`❌ media error ${audio.error?.code??'?'}`;status.style.color='#ffb4aa';});
  card.append(title,audio,status);list.append(card);
}

const report=document.querySelector('#report');
const runButton=document.querySelector('#run');
const copyButton=document.querySelector('#copy');
const lines=[];
function say(text,kind){lines.push(text);const row=document.createElement('span');row.textContent=text+'\n';if(kind)row.className=kind;report.append(row);}
const wait=(ms)=>new Promise((resolve)=>setTimeout(resolve,ms));

function makeAudio(src,{muted=false,loop=false}={}){
  const a=document.createElement('audio');
  a.src=`${src}?v=${REV}`;a.preload='auto';a.playsInline=true;a.loop=loop;a.muted=muted;a.hidden=true;
  a.setAttribute('playsinline','');a.setAttribute('webkit-playsinline','');document.body.append(a);return a;
}

async function playProbe(name,src,{muted=false,listenMs=900}={}){
  const a=makeAudio(src,{muted});
  const at=a.currentTime;
  let error='';
  try{await a.play();}catch(e){error=String(e?.name||e?.message||e);}
  await wait(listenMs);
  const moved=a.currentTime-at;
  const result={name,error,moved,paused:a.paused,code:a.error?.code??0,ready:a.readyState,network:a.networkState};
  try{a.pause();}catch{}a.removeAttribute('src');try{a.load();}catch{}a.remove();
  return result;
}

async function runReport(){
  runButton.disabled=true;report.textContent='';lines.length=0;
  say('=== Liora audio19 native report ===');
  say(new Date().toISOString());
  say(navigator.userAgent);
  say(`visibility=${document.visibilityState}`);
  const volumeProbe=document.createElement('audio');volumeProbe.volume=.37;
  const volumeWritable=Math.abs(volumeProbe.volume-.37)<.01;
  say(`element volume writable=${volumeWritable}`,volumeWritable?'ok':'warn');

  say('1) เสียงเดินแบบ native จาก gesture นี้');
  const step=await playProbe('walk',STEPS[0][1],{listenMs:650});
  if(step.error) say(`  ❌ play() rejected: ${step.error}`,'bad');
  else if(step.code) say(`  ❌ media error ${step.code}`,'bad');
  else if(step.moved<.05) say(`  ⚠️ play resolved แต่ clock เดิน ${step.moved.toFixed(2)}s`,'warn');
  else say(`  ✅ clock เดิน ${step.moved.toFixed(2)}s`,'ok');

  say('2) เพลงหลักแบบ native');
  const music=await playProbe('music',STREAMS[0][1],{listenMs:1100});
  if(music.error) say(`  ❌ play() rejected: ${music.error}`,'bad');
  else if(music.code) say(`  ❌ media error ${music.code}`,'bad');
  else if(music.moved<.1) say(`  ⚠️ play resolved แต่ clock เดิน ${music.moved.toFixed(2)}s`,'warn');
  else say(`  ✅ clock เดิน ${music.moved.toFixed(2)}s`,'ok');

  say('3) metadata ของทุกไฟล์');
  for(const [name,src] of ALL){
    const a=makeAudio(src,{muted:true});
    let detail='';
    try{
      await new Promise((resolve,reject)=>{
        const timer=setTimeout(()=>reject(new Error('timeout')),5000);
        a.addEventListener('loadedmetadata',()=>{clearTimeout(timer);resolve();},{once:true});
        a.addEventListener('error',()=>{clearTimeout(timer);reject(new Error(`media ${a.error?.code??'?'}`));},{once:true});
        a.load();
      });
      detail=`${Number(a.duration||0).toFixed(2)}s`;
      say(`  ✅ ${name} ${detail}`,'ok');
    }catch(e){say(`  ❌ ${name} ${e?.message??e}`,'bad');}
    a.removeAttribute('src');try{a.load();}catch{}a.remove();
  }

  say('=== จบการตรวจ ===');
  copyButton.hidden=false;runButton.disabled=false;runButton.textContent='▶ ตรวจอีกครั้ง';
}
runButton.addEventListener('click',()=>runReport().catch((error)=>{say(`ตรวจไม่สำเร็จ: ${error?.message??error}`,'bad');runButton.disabled=false;}));
copyButton.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(lines.join('\n'));copyButton.textContent='คัดลอกแล้ว ✓';}catch{copyButton.textContent='คัดลอกไม่ได้';}});
</script>
</main></body></html>
