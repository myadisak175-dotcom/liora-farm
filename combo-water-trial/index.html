<!--
  combo-water-trial/index.html  —  A TRIAL, to be taken away again: her four tapped casts (the normal combo) with the
  sound and the look of a clip the user sent (22 Nov 2026: gemini_generated_video_756f9de6.mp4, a girl's four water
  casts; "เอาเสียงตั้งแต่วินาทีที่สี่เป็นต้นไป มาปรับใช้กับสกิลโจมตีคอมโบปรกติได้เลยนะ Vfx ทำแบบในวีดีโอได้ยิ่งดี", then,
  shown a film of it, "ขึ้นแยกไว้": kept apart from the game for now).
  Heard: the clip's sound from its fourth second on, which is two sounds. The two swipes: the first, from just before its
  blow (swipe-1); the turn: the same with all its swing (turn-1); the finisher: the second, from its charge (finish-1).
  Each begun so that its blow comes as the cast leaves her hand. Files in assets/audio/ (the game does not ask for them).
  Drawn: transparent water flipbooks taken from the reference cast, with world-space projectiles and hit splashes.
  Each atlas is drawn at the cast marker, attached to the palm, the sweep around the body, or the forward thrust.
  The flipbooks made crisp (the same evening: "คือมันออกมาสวยนะ Vfx สวยมาก ... vfx ดูเบลอๆ", "ถ้าทำให้ texture ชัดสวยจะดีมาก"):
  the same frames of the clip, in the same place and as big, but cut from the clip at its full size, made bigger and
  sharp, and shown one whole frame at a time (they were a quarter of the clip's size, and always two frames mixed).
  water-jet/-sweep/-orbit/-vortex.webp and water-casts.js, made by tools/make-water-casts.py (which says how);
  drawn by magic-combo-fx.js (WATER_CASTS). 5 MB to fetch in all (they were 0.7), 27 MB held (they were 16).
  The game and magic-combo.html are as they were. This folder holds the page and its own copies of the three modules
  that change (magic-combo-fx.js: the look; magic-combo.js: the look set as a move begins, fx.cast as a cast leaves her
  hand; step-sounds.js: the four casts' own sounds, reading the game's audio folder one up); everything else is the
  game's, loaded from one folder up. (lance-trial/ is another trial, of the lance, made from the same three modules: if
  both are liked, the two sets of changes go to the root together.)
  Liked: the three modules go to the root in place of the game's (cast-1 then the swipes' sound, or step-sounds.js asking
  for swipe-1), with the README's account of it, and this folder goes. Not liked: this folder and the three sounds go.
  Below, the page as magic-combo.html has it (with the four casts' sounds).

  magic-combo.html  —  Vivi's magic combo, to try: the attack button pressed four times is four casts, each a different
  move that goes into the next (magic-combo.js; her moves: magic-combo-anim.js; the light: magic-combo-fx.js), and a roll
  with a rising cast out of it. In a meadow with straw dummies to cast at: they rock when hit and are thrown up by the
  rising cast; nothing hits back. Walk and run as in the game (the joystick, dragging to look).
  One job: try the combo, alone. The game does not have it yet: this page is where it is worked on.
  All three rounds: the tapped combo and the roll; the held cast (a lance of light) and the running cast (a leap that
  turns once round); the casts in the air, off the magic jump (magic-jump.js, as in the game: the jump button):
  tapped, a cast from each hand in turn that holds her up, or over a dummy the rain (head down, spinning, casting down);
  held, the drop and a blow on the ground.

<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import * as N from '../stylized-nature.js';
import * as G from '../stylized-grassfield.js';
import { loadCharacter } from '../stylized-character.js';
import { createSprings } from '../character-springs.js';
import { CHARACTER_ANIM } from '../character-anim.js';
import { createPlayerInput } from '../player-input.js';
import { createFollowCamera } from '../player-camera.js';
import { CHARACTER_ANIM as COMBO_ANIM, MAGIC_COMBO } from '../magic-combo-anim.js';
import { createMagicCombo } from './magic-combo.js?v=1';
import { createMagicComboFx } from './magic-combo-fx.js?v=3';
import { createStepSounds } from './step-sounds.js?v=1';
import { CHARACTER_ANIM as JUMP_ANIM } from '../magic-jump-mocap-anim.js';
import { createMagicCircles } from '../magic-circle-fx.js';
import { createMagicJump } from '../magic-jump.js';

const phone = matchMedia('(pointer: coarse)').matches;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, phone ? 1.75 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.autoClear = false;
document.body.prepend(renderer.domElement);

// ---- the meadow: the game's sky, ground and grass (as magic-jump.html's)
const scene = new THREE.Scene();
{
  const c = document.createElement('canvas'); c.width = 4; c.height = 256;
  const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#2f72c4'); gr.addColorStop(0.55, '#7fb4e6'); gr.addColorStop(1, '#dcecf5');
  g.fillStyle = gr; g.fillRect(0, 0, 4, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  scene.background = t;
}
const FAR = '#d6e8ef';
scene.add(N.createAlphaFix());
N.setHaze({ color: FAR, near: 45, far: 150, max: 0.65 });
const ground = N.createGround({ radius: 120, flat: 32, hills: 1, far: FAR });
scene.add(ground);
const H = ground.userData.heightAt;
const map = G.createGroundMap({ radius: 120, size: 768, seed: 4, heightAt: H, dirt: 0 });
G.applyGroundMap(ground, map, { far: FAR });
const grass = G.createFluffyGrass({ map, heightAt: H, count: phone ? 70000 : 150000, radius: 32, far: FAR });
scene.add(grass);

// ---- straw dummies to cast at: a post, a straw body bound with rope, a cross-piece, a head. Hit, one rocks on its foot
// and comes upright again; the rising cast throws it up. They do nothing else
const hex = h => [parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255];
const dummyGeo = (() => {
  const tint = (g, h) => { const c = hex(h), n = g.attributes.position.count, a = new Float32Array(n * 3); for (let i = 0; i < n; i++) a.set(c, i * 3); g.setAttribute('color', new THREE.BufferAttribute(a, 3)); return g; };
  const cyl = (rt, rb, h, y, colour, seg = 14) => tint(new THREE.CylinderGeometry(rt, rb, h, seg).translate(0, y, 0), colour);
  const parts = [
    cyl(0.3, 0.34, 0.1, 0.05, '#7a5a3c'),                 // its foot
    cyl(0.065, 0.075, 1.5, 0.75, '#8b6844'),              // its post
    cyl(0.25, 0.3, 0.72, 0.9, '#e2c477', 16),             // the straw
    cyl(0.305, 0.315, 0.05, 0.72, '#8a5f3a', 16), cyl(0.27, 0.28, 0.05, 1.1, '#8a5f3a', 16),      // rope round it
    tint(new THREE.CylinderGeometry(0.045, 0.045, 1.1, 8).rotateZ(Math.PI / 2).translate(0, 1.16, 0), '#8b6844'),      // the cross-piece
    tint(new THREE.SphereGeometry(0.2, 16, 12).translate(0, 1.56, 0), '#ead08a'),                  // its head
  ];
  const g = mergeGeometries(parts);
  parts.forEach(p => p.dispose());
  return g;
})();
const dummyMat = () => new THREE.ShaderMaterial({
  uniforms: { uFlash: { value: 0 } },
  vertexShader: /* glsl */`
    attribute vec3 color;
    varying vec3 vC, vN;
    void main() { vC = color; vN = normalize(mat3(modelMatrix) * normal); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: /* glsl */`
    uniform float uFlash;
    varying vec3 vC, vN;
    void main() {
      float d = dot(normalize(vN), normalize(vec3(-0.4, 0.9, 0.5))) * 0.5 + 0.5;       // the game's sun; one edge between light and shade
      vec3 col = vC * mix(vec3(0.68, 0.68, 0.8), vec3(1.03, 1.01, 0.97), smoothstep(0.43, 0.47, d));
      gl_FragColor = vec4(mix(col, vec3(0.86, 0.96, 1.0), uFlash), 1.0);
    }`,
});
const SPOTS = [[0, 6.5], [-2.7, 7.6], [2.7, 7.6], [0.5, 10.5], [-6, 3.5], [6, 3.5]];       // (x, z; she starts at 0, 0 facing +z, +x her left)
const dummies = SPOTS.map(([x, z], i) => {
  const g = new THREE.Group(), mat = dummyMat();
  g.add(new THREE.Mesh(dummyGeo, mat));
  g.position.set(x, H(x, z), z);
  g.rotation.y = Math.atan2(-x, -z);                    // facing where she starts
  scene.add(g);
  const d = {
    g, mat, pos: g.position.clone(), radius: 0.34, height: 1.72, turn: g.rotation.y,
    tx: 0, tz: 0, vx: 0, vz: 0, up: 0, vy: 0, flash: 0, spin: 0,
    hit({ power, x: hx, z: hz, launch }) {
      const p = 2.4 + 1.3 * power;
      d.vx += hx * p; d.vz += hz * p; d.flash = 1;
      if (launch) { d.vy = 6.4; d.spin = (i % 2 ? 1 : -1) * 7; }
    },
  };
  return d;
});
function stepDummies(dt) {
  for (const d of dummies) {
    // rocking on its foot: a spring that brings it upright again
    d.vx += (-150 * d.tx - 5.5 * d.vx) * dt; d.vz += (-150 * d.tz - 5.5 * d.vz) * dt;
    d.tx = Math.max(-0.7, Math.min(0.7, d.tx + d.vx * dt)); d.tz = Math.max(-0.7, Math.min(0.7, d.tz + d.vz * dt));
    if (d.up > 0 || d.vy > 0) {
      d.vy -= 17 * dt; d.up += d.vy * dt; d.turn += d.spin * dt;
      if (d.up <= 0) { d.up = 0; d.vy = 0; d.spin = 0; d.vx *= 0.4; d.vz *= 0.4; d.flash = Math.max(d.flash, 0.4); }
    }
    d.flash = Math.max(0, d.flash - dt / 0.16);
    d.g.position.y = d.pos.y + d.up;
    d.g.rotation.set(d.tz, d.turn, -d.tx, 'YXZ');
    d.mat.uniforms.uFlash.value = d.flash * d.flash;
  }
}

// ---- the combo's light, in a scene of its own drawn over the meadow's: by night the meadow is dimmed to the hour's light
// first (as the game does it: the whole picture multiplied by one colour) and the light is drawn after it, undimmed
const fxScene = new THREE.Scene();
const fx = createMagicComboFx();
const circles = createMagicCircles({ seed: 2 });         // the magic jump's circles, in the combo's blue
circles.setLook('water');
fxScene.add(fx.object, circles.object);
const NIGHT = [0.26, 0.31, 0.6];
const dim = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
  uniforms: { uC: { value: new THREE.Vector3(...NIGHT) } },
  vertexShader: 'void main() { gl_Position = vec4(position.xy, 0.0, 1.0); }',
  fragmentShader: 'uniform vec3 uC; void main() { gl_FragColor = vec4(uC, 1.0); }',
  blending: THREE.CustomBlending, blendSrc: THREE.DstColorFactor, blendDst: THREE.ZeroFactor, depthTest: false, depthWrite: false,
}));
dim.frustumCulled = false;
const dimScene = new THREE.Scene(); dimScene.add(dim);
let night = false;
fx.setNight(night); circles.setNight(night);

// ---- the camera: the game's (player-camera.js), behind her
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 600);      // (55: FOV, below)
const level = { heightAt: H, crowns: [], cameraTrunks: [] };
const cam = createFollowCamera({ camera, level });
cam.setView(-Math.PI, 0.2);

// ---- her: walking and running as in the game (player-moves.js' numbers, at 1.75 m); the combo takes her over while a move lasts
const TUNED = 1.412;
const me = { pos: new THREE.Vector3(0, H(0, 0), 0), vel: new THREE.Vector3(), heading: 0 };
const root = new THREE.Group(); root.name = 'player'; scene.add(root);
let hero = null, combo = null, springs = null, air = null;
let landT = -1, landHold = 0, jumpWanted = 0, airBase = 0, jumpsUsed = 1;      // the magic jump, as magic-jump.html has it
let speed = 0, slow = 1, demo = null, shake = 0, clock = 0, aimK = 0, aimWas = null;
// the held cast's camera: in behind her right shoulder, a little to her right of the way she aims and from above, so that
// the lance goes off across the picture, up and to the right. dist, pitch, yaw: where it goes (m at 1.75 m, radians);
// side: how far to her right (m at most; of the picture's half width at her, so on an upright phone she stays in it);
// fov: how much narrower the picture (degrees, more the more the lance has grown)
const AIM_CAM = { dist: 3.6, pitch: 0.26, yaw: 0.22, side: 0.55, across: 0.4, fov: 6, in: 5, out: 3.5 };
const FOV = 55;
const WALK = 1.5, RUN = 4.2;
const stickV = new THREE.Vector2(), stick = { x: 0, z: 1, amount: 0 };
const world = { stick, targets: dummies, ground: H };
const sounds = createStepSounds();                       // her four casts heard (awake at the first touch)
const input = createPlayerInput({
  dom: renderer.domElement, ui: document.getElementById('stick'),
  onJump: () => attack(), onDash: () => dodge(),               // (a keyboard: Space casts, Shift rolls)
  onLook: (y, p) => { if (!combo || !combo.aiming) cam.turn(y, p); }, onZoom: d => { if (!combo || !combo.aiming) cam.zoom(d); },      // (aiming, the camera is the lance's)
});
// the attack button: the combo's; in the air (high enough), a cast in the air, and the jump lets her go
function pressAttack() {
  combo.attack();
  if (air.active && me.pos.y - H(me.pos.x, me.pos.z) > 0.8 * hero.height / 1.75 && combo.airShot(me, world)) { jumpsUsed = air.tier; air.end(); }
}
// the jump button: the magic jump (in the air, its next jump); not in the middle of a cast
function pressJump() { if (combo.active) return; if (air.active) air.press(me, stick); else jumpWanted = 0.15; }
function attack() { if (hero && !demo) pressAttack(); }
function jump() { if (hero && !demo) pressJump(); }
function release() { if (hero && !demo) combo.release(); }                // (the attack button let go: a held cast is thrown)
function dodge() { if (hero && !demo) combo.dodge(); }
for (const [id, press, up] of [['atkBtn', attack, release], ['rollBtn', dodge, null], ['jumpBtn', jump, null]]) {
  const b = document.getElementById(id);
  b.addEventListener('pointerdown', e => { e.preventDefault(); b.setPointerCapture(e.pointerId); b.classList.add('down'); press(); });
  for (const ev of ['pointerup', 'pointercancel']) b.addEventListener(ev, () => { b.classList.remove('down'); if (up) up(); });
}
addEventListener('keyup', e => { if (e.code === 'Space') release(); });

(async () => {
  const [{ VIVI_GLB }, data] = await Promise.all([
    import('../vivi-data.js'),
    fetch('../assets/characters/vivi.springs.json').then(r => (r.ok ? r.json() : null)).catch(() => null),
  ]);
  hero = await loadCharacter(VIVI_GLB, { ...CHARACTER_ANIM, clips: { ...CHARACTER_ANIM.clips, ...JUMP_ANIM.clips, ...COMBO_ANIM.clips } });
  if (data) {
    springs = createSprings(hero.model, data);
    hero.attachSprings(springs);
  }
  hero.setSize(1.75 / hero.baseHeight);
  root.add(hero.object);
  combo = createMagicCombo({ character: hero, marks: MAGIC_COMBO, fx });
  combo.onBegin = (i, hit) => { if (i >= 0) sounds.cast(i + 1, hit); };      // (each timed so its blow comes as the cast leaves her hand)
  air = createMagicJump({ character: hero, circles, mocap: true });
  combo.onLand = kind => { if (kind === 'big' || kind === 'ring') shake = 1; };
  hero.play('idle', 0);
  document.getElementById('wait').remove();
  window.magicTrial.ready = true;
})().catch(err => { document.getElementById('wait').textContent = 'โหลดวีวี่ไม่ได้: ' + err.message; console.error(err); });

// she goes round a dummy, not through it, and stays on the meadow
function collide(p) {
  for (const d of dummies) {
    const dx = p.x - d.pos.x, dz = p.z - d.pos.z, R = d.radius + 0.3, d2 = dx * dx + dz * dz;
    if (d2 < R * R && d2 > 1e-6) { const l = Math.sqrt(d2); p.x = d.pos.x + dx / l * R; p.z = d.pos.z + dz / l * R; }
  }
  const rr = Math.hypot(p.x, p.z);
  if (rr > 30) { p.x *= 30 / rr; p.z *= 30 / rr; }
}

// ---- the demo: the four casts one after another, a roll and the rising cast out of it, a run and the leap, the held
// cast grown full and thrown, and two jumps up and the cast in the air
function startDemo() {
  if (!hero || combo.active || demo) return;
  demo = { phase: 0, wait: 0, stick: null };
}
function stepDemo(dt) {
  const d = demo, idle = !combo.active;
  if (d.phase === 0) { combo.attack(); combo.release(); if (combo.index === 3) d.phase = 1; }
  else if (d.phase === 1) { if (idle && (d.wait += dt) > 0.35) { combo.dodge(); d.phase = 2; d.wait = 0; } }
  else if (d.phase === 2) { if (combo.rising) d.phase = 3; else { combo.attack(); combo.release(); } }
  else if (d.phase === 3) { if (idle) { d.phase = 4; d.stick = [0, -1]; } }                    // run on, away from the camera
  else if (d.phase === 4) { if ((d.wait += dt) > 0.75) { combo.attack(); combo.release(); d.stick = null; d.phase = 5; d.wait = 0; } }
  else if (d.phase === 5) { if (idle && (d.wait += dt) > 0.3) { combo.attack(); d.phase = 6; } }      // press, and hold
  else if (d.phase === 6) { if (combo.charge === 3 && (d.wait += dt) > 0.45) { combo.release(); d.phase = 7; d.wait = 0; } }
  else if (d.phase === 7) {                                                                                           // clear of the dummies (over one it would be the rain), and two jumps up
    if (!idle || (d.wait += dt) < 0.3) return;
    const near = dummies.reduce((a, b) => Math.hypot(b.pos.x - me.pos.x, b.pos.z - me.pos.z) < Math.hypot(a.pos.x - me.pos.x, a.pos.z - me.pos.z) ? b : a);
    const dx = me.pos.x - near.pos.x, dz = me.pos.z - near.pos.z, far = Math.hypot(dx, dz);
    if (far < 3 * hero.height / 1.75 && d.wait < 3) {
      const fwx = -Math.sin(cam.yaw), fwz = -Math.cos(cam.yaw);
      d.stick = [(dz * fwx - dx * fwz) / far, -(dx * fwx + dz * fwz) / far];
    } else if (d.stick) { d.stick = null; d.wait = 0.1; }                                                              // (stood still a moment first)
    else { pressJump(); d.phase = 8; d.wait = 0; }
  }
  else if (d.phase === 8) { if ((d.wait += dt) > 0.36) { pressJump(); d.phase = 9; d.wait = 0; } }
  else if (d.phase === 9) {                                                                                           // four casts in the air, then held: the drop
    if ((d.wait += dt) > (d.n ? 0.15 : 0.3)) { d.wait = 0; d.n = (d.n || 0) + 1; pressAttack(); if (d.n < 5) combo.release(); else d.phase = 10; }
  }
  else if (d.phase === 10) { if (idle && !air.active && (d.wait += dt) > 0.5) { d.phase = 11; d.wait = 0; } }
  else if (d.phase === 11) {                                                                                          // on to the nearest dummy, and up beside it
    const near = dummies.reduce((a, b) => Math.hypot(b.pos.x - me.pos.x, b.pos.z - me.pos.z) < Math.hypot(a.pos.x - me.pos.x, a.pos.z - me.pos.z) ? b : a);
    const dx = near.pos.x - me.pos.x, dz = near.pos.z - me.pos.z, far = Math.hypot(dx, dz);
    if (far > 1.3 * hero.height / 1.75 && (d.wait += dt) < 4) {
      const fwx = -Math.sin(cam.yaw), fwz = -Math.cos(cam.yaw);
      d.stick = [(dz * fwx - dx * fwz) / far, -(dx * fwx + dz * fwz) / far];
    } else { d.stick = null; pressJump(); d.phase = 12; d.wait = 0; }
  }
  else if (d.phase === 12) { if ((d.wait += dt) > 0.36) { pressJump(); d.phase = 13; d.wait = 0; d.n = 0; } }
  else if (d.phase === 13) {                                                                                          // over it: the rain, four presses long
    if ((d.wait += dt) > (d.n ? 0.2 : 0.3)) { d.wait = 0; d.n++; pressAttack(); combo.release(); if (d.n >= 4) d.phase = 14; }
  }
  else if (idle && !air.active) demo = null;
}

const tmp = new THREE.Vector3();
function step(dt) {
  if (!hero) return;
  dt = Math.min(dt, 0.05) * slow;
  clock += dt;
  const k = hero.height / 1.75;
  // ---- the stick, as a way over the ground (relative to the camera, as in the game)
  let amount = input.stick(stickV);
  if (window.magicTrial.stick) { stickV.set(...window.magicTrial.stick); amount = Math.min(1, stickV.length()); }      // (a test's hand on the stick)
  if (demo) { stepDemo(dt); stickV.set(...((demo && demo.stick) || [0, 0])); amount = stickV.length(); }
  const mx = stickV.x, mz = stickV.y;
  const fwx = -Math.sin(cam.yaw), fwz = -Math.cos(cam.yaw), rx = -fwz, rz = fwx;
  let wx = rx * mx - fwx * mz, wz = rz * mx - fwz * mz;
  const wl = Math.hypot(wx, wz);
  if (wl > 1e-4) { wx /= wl; wz /= wl; }
  stick.x = wx; stick.z = wz; stick.amount = Math.min(1, amount);
  // ---- a move of the combo has her; or she walks and runs
  jumpWanted = Math.max(0, jumpWanted - dt);
  world.grounded = !air.active && !combo.airborne;
  const busy = combo.step(dt, me, world);
  if (!busy && combo.takeFall()) air.drop(me, 0, jumpsUsed, true);   // (a cast in the air is over: the jump has her again, falling, with the jumps she had left)
  if (busy) { speed = 0; landT = -1; }
  else if (air.active) {
    // in the air: the magic jump has her (as magic-jump.html)
    me.pos.x += me.vel.x * dt; me.pos.z += me.vel.z * dt;
    if (air.step(dt, me, stick, H(me.pos.x, me.pos.z)) === 'landed') {
      landT = 0; speed = Math.hypot(me.vel.x, me.vel.z) * (1 - 0.4 * air.impact); landHold = air.landing.hold;
    }
  } else {
    let target = 0;
    if (stick.amount > 0.12) {
      target = stick.amount > 0.72 ? RUN * k : WALK * k * Math.max(0.6, stick.amount / 0.72);
      const want = Math.atan2(wx, wz);
      me.heading += Math.atan2(Math.sin(want - me.heading), Math.cos(want - me.heading)) * Math.min(1, dt * 11);
    }
    speed += (target - speed) * Math.min(1, dt * (target > speed ? 7 : 10));
    if (landT >= 0) speed *= stick.amount > 0.12 ? 1 : 0.8;
    me.vel.set(Math.sin(me.heading) * speed, 0, Math.cos(me.heading) * speed);
    me.pos.x += me.vel.x * dt; me.pos.z += me.vel.z * dt;
    if (jumpWanted > 0) { jumpWanted = 0; air.takeOff(me); airBase = me.pos.y; landT = -1; }
    else {
      // her clips on the ground: out of a landing she stands or runs on (as magic-jump.html)
      if (landT >= 0) {
        landT += dt;
        const name = air.landing.clip, land = hero.actions[name];
        if ((speed > 0.25 && landT > landHold) || hero.state !== name || (land && land.time >= land.getClip().duration - 0.02)) landT = -1;
        else hero.setRate(air.landing.rate);
      }
      if (landT < 0) {
        const st = speed < 0.25 ? 'idle' : speed < (WALK + RUN) * 0.5 * k ? 'walk' : 'run';
        if (hero.state !== st) hero.play(st, st === 'idle' ? 0.25 : /land/.test(hero.state) ? 0.28 : 0.2);
        hero.setRate(st === 'idle' ? 1 : Math.min(1.9, Math.max(0.7, speed / (hero.speeds[st] || 1))));
      }
    }
  }
  tmp.copy(me.pos); collide(tmp);
  me.pos.x = tmp.x; me.pos.z = tmp.z;
  const high = air.active || combo.airborne;            // (off the ground: her height is the jump's, or the cast in the air's)
  if (!high) me.pos.y += (H(me.pos.x, me.pos.z) - me.pos.y) * Math.min(1, dt * 18);
  hero.update(dt);
  root.position.copy(me.pos);
  hero.object.position.set(0, 0, 0);
  hero.object.rotation.set(0, me.heading, 0);
  // her hair and skirt: held harder through the roll and the turn (her skirt would fly over her head)
  air.pose(dt, me);
  hero.holdSprings(1 + 4 * Math.max(combo.held, air.held), 1 - Math.max(combo.upside, air.upside));
  combo.after(dt, me, world);
  hero.updateSprings(dt);
  grass.userData.setWalker(me.pos, 0.55);
  stepDummies(dt);
  // ---- the camera. Holding the lance, it comes in behind her the way she aims, low, over her right shoulder (she is to
  // the left of the picture, the lance and what she aims at in its middle); thrown, it goes back to where it was
  const aiming = combo.aiming, ease = Math.min(1, dt * (aiming ? AIM_CAM.in : AIM_CAM.out));
  aimK += ((aiming ? 1 : 0) - aimK) * ease;
  if (aiming) {
    if (!aimWas) aimWas = { pitch: cam.pitch, dist: cam.dist };
    const behind = me.heading + Math.PI + AIM_CAM.yaw;
    cam.turn(Math.atan2(Math.sin(behind - cam.yaw), Math.cos(behind - cam.yaw)) * ease, (AIM_CAM.pitch - cam.pitch) * ease);
    cam.zoom((AIM_CAM.dist - cam.dist) * ease);
  } else if (aimWas) {
    cam.turn(0, (aimWas.pitch - cam.pitch) * ease); cam.zoom((aimWas.dist - cam.dist) * ease);
    if (aimK < 0.02) { cam.turn(0, aimWas.pitch - cam.pitch); cam.zoom(aimWas.dist - cam.dist); aimWas = null; aimK = 0; }
  }
  cam.update(dt, { pos: me.pos, aimY: high ? airBase + Math.max(0, me.pos.y - airBase) * 0.72 : me.pos.y, height: hero.height, k: hero.height / TUNED, steady: !high });
  if (aimK > 0 || camera.fov !== FOV) {
    camera.fov = FOV - AIM_CAM.fov * aimK * (0.55 + 0.15 * Math.max(0, combo.charge));
    camera.updateProjectionMatrix();
    const half = camera.position.distanceTo(me.pos) * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.aspect;      // half the picture's width, at her
    camera.position.addScaledVector(tmp.set(1, 0, 0).applyQuaternion(camera.quaternion), Math.min(AIM_CAM.side * k, AIM_CAM.across * half) * aimK);
  }
  // the finisher landing shakes the picture a little, briefly
  if (shake > 0) {
    shake = Math.max(0, shake - dt / 0.22);
    const a = 0.06 * shake * shake;
    camera.position.x += Math.sin(clock * 91) * a; camera.position.y += Math.sin(clock * 123 + 1) * a;
  }
  fx.update(dt, camera);
  circles.update(dt, camera);
  // ---- the label, the pips, the count
  beatEl.textContent = combo.beat || (air.active ? air.beat : '');
  for (const [i, p] of pips.entries()) p.classList.toggle('on', combo.index >= i);
  if (combo.hits !== shownHits) {
    shownHits = combo.hits;
    if (shownHits > 0) countEl.innerHTML = `${shownHits}<small>HIT</small>`;
    countEl.classList.toggle('on', shownHits > 0);
  }
}
const beatEl = document.getElementById('beat'), pips = [...document.querySelectorAll('#pips i')], countEl = document.getElementById('count');
let shownHits = 0;

function draw() {
  renderer.clear();
  renderer.render(scene, camera);
  if (night) renderer.render(dimScene, camera);
  renderer.render(fxScene, camera);
}

// ---- the buttons
const btn = id => document.getElementById(id);
btn('hour').textContent = night ? '🌙 กลางคืน' : '☀ กลางวัน';
btn('hour').onclick = () => {
  night = !night;
  fx.setNight(night); circles.setNight(night);
  btn('hour').textContent = night ? '🌙 กลางคืน' : '☀ กลางวัน';
};
const SLOWS = [1, 0.5, 0.25];
btn('slow').onclick = () => { slow = SLOWS[(SLOWS.indexOf(slow) + 1) % SLOWS.length]; btn('slow').textContent = `⏱ ×${slow === 1 ? 1 : slow === 0.5 ? '½' : '¼'}`; };
btn('demo').onclick = () => startDemo();
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

// for a test (or the console): step the world by hand, look from a chosen spot
window.magicTrial = {
  ready: false, held: false, stick: null,
  me, get combo() { return combo; }, get hero() { return hero; }, cam, camera, fx, dummies, sounds,
  run(seconds, { fps = 60, show = true } = {}) { this.held = true; for (let u = 0; u < seconds - 1e-6; u += 1 / fps) step(1 / fps); if (show) draw(); },
  attack() { pressAttack(); }, release() { combo.release(); }, dodge() { combo.dodge(); }, jump() { pressJump(); }, demo() { startDemo(); },
  get air() { return air; },
  look(yaw, pitch, dist) { cam.setView(yaw, pitch, dist); },
  night(on) { if (on !== night) btn('hour').onclick(); },
  draw,
};

let then = performance.now(), shown = 0;
function tick(now) {
  requestAnimationFrame(tick);
  if (now - shown < 1000 / 61) return;                // 60 pictures a second at most: no hotter than it need be
  shown = now;
  const dt = (now - then) / 1000; then = now;
  if (window.magicTrial.held) return;
  step(dt);
  draw();
}
requestAnimationFrame(tick);
</script>
</body>
