<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>ทุ่งหญ้า — เดินสำรวจ</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cde6f2; overscroll-behavior: none;
    font-family: system-ui, -apple-system, "Noto Sans Thai", "Segoe UI", sans-serif; -webkit-user-select: none; user-select: none; }
  html, body { height: 100dvh; }
  #fps { margin-top: env(safe-area-inset-top); }
  #style, #tune, #skyBtn, #fullscreen, #credit { transform: translateY(env(safe-area-inset-top)); }
  canvas { display: block; touch-action: none; }
  #stick { position: fixed; width: 112px; height: 112px; margin: -56px 0 0 -56px; border-radius: 50%; pointer-events: none; opacity: 0;
    background: rgba(255, 255, 255, .2); border: 2px solid rgba(255, 255, 255, .6); transition: opacity .12s; }
  #stick i { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%;
    background: rgba(255, 255, 255, .82); box-shadow: 0 2px 8px rgba(40, 60, 30, .25); }
  #fps { position: fixed; right: max(8px, env(safe-area-inset-right)); top: 8px; font-size: 11px; color: rgba(39, 52, 26, .75);
    background: rgba(255, 255, 255, .62); padding: 2px 8px; border-radius: 999px; pointer-events: none; }
  #style { position: fixed; right: max(8px, env(safe-area-inset-right)); top: 34px; font: inherit; font-size: 12px; color: #fff;
    background: rgba(39, 52, 26, .72); border: 0; padding: 7px 13px; border-radius: 999px; }
  #tune, #skyBtn { position: fixed; right: max(8px, env(safe-area-inset-right)); top: 70px; font: inherit; font-size: 12px; color: #fff;
    background: rgba(30, 86, 122, .78); border: 0; padding: 7px 13px; border-radius: 999px; }
  #skyBtn { top: 106px; background: rgba(52, 104, 178, .8); }
  .tuner { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; max-height: 44vh; overflow-y: auto; display: none; box-sizing: border-box;
    padding: 6px 14px max(12px, env(safe-area-inset-bottom)); background: rgba(250, 253, 255, .86); color: #223a4a; font-size: 12px;
    border-radius: 16px 16px 0 0; box-shadow: 0 -4px 18px rgba(20, 50, 70, .18); -webkit-user-select: none; user-select: none; }
  .tuner.open { display: block; }
  .tuner h4 { margin: 10px 0 2px; font-size: 12px; color: #1e567a; }
  .tuner label { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 0 8px; padding: 2px 0; }
  .tuner label b { font-weight: 600; font-variant-numeric: tabular-nums; }
  .tuner input[type=range] { grid-column: 1 / 3; width: 100%; height: 26px; margin: 0; accent-color: #2f8fbe; }
  .tuner .bar { display: flex; gap: 8px; margin: 10px 0 6px; }
  .tuner .bar button { flex: 1; font: inherit; font-size: 12px; padding: 9px 6px; border: 0; border-radius: 10px; background: #1e567a; color: #fff; }
  .tuner textarea { width: 100%; box-sizing: border-box; font: 11px/1.4 ui-monospace, monospace; border: 1px solid #b9d2e0; border-radius: 8px; padding: 6px; }
  #hint { position: fixed; left: 0; right: 0; bottom: max(14px, env(safe-area-inset-bottom)); display: flex; justify-content: center; pointer-events: none;
    transition: opacity .8s; }
  #hint span { background: rgba(39, 52, 26, .72); color: #fff; font-size: 13px; padding: 8px 16px; border-radius: 999px; }
  #credit { position: fixed; left: max(8px, env(safe-area-inset-left)); top: 8px; font-size: 9.5px; color: rgba(39, 52, 26, .55); pointer-events: none; max-width: 60vw; }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 14px; align-items: center; justify-content: center;
    color: #3e5d2b; background: #eaf3df; transition: opacity .6s; }
  #loading b { font-size: 20px; letter-spacing: .02em; }
  #loading span { font-size: 13px; color: #6d8a4f; min-height: 1.3em; }
  #bar { width: min(240px, 60vw); height: 5px; border-radius: 3px; background: #cfe0bd; overflow: hidden; }
  #bar i { display: block; height: 100%; width: 0; background: #6f9a3c; transition: width .25s; }
  #fullscreen { position: fixed; right: max(8px, env(safe-area-inset-right)); top: 142px; z-index: 4; font: inherit; font-size: 12px; color: white; background: rgba(39,52,26,.78); border: 0; padding: 9px 13px; border-radius: 999px; touch-action: manipulation; }
  html:fullscreen, html:-webkit-full-screen { width: 100%; height: 100%; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
  "./stylized-nature.js": "./stylized-nature.js?v=cliffs1",
  "./stylized-terrain.js": "./stylized-terrain.js?v=foamphysics1",
  "./stylized-sky.js": "./stylized-sky.js?v=foamphysics1",
  "./volumetric-sky.js": "./volumetric-sky.js?v=foamphysics1",
  "./stylized-animals.js": "./stylized-animals.js?v=foamphysics1",
  "./stylized-grassfield.js": "./stylized-grassfield.js?v=foamphysics1",
  "./stylized-character.js": "./stylized-character.js?v=foamphysics1",
  "./meadow-level.js": "./meadow-level.js?v=cliffs1",
  "./stylized-water.js": "./stylized-water.js?v=water4",
  "./water-tuner.js": "./water-tuner.js?v=foamphysics1",
  "./sky-tuner.js": "./sky-tuner.js?v=foamphysics1",
  "./cloud-shadows.js": "./cloud-shadows.js?v=foamphysics1",
  "./tuner-panel.js": "./tuner-panel.js?v=foamphysics1",
  "./stylized-cliffs.js": "./stylized-cliffs.js?v=cliffs1",
  "./hills-level.js": "./hills-level.js?v=hills1",
  "./valley-level.js": "./valley-level.js?v=valley4",
  "./stylized-waterfall.js": "./stylized-waterfall.js?v=fall5",
  "./player.js": "./player.js?v=valley1"
} }

</head>
<body>
<button id="fullscreen" aria-label="เปิดโหมดเต็มจอ" aria-pressed="false">⛶ เต็มจอ</button>
<script>
(() => {
  const button = document.getElementById('fullscreen');
  const active = () => document.fullscreenElement || document.webkitFullscreenElement;
  const sync = () => {
    button.textContent = active() ? '⛶ ออกจากเต็มจอ' : '⛶ เต็มจอ';
    button.setAttribute('aria-pressed', String(!!active()));
    button.setAttribute('aria-label', active() ? 'ออกจากโหมดเต็มจอ' : 'เปิดโหมดเต็มจอ');
    window.dispatchEvent(new Event('resize'));
  };
  button.onclick = async () => {
    try {
      if (active()) {
        const exit = document.exitFullscreen || document.webkitExitFullscreen;
        if (exit) await exit.call(document);
      } else {
        const root = document.documentElement;
        const enter = root.requestFullscreen || root.webkitRequestFullscreen;
        if (!enter) { alert('บน iPhone/iPad: เปิดเกมใน Safari → แชร์ → เพิ่มไปยังหน้าจอโฮม แล้วเปิดจากไอคอน Liora Farm เพื่อเล่นแบบแอป หมุนจอได้ทั้งแนวตั้งและแนวนอน'); return; }
        await enter.call(root);
      }
    } catch (error) { button.textContent = 'แตะเพื่อลองเต็มจออีกครั้ง'; }
    // Keep the device orientation free: portrait and landscape both remain available.
  };
  if (navigator.standalone || matchMedia('(display-mode: standalone)').matches) button.hidden = true;
  document.addEventListener('fullscreenchange', sync);
  document.addEventListener('webkitfullscreenchange', sync);
})();
</script>
<div id="stick"><i></i></div>
<div id="fps"></div>
<button id="style">หญ้า: พู่กัน</button>
<button id="tune">ปรับน้ำ</button>
<button id="skyBtn">ปรับฟ้า</button>
<div id="tuner" class="tuner"></div>
<div id="skyTuner" class="tuner"></div>
<div id="credit">v23 · Vivi: VRoid sample (CC0) · กวาง “DEER” โดย WildMesh 3D (CC BY-NC 4.0) · หญ้า: แนวคิดจาก Cortiz (MIT)</div>
<div id="hint"><span id="hintText">แตะซ้ายเพื่อเดิน · ลากขวาเพื่อหมุนกล้อง</span></div>
<div id="loading"><b>ทุ่งหญ้า</b><div id="bar"><i></i></div><span id="step">กำลังเตรียม…</span></div>
<script type="module">
import * as THREE from 'three';
import * as N from './stylized-nature.js';
import * as A from './stylized-animals.js';
import * as Sky from './stylized-sky.js';
import { createVolumetricSky } from './volumetric-sky.js';
import { buildMeadowLevel } from './meadow-level.js';
import { buildHillsLevel } from './hills-level.js';
import { buildValleyLevel } from './valley-level.js';
import { loadCharacter } from './stylized-character.js';
import { createPlayer } from './player.js';
import { WATER_TUNE } from './stylized-water.js';
import { createWaterTuner } from './water-tuner.js';
import { createSkyTuner } from './sky-tuner.js';
import { createCloudShadows } from './cloud-shadows.js';
import { VIVI_GLB, VIVI_ANIM } from './vivi-data.js';
import DEER_GLB from './deer-glb.js';

const HAZE = '#cde6f2';
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
// Bound Retina render cost; recover resolution gradually when the device has headroom.
const IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const fastMode = new URLSearchParams(location.search).get('fps') === '120';
const targetFPS = fastMode ? 120 : 60;
const maxDPR = Math.min(devicePixelRatio || 1, fastMode ? 1.25 : 2);
let renderDPR = IOS ? Math.min(maxDPR, 1.5) : maxDPR;
renderer.setPixelRatio(renderDPR);
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(HAZE);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.12, 1400);
const fit = () => {
  camera.aspect = innerWidth / innerHeight;
  camera.fov = camera.aspect < 1 ? 70 : 55;           // made for landscape; portrait still works
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  document.getElementById('hintText').textContent = (camera.aspect < 1 ? 'หมุนจอเป็นแนวนอนจะเห็นกว้างกว่า · ' : '') + 'แตะซ้ายเพื่อเดิน · ลากขวาเพื่อหมุนกล้อง · แตะผิวน้ำให้กระเพื่อม';
};
addEventListener('resize', fit);
if (window.visualViewport) visualViewport.addEventListener('resize', fit);
addEventListener('orientationchange', () => requestAnimationFrame(fit));

const stepEl = document.getElementById('step'), barEl = document.querySelector('#bar i');
let steps = 0;
const onStep = async text => {
  stepEl.textContent = text + '…';
  barEl.style.width = Math.min(96, ++steps * 7) + '%';
  await new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));     // let the screen repaint between heavy steps
};
const b64ToBuffer = b64 => { const bin = atob(b64), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u.buffer; };

N.setHaze({ color: HAZE, near: 45, far: 230, max: 0.6 });
await onStep('วาดท้องฟ้า');
const Q = new URLSearchParams(location.search);          // ?grass=120000 to force a blade count, ?still=1 to render on demand (tests), ?sky=1024 panorama width
const skyW = +Q.get('sky') || (fastMode ? 1024 : IOS ? 1536 : 2560);
let sky = createVolumetricSky({ seed: 5, horizon: HAZE, width: skyW, height: skyW / 4 });
if (!await sky.userData.prewarm(renderer)) { sky.userData.dispose(); sky = Sky.createPaintedSky({ seed: 8, size: 0.85 }); }      // a phone that cannot run the cloud shader keeps the painted sky
scene.add(sky, Sky.createDistantMountains({ center: [0, 0], seed: 5 }), N.createAlphaFix());
const buildLevel = { meadow: buildMeadowLevel, hills: buildHillsLevel }[Q.get('map')] || buildValleyLevel;      // ?map=hills or ?map=meadow for the other maps
const level = await buildLevel({ far: HAZE, deer: b64ToBuffer(DEER_GLB), onStep, grassCount: +Q.get('grass') || (fastMode ? 120000 : 200000) });
scene.add(level.group);
await onStep('ปลุก Vivi');
const vivi = await loadCharacter(VIVI_GLB, VIVI_ANIM);
const ray = new THREE.Raycaster();
const onTap = (cx, cy) => {                          // tap the water: a stone's worth of splash
  ray.setFromCamera(new THREE.Vector2(cx / innerWidth * 2 - 1, -(cy / innerHeight) * 2 + 1), camera);
  level.tapWater(ray.ray.origin, ray.ray.direction);
};
if (Q.get('view') === 'water' && Q.get('map')) { level.spawn = { x: 17.5, z: -1, yaw: Math.PI / 2 }; }
const player = createPlayer({ character: vivi, level, camera, dom: renderer.domElement, ui: document.getElementById('stick'), onTap });
scene.add(player.object);
level.addUnderwater(player.object);
fit();

// ---- grass look: painterly dabs or smooth blades, to compare on the device
const styleBtn = document.getElementById('style');
const setStyle = on => { level.grass.userData.setPainterly(on); styleBtn.textContent = 'หญ้า: ' + (on ? 'พู่กัน' : 'เนียน'); };
styleBtn.onclick = () => setStyle(!level.grass.userData.painterly);
setStyle(Q.get('paint') !== '0');

const tunerPanel = document.getElementById('tuner');
createWaterTuner({ tune: WATER_TUNE, optics: level.optics, button: document.getElementById('tune'), panel: tunerPanel });
if (fastMode) level.optics.setQuality(1);
// cloud shadows: only with the volumetric sky (they ride on its wind), and only once everything is in the scene
const shadows = sky.userData.tune ? createCloudShadows({ sky }) : null;
if (shadows) shadows.apply(scene);
const skyBtn = document.getElementById('skyBtn');
if (sky.userData.tune) createSkyTuner({ sky, button: skyBtn, panel: document.getElementById('skyTuner') }); else skyBtn.remove();      // the painted fallback sky has nothing to tune

// ---- keep it smooth: thin the grass when the phone struggles, thicken it again when there is room
const fpsEl = document.getElementById('fps');
let fpsN = 0, fpsT = 0, warm = 0, good = 0;
function tune(dt) {
  fpsN++; fpsT += dt; warm += dt;
  if (fpsT < 1) return;
  const fps = fpsN / fpsT; fpsN = 0; fpsT = 0;
  const g = level.grass.userData;
  if (warm > 4) {
    if (fps < targetFPS * 0.78 && renderDPR > 1) {
      renderDPR = Math.max(1, renderDPR - 0.125); renderer.setPixelRatio(renderDPR); fit();
      warm = 2; good = 0; return;
    }
    if (fps > targetFPS * 0.97 && renderDPR < maxDPR && g.density >= 0.99 && (!sky.userData.rate || sky.userData.rate >= 1)) {
      if (++good >= 8) { renderDPR = Math.min(maxDPR, renderDPR + 0.125); renderer.setPixelRatio(renderDPR); fit(); warm = 2; good = 0; }
      return;
    }
    // too slow: first give up mirror quality (the costliest thing on screen), only then thin the grass
    if (fps < targetFPS * 0.78 && sky.userData.rate > 0.3) { sky.userData.setRate(sky.userData.rate * 0.5); warm = 2; good = 0; }       // cheapest saving first: redraw the clouds less often
    else if (fps < targetFPS * 0.78 && level.optics.quality > 0) { level.optics.setQuality(level.optics.quality - 1); if (tunerPanel.repaintMirror) tunerPanel.repaintMirror(); warm = 2; good = 0; }
    else if (fps < targetFPS * 0.78 && g.density > 0.3) { g.setDensity(g.density * 0.8); good = 0; }
    else if (fps > targetFPS * 0.93 && g.density < 1) { if (++good >= 3) { g.setDensity(g.density * 1.12); good = 0; } }
    else if (fps > targetFPS * 0.93 && sky.userData.rate < 1) { if (++good >= 5) { sky.userData.setRate(sky.userData.rate * 2); good = 0; } }
    else good = 0;
  }
  fpsEl.textContent = Math.round(fps) + ' fps' + (fastMode ? ' / เป้าหมาย 120' : '') + ' · หญ้า ' + Math.round(g.density * 100) + '% · เงาน้ำ ' + ['ปิด', 'ประหยัด', 'เต็ม'][level.optics.quality];
}

const clock = new THREE.Clock();
let moved = false;
const frame = (dt = clock.getDelta()) => {
  dt = Math.min(Math.max(dt, 0), 0.05);
  N.update(dt);
  A.updateAnimals(dt);
  player.update(dt);
  level.follow(player.position, player.lookDir);
  if (sky.userData.update) sky.userData.update(renderer, dt);
  if (shadows) shadows.update();
  level.update(renderer, dt, scene, camera);
  renderer.render(scene, camera);
  tune(dt);
  if (!moved && player.speed > 0.5) { moved = true; setTimeout(() => { document.getElementById('hint').style.opacity = 0; }, 2500); }
};
const animate = () => frame();
const syncVisibility = () => {
  clock.getDelta(); fpsN = 0; fpsT = 0; warm = 0; good = 0;
  renderer.setAnimationLoop(!document.hidden && !Q.get('still') ? animate : null);
};
document.addEventListener('visibilitychange', syncVisibility);
addEventListener('pageshow', syncVisibility);
syncVisibility();
barEl.style.width = '100%';
document.getElementById('loading').style.opacity = 0;
setTimeout(() => document.getElementById('loading').remove(), 700);
window.__game = { THREE, N, scene, camera, renderer, level, player, vivi, frame, sky, shadows };
</script>
</body>
</html>
