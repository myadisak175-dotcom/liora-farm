<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Liora's Farm — Orbit Camera</title><link rel="stylesheet" href="./styles/main.css"><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script><style>#edit-island{position:fixed;right:16px;top:16px;z-index:30;border:1px solid rgba(255,255,255,.6);background:rgba(23,60,75,.82);color:#fff;padding:10px 14px;border-radius:14px;font:700 13px system-ui,sans-serif;backdrop-filter:blur(6px);box-shadow:0 4px 14px rgba(0,0,0,.18)}#edit-island:active{transform:scale(.97)}#builder-shell{position:fixed;inset:0;z-index:100;display:none;background:#9bd8f5}#builder-shell.open{display:block}#builder-frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#9bd8f5}#builder-back{position:absolute;left:12px;top:12px;z-index:2;border:1px solid rgba(255,255,255,.7);background:rgba(23,60,75,.88);color:#fff;padding:10px 14px;border-radius:14px;font:800 13px system-ui,sans-serif;backdrop-filter:blur(6px);box-shadow:0 4px 14px rgba(0,0,0,.2)}body.builder-open{overflow:hidden}</style></head><body><div id="info">Liora's Farm — Orbit Camera<div id="sub">ลากฉาก 1 นิ้วเพื่อหมุน • 2 นิ้วเพื่อซูม • Reset เพื่อกลับมุมเดิม</div></div><button id="edit-island" type="button" aria-label="Edit Island">🛠️ สร้างเกาะ</button><div id="status">กำลังโหลด Liora…</div><div id="joy"><div id="stick"></div></div><div id="actions"><button data-action="pickUp">Pick Up</button><button data-action="pullRadish">Pull Radish</button><button data-action="hammer">Hammer</button><button data-action="mirror">Mirror</button></div><div id="zoom"><button id="camera-reset" aria-label="Reset camera">↻</button><button id="zin">＋</button><button id="zout">−</button></div><div id="builder-shell" aria-hidden="true"><iframe id="builder-frame" title="Liora Island Builder" loading="lazy"></iframe><button id="builder-back" type="button">▶ กลับไปเล่น</button></div><script>const editIsland=document.querySelector('#edit-island');const builderShell=document.querySelector('#builder-shell');const builderFrame=document.querySelector('#builder-frame');const builderBack=document.querySelector('#builder-back');function openBuilder(){if(!builderFrame.src)builderFrame.src='./builder/v624.html?embedded=1&v=624gameplay1';builderShell.classList.add('open');builderShell.setAttribute('aria-hidden','false');document.body.classList.add('builder-open')}function closeBuilder(){builderShell.classList.remove('open');builderShell.setAttribute('aria-hidden','true');document.body.classList.remove('builder-open')}editIsland.addEventListener('click',openBuilder);builderBack.addEventListener('click',closeBuilder);window.addEventListener('message',event=>{if(event.data==='liora-builder-close')closeBuilder()});</script><script type="module" src="./src/main.js"></script></body></html>
