<script>
(() => {
  const button = document.getElementById('fullscreen');
  const active = () => document.fullscreenElement || document.webkitFullscreenElement;
  const sync = () => {
    button.textContent = active() ? '⛶ ออกจากเต็มจอ' : '⛶ เต็มจอ';
    button.setAttribute('aria-pressed', String(!!active()));
    button.setAttribute('aria-label', active() ? 'ออกจากโหมดเต็มจอ' : 'เปิดโหมดเต็มจอ');
    window.dispatchEvent(new Event('resize'));
  };
  button.onclick = async () => {
    try {
      if (active()) {
        const exit = document.exitFullscreen || document.webkitExitFullscreen;
        if (exit) await exit.call(document);
      } else {
        const root = document.documentElement;
        const enter = root.requestFullscreen || root.webkitRequestFullscreen;
        if (!enter) { alert('บน iPhone/iPad: เปิดเกมใน Safari → แชร์ → เพิ่มไปยังหน้าจอโฮม แล้วเปิดจากไอคอน Liora Farm เพื่อเล่นแบบแอป หมุนจอได้ทั้งแนวตั้งและแนวนอน'); return; }
        await enter.call(root);
      }
    } catch (error) { button.textContent = 'แตะเพื่อลองเต็มจออีกครั้ง'; }
    // Keep the device orientation free: portrait and landscape both remain available.
  };
  if (navigator.standalone || matchMedia('(display-mode: standalone)').matches) button.hidden = true;
  document.addEventListener('fullscreenchange', sync);
  document.addEventListener('webkitfullscreenchange', sync);
})();
</script>

<script type="module">
import * as THREE from 'three';
import * as N from './stylized-nature.js';
import * as A from './stylized-animals.js';
import * as Sky from './stylized-sky.js';
import { createVolumetricSky } from './volumetric-sky.js';
import { buildMeadowLevel } from './meadow-level.js';
import { buildHillsLevel } from './hills-level.js';
import { buildValleyLevel } from './valley-level.js';
import { buildDepthsLevel } from './depths-level.js';
import { buildRocksLevel } from './rocks-level.js';
import { buildBlockoutLevel } from './blockout-level.js';
import { buildPitLevel } from './pit-level.js';
import { loadCharacter } from './stylized-character.js';
import { createPlayer } from './player.js';
import { createCharacterShadow } from './character-shadow.js';
import { WATER_TUNE } from './stylized-water.js';
import { createWaterTuner } from './water-tuner.js';
import { FALL_TUNE } from './stylized-waterfall.js';
import { createSkyTuner } from './sky-tuner.js';
import { createCloudShadows } from './cloud-shadows.js';
import { createTimeOfDay } from './time-of-day.js';
import { VIVI_GLB, VIVI_ANIM } from './vivi-data.js';
import DEER_GLB from './deer-glb.js';
import { createForestForage } from './forest-forage.js?v=5';
import { createSceneEditor } from './scene-editor.js';
import { createRockEditor } from './rock-editor.js';
import { createTeleportMenu } from './teleport-menu.js';
import { createWarpUI } from './warp-ui.js';

const HAZE = '#cde6f2';
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
// Bound Retina render cost; recover resolution gradually when the device has headroom.
const IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const fastMode = new URLSearchParams(location.search).get('fps') === '120';
const targetFPS = fastMode ? 120 : 60;
const maxDPR = Math.min(devicePixelRatio || 1, +new URLSearchParams(location.search).get('dpr') || (fastMode ? 1.25 : 1.5));      // a phone's own resolution is far more pixels than a painted look needs; ?dpr=2 to compare
let renderDPR = IOS ? Math.min(maxDPR, 1.5) : maxDPR;
renderer.setPixelRatio(renderDPR);
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(HAZE);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.12, 1400);
const fit = () => {
  camera.aspect = innerWidth / innerHeight;
  camera.fov = camera.aspect < 1 ? 70 : 55;           // made for landscape; portrait still works
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  document.getElementById('hintText').textContent = (camera.aspect < 1 ? 'หมุนจอเป็นแนวนอนจะเห็นกว้างกว่า · ' : '') + 'แตะซ้ายเพื่อเดิน · ลากขวาเพื่อหมุนกล้อง · แตะผิวน้ำให้กระเพื่อม';
};
addEventListener('resize', fit);
if (window.visualViewport) visualViewport.addEventListener('resize', fit);
addEventListener('orientationchange', () => requestAnimationFrame(fit));

const stepEl = document.getElementById('step'), barEl = document.querySelector('#bar i');
let steps = 0;
const onStep = async text => {
  stepEl.textContent = text + '…';
  barEl.style.width = Math.min(96, ++steps * 7) + '%';
  await new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));     // let the screen repaint between heavy steps
};
const b64ToBuffer = b64 => { const bin = atob(b64), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u.buffer; };

N.setHaze({ color: HAZE, near: 45, far: 230, max: 0.6 });
await onStep('วาดท้องฟ้า');
const Q = new URLSearchParams(location.search);          // ?grass=120000 to force a blade count, ?still=1 to render on demand (tests), ?sky=1024 panorama width
const skyW = +Q.get('sky') || (fastMode ? 1024 : IOS ? 1536 : 2560);
let sky = createVolumetricSky({ seed: 5, horizon: HAZE, width: skyW, height: skyW / 4 });
if (!await sky.userData.prewarm(renderer)) { sky.userData.dispose(); sky = Sky.createPaintedSky({ seed: 8, size: 0.85 }); }      // a phone that cannot run the cloud shader keeps the painted sky
scene.add(sky, Sky.createDistantMountains({ center: [0, 0], seed: 5 }), N.createAlphaFix());
const buildLevel = { meadow: buildMeadowLevel, hills: buildHillsLevel, depths: buildDepthsLevel, rocks: buildRocksLevel, blockout: buildBlockoutLevel, pit: buildPitLevel }[Q.get('map')] || buildValleyLevel;      // ?map=hills or ?map=meadow for the other maps; ?map=depths&layer=1|2: a layer down the abyss (&view=stone-meadow: by the meadow's stone); ?map=rocks: the rock test map
const level = await buildLevel({ layer: +Q.get('layer') || 1, far: HAZE, deer: b64ToBuffer(DEER_GLB), onStep, grassCount: +Q.get('grass') || 150000, sun: sky.userData.sun ? sky.userData.sun.toArray() : undefined });
scene.add(level.group);
let forage = null;
try { forage = await createForestForage({ level, onStep }); } catch (e) { console.error('Forest forage failed to load', e); }
await onStep('ปลุก Vivi');
const vivi = await loadCharacter(VIVI_GLB, VIVI_ANIM);
const ray = new THREE.Raycaster();
const onTap = (cx, cy) => {                          // tap the water: a stone's worth of splash
  if ((sceneEditor && sceneEditor.active) || (rockEditor && rockEditor.active)) return;     // while editing, a tap belongs to the editor
  ray.setFromCamera(new THREE.Vector2(cx / innerWidth * 2 - 1, -(cy / innerHeight) * 2 + 1), camera);
  level.tapWater(ray.ray.origin, ray.ray.direction);
};
if (Q.get('view') === 'water' && Q.get('map')) { level.spawn = { x: 17.5, z: -1, yaw: Math.PI / 2 }; }
const player = createPlayer({ character: vivi, level, camera, dom: renderer.domElement, ui: document.getElementById('stick'), onTap });
scene.add(player.object);
if (forage) {
  const visit = document.createElement('button'); visit.id = 'forage-view'; visit.textContent = '🌿 ไปดูของป่า';
  visit.onpointerdown = e => e.stopPropagation(); visit.onclick = () => forage.visit(player); document.body.append(visit);
  if (Q.has('forage')) forage.visit(player);
}
level.addUnderwater(player.object);
// her real shadow on the ground, thrown by the sun. The round blob under her feet takes over at night, when nothing casts one.
const charShadow = createCharacterShadow({ character: vivi, heightAt: level.heightAt, shade: level.map && level.map.cast ? { texture: level.map.cast, rect: level.map.rect } : null });
scene.add(charShadow.object);
level.addUnderwater(charShadow.object);                // on the river bed too, seen through the water
const shadowOnGrass = !!(level.grass && charShadow.receive(level.grass.material));   // and across the tops of the grass
if (!shadowOnGrass) console.warn('[shadow] the grass could not take her shadow; the soft patch stands in there');
if (level.useRealShadow) level.useRealShadow(true, shadowOnGrass);
const NOON = new THREE.Vector3(-0.4, 0.9, 0.5).normalize();
fit();

// Find a collision-free shallow bank on whichever map is active.
const waterView = document.createElement('button'); waterView.id = 'waterView'; waterView.textContent = 'ไปดูน้ำ'; document.body.append(waterView);
const splashTest = document.createElement('button'); splashTest.id = 'splashTest'; splashTest.textContent = 'ทดสอบน้ำกระเซ็น'; document.body.append(splashTest);
let splashTarget = null;
// anime water / realistic water: one tap, remembered
const animeBtn = document.createElement('button'); animeBtn.id = 'animeBtn'; document.body.append(animeBtn);
try { const a = localStorage.getItem('meadow.water.anime.v2'); if (a !== null) WATER_TUNE.anime.value = +a ? 1 : 0; } catch (e) { /* nothing saved */ }
const paintAnime = () => { animeBtn.textContent = WATER_TUNE.anime.value ? 'น้ำ: อนิเมะ' : 'น้ำ: สมจริง'; };
animeBtn.onclick = () => { WATER_TUNE.anime.value = WATER_TUNE.anime.value ? 0 : 1; try { localStorage.setItem('meadow.water.anime.v2', WATER_TUNE.anime.value); } catch (e) { /* not remembered */ } paintAnime(); };
paintAnime();
function visitWater() {
  const origin = player.position;
  let best = null, score = Infinity;
  for (let z = origin.z - 60; z <= origin.z + 60; z += 0.75) for (let x = origin.x - 60; x <= origin.x + 60; x += 0.75) {
    if (Math.hypot(x,z) > level.radius-0.5) continue;
    const d = level.waterDepthAt(x, z);
    if (d < 0.04 || d > 0.25) continue;
    if (level.colliders.some(([cx, cz, r]) => Math.hypot(cx - x, cz - z) < r + 0.8)) continue;
    if (level.confine) { const confined = { x, z }; level.confine(confined); if (Math.hypot(confined.x-x,confined.z-z) > 0.1) continue; }
    let target = null, depth = 0.25;
    for (let i = 0; i < 12; i++) {
      const a = i * Math.PI / 6, tx = x + Math.sin(a) * 1.8, tz = z + Math.cos(a) * 1.8, td = level.waterDepthAt(tx, tz);
      if (td > depth && !level.colliders.some(([cx,cz,r]) => Math.hypot(cx-tx,cz-tz) < r+0.2)) { depth = td; target = { x: tx, z: tz, yaw: a }; }
    }
    if (!target) continue;
    const candidate = Math.hypot(x-origin.x,z-origin.z) + Math.abs(d-0.14)*20;
    if (candidate < score) { score = candidate; best = { x, z, target }; }
  }
  if (!best) return false;
  player.teleport(best.x, best.z, best.target.yaw);
  player.setView(best.target.yaw - Math.PI, 0.4, 5.2);
  splashTarget = best.target;
  return true;
}
waterView.onclick = visitWater;
splashTest.onclick = () => {
  if (!splashTarget || Math.hypot(player.position.x-splashTarget.x, player.position.z-splashTarget.z)>5) {
    if (!visitWater()) return;
  }
  level.ripple(splashTarget.x, splashTarget.z, 2.4, 0.36);
};
if (Q.get('view') === 'water') visitWater();
// ?view=climb (the foot of the cliff path) or ?view=mill (the meadow by the windmill): start there
if (level.views && level.views[Q.get('view')]) { const v = level.views[Q.get('view')]; player.teleport(v.x, v.z, v.yaw); }

// ---- grass look: painterly dabs or smooth blades, to compare on the device
const styleBtn = document.getElementById('style');
const setStyle = on => { level.grass.userData.setPainterly(on); styleBtn.textContent = 'หญ้า: ' + (on ? 'พู่กัน' : 'เนียน'); };
styleBtn.onclick = () => setStyle(!level.grass.userData.painterly);
setStyle(Q.get('paint') !== '0');

const tunerPanel = document.getElementById('tuner');
createWaterTuner({ tune: { ...WATER_TUNE, ...FALL_TUNE }, optics: level.optics, button: document.getElementById('tune'), panel: tunerPanel });
if (fastMode) level.optics.setQuality(1);
// cloud shadows: only with the volumetric sky (they ride on its wind), and only once everything is in the scene
const shadows = sky.userData.tune ? createCloudShadows({ sky }) : null;
if (shadows) shadows.apply(scene);
const skyBtn = document.getElementById('skyBtn');
if (sky.userData.tune) createSkyTuner({ sky, button: skyBtn, panel: document.getElementById('skyTuner') }); else skyBtn.remove();      // the painted fallback sky has nothing to tune

// ---- day, evening, night: the clock runs by itself, slowly; the button jumps to the next of noon / dusk / night
const timeBtn = document.getElementById('timeBtn'), timeRun = document.getElementById('timeRun');
const tod = sky.userData.look && shadows
  ? createTimeOfDay({ sky, shadows, scene, level, rgb: N._internal.rgb, setHaze: c => N._internal.shared.uHaze.value.copy(c), hour: Q.has('hour') ? +Q.get('hour') : 12 })
  : null;
const ICON = { 'เช้า': '🌅', 'กลางวัน': '☀', 'เย็น': '🌇', 'กลางคืน': '🌙' };
const showTime = () => { if (tod) timeBtn.textContent = ICON[tod.phase] + ' ' + tod.phase; };
if (tod) {
  showTime();
  timeBtn.onclick = () => { tod.next(); showTime(); };
  timeRun.onclick = () => { tod.auto = !tod.auto; timeRun.textContent = tod.auto ? '⏸ หยุดเวลา' : '▶ เดินเวลา'; };
  if (Q.get('time') === 'stop') { tod.auto = false; timeRun.textContent = '▶ เดินเวลา'; }
  setInterval(showTime, 1000);
} else { timeBtn.remove(); timeRun.remove(); }

// ---- keep it smooth: thin the grass when the phone struggles, thicken it again when there is room
const fpsEl = document.getElementById('fps');
let fpsN = 0, fpsT = 0, warm = 0, good = 0;
function tune(dt) {
  fpsN++; fpsT += dt; warm += dt;
  if (fpsT < 1) return;
  const fps = fpsN / fpsT; fpsN = 0; fpsT = 0;
  const g = level.grass.userData;
  if (warm > 4) {
    if (fps < targetFPS * 0.78 && renderDPR > 1) {
      renderDPR = Math.max(1, renderDPR - 0.125); renderer.setPixelRatio(renderDPR); fit();
      warm = 2; good = 0; return;
    }
    if (fps > targetFPS * 0.97 && renderDPR < maxDPR && g.density >= 0.99 && (!sky.userData.rate || sky.userData.rate >= 1)) {
      if (++good >= 8) { renderDPR = Math.min(maxDPR, renderDPR + 0.125); renderer.setPixelRatio(renderDPR); fit(); warm = 2; good = 0; }
      return;
    }
    // too slow: first give up mirror quality (the costliest thing on screen), only then thin the grass
    if (fps < targetFPS * 0.78 && sky.userData.rate > 0.3) { sky.userData.setRate(sky.userData.rate * 0.5); warm = 2; good = 0; }       // cheapest saving first: redraw the clouds less often
    else if (fps < targetFPS * 0.78 && level.optics.quality > 0) { level.optics.setQuality(level.optics.quality - 1); if (tunerPanel.repaintMirror) tunerPanel.repaintMirror(); warm = 2; good = 0; }
    else if (fps < targetFPS * 0.78 && g.density > 0.3) { g.setDensity(g.density * 0.8); good = 0; }
    else if (fps > targetFPS * 0.93 && g.density < 1) { if (++good >= 3) { g.setDensity(g.density * 1.12); good = 0; } }
    else if (fps > targetFPS * 0.93 && sky.userData.rate < 1) { if (++good >= 5) { sky.userData.setRate(sky.userData.rate * 2); good = 0; } }
    else good = 0;
  }
  fpsEl.textContent = Math.round(fps) + ' fps' + (fastMode ? ' / เป้าหมาย 120' : '') + ' · หญ้า ' + Math.round(g.density * 100) + '% · เงาน้ำ ' + ['ปิด', 'ประหยัด', 'เต็ม'][level.optics.quality];
}

// ---- the scene editor: fix the ways and the plants by hand (only where the level can be edited)
const sceneEditor = createSceneEditor({ level, camera, dom: renderer.domElement, player });
if (sceneEditor) {
  const editBtn = document.createElement('button'); editBtn.id = 'editBtn'; editBtn.textContent = '🛠 แก้ฉาก';
  editBtn.onpointerdown = e => e.stopPropagation(); editBtn.onclick = () => sceneEditor.open();
  document.body.append(editBtn);
  if (sceneEditor.resume) sceneEditor.open(sceneEditor.resume);                // back from "save": the same place in the editor
  else if (Q.has('edit')) sceneEditor.open({ x: 0, z: -62, h: 60, mode: 'ways', view: 'top' });
}
// ---- the rock editor: move the map's rocks by hand (only where the level offers it: the rock test map, the blockout, the valley with ?rocks=new)
const rockEditor = createRockEditor({ level, camera, player });
if (rockEditor) {
  const b = document.createElement('button'); b.id = 'rockEditBtn'; b.textContent = '🪨 แก้หิน';
  b.onpointerdown = e => e.stopPropagation(); b.onclick = () => rockEditor.open();
  if (sceneEditor) b.style.top = 'calc(206px + env(safe-area-inset-top))';    // (below the scene editor's button, where a map has both)
  document.body.append(b);
  if (rockEditor.resume) rockEditor.open(rockEditor.resume);                  // back from "save": the same view, the same rock
}
// ---- 📍 ไปที่…: straight to any of the places the map offers (the village, the abyss's rim, ...)
const teleportMenu = createTeleportMenu({ level, player, top: 164 + 42 * ((sceneEditor ? 1 : 0) + (rockEditor ? 1 : 0)) });
// ---- 🌀 warp stones: by one, a button offers the others (the rim of the abyss and the stones down it)
const warpUI = createWarpUI({ level, player });
const farHills = scene.getObjectByName('distantMountains'); let lastZone = -1;

const clock = new THREE.Clock();
let moved = false;
const frame = (dt = clock.getDelta()) => {
  dt = Math.min(Math.max(dt, 0), 0.05);
  N.update(dt);
  A.updateAnimals(dt);
  player.update(dt);
  if (sceneEditor && sceneEditor.active) sceneEditor.apply(camera);      // the scene editor looks straight down instead
  const rockEditing = rockEditor && rockEditor.active;
  if (rockEditing) rockEditor.apply(camera);                              // the rock editor's camera flies free of her
  if (forage) forage.update(dt, player.position);
  level.follow(rockEditing ? rockEditor.focus : player.position, player.lookDir);      // (the grass grows round what is looked at)
  if (warpUI) warpUI.update();
  if (farHills && (level.zone ?? -1) !== lastZone) { lastZone = level.zone ?? -1; farHills.visible = lastZone < 0; }      // no far hills from down in the abyss
  {
    // the level knows the sun its own shadows are drawn for; a map without them goes by the sky
    const cast = level.sunCast, dir = cast ? cast.dir : (sky.userData.sun || NOON), k = cast ? cast.k : (tod ? tod.daylight : 1);
    charShadow.update(renderer, player.position, dir, k);
    player.blob.material.opacity = 1 - 0.65 * Math.min(1, Math.max(0, k));      // by day only a faint touch of dark where her feet meet the ground
  }
  if (sky.userData.update) sky.userData.update(renderer, dt);
  if (tod) tod.update(dt);
  if (shadows) shadows.update();
  level.update(renderer, dt, scene, camera);
  renderer.render(scene, camera);
  tune(dt);
  if (!moved && player.speed > 0.5) { moved = true; setTimeout(() => { document.getElementById('hint').style.opacity = 0; }, 2500); }
};
// No more frames than the target. A 120 Hz screen calls this 120 times a second, and drawing every one of them is work the
// phone turns into heat, not into anything the eye needs here: frames that come too soon are skipped (?fps=120 keeps them all).
const frameGap = 1000 / targetFPS - 2;               // ms between frames; the 2 forgives a tick that arrives a hair early
let lastFrameAt = -1e9;
const animate = t => { if (t - lastFrameAt < frameGap) return; lastFrameAt = t; frame(); };
const syncVisibility = () => {
  clock.getDelta(); fpsN = 0; fpsT = 0; warm = 0; good = 0;
  renderer.setAnimationLoop(!document.hidden && !Q.get('still') ? animate : null);
};
document.addEventListener('visibilitychange', syncVisibility);
addEventListener('pageshow', syncVisibility);
syncVisibility();
barEl.style.width = '100%';
document.getElementById('loading').style.opacity = 0;
setTimeout(() => document.getElementById('loading').remove(), 700);
window.__game = { sceneEditor, rockEditor, visitWater, forage, THREE, N, scene, camera, renderer, level, player, vivi, frame, sky, shadows, tod, charShadow, warpUI };
</script>
</body>
</html>
