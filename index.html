<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Liora's Farm</title>
<link rel="stylesheet" href="./styles/main.css?v=scale1">
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
}}
</script>
</head>
<body data-mode="play">

<div id="status">กำลังโหลด…</div>

<nav id="mode-bar">
  <button type="button" data-mode="play" class="active">เล่น</button>
  <button type="button" data-mode="build">สร้าง</button>
</nav>

<!-- play mode -->
<div id="joy"><div id="stick"></div></div>
<div id="actions">
  <button data-action="pickUp">เก็บของ</button>
  <button data-action="pullRadish">ถอนผัก</button>
  <button data-action="hammer">ทุบ</button>
  <button data-action="mirror">ส่องกระจก</button>
</div>
<div id="zoom">
  <button id="camera-reset" aria-label="รีเซ็ตมุมกล้อง">↻</button>
  <button id="zin" aria-label="ซูมเข้า">＋</button>
  <button id="zout" aria-label="ซูมออก">−</button>
</div>

<!-- build mode -->
<section id="build-panel" aria-label="โหมดสร้าง">
  <div id="build-tabs">
    <button type="button" id="tab-place" class="active">วางสิ่งของ</button>
    <button type="button" id="tab-paint">ระบายพื้น</button>
  </div>
  <div id="build-hint"></div>
  <div id="asset-strip" class="strip"></div>
  <div id="paint-strip" class="strip"></div>
  <div id="build-actions" class="strip"></div>
</section>

<script type="module" src="./src/main.js?v=paintblend2"></script>
</body>
</html>
