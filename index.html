<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Liora Farm</title>
<style>
  html,body{margin:0;height:100%;background:#0e1410;overflow:hidden;overscroll-behavior:none}
  #game{display:block;width:100%;height:100%;touch-action:none;-webkit-user-select:none;user-select:none}
  #zonebar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;flex-wrap:wrap;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(14,20,16,.82);border-top:1px solid rgba(190,220,180,.16);backdrop-filter:blur(8px)}
  #zonebar button{font:12px/1 ui-monospace,Menlo,Consolas,monospace;color:#e8efe3;background:transparent;border:1px solid rgba(190,220,180,.16);border-radius:999px;padding:8px 14px}
  #zonebar button[aria-pressed="true"]{background:#7fb85e;border-color:#7fb85e;color:#0e1410}
  #status{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font:14px/1.6 ui-monospace,Menlo,Consolas,monospace;color:#8fa286}
</style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="zonebar"></div>
  <div id="status">กำลังโหลด…</div>
  <script type="module" src="src/game.js"></script>
</body>
</html>
