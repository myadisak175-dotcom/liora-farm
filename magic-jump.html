<!doctype html>
<html lang="th">

<title>วีวี่ — กระโดดเวท 4 ชั้น</title>
<!--
  magic-jump.html  —  Vivi's magic jump, to try: up to four jumps in one flight, each off a magic circle that opens under
  her feet (magic-jump.js: her body in the air; magic-circle-fx.js: the circles), in a meadow with four rocks to jump on,
  one for each number of jumps it takes to reach its top. Walk and run as in the game (the joystick, dragging to look);
  the jump button again in the air is the next jump; the stick pushed sends her its way, let go she goes straight up.
  One job: try the jump, alone. The game has it too (player-moves.js): this page is where it is worked on.
  The first jump off the ground and every landing are the mocap's, as in the game (magic-jump.js, mocap; its clips:
  magic-jump-mocap-anim.js); ?mocap=0 (the 🎞 button) is the jump as it was before them.
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1d2547; font-family: system-ui, sans-serif; touch-action: none; -webkit-user-select: none; user-select: none; }
  canvas { display: block; touch-action: none; }
  #name { position: fixed; left: 0; right: 0; top: calc(8px + env(safe-area-inset-top)); text-align: center; pointer-events: none;
    font: 700 16px system-ui; color: #fff; text-shadow: 0 1px 6px #0009; }
  #name small { display: block; font: 500 12px system-ui; opacity: 0.92; margin-top: 3px; }
  #beat { position: fixed; left: 0; right: 0; top: calc(52px + env(safe-area-inset-top)); text-align: center; pointer-events: none;
    font: 800 15px system-ui; color: #fff; text-shadow: 0 1px 6px #000b; }
  #pips { position: fixed; left: 0; right: 0; top: calc(76px + env(safe-area-inset-top)); display: flex; justify-content: center; gap: 6px; pointer-events: none; }
  #pips i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid #ffffffc0; background: transparent; }
  #pips i.on { background: var(--lit, #ff76a0); border-color: #fff; box-shadow: 0 0 8px var(--lit, #ff76a0); }
  #bar { position: fixed; right: calc(8px + env(safe-area-inset-right)); top: calc(8px + env(safe-area-inset-top)); display: flex; flex-direction: column; align-items: flex-end; gap: 6px; z-index: 3; }
  #bar button { border: 1px solid #ffffffaa; border-radius: 999px; padding: 7px 11px; background: #2b3a55d9; color: #fff; font: 700 12px system-ui; touch-action: manipulation; text-align: left; }
  #stick { position: fixed; width: 112px; height: 112px; margin: -56px 0 0 -56px; border-radius: 50%; pointer-events: none; opacity: 0;
    background: rgba(255, 255, 255, .2); border: 2px solid rgba(255, 255, 255, .6); transition: opacity .12s; }
  #stick i { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%;
    background: rgba(255, 255, 255, .82); box-shadow: 0 2px 8px rgba(40, 60, 30, .25); }
  #jumpBtn { position: fixed; right: max(24px, calc(env(safe-area-inset-right) + 14px)); bottom: max(16px, calc(env(safe-area-inset-bottom) + 10px));
    z-index: 4; width: 72px; height: 72px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .75); background: rgba(255, 255, 255, .24);
    color: #fff; font: 600 12px system-ui, sans-serif; text-shadow: 0 1px 3px rgba(40, 30, 60, .7); touch-action: none; user-select: none;
    -webkit-user-select: none; -webkit-tap-highlight-color: transparent; display: grid; place-items: center; padding: 0; }
  #jumpBtn svg { width: 22px; height: 22px; margin-bottom: -6px; }
  #jumpBtn.down { background: rgba(255, 255, 255, .5); }
  #hint { position: fixed; left: 0; right: 0; bottom: calc(12px + env(safe-area-inset-bottom)); padding: 0 104px; text-align: center; pointer-events: none;
    font: 500 12px system-ui; color: #fff; opacity: .85; text-shadow: 0 1px 4px #000a; }
  #wait { position: fixed; left: 0; right: 0; top: 46%; text-align: center; color: #fff; font: 700 15px system-ui; text-shadow: 0 1px 6px #0008; pointer-events: none; }
  @media (max-width: 640px) {                        /* a phone upright: the title on the left, clear of the buttons */
    #name, #beat { text-align: left; padding-left: calc(14px + env(safe-area-inset-left)); }
    #name small { display: none; }
    #beat { top: calc(32px + env(safe-area-inset-top)); }
    #pips { justify-content: flex-start; padding-left: calc(14px + env(safe-area-inset-left)); top: calc(56px + env(safe-area-inset-top)); }
  }
  @media (max-height: 520px) {                       /* a phone on its side: the title shorter */
    #name small { display: none; }
    #beat { top: calc(32px + env(safe-area-inset-top)); }
    #pips { top: calc(56px + env(safe-area-inset-top)); }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
  "@pixiv/three-vrm-springbone": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm-springbone@3.5.5/lib/three-vrm-springbone.module.min.js"
} }
</script>

<body>
<div id="name">วีวี่ · กระโดดเวท 4 ชั้น<small>หินข้างหน้าสูง 1–4 ชั้น ลองกระโดดขึ้นไปยืนดู</small></div>
<div id="beat"></div>
<div id="pips"><i></i><i></i><i></i><i></i></div>
<div id="bar">
  <button id="look">🎨 สีชมพู</button>
  <button id="hour">🌙 กลางคืน</button>
  <button id="slow">⏱ ×1</button>
  <button id="demo">▶ เดโม 4 ชั้น</button>
  <button id="kind">🎞 ท่าเดิม</button>
</div>
<div id="stick"><i></i></div>
<button id="jumpBtn" type="button" aria-label="กระโดด"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15l7-7 7 7"/></svg><br>กระโดด</span></button>
<div id="hint">กดกระโดดซ้ำกลางอากาศได้อีก 3 ครั้ง · ดันจอย = พุ่งไปทางนั้น · ปล่อยจอย = ขึ้นตรงๆ</div>
<div id="wait">กำลังโหลดวีวี่…</div>
<script type="module">
import * as THREE from 'three';
import * as N from './stylized-nature.js';
import * as G from './stylized-grassfield.js';
import { createRockBlocks } from './rocks.js';
import { loadCharacter } from './stylized-character.js';
import { createSprings } from './character-springs.js';
import { CHARACTER_ANIM } from './character-anim.js';
import { createPlayerInput } from './player-input.js';
import { createFollowCamera } from './player-camera.js';
import { createMagicCircles } from './magic-circle-fx.js';
import { createMagicJump } from './magic-jump.js';

const phone = matchMedia('(pointer: coarse)').matches;
const MOCAP = new URLSearchParams(location.search).get('mocap') !== '0';      // (as the game has it; ?mocap=0: the jump before it)
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, phone ? 1.75 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.autoClear = false;
document.body.prepend(renderer.domElement);

// ---- the meadow: the game's sky, ground and grass (as barrier.html's)
const scene = new THREE.Scene();
{
  const c = document.createElement('canvas'); c.width = 4; c.height = 256;
  const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#2f72c4'); gr.addColorStop(0.55, '#7fb4e6'); gr.addColorStop(1, '#dcecf5');
  g.fillStyle = gr; g.fillRect(0, 0, 4, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  scene.background = t;
}
const FAR = '#d6e8ef';
scene.add(N.createAlphaFix());
N.setHaze({ color: FAR, near: 45, far: 150, max: 0.65 });
const ground = N.createGround({ radius: 120, flat: 32, hills: 1, far: FAR });
scene.add(ground);
const H = ground.userData.heightAt;
const map = G.createGroundMap({ radius: 120, size: 768, seed: 4, heightAt: H, dirt: 0 });
G.applyGroundMap(ground, map, { far: FAR });
const grass = G.createFluffyGrass({ map, heightAt: H, count: phone ? 70000 : 150000, radius: 32, far: FAR });
scene.add(grass);

// ---- four rocks ahead of her, each as tall as that many jumps reach and one jump fewer does not (their tops: measured,
// below). She gets over a rock's side once her feet are within 0.35 m of its top: her tops are 1.0, 2.35, 3.45, 4.4 m (at the
// top of each jump), and each rock's top a little under one of them
const ROCKS = [
  { x: 6.2, z: 7.5, h: 1.13, seed: 3 }, { x: 2.3, z: 10, h: 2.45, seed: 8 },         // (+x is her left: from behind her, 1 to 4 left to right)
  { x: -2.3, z: 10, h: 3.53, seed: 5 }, { x: -6.2, z: 7.5, h: 4.48, seed: 11 },
].map(r => ({ ...r, w: 2.8, d: 2.8, y: H(r.x, r.z) - 0.25, rotY: r.seed * 0.7 }));
const blocks = createRockBlocks(ROCKS);
scene.add(blocks);
blocks.updateMatrixWorld(true);
const ray = new THREE.Raycaster(), DOWN = new THREE.Vector3(0, -1, 0), from = new THREE.Vector3();
// what she stands on at x, z coming from height y: the top of a rock under her feet (stepping up no more than STEP), or the land
const STEP = 0.45;
function standAt(x, z, y = 1e4) {
  let top = H(x, z);
  for (const r of ROCKS) {
    if ((x - r.x) ** 2 + (z - r.z) ** 2 > 2.4 * 2.4) continue;
    from.set(x, Math.min(y + STEP, 50), z);
    ray.set(from, DOWN); ray.far = 60;
    const hit = ray.intersectObject(blocks, false)[0];
    if (hit && hit.face.normal.y > 0.6) top = Math.max(top, hit.point.y);      // a top, not a rock's sloping side
    break;
  }
  return top;
}
for (const r of ROCKS) r.top = standAt(r.x, r.z);
// a label over each: how many jumps it takes (drawn with the circles: not dimmed by night)
const labels = [];
for (const [i, r] of ROCKS.entries()) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 96;
  const g = c.getContext('2d');
  g.font = '800 52px system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.lineWidth = 10; g.strokeStyle = 'rgba(30,30,60,0.65)'; g.strokeText(`${i + 1} ชั้น`, 128, 50);
  g.fillStyle = '#fff'; g.fillText(`${i + 1} ชั้น`, 128, 50);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthWrite: false }));
  s.scale.set(1.3, 0.49, 1); s.position.set(r.x, r.top + 0.9, r.z);
  labels.push(s);
}

// ---- the circles, in a scene of their own drawn over the meadow's: by night the meadow is dimmed to the hour's light first
// (as the game does it: the whole picture multiplied by one colour) and the circles' light is drawn after it, undimmed
const fxScene = new THREE.Scene();
const circles = createMagicCircles({ seed: 2 });
fxScene.add(circles.object, ...labels);
const NIGHT = [0.26, 0.31, 0.6];
const dim = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
  uniforms: { uC: { value: new THREE.Vector3(...NIGHT) } },
  vertexShader: 'void main() { gl_Position = vec4(position.xy, 0.0, 1.0); }',
  fragmentShader: 'uniform vec3 uC; void main() { gl_FragColor = vec4(uC, 1.0); }',
  blending: THREE.CustomBlending, blendSrc: THREE.DstColorFactor, blendDst: THREE.ZeroFactor, depthTest: false, depthWrite: false,
}));
dim.frustumCulled = false;
const dimScene = new THREE.Scene(); dimScene.add(dim);
let night = true;
circles.setNight(night);

// ---- the camera: the game's (player-camera.js), behind her
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 600);
const level = { heightAt: H, crowns: [], cameraTrunks: [] };
const cam = createFollowCamera({ camera, level });
cam.setView(-Math.PI, 0.22);

// ---- her: walking and running as in the game (player-moves.js' numbers, at 1.75 m), the magic jump in the air
const TUNED = 1.412;
const me = { pos: new THREE.Vector3(0, H(0, 0), 0), vel: new THREE.Vector3(), heading: 0 };
const root = new THREE.Group(); root.name = 'player'; scene.add(root);
let hero = null, air = null, springs = null;
let speed = 0, landT = -1, landHold = 0, jumpWanted = 0, demo = null, slow = 1, airBase = 0;
const WALK = 1.5, RUN = 4.2;
const stickV = new THREE.Vector2(), stick = { x: 0, z: 1, amount: 0 };
const input = createPlayerInput({
  dom: renderer.domElement, ui: document.getElementById('stick'),
  onJump: () => press(),
  onLook: (y, p) => cam.turn(y, p), onZoom: d => cam.zoom(d),
});
function press() {
  if (!hero || demo) return;
  if (air.active) air.press(me, stick);
  else jumpWanted = 0.15;
}
const jumpBtn = document.getElementById('jumpBtn');
jumpBtn.addEventListener('pointerdown', e => { e.preventDefault(); jumpBtn.classList.add('down'); press(); });
for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) jumpBtn.addEventListener(ev, () => jumpBtn.classList.remove('down'));

(async () => {
  const [{ VIVI_GLB }, data, extra] = await Promise.all([
    import('./vivi-data.js'),
    fetch('assets/characters/vivi.springs.json').then(r => (r.ok ? r.json() : null)).catch(() => null),
    MOCAP ? import('./magic-jump-mocap-anim.js') : null,
  ]);
  // with the mocap: its take-off and landings beside the game's own clips
  const anim = extra ? { ...CHARACTER_ANIM, clips: { ...CHARACTER_ANIM.clips, ...extra.CHARACTER_ANIM.clips } } : CHARACTER_ANIM;
  hero = await loadCharacter(VIVI_GLB, anim);
  if (data) {
    springs = createSprings(hero.model, data);
    hero.attachSprings(springs);
  }
  hero.setSize(1.75 / hero.baseHeight);
  root.add(hero.object);
  air = createMagicJump({ character: hero, circles, mocap: MOCAP });
  hero.play('idle', 0);
  document.getElementById('wait').remove();
  window.magicTrial.ready = true;
})().catch(err => { document.getElementById('wait').textContent = 'โหลดวีวี่ไม่ได้: ' + err.message; console.error(err); });

// slide along the rocks' sides (not over their tops), and stay on the meadow
function collide(p) {
  for (const r of ROCKS) {
    if (me.pos.y > r.top - 0.35) continue;
    const dx = p.x - r.x, dz = p.z - r.z, R = 1.25 + 0.3, d2 = dx * dx + dz * dz;
    if (d2 < R * R && d2 > 1e-6) { const d = Math.sqrt(d2); p.x = r.x + dx / d * R; p.z = r.z + dz / d * R; }
  }
  const rr = Math.hypot(p.x, p.z);
  if (rr > 30) { p.x *= 30 / rr; p.z *= 30 / rr; }
}

// ---- the demo: the four jumps one after another, each at the top of the one before, going a little forward
function startDemo() {
  if (!hero || air.active) return;
  demo = { at: 0 };
  air.takeOff(me); airBase = me.pos.y; landT = -1;
}

const tmp = new THREE.Vector3();
function step(dt) {
  if (!hero) return;
  dt = Math.min(dt, 0.05) * slow;
  const k = hero.height / 1.75;
  // ---- the stick, as a way over the ground (relative to the camera, as in the game)
  let amount = input.stick(stickV);
  if (window.magicTrial.stick) { stickV.set(...window.magicTrial.stick); amount = Math.min(1, stickV.length()); }      // (a test's hand on the stick)
  let mx = stickV.x, mz = stickV.y;
  if (demo) { amount = 0.55; mx = 0; mz = -1; }        // (the demo: the stick half pushed, away from the camera)
  const fx = -Math.sin(cam.yaw), fz = -Math.cos(cam.yaw), rx = -fz, rz = fx;
  let wx = rx * mx - fx * mz, wz = rz * mx - fz * mz;
  const wl = Math.hypot(wx, wz);
  if (wl > 1e-4) { wx /= wl; wz /= wl; }
  stick.x = wx; stick.z = wz; stick.amount = Math.min(1, amount);
  // ---- on the ground: walk and run; in the air: the magic jump
  jumpWanted = Math.max(0, jumpWanted - dt);
  if (!air.active) {
    let target = 0;
    if (stick.amount > 0.12) {
      target = stick.amount > 0.72 ? RUN * k : WALK * k * Math.max(0.6, stick.amount / 0.72);
      const want = Math.atan2(wx, wz);
      me.heading += Math.atan2(Math.sin(want - me.heading), Math.cos(want - me.heading)) * Math.min(1, dt * 11);
    }
    speed += (target - speed) * Math.min(1, dt * (target > speed ? 7 : 10));
    if (landT >= 0) speed *= stick.amount > 0.12 ? 1 : 0.8;
    me.vel.set(Math.sin(me.heading) * speed, 0, Math.cos(me.heading) * speed);
    tmp.set(me.pos.x + me.vel.x * dt, 0, me.pos.z + me.vel.z * dt);
    collide(tmp);
    me.pos.x = tmp.x; me.pos.z = tmp.z;
    const g = standAt(me.pos.x, me.pos.z, me.pos.y);
    if (g < me.pos.y - STEP) { air.drop(me); airBase = me.pos.y; landT = -1; }            // walked off a rock's top
    else me.pos.y += (g - me.pos.y) * Math.min(1, dt * 18);
    if (!air.active && jumpWanted > 0) { jumpWanted = 0; air.takeOff(me); airBase = me.pos.y; landT = -1; }
  } else {
    tmp.set(me.pos.x + me.vel.x * dt, 0, me.pos.z + me.vel.z * dt);
    collide(tmp);
    me.pos.x = tmp.x; me.pos.z = tmp.z;
  }
  if (air.active) {
    const g = standAt(me.pos.x, me.pos.z, me.pos.y);
    // the demo presses at the top of each jump
    if (demo && air.tier < 4 && air.debug.wind < 0 && air.debug.vy < 0.4 * k && air.debug.t > 0.15) air.press(me, stick);
    if (air.step(dt, me, stick, g) === 'landed') {
      // down: the harder she lands, the more of her pace her legs take up and the longer before she is off again
      landT = 0; speed = Math.hypot(me.vel.x, me.vel.z) * (1 - 0.4 * air.impact); landHold = air.landing.hold;
      if (demo) { demo = null; speed = 0; }
    }
  }
  // ---- her clips on the ground (as the game: her legs go at her pace; out of a landing she runs on)
  if (!air.active) {
    if (landT >= 0) {
      landT += dt;
      const name = air.landing.clip, land = hero.actions[name];
      if ((speed > 0.25 && landT > landHold) || hero.state !== name || (land && land.time >= land.getClip().duration - 0.02)) landT = -1;
      else hero.setRate(air.landing.rate);
    }
    if (landT < 0) {
      const st = speed < 0.25 ? 'idle' : speed < (WALK + RUN) * 0.5 * k ? 'walk' : 'run';
      if (hero.state !== st) hero.play(st, st === 'idle' ? 0.3 : /land/.test(hero.state) ? 0.28 : 0.2);      // (up out of a landing: a longer blend)
      hero.setRate(st === 'idle' ? 1 : Math.min(1.9, Math.max(0.7, speed / (hero.speeds[st] || 1))));
    }
  }
  hero.update(dt);
  root.position.copy(me.pos);
  hero.object.position.set(0, 0, 0);
  hero.object.rotation.set(0, me.heading, 0);
  air.pose(dt, me);
  // her hair and skirt: held harder in the air (a long fall would blow her skirt up) and harder still through a flip or a
  // turn, and not pulled down by their weight while she is upside down (her skirt would fall over her head)
  hero.holdSprings(1 + 4 * air.held, 1 - air.upside);
  hero.updateSprings(dt);
  grass.userData.setWalker(me.pos, 0.55);
  circles.update(dt, camera);
  // ---- the camera: on the ground it follows her feet; in the air it rises with her, most of the way
  const aimY = air.active ? airBase + Math.max(0, me.pos.y - airBase) * 0.72 : me.pos.y;
  cam.update(dt, { pos: me.pos, aimY, height: hero.height, k: hero.height / TUNED, steady: !air.active });
  // ---- the label and the pips
  beatEl.textContent = air.beat;
  for (const [i, p] of pips.entries()) p.classList.toggle('on', air.active && i < air.tier);
}
const beatEl = document.getElementById('beat'), pips = [...document.querySelectorAll('#pips i')];

function draw() {
  renderer.clear();
  renderer.render(scene, camera);
  if (night) renderer.render(dimScene, camera);
  renderer.render(fxScene, camera);
}

// ---- the buttons
const btn = id => document.getElementById(id);
let lookName = 'rose';
const LIT = { rose: '#ff76a0', water: '#6fcbff' };
document.documentElement.style.setProperty('--lit', LIT.rose);
btn('look').onclick = () => {
  lookName = lookName === 'rose' ? 'water' : 'rose';
  circles.setLook(lookName);
  btn('look').textContent = lookName === 'rose' ? '🎨 สีชมพู' : '🎨 สีฟ้า (น้ำ)';
  document.documentElement.style.setProperty('--lit', LIT[lookName]);
};
btn('hour').onclick = () => {
  night = !night;
  circles.setNight(night);
  btn('hour').textContent = night ? '🌙 กลางคืน' : '☀ กลางวัน';
};
const SLOWS = [1, 0.5, 0.25];
btn('slow').onclick = () => { slow = SLOWS[(SLOWS.indexOf(slow) + 1) % SLOWS.length]; btn('slow').textContent = `⏱ ×${slow === 1 ? 1 : slow === 0.5 ? '½' : '¼'}`; };
btn('demo').onclick = () => startDemo();
// the mocap's take-off and landing, or the jump as it is in the game
btn('kind').textContent = MOCAP ? '🎞 ท่า mocap' : '🎞 ท่าเดิม';
btn('kind').onclick = () => { const u = new URL(location.href); if (MOCAP) u.searchParams.set('mocap', '0'); else u.searchParams.delete('mocap'); location.href = u.href; };
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

// for a test (or the console): step the world by hand, look from a chosen spot
window.magicTrial = {
  ready: false, held: false, stick: null,
  me, get air() { return air; }, get hero() { return hero; }, cam, camera, circles, ROCKS,
  run(seconds, { fps = 60, show = true } = {}) { this.held = true; for (let u = 0; u < seconds - 1e-6; u += 1 / fps) step(1 / fps); if (show) draw(); },
  demo() { startDemo(); },
  press(dirX = 0, dirZ = 0, amount = 0) { stick.x = dirX; stick.z = dirZ; stick.amount = amount; if (air.active) return air.press(me, stick); jumpWanted = 0.15; return true; },
  look(yaw, pitch, dist) { cam.setView(yaw, pitch, dist); },
  night(on) { if (on !== night) btn('hour').onclick(); },
  colour(name) { if (name !== lookName) btn('look').onclick(); },
  draw,
};

let then = performance.now(), shown = 0;
function tick(now) {
  requestAnimationFrame(tick);
  if (now - shown < 1000 / 61) return;                // 60 pictures a second at most: no hotter than it need be
  shown = now;
  const dt = (now - then) / 1000; then = now;
  if (window.magicTrial.held) return;
  step(dt);
  draw();
}
requestAnimationFrame(tick);
</script>
</body>
</html>
