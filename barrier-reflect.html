<title>วีวี่ — บาเรียสะท้อน (ลอง)</title>
<!--
  barrier-reflect.html  —  the barrier that throws a blow back, to try (24 Nov 2026, with ten seconds of a clip:
  "สกิลบาเรียอยากได้เอฟเฟคประมาณนี้ค่ะ เหมือนเป็นโล่อะ เคลื่อนที่ได้ แล้วก็มี reflection ตอนบาเรียโดนโจมตี แล้วก็แตกด้วย แต่ใน
  วีดีโอใส่อนิเมชั่นตัวละครตอนมัน reflection ไม่ต้องทำแบบนั้นค่ะ ... เอฟเฟคขอแบบในวีดีโอเลยนะคะ ขอลิ้งทดลองเหมือนเดิม").
  Kept apart: nothing of it is in the game (the game's barrier is still the dome of water, barrier-fx.js). Of the first
  try: "เอฟเฟคแข็งมาก ไม่นุ่มแบบ anime เลย แล้วก็อนิเมชั่นมันช้าไปอะ อยากได้แบบเกม action rpg": so its light is soft and it
  goes at an action game's pace, and the world stops for an instant and the camera shakes at the blow and the burst.
  One job: try that one thing. The บาเรีย button (B on a keyboard): a dome of light stands up round her and goes where she
  goes (walk, run, jump, dash: the game's own player, player-moves.js). Three practice towers stand on the meadow and throw
  a bolt at her when asked (🎯: the one most in view; 🎯×3: all three); a bolt that meets the dome is stopped there, the
  dome turns deep blue with lightning all through it, then bursts, throwing the bolt back at the tower that threw it
  (barrier-reflect.js: the rules; barrier-reflect-fx.js: what is seen; barrier-reflect-sounds.js: the clip's own sound,
  cut to it). Without the dome the bolt strikes her. Her body does nothing for it (the clip's girl's moves are not wanted).
  Up top: ☀/🌙 the hour, ⏱ slower, 🔊 the sound, 🎥 the game's camera or one in front of her as the clip's, 🎯 / 🎯×3,
  ▶ a demo by itself.
-->

<body>

<button id="jumpBtn" class="act" type="button" aria-label="กระโดด"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15l7-7 7 7"/></svg><br>กระโดด</span></button>

<script type="module">
import * as THREE from 'three';
import * as N from './stylized-nature.js';
import * as G from './stylized-grassfield.js';
import { loadCharacter } from './stylized-character.js';
import { createSprings } from './character-springs.js';
import { CHARACTER_ANIM } from './character-anim.js';
import { VAULT_ANIM } from './vault-anim.js';
import { CHARACTER_ANIM as MOCAP_ANIM } from './magic-jump-mocap-anim.js';
import { CHARACTER_ANIM as FLOW_ANIM } from './magic-jump-flow-anim.js';
import { CLIMB_TOP_ANIM } from './climb-top-anim.js';
import { createPlayer } from './player-moves.js?v=blink3';
import { createMagicCircles } from './magic-circle-fx.js';
import { createStepSounds } from './step-sounds.js';
import { createReflectBarrier, REFLECT_BARRIER } from './barrier-reflect.js?v=4';
import { createReflectBarrierFx, REFLECT_FX } from './barrier-reflect-fx.js?v=4';
import { createReflectBarrierSounds } from './barrier-reflect-sounds.js?v=2';

const Q = new URLSearchParams(location.search);
const phone = matchMedia('(pointer: coarse)').matches;
const waitEl = document.getElementById('wait');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, phone ? 1.75 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.autoClear = false;
document.body.prepend(renderer.domElement);

// ---- the meadow: the game's sky, ground and grass (as the other trial pages')
const scene = new THREE.Scene();
{
  const c = document.createElement('canvas'); c.width = 4; c.height = 256;
  const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#2f72c4'); gr.addColorStop(0.55, '#7fb4e6'); gr.addColorStop(1, '#dcecf5');
  g.fillStyle = gr; g.fillRect(0, 0, 4, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  scene.background = t;
}
const FAR = '#d6e8ef';
scene.add(N.createAlphaFix());
N.setHaze({ color: FAR, near: 45, far: 150, max: 0.65 });
const ground = N.createGround({ radius: 120, flat: 32, hills: 1, far: FAR });
scene.add(ground);
const H = ground.userData.heightAt;
const map = G.createGroundMap({ radius: 120, size: 768, seed: 4, heightAt: H, dirt: 0 });
G.applyGroundMap(ground, map, { far: FAR });
const grass = G.createFluffyGrass({ map, heightAt: H, count: phone ? 70000 : 150000, radius: 32, far: FAR });
scene.add(grass);

// ---- the practice towers: a stone post with a crystal over it that throws a bolt at her when asked. Lit as the game
// lights (one edge between light and shade)
const hex = h => [parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255];
const tint = (g, h) => { const c = hex(h), n = g.attributes.position.count, a = new Float32Array(n * 3); for (let i = 0; i < n; i++) a.set(c, i * 3); g.setAttribute('color', new THREE.BufferAttribute(a, 3)); return g; };
const lit = new THREE.ShaderMaterial({
  vertexShader: /* glsl */`
    attribute vec3 color;
    varying vec3 vC, vN;
    void main() { vC = color; vN = normalize(mat3(modelMatrix) * normal); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: /* glsl */`
    varying vec3 vC, vN;
    void main() {
      float d = dot(normalize(vN), normalize(vec3(-0.4, 0.9, 0.5))) * 0.5 + 0.5;
      gl_FragColor = vec4(vC * mix(vec3(0.66, 0.66, 0.8), vec3(1.03, 1.01, 0.97), smoothstep(0.43, 0.47, d)), 1.0);
    }`,
});
const CRYSTAL_FRAG = /* glsl */`
  uniform float uGlow, uDark;
  varying vec3 vN, vW;
  void main() {
    vec3 n = normalize(vN), v = normalize(cameraPosition - vW);
    float d = dot(n, normalize(vec3(-0.4, 0.9, 0.5))) * 0.5 + 0.5;
    vec3 col = mix(vec3(0.24, 0.5, 0.72), vec3(0.62, 0.9, 1.0), smoothstep(0.4, 0.62, d));
    col += vec3(0.5, 0.9, 1.0) * pow(1.0 - abs(dot(n, v)), 2.0) * 0.55;
    col = mix(col, vec3(1.0), uGlow * 0.75);
    col = mix(col, vec3(0.15, 0.17, 0.23) + 0.12 * pow(1.0 - abs(dot(n, v)), 2.0), uDark);
    gl_FragColor = vec4(col, 1.0);
  }`;
const colliders = [];
const TOWERS = [[-6.6, 8.6], [8.2, 7.0], [10.4, -4.8]];
const towers = TOWERS.map(([x, z], i) => {
  const g = new THREE.Group();
  g.add(new THREE.Mesh(tint(new THREE.CylinderGeometry(0.42, 0.52, 0.62, 6).translate(0, 0.31, 0), '#8f95a3'), lit));
  g.add(new THREE.Mesh(tint(new THREE.CylinderGeometry(0.33, 0.4, 0.13, 6).translate(0, 0.68, 0), '#a8aebb'), lit));
  const mat = new THREE.ShaderMaterial({
    uniforms: { uGlow: { value: 0 }, uDark: { value: 0 } },
    vertexShader: 'varying vec3 vN, vW; void main() { vN = normalize(mat3(modelMatrix) * normal); vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }',
    fragmentShader: CRYSTAL_FRAG,
  });
  const crystal = new THREE.Mesh(new THREE.OctahedronGeometry(0.3, 0).scale(1, 1.65, 1), mat);
  crystal.position.y = 1.32;
  g.add(crystal);
  g.position.set(x, H(x, z) - 0.05, z);
  scene.add(g);
  colliders.push([x, z, 0.62]);
  return { i, group: g, crystal, u: mat.uniforms, position: new THREE.Vector3(x, H(x, z) + 1.32, z), charging: false, charge: 0, stun: -1, spin: i * 2.1 };
});

// ---- the light: the circles of her jump and the barrier's, in a scene of their own drawn after the meadow (by night
// the meadow is dimmed to the hour's light first, as the game does it, and the light is drawn over it undimmed)
const fxScene = new THREE.Scene();
const circles = createMagicCircles({ seed: 2 });
const fx = createReflectBarrierFx({ heightAt: H });
fxScene.add(circles.object, fx.object);
const NIGHT = [0.26, 0.31, 0.6];
const dim = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
  uniforms: { uC: { value: new THREE.Vector3(...NIGHT) } },
  vertexShader: 'void main() { gl_Position = vec4(position.xy, 0.0, 1.0); }',
  fragmentShader: 'uniform vec3 uC; void main() { gl_FragColor = vec4(uC, 1.0); }',
  blending: THREE.CustomBlending, blendSrc: THREE.DstColorFactor, blendDst: THREE.ZeroFactor, depthTest: false, depthWrite: false,
}));
dim.frustumCulled = false;
const dimScene = new THREE.Scene(); dimScene.add(dim);
let night = Q.get('night') === '1';            // (by day, as the clip is)
fx.setNight(night); if (circles.setNight) circles.setNight(night);

// ---- the camera: the game's (player-moves.js makes it), as wide as the game's; or one in front of her, as the clip's
const FOV = () => (innerWidth < innerHeight ? 70 : 55);
const camera = new THREE.PerspectiveCamera(FOV(), innerWidth / innerHeight, 0.1, 600);
let clipView = Q.get('view') === 'clip', clipYaw = 0;

// ---- her: the game's own player, on this field; the barrier goes with her
const level = {
  spawn: { x: 0, z: 0, yaw: 0 }, heightAt: H, waterDepthAt: () => 0, footing: () => 'ground', surfaceAt: () => 'grass',
  colliders, cameraTrunks: [], crowns: [], radius: 30,
};
const sounds = createStepSounds({ level, volume: 1 });                                   // her steps, her jump, the dash (the game's), and the AudioContext
const heard = createReflectBarrierSounds({ context: () => sounds.context });
const barrier = createReflectBarrier({ fx, heard, heightAt: H });
let player = null, hero = null, slow = 1, demo = null, beatT = 0, hurt = 0;
const size = () => (hero ? hero.height / 1.75 : 1);
const chest = (out = new THREE.Vector3()) => out.copy(player.position).add(new THREE.Vector3(0, 1.02 * size(), 0));

(async () => {
  const anim = { ...CHARACTER_ANIM, clips: { ...CHARACTER_ANIM.clips, ...VAULT_ANIM.clips, ...MOCAP_ANIM.clips, ...FLOW_ANIM.clips, ...CLIMB_TOP_ANIM.clips } };
  const [{ VIVI_GLB: model }, springs] = await Promise.all([
    import('./vivi-data.js'),
    fetch('assets/characters/vivi.springs.json').then(r => (r.ok ? r.json() : null)).catch(() => null),
  ]);
  // (her pictures read as <img>, not fetched: as step-sounds.html does)
  const bitmap = window.createImageBitmap;
  window.createImageBitmap = undefined;
  try { hero = await loadCharacter(model, anim); } finally { window.createImageBitmap = bitmap; }
  if (springs) hero.attachSprings(createSprings(hero.model, springs));
  hero.setSize(1.75 / hero.baseHeight);
  player = createPlayer({ character: hero, level, camera, dom: renderer.domElement, ui: document.getElementById('stick'), circles, sounds });
  scene.add(player.object);
  waitEl.remove();
  window.barrierTrial.ready = true;
})().catch(err => { waitEl.textContent = 'โหลดวีวี่ไม่ได้\n' + (err && err.message || err); console.error(err); });

// ---- the bolts: thrown by a tower at her chest (the clip's bolt), or thrown back by the barrier at the tower
const SHOT = { charge: 0.32, speed: 24, len: 2.4, wide: 0.3, range: 34, backSpeed: 44, backLen: 3.2, backWide: 0.22 };
const shots = [];
let seedTurn = 1;
function fire(t, wait = 0) {
  if (!player || t.stun >= 0 || t.charging) return false;
  t.charging = true; t.charge = -wait;   // (counts up: it gathers from 0, throws at SHOT.charge)
  return true;
}
function throwFrom(t) {
  const from = t.position.clone();
  const way = chest().sub(from).normalize();
  shots.push({ kind: 0, pos: from.clone(), way, speed: SHOT.speed, went: 0, tower: t, from, seed: seedTurn++ * 0.37 });
  heard.shot(Math.min(1, 9 / Math.max(4, from.distanceTo(player.position))));
}
barrier.onReflect = ({ at, blows }) => {
  for (const b of blows) {
    const t = b.source;
    if (!t) continue;
    shots.push({ kind: 1, pos: at.clone(), way: t.position.clone().sub(at).normalize(), speed: SHOT.backSpeed, went: 0, tower: t, from: at.clone(), seed: seedTurn++ * 0.37 });
  }
  say('สะท้อนกลับ!', 1.4);
  hitStop(0.08, 0.05); shake(0.12);      // (the world stops once the burst is big and white, not before it is seen)
};
barrier.onStrike = ({ first }) => { hitStop(first ? 0.05 : 0.03); shake(first ? 0.05 : 0.03); };
// the action game's weight: the world stops for an instant (s; `after` s of the game's time from now) and the camera
// shakes (m), dying away
let stopT = 0, shakeA = 0, shakeAge = 9, stopLater = null;
const shakeOff = new THREE.Vector3();
function hitStop(s, after = 0) { if (after > 0) stopLater = { at: time + after, s }; else stopT = Math.max(stopT, s); }
function shake(a) { shakeA = Math.max(shakeA * Math.exp(-shakeAge * 14), a); shakeAge = 0; }
// she, hit with no barrier: a flash on her, washed red a moment
function hitHer(at, from) {
  fx.impact(at, from, 0.8 * size());
  hurt = 1; shake(0.07); hitStop(0.04);
  heard.thud(1);
  say('โดน! (ยังไม่ได้กางบาเรีย)', 1.2);
}
const p0 = new THREE.Vector3(), p1 = new THREE.Vector3(), q = new THREE.Vector3(), axisA = new THREE.Vector3(), axisB = new THREE.Vector3();
function stepShots(dt) {
  const list = [];
  for (let i = shots.length - 1; i >= 0; i--) {
    const s = shots[i];
    if (s.kind === 1) s.way.copy(s.tower.position).sub(s.pos).normalize();      // (thrown back: it finds its tower)
    p0.copy(s.pos); p1.copy(s.pos).addScaledVector(s.way, s.speed * dt);
    let gone = false;
    if (s.kind === 0) {
      const at = barrier.meet(p0, p1);
      if (at && barrier.strike(at, s.from, s.tower)) { gone = true; say(barrier.state === 'struck' ? 'บาเรียรับไว้ได้' : '', 1.2); }
      else {
        // her: a rod from her shins to her head, 0.32 m round it
        axisA.copy(player.position).y += 0.3 * size(); axisB.copy(player.position).y += 1.5 * size();
        for (let k = 1; k <= 4 && !gone; k++) {
          q.lerpVectors(p0, p1, k / 4);
          const ab = axisB.clone().sub(axisA), t = THREE.MathUtils.clamp(q.clone().sub(axisA).dot(ab) / ab.lengthSq(), 0, 1);
          if (q.distanceTo(axisA.clone().addScaledVector(ab, t)) < 0.32 * size()) { hitHer(q.clone(), s.from); gone = true; }
        }
      }
      if (!gone && (s.went > SHOT.range || p1.y < H(p1.x, p1.z))) { fx.impact(p1.clone(), s.from, 0.5); gone = true; }
    } else if (p1.distanceTo(s.tower.position) < 0.35 || s.pos.distanceTo(s.tower.position) < s.speed * dt) {
      fx.impact(s.tower.position.clone(), s.from, 1.0);
      s.tower.stun = 0; s.tower.charging = false; shake(0.03);
      heard.thud(Math.min(1, 9 / Math.max(4, s.tower.position.distanceTo(player.position))));
      say('ป้อมโดนสะท้อน!', 1.4);
      gone = true;
    }
    if (gone) { shots.splice(i, 1); continue; }
    s.pos.copy(p1); s.went += s.speed * dt;
    const L = s.kind ? SHOT.backLen : SHOT.len;
    list.push({ head: s.pos, way: s.way, kind: s.kind, len: Math.min(L, s.went + 0.05), wide: s.kind ? SHOT.backWide : SHOT.wide, seed: s.seed });
  }
  // a tower gathering its bolt: a ball of light growing at its crystal
  for (const t of towers) if (t.charging && t.charge >= 0 && player) {
    const way = chest().sub(t.position).normalize();
    list.push({ head: t.position.clone().addScaledVector(way, 0.32), way, kind: 0, len: 0.02, wide: 0.05 + 0.15 * Math.min(1, t.charge / SHOT.charge), seed: t.i });
  }
  fx.bolts(list);
}
function stepTowers(dt, time) {
  for (const t of towers) {
    let y = 1.32 + 0.05 * Math.sin(time * 1.6 + t.i * 2), glow = 0, dark = 0, spin = 0.6;
    if (t.charging) {
      t.charge += dt;
      if (t.charge >= 0) glow = 0.25 + 0.6 * Math.min(1, t.charge / SHOT.charge) + 0.15 * Math.sin(time * 40);
      if (t.charge >= SHOT.charge) { throwFrom(t); t.charging = false; }
    }
    if (t.stun >= 0) {
      t.stun += dt;
      const s = t.stun;
      glow = Math.max(0, 1 - s / 0.12);
      dark = THREE.MathUtils.smoothstep(s, 0.06, 0.2) * (1 - THREE.MathUtils.smoothstep(s, 1.2, 1.6));
      const fall = THREE.MathUtils.smoothstep(s, 0.04, 0.3) * (1 - THREE.MathUtils.smoothstep(s, 1.1, 1.5));
      y = THREE.MathUtils.lerp(y, 0.98, fall) + Math.abs(Math.sin(s * 9)) * 0.08 * Math.max(0, 1 - s * 2);
      spin = 14 * Math.exp(-s * 2.2) + 0.6;
      t.crystal.rotation.z = 0.5 * fall;
      if (s > 1.6) { t.stun = -1; t.crystal.rotation.z = 0; }
    }
    t.spin += spin * dt;
    t.crystal.position.y = y; t.crystal.rotation.y = t.spin;
    t.position.set(t.group.position.x, t.group.position.y + y, t.group.position.z);
    t.u.uGlow.value = glow; t.u.uDark.value = dark;
  }
}
// the tower most in view (and free): the camera's way over the ground against the way to each
function towerInView() {
  const f = new THREE.Vector3(); camera.getWorldDirection(f); f.y = 0; f.normalize();
  let best = null, bd = -2;
  for (const t of towers) {
    if (t.stun >= 0 || t.charging) continue;
    const d = t.position.clone().sub(camera.position); d.y = 0; d.normalize();
    const k = d.dot(f);
    if (k > bd) { bd = k; best = t; }
  }
  return best;
}
function fireOne() { const t = towerInView(); if (t) fire(t); else say('ป้อมยังมึนอยู่', 1); }
function fireAll() { let n = 0; for (const t of towers) if (fire(t, n * 0.06)) n++; if (!n) say('ป้อมยังมึนอยู่', 1); }
function raise() {
  if (!player) return;
  if (barrier.raise(player.position, size())) say('บาเรีย!', 1.0);
  else if (barrier.state === 'off') say(`บาเรียยังไม่พร้อม (${barrier.cooldown.toFixed(1)} วิ)`, 0.8);
}

// ---- the buttons: pressed, not clicked (as the game's)
function press(id, act) {
  const b = document.getElementById(id);
  b.addEventListener('pointerdown', e => { e.preventDefault(); b.classList.add('down'); if (player && !demo) act(); });
  for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) b.addEventListener(ev, () => b.classList.remove('down'));
}
press('shieldBtn', raise);
press('jumpBtn', () => player.jump());
press('dashBtn', () => player.dash());
addEventListener('keydown', e => {
  if (e.repeat || !player || demo) return;
  if (e.code === 'KeyB') raise();
  if (e.code === 'KeyF') fireOne();
  if (e.code === 'KeyG') fireAll();
});

// ---- ▶: by itself: the barrier up, a few steps with it, a bolt from the tower ahead on the left (as the clip's, from the
// side) thrown back; up again, and all three at once
const key = (code, down) => dispatchEvent(new KeyboardEvent(down ? 'keydown' : 'keyup', { code }));
const DEMO = [
  [0.3, () => raise()], [0.8, () => key('KeyW', true)], [1.8, () => key('KeyW', false)],
  [2.0, () => fire(towers[0])],
  [4.6, () => raise()], [5.2, () => fireAll()],
  [7.6, null],
];
function startDemo() {
  if (!player || demo) return;
  barrier.drop();
  player.teleport(0, 0, 0);
  demo = { t: 0, i: 0 };
}
function stepDemo(dt) {
  demo.t += dt;
  while (demo && demo.i < DEMO.length && demo.t >= DEMO[demo.i][0]) {
    const f = DEMO[demo.i][1];
    demo.i++;
    if (f) f(); else { key('KeyW', false); demo = null; }
  }
}

function say(text, secs) { if (!text) return; beatEl.textContent = text; beatEl.style.opacity = 1; beatT = secs; }
const beatEl = document.getElementById('beat'), tapEl = document.getElementById('tap'), btnEl = document.getElementById('shieldBtn'), coolEl = document.getElementById('cool');
let time = 0;
function step(dt) {
  if (!player) return;
  const real = Math.min(dt, 0.05);
  let k = slow;
  if (stopLater && time >= stopLater.at) { stopT = Math.max(stopT, stopLater.s); stopLater = null; }
  if (stopT > 0) { stopT -= real; k *= 0.05; }
  shakeAge += real;
  dt = real * k;
  time += dt;
  if (demo) stepDemo(dt);
  player.update(dt);
  if (clipView) {
    // in front of her, as the clip's: a little below her eyes, looking at her
    const p = player.position, s = size();
    camera.position.set(p.x + Math.sin(clipYaw) * 5.0 * s, p.y + 1.35 * s, p.z + Math.cos(clipYaw) * 5.0 * s);
    camera.lookAt(p.x, p.y + 0.98 * s, p.z);
    camera.updateMatrixWorld();
  }
  barrier.update(dt, player.position, size());
  stepTowers(dt, time);
  stepShots(dt);
  circles.update(dt, camera);
  grass.userData.setWalker(player.position, 0.55);
  fx.update(dt, camera);
  if (hurt > 0) { hurt = Math.max(0, hurt - dt / 0.35); hero.tint.set(1, 0.32, 0.3, hurt * 0.7); }
  if (beatT > 0 && (beatT -= dt / slow) <= 0) beatEl.style.opacity = 0;
  btnEl.style.setProperty('--ready', barrier.ready ? 1 : 0.15);
  const cd = barrier.cooldown;
  coolEl.textContent = barrier.state !== 'off' ? '' : cd > 0.05 ? cd.toFixed(1) : '';
  const s = sounds.stats;
  tapEl.hidden = s.ready || !!s.failed;
}
function draw() {
  const amp = shakeA * Math.exp(-shakeAge * 14);
  if (amp > 0.002) { shakeOff.set(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).multiplyScalar(2 * amp); camera.position.add(shakeOff); camera.updateMatrixWorld(); }
  renderer.clear();
  renderer.render(scene, camera);
  if (night) renderer.render(dimScene, camera);
  renderer.render(fxScene, camera);
  if (amp > 0.002) { camera.position.sub(shakeOff); camera.updateMatrixWorld(); }      // (the game's camera goes on from where it was)
}

// ---- the buttons at the top
const btn = id => document.getElementById(id);
const showHour = () => { btn('hour').textContent = night ? '🌙 กลางคืน' : '☀ กลางวัน'; };
showHour();
btn('hour').onclick = () => { night = !night; fx.setNight(night); if (circles.setNight) circles.setNight(night); showHour(); };
const SLOWS = [1, 0.5, 0.25];
btn('slow').onclick = () => { slow = SLOWS[(SLOWS.indexOf(slow) + 1) % SLOWS.length]; barrier.pace = slow; btn('slow').textContent = `⏱ ×${slow === 1 ? 1 : slow === 0.5 ? '½' : '¼'}`; };
btn('sound').onclick = () => { heard.on = !heard.on; btn('sound').textContent = `🔊 เสียง: ${heard.on ? 'เปิด' : 'ปิด'}`; };
const showView = () => { btn('view').textContent = clipView ? '🎥 กล้อง: แบบคลิป' : '🎥 กล้อง: เกม'; camera.fov = clipView ? (innerWidth < innerHeight ? 50 : 32) : FOV(); camera.updateProjectionMatrix(); };
btn('view').onclick = () => { clipView = !clipView; if (player) clipYaw = player.heading; showView(); };
showView();
btn('fire1').onclick = () => { if (!demo) fireOne(); };
btn('fire3').onclick = () => { if (!demo) fireAll(); };
btn('demo').onclick = () => startDemo();
const viewSize = new THREE.Vector2();
const fitView = () => fx.setView(renderer.getDrawingBufferSize(viewSize).y);
fitView();
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; showView(); renderer.setSize(innerWidth, innerHeight); fitView(); });
tapEl.hidden = false;

// for a test (or the console): step the world by hand
window.barrierTrial = {
  ready: false, held: false,
  get player() { return player; }, get hero() { return hero; }, barrier, fx, heard, sounds, camera, renderer, level, towers, shots, REFLECT_BARRIER, REFLECT_FX,
  run(seconds, { fps = 60, show = true } = {}) { this.held = true; for (let u = 0; u < seconds - 1e-6; u += 1 / fps) step(1 / fps); if (show) draw(); },
  raise, fire: i => fire(towers[i]), fireAll, night(on) { if (on !== night) btn('hour').onclick(); },
  view(clip, yaw) { clipView = !!clip; clipYaw = yaw === undefined ? (player ? player.heading : 0) : yaw; showView(); },
  demo() { startDemo(); }, get demoing() { return !!demo; }, key,
  draw,
};

let then = performance.now(), shown = 0;
function tick(now) {
  requestAnimationFrame(tick);
  if (now - shown < 1000 / 61) return;                // 60 pictures a second at most: no hotter than it need be
  shown = now;
  const dt = (now - then) / 1000; then = now;
  if (window.barrierTrial.held) return;
  step(dt);
  draw();
}
requestAnimationFrame(tick);
</script>
</body>
